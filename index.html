
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">

<title>برنامج كنيسة الشهيد العظيم استيفانوس ومارمينا العجايبي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
    --primary: #30213D;
    --primary-dark: #24172F;
    --gold: #B79A63;
    --gold-pale: #F5F0E5;
    --white: #FFFFFF;
    --background: #FFFFFF;
    --text: #30213D;
    --muted: #85818A;
    --border: #ECE9E5;
    --shadow: 0 8px 25px rgba(40, 29, 47, .055);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    background: #FFFFFF;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #FFFFFF;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
}

button {
    font: inherit;
}

button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
}

.app {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: auto;
    background: #FFFFFF;
    padding-bottom: max(22px, env(safe-area-inset-bottom));
}

/* الشريط العلوي */
.topbar {
    min-height: 72px;
    padding: max(10px, env(safe-area-inset-top)) 18px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #FFFFFF;
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
}

.brand-icon {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: var(--primary);
    color: #FFFFFF;
    border-radius: 13px;
}

.brand-icon i {
    font-size: 20px;
}

.brand-title {
    font-size: 13px;
    font-weight: 900;
    color: var(--primary);
}

.brand-subtitle {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
}

.refresh-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 13px;
    color: var(--primary);
    cursor: pointer;
    transition: background .2s, transform .2s;
}

.refresh-btn i {
    font-size: 19px;
}

.refresh-btn:active {
    background: var(--gold-pale);
    transform: scale(.96);
}

.refresh-btn.spinning i {
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* كارت الترحيب الأبيض */
.hero {
    margin: 19px 15px 0;
    padding: 27px 19px 25px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 23px;
    background: #FFFFFF;
    box-shadow: var(--shadow);
}

.church-emblem {
    width: 76px;
    height: 76px;
    margin: 0 auto 17px;
    display: grid;
    place-items: center;
    border-radius: 22px;
    background: var(--primary);
    color: #FFFFFF;
    border: 1px solid var(--gold);
    box-shadow: 0 5px 15px rgba(40, 29, 47, .10);
}

.church-emblem i {
    font-size: 31px;
    color: #FFFFFF;
}

.hero-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    margin-bottom: 12px;
    color: var(--primary);
    background: #FFFFFF;
    border: 1px solid #E9E0CE;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
}

.hero-label i {
    font-size: 12px;
    color: var(--gold);
}

h1 {
    color: var(--primary);
    font-family: 'Amiri', 'Cairo', serif;
    font-size: clamp(25px, 6.5vw, 31px);
    line-height: 1.7;
    font-weight: 700;
}

.church-name {
    display: block;
}

.name-highlight {
    color: var(--primary);
}

.hero-divider {
    width: 58px;
    height: 2px;
    background: var(--gold);
    border-radius: 5px;
    margin: 15px auto 0;
}

/* عنوان تسجيل الدخول */
.content {
    padding: 25px 15px 10px;
}

.section-heading {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}

.heading-icon {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    color: var(--primary);
    background: var(--gold-pale);
    border: 1px solid #E9E0CE;
    border-radius: 14px;
}

.heading-icon i {
    font-size: 20px;
}

.heading-title {
    font-size: 16px;
    font-weight: 900;
    color: var(--primary);
}

.heading-subtitle {
    margin-top: 3px;
    color: var(--muted);
    font-size: 10px;
}

/* كارت أزرار الدخول */
.login-panel {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: #FFFFFF;
    box-shadow: var(--shadow);
}

.login-options {
    display: grid;
    gap: 11px;
}

.login-button {
    min-height: 78px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #FFFFFF;
    color: var(--text);
    text-align: right;
    cursor: pointer;
    transition: background .18s, transform .18s, border-color .18s;
}

.login-button:hover {
    background: #FCFBFD;
    border-color: #DCD3E2;
}

.login-button:active {
    transform: scale(.985);
}

.button-icon {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: var(--primary);
    color: #FFFFFF;
}

.button-icon i {
    font-size: 23px;
}

.servant-button .button-icon {
    background: var(--gold-pale);
    color: var(--primary);
    border: 1px solid #E9E0CE;
}

.button-copy {
    flex: 1;
    min-width: 0;
}

.button-title {
    display: block;
    color: var(--primary);
    font-size: 14px;
    font-weight: 900;
}

.button-description {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.8;
}

.arrow-icon {
    font-size: 14px;
    flex-shrink: 0;
    color: var(--gold);
    margin-right: auto;
}

.panel-footer {
    margin-top: 15px;
    padding-top: 13px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: var(--muted);
    font-size: 10px;
}

.panel-footer i {
    font-size: 14px;
    color: var(--gold);
}

.footer {
    padding: 18px 12px 5px;
    color: var(--muted);
    font-size: 10px;
    line-height: 2;
    text-align: center;
}

.footer strong {
    color: var(--primary);
}

/* إشعار التحديث */
.pull-indicator {
    position: fixed;
    z-index: 10;
    top: max(8px, env(safe-area-inset-top));
    left: 50%;
    transform: translate(-50%, -70px);
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: #FFFFFF;
    color: var(--primary);
    font-size: 11px;
    box-shadow: var(--shadow);
    white-space: nowrap;
    pointer-events: none;
    transition: transform .2s;
}

.pull-indicator.visible {
    transform: translate(-50%, 0);
}

@media (min-width: 600px) {
    body {
        background: #FAFAFA;
    }

    .app {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
    }
}

@media (max-width: 360px) {
    .hero {
        margin: 13px 10px 0;
        padding: 23px 13px;
    }

    .content {
        padding: 21px 10px;
    }

    .church-emblem {
        width: 68px;
        height: 68px;
    }

    .church-emblem i {
        font-size: 28px;
    }

    h1 {
        font-size: 24px;
    }

    .login-panel {
        padding: 9px;
    }

    .login-button {
        gap: 9px;
        padding: 10px;
    }

    .button-icon {
        width: 43px;
        height: 43px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div class="pull-indicator" id="pullIndicator">
    <i class="fa-solid fa-rotate"></i>
    جاري تحديث الصفحة...
</div>

<main class="app">

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">
                <i class="fa-solid fa-house"></i>
            </div>

            <div>
                <div class="brand-title">برنامج الكنيسة</div>
                <div class="brand-subtitle">الصفحة الرئيسية</div>
            </div>
        </div>

        <button class="refresh-btn" id="refreshBtn" type="button" aria-label="تحديث الصفحة" title="تحديث الصفحة">
            <i class="fa-solid fa-rotate"></i>
        </button>
    </header>

    <section class="hero">
        <div class="church-emblem" aria-hidden="true">
            <i class="fa-solid fa-church"></i>
        </div>

        <div class="hero-label">
            <i class="fa-solid fa-house"></i>
            الصفحة الرئيسية
        </div>

        <h1>
            كنيسة الشهيد العظيم
            <span class="church-name">
                <span class="name-highlight">استيفانوس</span>
            </span>
            ومارمينا العجايبي
        </h1>

        <div class="hero-divider"></div>
    </section>

    <section class="content">

        <div class="section-heading">
            <div class="heading-icon" aria-hidden="true">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>

            <div>
                <h2 class="heading-title">تسجيل الدخول</h2>
                <p class="heading-subtitle">اختر نوع الحساب للمتابعة</p>
            </div>
        </div>

        <div class="login-panel">
            <div class="login-options">

                <button type="button" id="login-btn" class="login-button">
                    <span class="button-icon" aria-hidden="true">
                        <i class="fa-solid fa-user"></i>
                    </span>

                    <span class="button-copy">
                        <span class="button-title">دخول مستخدم</span>
                        <span class="button-description">الدخول إلى حساب المستخدم</span>
                    </span>

                    <i class="fa-solid fa-chevron-left arrow-icon" aria-hidden="true"></i>
                </button>

                <button type="button" id="servant-btn" class="login-button servant-button">
                    <span class="button-icon" aria-hidden="true">
                        <i class="fa-solid fa-user-shield"></i>
                    </span>

                    <span class="button-copy">
                        <span class="button-title">دخول خادم</span>
                        <span class="button-description">الدخول إلى حساب الخادم</span>
                    </span>

                    <i class="fa-solid fa-chevron-left arrow-icon" aria-hidden="true"></i>
                </button>

            </div>

            <div class="panel-footer">
                <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                بوابة الدخول إلى برنامج الكنيسة
            </div>
        </div>

        <footer class="footer">
            <strong>كنيسة الشهيد العظيم استيفانوس ومارمينا العجايبي</strong>
        </footer>

    </section>

</main>

<script>
"use strict";

/* دخول المستخدم */
document.getElementById("login-btn").addEventListener("click", function () {
    window.location.href = "u/sign.html";
});

/* دخول الخادم */
document.getElementById("servant-btn").addEventListener("click", function () {
    window.location.href = "a/sign.html";
});

/* زر تحديث الصفحة */
const refreshBtn = document.getElementById("refreshBtn");
const pullIndicator = document.getElementById("pullIndicator");

refreshBtn.addEventListener("click", function () {
    refreshBtn.classList.add("spinning");
    window.location.reload();
});

/* السحب لأسفل لتحديث الصفحة على الهاتف */
let startY = 0;
let startX = 0;
let pulling = false;
let refreshing = false;

document.addEventListener("touchstart", function (event) {
    if (
        event.touches.length !== 1 ||
        window.scrollY > 0 ||
        refreshing
    ) {
        pulling = false;
        return;
    }

    startY = event.touches[0].clientY;
    startX = event.touches[0].clientX;
    pulling = true;
}, { passive: true });

document.addEventListener("touchend", function (event) {
    if (!pulling || !event.changedTouches.length) return;

    const endY = event.changedTouches[0].clientY;
    const endX = event.changedTouches[0].clientX;

    const distanceY = endY - startY;
    const distanceX = Math.abs(endX - startX);

    pulling = false;

    if (
        distanceY > 85 &&
        distanceX < 55 &&
        window.scrollY <= 0 &&
        !refreshing
    ) {
        refreshing = true;
        pullIndicator.classList.add("visible");

        setTimeout(function () {
            window.location.reload();
        }, 300);
    }
}, { passive: true });

document.addEventListener("touchcancel", function () {
    pulling = false;
    pullIndicator.classList.remove("visible");
}, { passive: true });
</script>

</body>
</html>
