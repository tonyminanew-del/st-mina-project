<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>برنامج كنيسة الشهيد العظيم استيفانوس ومارمينا العجايبي</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root{
    --navy-deep: #041a36;
    --navy-mid: #062348;
    --navy-edge: #000b18;

    --maroon-dark: #5d101c;
    --maroon: #7d1424;
    --maroon-light: #9b1c30;

    --ink: #1f1715;
    --muted: #8a817c;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:'Tajawal', sans-serif;
    background:
      radial-gradient(circle at center, var(--navy-mid) 0%, var(--navy-deep) 45%, var(--navy-edge) 100%);
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  .welcome-box{
    width:100%;
    max-width:440px;
    background:#ffffff;
    border-radius:30px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
    position:relative;
    overflow:hidden;
  }

  .drag-handle{
    width:100%;
    display:flex;
    justify-content:center;
    padding-top:12px;
    padding-bottom:4px;
    background: linear-gradient(180deg, #fbeef0 0%, #ffffff 60%);
  }

  .drag-handle span{
    width:44px;
    height:4px;
    border-radius:4px;
    background:#e3c9cd;
  }

  .box-body{
    padding: 12px 30px 38px;
    text-align:center;
  }

  .logo-container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:8px;
    margin-bottom:18px;
  }

  .church-logo{
    width:76px;
    height:76px;
    border-radius:50%;
    background: linear-gradient(150deg, var(--maroon-light) 0%, var(--maroon-dark) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
    font-size:36px;
    box-shadow: 0 10px 22px rgba(125, 20, 36, 0.35);
  }

  .formal-gold{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size: clamp(21px, 6vw, 25px);
    line-height:1.7;
    color: var(--ink);
  }

  /* كلمة استيفانوس السرية (تتفاعل فقط إذا سمح مينا بذلك) */
  .formal-gold #secret-click{
    color: var(--maroon);
    font:inherit;
    cursor: pointer;
    user-select: none;
  }

  .subtitle{
    margin-top:12px;
    font-size: clamp(14px, 4vw, 15px);
    color: var(--muted);
  }

  .formal-button{
    margin-top:30px;
    width:100%;
    min-height:54px;
    border:none;
    border-radius:14px;
    background: linear-gradient(135deg, var(--maroon-light) 0%, var(--maroon-dark) 100%);
    color:#ffffff;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size: clamp(16px, 5vw, 18px);
    letter-spacing:0.3px;
    cursor:pointer;
    box-shadow: 0 10px 22px rgba(125, 20, 36, 0.35);
    transition: all 0.25s ease;
  }

  .formal-button:hover{
    transform: translateY(-1px);
    box-shadow: 0 12px 26px rgba(125, 20, 36, 0.45);
  }

  .formal-button:active{
    transform: translateY(1px);
    box-shadow: 0 5px 12px rgba(125, 20, 36, 0.25);
  }

  .lock-status {
    margin-top: 16px;
    font-size: 13px;
    font-weight: 700;
    color: #9f1239;
    min-height: 18px;
  }

  @media (max-width:360px){
    .box-body{ padding: 10px 20px 30px; }
  }
</style>
</head>
<body>

  <div class="welcome-box">

    <div class="drag-handle"><span></span></div>

    <div class="box-body">

      <div class="logo-container">
        <div class="church-logo">
          <i class="fas fa-cross"></i>
        </div>
      </div>

      <div class="formal-gold">
        أهلاً ببرنامج كنيسة الشهيد العظيم <span id="secret-click" title="خاص">استيفانوس</span> ومارمينا العجايبي
      </div>

      <div class="subtitle">برجاء الدخول لمتابعة البرنامج</div>

      <button type="button" id="login-btn" class="formal-button">دخول مستخدم</button>
      <div id="lockStatusMsg" class="lock-status"></div>

    </div>

  </div>

  <script>
    let clickCount = 0;
    const targetWord = document.getElementById('secret-click');
    const lockStatusMsg = document.getElementById('lockStatusMsg');

    targetWord.addEventListener('click', function() {
      // التحقق مما إذا كان السوبر أدمن (Mina) قد فتح الصلاحية أم لا
      const isUnlockedByMina = localStorage.getItem('stephanus_unlocked') === 'true';

      if (!isUnlockedByMina) {
        lockStatusMsg.textContent = "عذراً، هذا المسار مغلق ولا يمكن فتحه إلا بواسطة السوبر أدمن.";
        setTimeout(() => { lockStatusMsg.textContent = ""; }, 3500);
        return;
      }

      clickCount++;
      if (clickCount < 5) {
        lockStatusMsg.style.color = "#b45309";
        lockStatusMsg.textContent = `متبقي ${5 - clickCount} ضغطات...`;
      } else {
        lockStatusMsg.style.color = "#137333";
        lockStatusMsg.textContent = "تم التحقق بنجاح!";
        setTimeout(() => {
          window.location.href = 'a/sign.html'; // أو صفحة مينا حسب المسار الخاص بك
        }, 500);
      }
    });

    document.getElementById('login-btn').addEventListener('click', function() {
      window.location.href = 'u/sign.html';
    });
  </script>

</body>
</html>
