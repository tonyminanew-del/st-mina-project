<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بيانات اللاعب / المستخدم</title>
    
    <!-- استيراد خط عربي فخم -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Amiri', serif;
        }

        .form-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 
                0 0 25px rgba(56, 189, 248, 0.15),
                inset 0 0 15px rgba(56, 189, 248, 0.05),
                0 25px 50px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 520px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            position: relative;
        }

        h2 {
            margin-bottom: 25px;
            text-align: center;
            font-size: 28px;
            color: #38bdf8;
            text-shadow: 
                0 0 10px rgba(56, 189, 248, 0.6),
                2px 2px 0px #000,
                4px 4px 0px #0f172a;
            letter-spacing: 1.5px;
        }

        .notebook-note {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            color: #1e293b;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-right: 6px solid #eab308;
            box-shadow: 0 5px 15px rgba(234, 179, 8, 0.2);
            position: relative;
        }

        .notebook-note h4 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #854d0e;
        }

        .notebook-note p {
            font-size: 15px;
            line-height: 1.6;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #e2e8f0;
            margin-bottom: 6px;
            font-size: 17px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: #020617;
            border: 2px solid #1e293b;
            border-radius: 10px;
            color: #38bdf8;
            font-size: 16px;
            font-family: 'Amiri', serif;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            background: #030712;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 2px 4px rgba(0,0,0,0.9);
        }

        select option {
            background: #020617;
            color: #38bdf8;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            font-family: 'Amiri', serif;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 6px 0 #03345c, 0 10px 25px rgba(2, 132, 199, 0.4);
            transition: all 0.1s ease;
            position: relative;
            top: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            box-shadow: 0 6px 0 #03345c, 0 15px 30px rgba(56, 189, 248, 0.6);
        }

        .btn-action:active {
            top: 4px;
            box-shadow: 0 2px 0 #03345c, 0 5px 10px rgba(2, 132, 199, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            border-color: #64748b;
            box-shadow: 0 6px 0 #1e293b, 0 10px 25px rgba(0, 0, 0, 0.4);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
        }

        .step-section {
            display: none;
        }

        .step-section.active {
            display: block;
        }

        #error-msg {
            color: #f43f5e;
            text-align: center;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(244, 63, 94, 0.5);
        }
    </style>

    <!-- مكتبات Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تحديث خيارات الصفوف بناءً على المرحلة المختارة
        window.updateGrades = function() {
            const stageSelect = document.getElementById('stage');
            const gradeSelect = document.getElementById('grade');
            const selectedStage = stageSelect.value;

            gradeSelect.innerHTML = '<option value="" disabled selected>اختر الصف الدراسي...</option>';

            let gradesOptions = [];

            if (selectedStage === "ابتدائي") {
                gradesOptions = [
                    "الأول الابتدائي", 
                    "الثاني الابتدائي", 
                    "الثالث الابتدائي", 
                    "الرابع الابتدائي", 
                    "الخامس الابتدائي", 
                    "السادس الابتدائي"
                ];
            } else if (selectedStage === "إعدادي") {
                gradesOptions = [
                    "الصف الأول الإعدادي", 
                    "الصف الثاني الإعدادي", 
                    "الصف الثالث الإعدادي"
                ];
            } else if (selectedStage === "ثانوي") {
                gradesOptions = [
                    "الصف الأول الثانوي", 
                    "الصف الثاني الثانوي", 
                    "الصف الثالث الثانوي"
                ];
            }

            gradesOptions.forEach(grade => {
                const opt = document.createElement('option');
                opt.value = grade;
                opt.textContent = grade;
                gradeSelect.appendChild(opt);
            });
        }

        // الانتقال للخطوة الثانية بعد التحقق من اسم المستخدم
        window.nextStep = async function() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const btn1 = document.getElementById('btnNext');

            errorMsg.innerText = "";

            if (!username || !password) {
                errorMsg.innerText = "يرجى إدخال اسم المستخدم وكلمة المرور أولاً!";
                return;
            }

            btn1.innerText = "جاري الفحص...";
            btn1.disabled = true;

            try {
                const usersRef = collection(db, "users");
                const qUsername = query(usersRef, where("username", "==", username));
                const usernameSnapshot = await getDocs(qUsername);

                if (!usernameSnapshot.empty) {
                    errorMsg.innerText = "اسم المستخدم هذا مستخدم من قبل، اختر اسماً آخر.";
                    btn1.innerText = "التالي ➔";
                    btn1.disabled = false;
                    return;
                }

                document.getElementById('step-1').classList.remove('active');
                document.getElementById('step-2').classList.add('active');
                btn1.innerText = "التالي ➔";
                btn1.disabled = false;

            } catch (error) {
                console.error(error);
                errorMsg.innerText = "حدث خطأ في الاتصال بقاعدة البيانات.";
                btn1.innerText = "التالي ➔";
                btn1.disabled = false;
            }
        }

        // العودة للخطوة الأولى
        window.prevStep = function() {
            document.getElementById('step-2').classList.remove('active');
            document.getElementById('step-1').classList.add('active');
        }

        // تسجيل البيانات بالكامل وحفظها في فيرستور
        window.handleRegister = async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const userId = document.getElementById('userId').value.trim();
            const birthdate = document.getElementById('birthdate').value;
            const fatherPhone = document.getElementById('fatherPhone').value.trim();
            const motherPhone = document.getElementById('motherPhone').value.trim();
            const address = document.getElementById('address').value.trim();
            const stage = document.getElementById('stage').value;
            const grade = document.getElementById('grade').value;
            
            const errorMsg = document.getElementById('error-msg-2');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.innerText = "";

            if (!stage || !grade) {
                errorMsg.innerText = "يرجى اختيار المرحلة والصف الدراسي!";
                return;
            }

            submitBtn.innerText = "جاري حفظ المغامرة...";
            submitBtn.disabled = true;

            try {
                const userDocRef = doc(db, "users", username);
                await setDoc(userDocRef, {
                    username: username,
                    password: password,
                    userId: userId,
                    birthdate: birthdate,
                    fatherPhone: fatherPhone,
                    motherPhone: motherPhone,
                    address: address,
                    stage: stage,
                    grade: grade,
                    points: 0, // يبدأ بـ 0 نقاط تلقائياً لتجنب أخطاء المعرض
                    createdAt: new Date().toISOString()
                });

                localStorage.setItem('userDocId', username);
                localStorage.setItem('currentUser', username);

                window.location.href = "home.html";

            } catch (error) {
                console.error(error);
                errorMsg.innerText = "حدث خطأ أثناء الحفظ.";
                submitBtn.innerText = "حفظ البيانات";
                submitBtn.disabled = false;
            }
        }
    </script>
</head>
<body>

    <div class="form-card">
        <h2>إنشاء حساب اللاعب</h2>
        <div id="error-msg"></div>

        <!-- الخطوة الأولى -->
        <div id="step-1" class="step-section active">
            <div class="notebook-note">
                <h4>note</h4>
                <p>يرجى كتابة اسم المستخدم وكلمة المرور لتسجيل الدخول بالبرنامج لاحقاً</p>
            </div>

            <div class="input-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="username" required placeholder="اكتب اسم المستخدم هنا...">
            </div>

            <div class="input-group">
                <label>كلمة المرور (Password)</label>
                <input type="password" id="password" required placeholder="اكتب كلمة المرور هنا...">
            </div>

            <button type="button" class="btn-action" id="btnNext" onclick="nextStep()">التالي ➔</button>
        </div>

        <!-- الخطوة الثانية -->
        <div id="step-2" class="step-section">
            <div id="error-msg-2" style="color: #f43f5e; text-align: center; margin-bottom: 10px; font-weight: bold;"></div>

            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>رقم المستخدم</label>
                    <input type="text" id="userId" required placeholder="مثال: 01203821961">
                </div>

                <div class="input-group">
                    <label>تاريخ الميلاد</label>
                    <input type="date" id="birthdate" required>
                </div>

                <div class="input-group">
                    <label>رقم الأب</label>
                    <input type="tel" id="fatherPhone" required placeholder="مثال: 01002777653">
                </div>

                <div class="input-group">
                    <label>رقم الأم</label>
                    <input type="tel" id="motherPhone" required placeholder="مثال: 01227307329">
                </div>

                <div class="input-group">
                    <label>العنوان</label>
                    <input type="text" id="address" required placeholder="مثال: مشتل">
                </div>

                <!-- قائمة اختيار المرحلة الدراسية -->
                <div class="input-group">
                    <label>المرحلة الدراسية</label>
                    <select id="stage" required onchange="updateGrades()">
                        <option value="" disabled selected>اختر المرحلة الدراسية...</option>
                        <option value="ابتدائي">ابتدائي</option>
                        <option value="إعدادي">إعدادي</option>
                        <option value="ثانوي">ثانوي</option>
                    </select>
                </div>

                <!-- قائمة اختيار الصف الدراسي (تتحدث ديناميكياً) -->
                <div class="input-group">
                    <label>الصف الدراسي</label>
                    <select id="grade" required>
                        <option value="" disabled selected>اختر المرحلة أولاً...</option>
                    </select>
                </div>

                <button type="submit" class="btn-action" id="submitBtn">حفظ البيانات</button>
                <button type="button" class="btn-action btn-secondary" onclick="prevStep()">⬅ رجوع للخلف</button>
            </form>
        </div>
    </div>

</body>
</html>
