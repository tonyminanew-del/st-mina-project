<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بوابة تسجيل حساب اللاعبين</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {

            --navy-deep: #041a36;
            --navy-mid: #062348;
            --navy-edge: #000b18;

            --maroon-dark: #5d101c;
            --maroon: #7d1424;
            --maroon-light: #9b1c30;

            --ink: #1f1715;
            --muted: #8a817c;
            --field-border: #e1d8d0;

            --sky-bg: #eaf6fd;
            --sky-border: #c3e3f6;
            --sky-text: #245876;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    var(--navy-mid) 0%,
                    var(--navy-deep) 45%,
                    var(--navy-edge) 100%
                );

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Tajawal', sans-serif;
        }

        .form-card {

            width: 100%;
            max-width: 440px;

            background: #ffffff;

            border-radius: 30px;

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.5);

            position: relative;

            overflow: hidden;
        }

        .drag-handle {

            width: 100%;

            display: flex;

            justify-content: center;

            padding-top: 12px;
            padding-bottom: 4px;

            background:
                linear-gradient(
                    180deg,
                    #fbeef0 0%,
                    #ffffff 60%
                );
        }

        .drag-handle span {

            width: 44px;
            height: 4px;

            border-radius: 4px;

            background: #e3c9cd;
        }

        .card-body {

            padding:
                10px
                30px
                32px;
        }

        .logo-container {

            width: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            margin-top: 10px;
            margin-bottom: 16px;
        }

        .church-logo {

            width: 74px;
            height: 74px;

            border-radius: 50%;

            background:
                linear-gradient(
                    150deg,
                    var(--maroon-light) 0%,
                    var(--maroon-dark) 100%
                );

            display: flex;

            justify-content: center;
            align-items: center;

            color: #ffffff;

            font-size: 34px;

            box-shadow:
                0 10px 22px rgba(125, 20, 36, 0.35);
        }

        h2 {

            text-align: center;

            color: var(--ink);

            font-family: 'Amiri', serif;

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 6px;

            letter-spacing: 0.5px;
        }

        .subtitle {

            text-align: center;

            color: var(--muted);

            font-size: 14px;

            margin-bottom: 20px;
        }

        #error-msg,
        #error-msg-2 {

            color: #9f1239;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 12px;

            min-height: 20px;
        }

        .notebook-note {

            background: var(--sky-bg);

            border: 1px solid var(--sky-border);

            color: var(--sky-text);

            padding: 12px 15px;

            border-radius: 14px;

            margin-bottom: 20px;

            display: flex;

            align-items: flex-start;

            gap: 10px;
        }

        .notebook-note i {

            color: #4a9bc9;

            margin-top: 3px;

            font-size: 14px;
        }

        .notebook-note h4 {

            color: var(--maroon);

            font-size: 16px;

            margin-bottom: 3px;

            font-weight: 700;
        }

        .notebook-note p {

            color: var(--sky-text);

            font-size: 13px;

            line-height: 1.7;

            font-weight: 500;
        }

        .input-group {

            margin-bottom: 14px;

            width: 100%;
        }

        label {

            display: block;

            color: #6b625c;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 6px;

            text-align: right;
        }

        .field-wrap {

            position: relative;
        }

        .field-wrap i.field-icon {

            position: absolute;

            top: 50%;

            right: 16px;

            transform: translateY(-50%);

            color: #b9afa8;

            font-size: 15px;

            pointer-events: none;
        }

        .field-wrap i.field-toggle {

            position: absolute;

            top: 50%;

            left: 16px;

            transform: translateY(-50%);

            color: #b9afa8;

            font-size: 15px;

            cursor: pointer;
        }

        input,
        select {

            width: 100%;

            padding:
                13px
                42px
                13px
                15px;

            background: #faf8f7;

            border:
                1.5px solid
                var(--field-border);

            border-radius: 13px;

            color: var(--ink);

            font-size: 15px;

            font-family: 'Tajawal', sans-serif;

            outline: none;

            transition: all 0.25s ease;
        }

        input::placeholder {

            color: #b9afa8;
        }

        input:focus,
        select:focus {

            border-color: var(--maroon);

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(125, 20, 36, 0.10);
        }

        #password {

            padding-left: 42px;
        }

        select {

            cursor: pointer;

            appearance: auto;
        }

        select option {

            background: #ffffff;

            color: var(--ink);
        }

        .btn-action {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light) 0%,
                    var(--maroon-dark) 100%
                );

            color: #ffffff;

            font-family: 'Tajawal', sans-serif;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.25s ease;

            box-shadow:
                0 10px 22px
                rgba(125, 20, 36, 0.35);
        }

        .btn-action:hover {

            transform: translateY(-1px);

            box-shadow:
                0 12px 26px
                rgba(125, 20, 36, 0.45);
        }

        .btn-action:active {

            transform: translateY(1px);

            box-shadow:
                0 5px 12px
                rgba(125, 20, 36, 0.25);
        }

        .btn-action:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .btn-secondary {

            background: transparent;

            color: var(--maroon);

            box-shadow: none;

            border:
                1.5px solid
                #f0d9dd;
        }

        .btn-secondary:hover {

            background: #fdf3f4;

            box-shadow: none;
        }

        .step-section {

            display: none;
        }

        .step-section.active {

            display: block;
        }

        @media (max-width: 500px) {

            .card-body {

                padding:
                    8px
                    20px
                    26px;
            }

            h2 {

                font-size: 24px;
            }

            .church-logo {

                width: 66px;
                height: 66px;

                font-size: 30px;
            }
        }

    </style>


    <!-- =========================================
         FIREBASE
    ========================================== -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            setDoc,
            doc,
            getDoc
        } from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /* =========================================
           Firebase Config
        ========================================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",

            authDomain:
                "st-mina-c01ec.firebaseapp.com",

            projectId:
                "st-mina-c01ec",

            storageBucket:
                "st-mina-c01ec.firebasestorage.app",

            messagingSenderId:
                "792349150559",

            appId:
                "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);


        /* =========================================
           المراحل والصفوف
           
           مهم:
           القيم هنا هي نفس القيم الموجودة
           في صفحة البروفايل والـ Admin
        ========================================= */

        const stageGrades = {

            "ابتدائي": [

                "الأول الابتدائي",

                "الثاني الابتدائي",

                "الثالث الابتدائي",

                "الرابع الابتدائي",

                "الخامس الابتدائي",

                "السادس الابتدائي"

            ],

            "إعدادي": [

                "الأول الإعدادي",

                "الثاني الإعدادي",

                "الثالث الإعدادي"

            ],

            "ثانوي": [

                "الأول الثانوي",

                "الثاني الثانوي",

                "الثالث الثانوي"

            ]

        };


        /* =========================================
           تنظيف النص
        ========================================= */

        function normalizeText(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }

            return String(value)

                .replace(/\u200f/g, "")

                .replace(/\u200e/g, "")

                .replace(/\u00a0/g, " ")

                .trim();

        }


        /* =========================================
           توحيد الصف
        ========================================= */

        function normalizeGrade(grade) {

            const value =
                normalizeText(grade);


            /*
             * دعم البيانات القديمة
             *
             * لو عندك:
             * الصف الثاني الإعدادي
             *
             * نحولها إلى:
             * الثاني الإعدادي
             */

            const oldToNew = {

                "الصف الأول الإعدادي":
                    "الأول الإعدادي",

                "الصف الثاني الإعدادي":
                    "الثاني الإعدادي",

                "الصف الثالث الإعدادي":
                    "الثالث الإعدادي",

                "الصف الأول الثانوي":
                    "الأول الثانوي",

                "الصف الثاني الثانوي":
                    "الثاني الثانوي",

                "الصف الثالث الثانوي":
                    "الثالث الثانوي"

            };


            return (
                oldToNew[value] ||
                value
            );

        }


        /* =========================================
           تحديث الصفوف
        ========================================= */

        window.updateGrades = function (
            selectedGrade = ""
        ) {

            const stageSelect =
                document.getElementById(
                    "stage"
                );


            const gradeSelect =
                document.getElementById(
                    "grade"
                );


            if (
                !stageSelect ||
                !gradeSelect
            ) {

                return;

            }


            const selectedStage =
                normalizeText(
                    stageSelect.value
                );


            const cleanSelectedGrade =
                normalizeGrade(
                    selectedGrade
                );


            gradeSelect.innerHTML =
                `
                    <option
                        value=""
                        disabled
                        selected
                    >
                        اختر الصف الدراسي
                    </option>
                `;


            const grades =
                stageGrades[
                    selectedStage
                ] || [];


            grades.forEach(
                grade => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        grade;


                    option.textContent =
                        grade;


                    if (
                        grade ===
                        cleanSelectedGrade
                    ) {

                        option.selected =
                            true;

                    }


                    gradeSelect.appendChild(
                        option
                    );

                }
            );

        };


        /* =========================================
           الخطوة الأولى
        ========================================= */

        window.nextStep =
            async function () {

                const username =
                    normalizeText(
                        document.getElementById(
                            "username"
                        ).value
                    );


                const password =
                    document.getElementById(
                        "password"
                    ).value.trim();


                const errorMsg =
                    document.getElementById(
                        "error-msg"
                    );


                const btn =
                    document.getElementById(
                        "btnNext"
                    );


                errorMsg.innerText =
                    "";


                if (
                    !username ||
                    !password
                ) {

                    errorMsg.innerText =
                        "يرجى إدخال اسم المستخدم وكلمة المرور أولاً!";

                    return;

                }


                btn.innerText =
                    "جاري الفحص...";


                btn.disabled =
                    true;


                try {

                    /*
                     * بما أن الـ Document ID
                     * هو username
                     *
                     * نعمل فحص مباشر أيضاً.
                     */

                    const directRef =
                        doc(
                            db,
                            "users",
                            username
                        );


                    const directSnap =
                        await getDoc(
                            directRef
                        );


                    if (
                        directSnap.exists()
                    ) {

                        errorMsg.innerText =
                            "اسم المستخدم هذا مستخدم من قبل، اختر اسماً آخر.";

                        btn.innerText =
                            "التالي ➔";

                        btn.disabled =
                            false;

                        return;

                    }


                    /*
                     * فحص إضافي لأي Document
                     * username فيه نفس القيمة.
                     */

                    const usersRef =
                        collection(
                            db,
                            "users"
                        );


                    const qUsername =
                        query(
                            usersRef,
                            where(
                                "username",
                                "==",
                                username
                            )
                        );


                    const usernameSnapshot =
                        await getDocs(
                            qUsername
                        );


                    if (
                        !usernameSnapshot.empty
                    ) {

                        errorMsg.innerText =
                            "اسم المستخدم هذا مستخدم من قبل، اختر اسماً آخر.";

                        btn.innerText =
                            "التالي ➔";

                        btn.disabled =
                            false;

                        return;

                    }


                    document
                        .getElementById(
                            "step-1"
                        )
                        .classList
                        .remove("active");


                    document
                        .getElementById(
                            "step-2"
                        )
                        .classList
                        .add("active");


                    btn.innerText =
                        "التالي ➔";


                    btn.disabled =
                        false;

                } catch (error) {

                    console.error(
                        "خطأ أثناء فحص المستخدم:",
                        error
                    );


                    errorMsg.innerText =
                        "حدث خطأ في الاتصال بقاعدة البيانات.";


                    btn.innerText =
                        "التالي ➔";


                    btn.disabled =
                        false;

                }

            };


        /* =========================================
           رجوع
        ========================================= */

        window.prevStep =
            function () {

                document
                    .getElementById(
                        "step-2"
                    )
                    .classList
                    .remove("active");


                document
                    .getElementById(
                        "step-1"
                    )
                    .classList
                    .add("active");

            };


        /* =========================================
           إظهار كلمة المرور
        ========================================= */

        window.togglePassword =
            function () {

                const passwordInput =
                    document.getElementById(
                        "password"
                    );


                const icon =
                    document.getElementById(
                        "togglePasswordIcon"
                    );


                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";


                    icon.classList.remove(
                        "fa-eye"
                    );


                    icon.classList.add(
                        "fa-eye-slash"
                    );

                } else {

                    passwordInput.type =
                        "password";


                    icon.classList.remove(
                        "fa-eye-slash"
                    );


                    icon.classList.add(
                        "fa-eye"
                    );

                }

            };


        /* =========================================
           إنشاء الحساب
        ========================================= */

        window.handleRegister =
            async function (event) {

                event.preventDefault();


                const username =
                    normalizeText(
                        document.getElementById(
                            "username"
                        ).value
                    );


                const password =
                    document.getElementById(
                        "password"
                    ).value.trim();


                const userId =
                    normalizeText(
                        document.getElementById(
                            "userId"
                        ).value
                    );


                const birthdate =
                    document.getElementById(
                        "birthdate"
                    ).value;


                const fatherPhone =
                    document.getElementById(
                        "fatherPhone"
                    ).value.trim();


                const motherPhone =
                    document.getElementById(
                        "motherPhone"
                    ).value.trim();


                const address =
                    document.getElementById(
                        "address"
                    ).value.trim();


                const stage =
                    normalizeText(
                        document.getElementById(
                            "stage"
                        ).value
                    );


                /*
                 * نقرأ الصف من الـ select
                 * بعد توحيد القيمة
                 */

                const grade =
                    normalizeGrade(
                        document.getElementById(
                            "grade"
                        ).value
                    );


                const errorMsg =
                    document.getElementById(
                        "error-msg-2"
                    );


                const submitBtn =
                    document.getElementById(
                        "submitBtn"
                    );


                errorMsg.innerText =
                    "";


                /* =================================
                   التحقق
                ================================= */

                if (!username) {

                    errorMsg.innerText =
                        "اسم المستخدم غير صحيح.";

                    return;

                }


                if (!password) {

                    errorMsg.innerText =
                        "يرجى إدخال كلمة المرور.";

                    return;

                }


                if (!stage) {

                    errorMsg.innerText =
                        "يرجى اختيار المرحلة الدراسية.";

                    return;

                }


                if (
                    !stageGrades[stage]
                ) {

                    errorMsg.innerText =
                        "المرحلة الدراسية غير صحيحة.";

                    return;

                }


                if (!grade) {

                    errorMsg.innerText =
                        "يرجى اختيار الصف الدراسي.";

                    return;

                }


                /*
                 * التأكد أن الصف تابع للمرحلة
                 */

                if (
                    !stageGrades[stage]
                        .includes(grade)
                ) {

                    errorMsg.innerText =
                        "الصف الدراسي لا يتوافق مع المرحلة.";

                    return;

                }


                submitBtn.innerText =
                    "جاري حفظ البيانات...";


                submitBtn.disabled =
                    true;


                try {

                    /* =================================
                       Document ID
                       
                       مهم جداً:
                       username = Document ID
                    ================================= */

                    const userDocRef =
                        doc(
                            db,
                            "users",
                            username
                        );


                    /*
                     * فحص أخير قبل الكتابة
                     */

                    const existingDoc =
                        await getDoc(
                            userDocRef
                        );


                    if (
                        existingDoc.exists()
                    ) {

                        throw new Error(
                            "اسم المستخدم مستخدم بالفعل."
                        );

                    }


                    /* =================================
                       البيانات
                    ================================= */

                    const userData = {

                        username:
                            username,

                        password:
                            password,

                        userId:
                            userId,

                        birthdate:
                            birthdate,

                        fatherPhone:
                            fatherPhone,

                        motherPhone:
                            motherPhone,

                        address:
                            address,

                        stage:
                            stage,

                        /*
                         * الصف الموحد
                         */
                        grade:
                            grade,

                        points:
                            0,

                        isBlocked:
                            false,

                        createdAt:
                            new Date().toISOString()

                    };


                    console.log(
                        "================================"
                    );

                    console.log(
                        "📤 إنشاء المستخدم"
                    );

                    console.log(
                        "Collection:",
                        "users"
                    );

                    console.log(
                        "Document ID:",
                        username
                    );

                    console.log(
                        "Username:",
                        username
                    );

                    console.log(
                        "Stage:",
                        stage
                    );

                    console.log(
                        "Grade:",
                        grade
                    );

                    console.log(
                        "================================"
                    );


                    /* =================================
                       الحفظ
                    ================================= */

                    await setDoc(
                        userDocRef,
                        userData
                    );


                    /* =================================
                       قراءة البيانات مرة أخرى
                    ================================= */

                    const savedSnap =
                        await getDoc(
                            userDocRef
                        );


                    if (
                        !savedSnap.exists()
                    ) {

                        throw new Error(
                            "تمت محاولة الحفظ ولكن لم يتم العثور على المستخدم."
                        );

                    }


                    const savedData =
                        savedSnap.data();


                    console.log(
                        "================================"
                    );

                    console.log(
                        "✅ تم إنشاء المستخدم في Firebase"
                    );

                    console.log(
                        "Document ID:",
                        savedSnap.id
                    );

                    console.log(
                        "Stage:",
                        savedData.stage
                    );

                    console.log(
                        "Grade:",
                        savedData.grade
                    );

                    console.log(
                        "================================"
                    );


                    /*
                     * تأكيد المرحلة
                     */

                    if (
                        normalizeText(
                            savedData.stage
                        ) !==
                        stage
                    ) {

                        throw new Error(
                            "المرحلة لم يتم حفظها بشكل صحيح."
                        );

                    }


                    /*
                     * تأكيد الصف
                     */

                    if (
                        normalizeGrade(
                            savedData.grade
                        ) !==
                        grade
                    ) {

                        throw new Error(
                            "الصف لم يتم حفظه بشكل صحيح."
                        );

                    }


                    /* =================================
                       LocalStorage
                    ================================= */

                    /*
                     * أهم 3 قيم للنظام كله
                     */

                    localStorage.setItem(
                        "userDocId",
                        savedSnap.id
                    );


                    localStorage.setItem(
                        "currentUser",
                        username
                    );


                    localStorage.setItem(
                        "username",
                        username
                    );


                    localStorage.setItem(
                        "userStage",
                        stage
                    );


                    localStorage.setItem(
                        "stage",
                        stage
                    );


                    localStorage.setItem(
                        "servantStage",
                        stage
                    );


                    localStorage.setItem(
                        "userGrade",
                        grade
                    );


                    localStorage.setItem(
                        "grade",
                        grade
                    );


                    localStorage.setItem(
                        "servantGrade",
                        grade
                    );


                    /*
                     * نحتفظ بالـ userId أيضاً
                     */

                    localStorage.setItem(
                        "userId",
                        userId
                    );


                    /* =================================
                       الانتقال
                    ================================= */

                    window.location.href =
                        "home.html";


                } catch (error) {

                    console.error(
                        "❌ خطأ أثناء إنشاء الحساب:",
                        error
                    );


                    errorMsg.innerText =
                        error.message ||
                        "حدث خطأ أثناء حفظ البيانات.";


                    submitBtn.innerText =
                        "حفظ البيانات";


                    submitBtn.disabled =
                        false;

                }

            };

    </script>

</head>


<body>

    <div class="form-card">

        <div class="drag-handle">
            <span></span>
        </div>


        <div class="card-body">


            <div class="logo-container">

                <div class="church-logo">

                    <i class="fas fa-cross"></i>

                </div>

            </div>


            <h2>
                إنشاء حساب مستخدم
            </h2>


            <div class="subtitle">
                بوابة تسجيل بيانات اللاعبين
            </div>


            <div id="error-msg"></div>


            <!-- =================================
                 الخطوة الأولى
            ================================= -->

            <div
                id="step-1"
                class="step-section active"
            >

                <div class="notebook-note">

                    <i class="fas fa-circle-info"></i>

                    <div>

                        <h4>
                            ملاحظة هامة
                        </h4>

                        <p>
                            يرجى كتابة اسم المستخدم وكلمة المرور لتسجيل الدخول بالبرنامج لاحقاً
                        </p>

                    </div>

                </div>


                <div class="input-group">

                    <label>
                        اسم المستخدم (Username)
                    </label>

                    <div class="field-wrap">

                        <input
                            type="text"
                            id="username"
                            placeholder="اكتب اسم المستخدم"
                            required
                        >

                        <i
                            class="fas fa-user field-icon"
                        ></i>

                    </div>

                </div>


                <div class="input-group">

                    <label>
                        كلمة المرور (Password)
                    </label>

                    <div class="field-wrap">

                        <input
                            type="password"
                            id="password"
                            placeholder="ادخل كلمة المرور"
                            required
                        >

                        <i
                            class="fas fa-lock field-icon"
                        ></i>


                        <i
                            class="fas fa-eye field-toggle"
                            id="togglePasswordIcon"
                            onclick="togglePassword()"
                        ></i>

                    </div>

                </div>


                <button
                    type="button"
                    class="btn-action"
                    id="btnNext"
                    onclick="nextStep()"
                >
                    التالي ➔
                </button>

            </div>


            <!-- =================================
                 الخطوة الثانية
            ================================= -->

            <div
                id="step-2"
                class="step-section"
            >

                <div id="error-msg-2"></div>


                <form
                    onsubmit="handleRegister(event)"
                >


                    <div class="input-group">

                        <label>
                            رقم المستخدم
                        </label>

                        <div class="field-wrap">

                            <input
                                type="text"
                                id="userId"
                                placeholder="رقم المستخدم"
                                required
                            >

                            <i
                                class="fas fa-id-card field-icon"
                            ></i>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            تاريخ الميلاد
                        </label>

                        <div class="field-wrap">

                            <input
                                type="date"
                                id="birthdate"
                                required
                            >

                            <i
                                class="fas fa-calendar-days field-icon"
                            ></i>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            رقم الأب
                        </label>

                        <div class="field-wrap">

                            <input
                                type="tel"
                                id="fatherPhone"
                                placeholder="01xxxxxxxxx"
                                required
                            >

                            <i
                                class="fas fa-phone field-icon"
                            ></i>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            رقم الأم
                        </label>

                        <div class="field-wrap">

                            <input
                                type="tel"
                                id="motherPhone"
                                placeholder="01xxxxxxxxx"
                                required
                            >

                            <i
                                class="fas fa-phone field-icon"
                            ></i>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            العنوان
                        </label>

                        <div class="field-wrap">

                            <input
                                type="text"
                                id="address"
                                placeholder="العنوان بالتفصيل"
                                required
                            >

                            <i
                                class="fas fa-location-dot field-icon"
                            ></i>

                        </div>

                    </div>


                    <!-- المرحلة -->

                    <div class="input-group">

                        <label>
                            المرحلة الدراسية
                        </label>

                        <select
                            id="stage"
                            required
                            onchange="updateGrades()"
                        >

                            <option
                                value=""
                                disabled
                                selected
                            >
                                اختر المرحلة الدراسية
                            </option>

                            <option value="ابتدائي">
                                ابتدائي
                            </option>

                            <option value="إعدادي">
                                إعدادي
                            </option>

                            <option value="ثانوي">
                                ثانوي
                            </option>

                        </select>

                    </div>


                    <!-- الصف -->

                    <div class="input-group">

                        <label>
                            الصف الدراسي
                        </label>

                        <select
                            id="grade"
                            required
                        >

                            <option
                                value=""
                                disabled
                                selected
                            >
                                اختر المرحلة أولاً
                            </option>

                        </select>

                    </div>


                    <!-- حفظ -->

                    <button
                        type="submit"
                        class="btn-action"
                        id="submitBtn"
                    >
                        حفظ البيانات
                    </button>


                    <!-- رجوع -->

                    <button
                        type="button"
                        class="btn-action btn-secondary"
                        onclick="prevStep()"
                    >
                        ⬅ رجوع للخلف
                    </button>


                </form>

            </div>

        </div>

    </div>

</body>

</html>
