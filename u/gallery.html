<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هدايا مرحلتي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --navy: #061d39;
      --navy-dark: #020c19;
      --maroon: #7d1424;
      --maroon-dark: #5d101c;
      --gold: #c9a24b;
      --ink: #211918;
      --muted: #817773;
      --line: #eadfe0;
      --soft: #fff7f8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      padding: 15px 12px 30px;
      color: var(--ink);
      font-family: "Tajawal", sans-serif;
      background: radial-gradient(circle at top, #0a2d57 0, var(--navy) 48%, var(--navy-dark) 100%);
    }
    .topbar, .page { width: min(900px, 100%); margin-inline: auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      color: #fff;
      font-weight: 800;
    }
    .topbar-title { display: flex; align-items: center; gap: 9px; }
    .topbar-title i { color: var(--gold); }
    .topbar-actions { display: flex; gap: 7px; }
    .topbar-actions button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      color: var(--maroon);
      background: #fff;
      box-shadow: 0 7px 18px rgb(0 0 0 / 22%);
      cursor: pointer;
    }
    .page {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border-radius: 27px;
      background: #fff;
      box-shadow: 0 30px 70px rgb(0 0 0 / 35%);
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--navy), var(--maroon), var(--gold), var(--maroon), var(--navy));
    }
    .page-head { margin-bottom: 20px; text-align: center; }
    .page-icon {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 50%;
      color: #fff;
      font-size: 30px;
      background: linear-gradient(145deg, #a51f35, var(--maroon-dark));
      box-shadow: 0 10px 22px rgb(125 20 36 / 25%);
    }
    h1 { font: 700 clamp(28px, 5vw, 38px) "Amiri", serif; }
    h1 span { color: var(--maroon); }
    .page-head p { margin-top: 5px; color: var(--muted); font-size: 14px; }
    .servant-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid #ead2d6;
      border-radius: 16px;
      color: var(--maroon-dark);
      background: linear-gradient(135deg, #fff7f8, #fff);
    }
    .servant-badge i { color: var(--maroon); font-size: 22px; }
    .servant-badge small { display: block; color: var(--muted); font-size: 11px; }
    .servant-badge strong { display: block; margin-top: 2px; font: 700 20px "Amiri", serif; }
    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }
    .gift-card {
      overflow: hidden;
      border: 1px solid #eee4e5;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 20px rgb(0 0 0 / 6%);
      transition: .25s ease;
    }
    .gift-card:hover {
      border-color: #d9b6bc;
      box-shadow: 0 15px 30px rgb(125 20 36 / 13%);
      transform: translateY(-4px);
    }
    .gift-img-wrapper { position: relative; overflow: hidden; cursor: pointer; }
    .gift-img {
      display: block;
      width: 100%;
      height: 175px;
      object-fit: cover;
      background: #f8f6f3;
      transition: transform .35s ease;
    }
    .gift-card:hover .gift-img { transform: scale(1.04); }
    .zoom-badge {
      position: absolute;
      bottom: 9px;
      left: 9px;
      padding: 5px 8px;
      border-radius: 8px;
      color: #fff;
      background: rgb(0 0 0 / 65%);
      font-size: 10px;
    }
    .gift-details { display: flex; flex-direction: column; gap: 7px; padding: 15px; }
    .gift-title { color: var(--maroon); font: 700 21px "Amiri", serif; }
    .gift-info { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
    .gift-info strong { color: var(--maroon); }
    .no-gifts {
      grid-column: 1 / -1;
      padding: 38px 20px;
      border: 1px dashed #d9c9cc;
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
      background: #f8f6f3;
    }
    .no-gifts i { display: block; margin-bottom: 10px; color: var(--maroon); font-size: 32px; }
    .image-modal {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgb(0 0 0 / 82%);
    }
    .modal-content { width: min(500px, 100%); text-align: center; }
    .image-modal img {
      width: 100%;
      max-height: 62vh;
      object-fit: contain;
      border-radius: 20px;
      background: #fff;
    }
    .close-modal {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: rgb(255 255 255 / 15%);
      font-size: 24px;
      cursor: pointer;
    }
    .image-modal h3 { margin-top: 16px; color: #fff; font: 700 25px "Amiri", serif; }
    .modal-details { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
    .modal-details span { padding: 8px 12px; border-radius: 10px; color: #fff; background: rgb(255 255 255 / 12%); font-size: 13px; }
    @media (max-width: 650px) {
      body { padding: 9px 8px 22px; }
      .page { padding: 23px 14px; border-radius: 22px; }
      .gifts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title"><i class="fas fa-gift"></i><span>هدايا المخدوم</span></div>
    <div class="topbar-actions">
      <button id="homeBtn" type="button" title="الرئيسية"><i class="fas fa-house"></i></button>
      <button id="reloadBtn" type="button" title="تحديث"><i class="fas fa-rotate"></i></button>
    </div>
  </header>

  <main class="page">
    <header class="page-head">
      <div class="page-icon"><i class="fas fa-gift"></i></div>
      <h1>هدايا <span>مرحلتي</span></h1>
      <p>الهدايا المتاحة لمخدومين مرحلتك فقط</p>
    </header>

    <div class="servant-badge">
      <i class="fas fa-graduation-cap"></i>
      <div>
        <small>المرحلة والصف</small>
        <strong id="stageBadge">جاري التحميل...</strong>
      </div>
    </div>

    <section id="giftsContainer" class="gifts-grid">
      <div class="no-gifts"><i class="fas fa-spinner fa-spin"></i>جاري تحميل الهدايا...</div>
    </section>
  </main>

  <div id="imageModal" class="image-modal">
    <button id="closeModal" class="close-modal" type="button"><i class="fas fa-xmark"></i></button>
    <div class="modal-content">
      <img id="modalImg" src="" alt="صورة الهدية">
      <h3 id="modalTitle"></h3>
      <div id="modalDetails" class="modal-details"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
      authDomain: "st-mina-c01ec.firebaseapp.com",
      databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
      projectId: "st-mina-c01ec",
      storageBucket: "st-mina-c01ec.firebasestorage.app",
      messagingSenderId: "792349150559",
      appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
      measurementId: "G-XZGSBG05KR"
    };
    const db = getFirestore(initializeApp(firebaseConfig));
    const $ = (selector) => document.querySelector(selector);

    function normalize(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/ـ/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLocaleLowerCase("ar-EG");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseCurrentUser() {
      const raw = localStorage.getItem("currentUser");
      let stored = {};
      try {
        stored = raw ? JSON.parse(raw) : {};
      } catch {
        stored = { username: raw };
      }
      return {
        id: stored.id || stored.docId || stored.userId || localStorage.getItem("userDocId") || "",
        username: stored.username || stored.userName
          || localStorage.getItem("username")
          || localStorage.getItem("currentUsername")
          || raw || "",
        fullName: stored.fullName || stored.name || localStorage.getItem("fullName") || ""
      };
    }

    function userValues(user) {
      return [
        user.id, user.username, user.userName, user.fullName,
        user.name, user.uid
      ].map(normalize).filter(Boolean);
    }

    function giftBelongsToServant(gift, servant) {
      const giftOwnerValues = [
        gift.userId, gift.userDocId, gift.uid,
        gift.username, gift.userName, gift.fullName
      ].map(normalize).filter(Boolean);

      const servantValues = userValues(servant);

      /*
       * إذا كانت الهدية مخصصة لمستخدم بعينه، نعرضها له فقط.
       * أما الهدايا العامة، فلا تظهر إلا إذا طابقت المرحلة والصف.
       */
      if (giftOwnerValues.length) {
        return giftOwnerValues.some((value) => servantValues.includes(value));
      }

      const sameStage =
        normalize(gift.stage || gift.stageName) === normalize(servant.stage);
      const giftGrade = normalize(gift.grade || gift.className);
      const servantGrade = normalize(servant.grade);
      const sameGrade = !giftGrade || giftGrade === servantGrade;

      return Boolean(servant.stage) && sameStage && sameGrade;
    }

    function openGift(gift) {
      $("#modalImg").src = gift.image || "";
      $("#modalTitle").textContent = gift.name || "هدية";
      $("#modalDetails").innerHTML = `
        <span><i class="fas fa-box"></i> الكمية: ${Number(gift.quantity) || 0}</span>
        <span><i class="fas fa-star"></i> النقاط: ${Number(gift.points) || 0}</span>
      `;
      $("#imageModal").style.display = "flex";
    }

    async function loadPage() {
      const container = $("#giftsContainer");
      try {
        const profile = parseCurrentUser();
        const usersSnapshot = await getDocs(collection(db, "users"));
        const users = usersSnapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
        const servant = users.find((user) =>
          userValues(user).some((value) => userValues(profile).includes(value))
        );

        if (!servant?.stage) {
          $("#stageBadge").textContent = "لم يتم تحديد المرحلة";
          container.innerHTML = `
            <div class="no-gifts">
              <i class="fas fa-triangle-exclamation"></i>
              لم يتم تحديد مرحلة المخدوم في بياناته.
            </div>
          `;
          return;
        }

        $("#stageBadge").textContent =
          `${servant.stage}${servant.grade ? ` • ${servant.grade}` : ""}`;

        const giftsSnapshot = await getDocs(collection(db, "gifts"));
        const gifts = giftsSnapshot.docs
          .map((item) => ({ id: item.id, ...item.data() }))
          .filter((gift) => (Number(gift.quantity) || 0) > 0)
          .filter((gift) => giftBelongsToServant(gift, servant));

        if (!gifts.length) {
          container.innerHTML = `
            <div class="no-gifts">
              <i class="fas fa-gift"></i>
              لا توجد هدايا متاحة لمرحلتك حاليًا.
            </div>
          `;
          return;
        }

        container.innerHTML = "";
        gifts.forEach((gift) => {
          const image = gift.image || "https://via.placeholder.com/500x350/f6f1e9/7c1b28?text=هدية";
          const card = document.createElement("article");
          card.className = "gift-card";
          card.innerHTML = `
            <div class="gift-img-wrapper">
              <img class="gift-img" src="${escapeHtml(image)}" alt="${escapeHtml(gift.name || "هدية")}">
              <span class="zoom-badge"><i class="fas fa-search-plus"></i> عرض التفاصيل</span>
            </div>
            <div class="gift-details">
              <div class="gift-title">${escapeHtml(gift.name || "هدية")}</div>
              <div class="gift-info"><span>الكمية</span><strong>${Number(gift.quantity) || 0}</strong></div>
              <div class="gift-info"><span>النقاط</span><strong>${Number(gift.points) || 0}</strong></div>
            </div>
          `;
          card.querySelector(".gift-img-wrapper").addEventListener("click", () => openGift(gift));
          card.querySelector("img").addEventListener("error", (event) => {
            event.currentTarget.src = "https://via.placeholder.com/500x350/f6f1e9/7c1b28?text=هدية";
          });
          container.appendChild(card);
        });
      } catch (error) {
        console.error("خطأ في تحميل هدايا المرحلة:", error);
        container.innerHTML = `
          <div class="no-gifts">
            <i class="fas fa-triangle-exclamation"></i>
            حدث خطأ أثناء تحميل هدايا المرحلة.
          </div>
        `;
      }
    }

    $("#closeModal").addEventListener("click", () => { $("#imageModal").style.display = "none"; });
    $("#imageModal").addEventListener("click", (event) => {
      if (event.target === $("#imageModal")) $("#imageModal").style.display = "none";
    });
    $("#homeBtn").addEventListener("click", () => { location.href = "home.html"; });
    $("#reloadBtn").addEventListener("click", () => { location.reload(); });
    loadPage();
  </script>
</body>
</html>
