<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>معرض الهدايا - St. Mina</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: "Cairo", sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #232f3e;
            color: #febd69;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .12);
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 7px 0 0;
            color: #fff;
            font-size: 14px;
        }

        /* =========================
           POINTS
        ========================= */

        .points-box {
            background: white;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, .07);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;

            background: #232f3e;
            color: #febd69;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .user-info h3 {
            margin: 0;
            font-size: 15px;
        }

        .user-info p {
            margin: 3px 0 0;
            font-size: 12px;
            color: #777;
        }

        .points-label {
            font-size: 11px;
            color: #777;
            text-align: center;
        }

        .points {
            font-size: 21px;
            font-weight: 900;
            color: #f59e0b;
        }

        /* =========================
           SECTION
        ========================= */

        .section-title {
            margin-bottom: 15px;
            font-size: 19px;
            font-weight: 900;
        }

        /* =========================
           GIFTS
        ========================= */

        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );

            gap: 18px;
        }

        .gift-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 7px 20px rgba(0, 0, 0, .08);

            transition: .25s;

            display: flex;
            flex-direction: column;
        }

        .gift-card:hover {
            transform: translateY(-4px);
        }

        .gift-image {
            width: 100%;
            height: 200px;

            background: #f1f3f5;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .gift-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gift-image i {
            font-size: 60px;
            color: #f59e0b;
        }

        .gift-content {
            padding: 15px;

            display: flex;
            flex-direction: column;

            gap: 9px;

            flex: 1;
        }

        .gift-name {
            font-size: 17px;
            font-weight: 900;
        }

        .gift-price {
            color: #f59e0b;
            font-weight: 900;
        }

        .gift-quantity {
            font-size: 12px;
            color: #137333;
        }

        .buy-btn {
            border: none;

            background: #232f3e;
            color: #febd69;

            padding: 11px;

            border-radius: 10px;

            font-family: "Cairo", sans-serif;

            font-weight: 900;

            cursor: pointer;

            margin-top: auto;
        }

        .buy-btn:hover {
            opacity: .9;
        }

        .buy-btn:disabled {
            background: #ccc;
            color: #666;
            cursor: not-allowed;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            background: white;

            border-radius: 15px;

            padding: 30px;

            text-align: center;

            color: #777;
        }

        /* =========================
           SUCCESS
        ========================= */

        .success {
            background: #e8f5e9;
            color: #137333;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 15px;

            display: none;

            text-align: center;

            font-weight: bold;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .65);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 99999;
        }

        .modal-box {
            background: white;

            width: 100%;

            max-width: 420px;

            border-radius: 20px;

            padding: 25px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .3);
        }

        .modal-icon {
            width: 75px;
            height: 75px;

            border-radius: 50%;

            background: #fff4d8;

            color: #f59e0b;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: auto auto 15px;

            font-size: 32px;
        }

        .modal-box h2 {
            margin: 0 0 10px;

            font-size: 20px;
        }

        .modal-box p {
            color: #666;

            font-size: 14px;

            line-height: 1.8;
        }

        .modal-buttons {
            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;

            border: none;

            padding: 11px;

            border-radius: 10px;

            font-family: "Cairo", sans-serif;

            font-weight: 900;

            cursor: pointer;
        }

        .confirm-btn {
            background: #137333;
            color: white;
        }

        .cancel-btn {
            background: #eee;
            color: #555;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px) {

            body {
                padding: 12px;
            }

            .gifts-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }

            .gift-image {
                height: 150px;
            }

            .gift-name {
                font-size: 14px;
            }

            .gift-content {
                padding: 10px;
            }

            .points-box {
                padding: 12px;
            }

            .header h1 {
                font-size: 21px;
            }
        }

    </style>
</head>


<body>
    <form action="home.html" method="get">
<a href="home.html" class="back-home-btn">
    <i class="fas fa-home"></i>
    <span>العودة للرئيسية</span>
</a>
</form>
<div class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>

            <i class="fas fa-gift"></i>

            معرض الهدايا

        </h1>

        <p>

            St. Mina - اختر هديتك باستخدام نقاطك ⭐

        </p>

    </div>


    <!-- =========================
         USER POINTS
    ========================= -->

    <div class="points-box">

        <div class="user-info">

            <div class="user-icon">

                <i class="fas fa-user"></i>

            </div>

            <div>

                <h3 id="usernameDisplay">
                    جاري التحميل...
                </h3>

                <p id="userStageDisplay">
                    جاري تحميل البيانات...
                </p>

            </div>

        </div>


        <div>

            <div class="points-label">
                نقاطك
            </div>

            <div class="points">

                ⭐

                <span id="pointsDisplay">
                    0
                </span>

            </div>

        </div>

    </div>


    <!-- =========================
         SUCCESS
    ========================= -->

    <div id="successMessage" class="success">

        تم إرسال طلب الهدية بنجاح ✅

    </div>


    <!-- =========================
         GIFTS
    ========================= -->

    <div class="section-title">

        <i class="fas fa-store"></i>

        الهدايا المتاحة

    </div>


    <div id="giftsContainer" class="gifts-grid">

        <div
            class="loading"
            style="grid-column:1/-1;">

            <i class="fas fa-spinner fa-spin"></i>

            جاري تحميل الهدايا...

        </div>

    </div>

</div>


<!-- =========================
     CONFIRM MODAL
========================= -->

<div id="confirmModal" class="modal">

    <div class="modal-box">

        <div class="modal-icon">

            <i class="fas fa-gift"></i>

        </div>


        <h2>

            تأكيد طلب الهدية

        </h2>


        <p id="confirmText">

            هل تريد طلب هذه الهدية؟

        </p>


        <div class="modal-buttons">

            <button
                id="confirmBuyBtn"
                class="confirm-btn">

                <i class="fas fa-check"></i>

                تأكيد الطلب

            </button>


            <button
                id="cancelBuyBtn"
                class="cancel-btn">

                إلغاء

            </button>

        </div>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    addDoc,
    serverTimestamp,
    runTransaction
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",

    authDomain:
        "st-mina-c01ec.firebaseapp.com",

    databaseURL:
        "https://st-mina-c01ec-default-rtdb.firebaseio.com",

    projectId:
        "st-mina-c01ec",

    storageBucket:
        "st-mina-c01ec.firebasestorage.app",

    messagingSenderId:
        "792349150559",

    appId:
        "1:792349150559:web:8a86bbf57c2c7e351f3aea",

    measurementId:
        "G-XZGSBG05KR"
};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* =====================================================
   USERNAME
===================================================== */

const loggedInUsername =
    localStorage.getItem("currentUser") ||
    localStorage.getItem("username") ||
    "tony1";


/* =====================================================
   VARIABLES
===================================================== */

let currentUserDoc = null;

let currentUserData = null;

let currentUserPoints = 0;

let currentUserStage = "";

let currentUserGrade = "";

let selectedGift = null;


/* =====================================================
   ELEMENTS
===================================================== */

const giftsContainer =
    document.getElementById(
        "giftsContainer"
    );


const pointsDisplay =
    document.getElementById(
        "pointsDisplay"
    );


const usernameDisplay =
    document.getElementById(
        "usernameDisplay"
    );


const userStageDisplay =
    document.getElementById(
        "userStageDisplay"
    );


const confirmModal =
    document.getElementById(
        "confirmModal"
    );


const confirmText =
    document.getElementById(
        "confirmText"
    );


const confirmBuyBtn =
    document.getElementById(
        "confirmBuyBtn"
    );


const cancelBuyBtn =
    document.getElementById(
        "cancelBuyBtn"
    );


const successMessage =
    document.getElementById(
        "successMessage"
    );


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser() {

    const usersSnap =
        await getDocs(
            collection(
                db,
                "users"
            )
        );


    const target =
        String(
            loggedInUsername
        )
        .trim()
        .toLowerCase();


    for (
        const userDoc
        of usersSnap.docs
    ) {

        const data =
            userDoc.data();


        const docUsername =
            String(
                userDoc.id
            )
            .trim()
            .toLowerCase();


        const fieldUsername =
            data.username
                ? String(
                    data.username
                )
                .trim()
                .toLowerCase()
                : "";


        if (
            docUsername === target ||
            fieldUsername === target
        ) {

            currentUserDoc =
                userDoc;

            currentUserData =
                data;

            break;
        }
    }


    if (!currentUserDoc) {

        throw new Error(
            "لم يتم العثور على حساب المخدوم."
        );
    }


    currentUserPoints =
        Number(
            currentUserData.points || 0
        );


    currentUserStage =
        currentUserData.stage || "";


    currentUserGrade =
        currentUserData.grade || "";


    usernameDisplay.textContent =
        currentUserData.username ||
        currentUserDoc.id;


    userStageDisplay.textContent =
        `المرحلة: ${
            currentUserStage ||
            "غير محددة"
        } - الصف: ${
            currentUserGrade ||
            "غير محدد"
        }`;


    updatePointsUI();
}


/* =====================================================
   POINTS UI
===================================================== */

function updatePointsUI() {

    pointsDisplay.textContent =
        currentUserPoints;
}


/* =====================================================
   LOAD GIFTS
===================================================== */

async function loadGifts() {

    try {

        giftsContainer.innerHTML = `

            <div
                class="loading"
                style="grid-column:1/-1;">

                <i class="fas fa-spinner fa-spin"></i>

                جاري تحميل الهدايا...

            </div>

        `;


        const giftsSnap =
            await getDocs(
                collection(
                    db,
                    "gifts"
                )
            );


        giftsContainer.innerHTML = "";


        let foundAny = false;


        for (
            const giftDoc
            of giftsSnap.docs
        ) {

            const gift =
                giftDoc.data();


            /*
             * =============================
             * الكمية
             * =============================
             */

            const quantity =
                Number(
                    gift.quantity || 0
                );


            /*
             * =============================
             * لو الكمية صفر
             *
             * لا تعرض الهدية نهائيًا
             * =============================
             */

            if (
                quantity <= 0
            ) {

                continue;
            }


            /*
             * =============================
             * فلترة الصف
             * =============================
             */

            if (
                gift.grade &&
                currentUserGrade &&
                String(gift.grade)
                    .trim()
                    .toLowerCase() !==
                String(currentUserGrade)
                    .trim()
                    .toLowerCase()
            ) {

                continue;
            }


            foundAny = true;


            const giftId =
                giftDoc.id;


            const giftName =
                gift.name ||
                "هدية بدون اسم";


            const giftPoints =
                Number(
                    gift.points || 0
                );


            const image =
                gift.image ||
                gift.imageUrl ||
                "";


            const enoughPoints =
                currentUserPoints >=
                giftPoints;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "gift-card";


            const imageHTML =
                image

                    ? `
                        <img
                            src="${escapeHtmlAttribute(image)}"
                            alt="${escapeHtmlAttribute(giftName)}">
                      `

                    : `
                        <i class="fas fa-gift"></i>
                      `;


            let buttonText =
                "طلب الهدية";


            if (!enoughPoints) {

                buttonText =
                    "النقاط غير كافية";
            }


            card.innerHTML = `

                <div class="gift-image">

                    ${imageHTML}

                </div>


                <div class="gift-content">

                    <div class="gift-name">

                        ${escapeHtml(giftName)}

                    </div>


                    <div class="gift-price">

                        ⭐

                        ${giftPoints}

                        نقطة

                    </div>


                    <div class="gift-quantity">

                        <i class="fas fa-box"></i>

                        المتبقي:

                        ${quantity}

                        قطعة

                    </div>


                    <button
                        class="buy-btn"
                        ${!enoughPoints ? "disabled" : ""}>

                        <i class="fas fa-gift"></i>

                        ${buttonText}

                    </button>

                </div>

            `;


            const buyButton =
                card.querySelector(
                    ".buy-btn"
                );


            if (enoughPoints) {

                buyButton.addEventListener(
                    "click",
                    () => {

                        openConfirmModal({

                            id:
                                giftId,

                            name:
                                giftName,

                            points:
                                giftPoints,

                            quantity:
                                quantity,

                            image:
                                image
                        });

                    }
                );
            }


            giftsContainer.appendChild(
                card
            );
        }


        /*
         * =============================
         * لا توجد هدايا
         * =============================
         */

        if (!foundAny) {

            giftsContainer.innerHTML = `

                <div
                    class="loading"
                    style="grid-column:1/-1;">

                    <i class="fas fa-box-open"></i>

                    <br><br>

                    لا توجد هدايا متاحة حاليًا 🎁

                </div>

            `;
        }


    } catch (error) {

        console.error(
            "LOAD GIFTS ERROR:",
            error
        );


        giftsContainer.innerHTML = `

            <div
                class="loading"
                style="grid-column:1/-1;">

                حدث خطأ أثناء تحميل الهدايا ❌

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;
    }
}


/* =====================================================
   OPEN MODAL
===================================================== */

function openConfirmModal(gift) {

    selectedGift =
        gift;


    confirmText.innerHTML = `

        هل تريد طلب:

        <strong>
            ${escapeHtml(gift.name)}
        </strong>

        ؟

        <br><br>

        سيتم خصم

        <strong>
            ${gift.points}
        </strong>

        نقطة ⭐

        <br>

        وسيتم حجز قطعة واحدة من المعرض 🎁

    `;


    confirmModal.style.display =
        "flex";
}


/* =====================================================
   CANCEL
===================================================== */

cancelBuyBtn.addEventListener(
    "click",
    () => {

        selectedGift =
            null;

        confirmModal.style.display =
            "none";
    }
);


confirmModal.addEventListener(
    "click",
    (event) => {

        if (
            event.target ===
            confirmModal
        ) {

            selectedGift =
                null;

            confirmModal.style.display =
                "none";
        }
    }
);


/* =====================================================
   CONFIRM BUY
===================================================== */

confirmBuyBtn.addEventListener(
    "click",
    async () => {

        if (!selectedGift) {
            return;
        }


        confirmBuyBtn.disabled =
            true;


        confirmBuyBtn.innerHTML = `

            <i class="fas fa-spinner fa-spin"></i>

            جاري تنفيذ الطلب...

        `;


        try {

            await createGiftOrder(
                selectedGift
            );


            confirmModal.style.display =
                "none";


            successMessage.style.display =
                "block";


            setTimeout(
                () => {

                    successMessage.style.display =
                        "none";

                },
                5000
            );


            selectedGift =
                null;


            /*
             * تحديث البيانات
             */

            await loadUser();

            await loadGifts();


        } catch (error) {

            console.error(
                "BUY ERROR:",
                error
            );


            alert(
                error.message ||
                "حدث خطأ أثناء طلب الهدية."
            );


        } finally {

            confirmBuyBtn.disabled =
                false;


            confirmBuyBtn.innerHTML = `

                <i class="fas fa-check"></i>

                تأكيد الطلب

            `;
        }
    }
);


/* =====================================================
   CREATE ORDER
===================================================== */

async function createGiftOrder(gift) {

    if (!currentUserDoc) {

        throw new Error(
            "لم يتم تحميل حسابك."
        );
    }


    const userRef =
        currentUserDoc.ref;


    const giftRef =
        doc(
            db,
            "gifts",
            gift.id
        );


    /*
     * =========================================
     * TRANSACTION
     * =========================================
     */

    await runTransaction(
        db,
        async (transaction) => {

            const userSnap =
                await transaction.get(
                    userRef
                );


            const giftSnap =
                await transaction.get(
                    giftRef
                );


            if (!userSnap.exists()) {

                throw new Error(
                    "حسابك غير موجود."
                );
            }


            if (!giftSnap.exists()) {

                throw new Error(
                    "هذه الهدية لم تعد موجودة."
                );
            }


            const userData =
                userSnap.data();


            const giftData =
                giftSnap.data();


            const actualPoints =
                Number(
                    userData.points || 0
                );


            const actualQuantity =
                Number(
                    giftData.quantity || 0
                );


            const giftPoints =
                Number(
                    giftData.points || 0
                );


            /*
             * =================================
             * تأكيد وجود الكمية
             * =================================
             */

            if (
                actualQuantity <= 0
            ) {

                throw new Error(
                    "آسف، هذه الهدية نفدت بالفعل."
                );
            }


            /*
             * =================================
             * تأكيد النقاط
             * =================================
             */

            if (
                actualPoints <
                giftPoints
            ) {

                throw new Error(
                    `نقاطك غير كافية. تحتاج ${giftPoints} نقطة، ولديك ${actualPoints} نقطة فقط.`
                );
            }


            /*
             * =================================
             * خصم النقاط
             * =================================
             */

            transaction.update(
                userRef,
                {
                    points:
                        actualPoints -
                        giftPoints
                }
            );


            /*
             * =================================
             * خصم قطعة
             * =================================
             */

            transaction.update(
                giftRef,
                {
                    quantity:
                        actualQuantity -
                        1
                }
            );
        }
    );


    /*
     * =========================================
     * إنشاء الطلب
     * =========================================
     */

    await addDoc(
        collection(
            db,
            "notifications"
        ),
        {

            type:
                "gift_order",


            title:
                "طلب هدية جديد",


            message:
                `قام المخدوم (${loggedInUsername}) من مرحلة (${currentUserStage} - ${currentUserGrade}) بطلب الهدية "${gift.name}" مقابل ${gift.points} نقطة.`,


            username:
                loggedInUsername,


            stage:
                currentUserStage,


            grade:
                currentUserGrade,


            /*
             * مهم جدًا
             */

            giftId:
                gift.id,


            giftName:
                gift.name,


            pointsSpent:
                Number(gift.points),


            /*
             * حالة الطلب
             */

            status:
                "pending",


            /*
             * لم يتم استرجاعه
             */

            refundProcessed:
                false,


            /*
             * لم يتم رفضه
             */

            isRejected:
                false,


            /*
             * لم يتم تسليمه
             */

            isDelivered:
                false,


            timestamp:
                serverTimestamp(),


            isRead:
                false
        }
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeHtmlAttribute(text) {

    return String(text)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /\n/g,
            " "
        );
}


/* =====================================================
   START
===================================================== */

async function start() {

    try {

        await loadUser();

        await loadGifts();

    } catch (error) {

        console.error(error);

        giftsContainer.innerHTML = `

            <div
                class="loading"
                style="grid-column:1/-1;">

                حدث خطأ ❌

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;
    }
}


start();

</script>
