<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Amiri', serif;
        }

        .form-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            box-shadow:
                0 0 25px rgba(56, 189, 248, 0.15),
                inset 0 0 15px rgba(56, 189, 248, 0.05),
                0 25px 50px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 460px;
            border: 2px solid rgba(56, 189, 248, 0.3);
        }

        h2 {
            margin-bottom: 25px;
            text-align: center;
            font-size: 28px;
            color: #38bdf8;
            text-shadow:
                0 0 10px rgba(56, 189, 248, 0.6),
                2px 2px 0px #000,
                4px 4px 0px #0f172a;
            letter-spacing: 1.5px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #e2e8f0;
            margin-bottom: 6px;
            font-size: 17px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #020617;
            border: 2px solid #1e293b;
            border-radius: 10px;
            color: #38bdf8;
            font-size: 16px;
            font-family: 'Amiri', serif;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            background: #030712;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 2px 4px rgba(0,0,0,0.9);
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 18px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            font-family: 'Amiri', serif;
            cursor: pointer;
            box-shadow: 0 6px 0 #03345c, 0 10px 25px rgba(2, 132, 199, 0.4);
            transition: all 0.1s ease;
            position: relative;
            top: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            box-shadow: 0 6px 0 #03345c, 0 15px 30px rgba(56, 189, 248, 0.6);
        }

        .btn-action:active {
            top: 4px;
            box-shadow: 0 2px 0 #03345c, 0 5px 10px rgba(2, 132, 199, 0.4);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #error-msg {
            color: #f43f5e;
            text-align: center;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(244, 63, 94, 0.5);
            min-height: 20px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.innerText = "";

            if (!username || !password) {
                errorMsg.innerText = "يرجى إدخال اسم المستخدم وكلمة المرور!";
                return;
            }

            loginBtn.innerText = "جاري الدخول...";
            loginBtn.disabled = true;

            try {
                // اسم المستخدم هو نفسه معرف المستند في Firestore
                const userDocRef = doc(db, "users", username);
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists()) {
                    errorMsg.innerText = "اسم المستخدم غير موجود.";
                    loginBtn.innerText = "دخول";
                    loginBtn.disabled = false;
                    return;
                }

                const userData = userSnap.data();

                if (userData.password !== password) {
                    errorMsg.innerText = "كلمة المرور غير صحيحة.";
                    loginBtn.innerText = "دخول";
                    loginBtn.disabled = false;
                    return;
                }

                // حفظ بيانات الدخول محلياً عشان تبقى متاحة داخل صفحة الهوم
                localStorage.setItem('userDocId', username);
                localStorage.setItem('currentUser', username);
                localStorage.setItem('username', username);
                localStorage.setItem('password', password);

                window.location.href = "home.html";

            } catch (error) {
                console.error(error);
                errorMsg.innerText = "حدث خطأ في الاتصال بقاعدة البيانات.";
                loginBtn.innerText = "دخول";
                loginBtn.disabled = false;
            }
        }
    </script>
</head>
<body>

    <div class="form-card">
        <h2>تسجيل الدخول</h2>
        <div id="error-msg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="username" required placeholder="اكتب اسم المستخدم هنا...">
            </div>

            <div class="input-group">
                <label>كلمة المرور (Password)</label>
                <input type="password" id="password" required placeholder="اكتب كلمة المرور هنا...">
            </div>

            <a href="pass.html" class="forgot-link">نسيت كلمة المرور؟</a>

            <button type="submit" class="btn-action" id="loginBtn">دخول</button>
        </form>
    </div>

</body>
</html>
