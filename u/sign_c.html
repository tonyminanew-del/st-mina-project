<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --navy-deep: #041a36;
            --navy-mid: #062348;
            --navy-edge: #000b18;

            --maroon-dark: #5d101c;
            --maroon: #7d1424;
            --maroon-light: #9b1c30;

            --ink: #1f1715;
            --muted: #8a817c;
            --field-border: #e1d8d0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    var(--navy-mid) 0%,
                    var(--navy-deep) 45%,
                    var(--navy-edge) 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Tajawal', sans-serif;
        }

        /* =========================
           الكارت
        ========================= */

        .form-card {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            border-radius: 30px;

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.5);

            position: relative;

            overflow: hidden;
        }

        .drag-handle {
            width: 100%;

            display: flex;
            justify-content: center;

            padding-top: 12px;
            padding-bottom: 4px;

            background: linear-gradient(180deg, #fbeef0 0%, #ffffff 60%);
        }

        .drag-handle span {
            width: 44px;
            height: 4px;
            border-radius: 4px;
            background: #e3c9cd;
        }

        .card-body {
            padding: 10px 32px 34px;
        }

        /* =========================
           اللوجو / الصليب
        ========================= */

        .logo-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-top: 10px;
            margin-bottom: 16px;
        }

        .church-logo {
            width: 74px;
            height: 74px;

            border-radius: 50%;

            background: linear-gradient(150deg, var(--maroon-light) 0%, var(--maroon-dark) 100%);

            display: flex;
            justify-content: center;
            align-items: center;

            color: #ffffff;

            font-size: 34px;

            box-shadow:
                0 10px 22px rgba(125, 20, 36, 0.35);
        }

        /* =========================
           العنوان
        ========================= */

        h2 {
            text-align: center;

            color: var(--ink);

            font-family: 'Amiri', serif;

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 6px;

            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;

            color: var(--muted);

            font-size: 14px;

            margin-bottom: 22px;
        }

        /* =========================
           رسالة الخطأ
        ========================= */

        #error-msg {

            color: #9f1239;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 14px;

            min-height: 20px;
        }

        /* =========================
           مجموعات الإدخال
        ========================= */

        .input-group {

            margin-bottom: 16px;

            width: 100%;
        }

        label {

            display: block;

            color: #6b625c;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 6px;

            text-align: right;
        }

        /* =========================
           الحقول
        ========================= */

        .field-wrap {
            position: relative;
        }

        .field-wrap i.field-icon {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);

            color: #b9afa8;
            font-size: 15px;

            pointer-events: none;
        }

        .field-wrap i.field-toggle {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);

            color: #b9afa8;
            font-size: 15px;

            cursor: pointer;
        }

        input {

            width: 100%;

            padding: 13px 42px 13px 42px;

            background: #faf8f7;

            border: 1.5px solid var(--field-border);

            border-radius: 13px;

            color: var(--ink);

            font-size: 15px;

            font-family: 'Tajawal', sans-serif;

            outline: none;

            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #b9afa8;
        }

        input:focus {

            border-color: var(--maroon);

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(125, 20, 36, 0.10);
        }

        /* حقل اسم المستخدم لا يحتاج مساحة يسار لأنه بلا زر عين */
        #username {
            padding-left: 15px;
        }

        /* =========================
           رابط نسيت كلمة المرور
        ========================= */

        .forgot-link {
            display: block;
            text-align: center;
            color: var(--maroon);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* =========================
           الأزرار
        ========================= */

        .btn-action {

            width: 100%;

            padding: 15px;

            margin-top: 6px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light) 0%,
                    var(--maroon-dark) 100%
                );

            color: #ffffff;

            font-family: 'Tajawal', sans-serif;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.25s ease;

            box-shadow:
                0 10px 22px rgba(125, 20, 36, 0.35);
        }

        .btn-action:hover {

            transform: translateY(-1px);

            box-shadow:
                0 12px 26px rgba(125, 20, 36, 0.45);
        }

        .btn-action:active {

            transform: translateY(1px);

            box-shadow:
                0 5px 12px rgba(125, 20, 36, 0.25);
        }

        .btn-action:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================
           رابط أسفل الكارت
        ========================= */

        .bottom-note {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted);
        }

        .bottom-note a {
            color: var(--maroon);
            font-weight: 700;
            text-decoration: none;
        }

        .bottom-note a:hover {
            text-decoration: underline;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 500px) {

            .card-body {

                padding: 8px 22px 28px;
            }

            h2 {

                font-size: 24px;
            }

            .church-logo {

                width: 66px;
                height: 66px;

                font-size: 30px;
            }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.togglePassword = function () {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        };

        window.handleLogin = async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.innerText = "";

            if (!username || !password) {
                errorMsg.innerText = "يرجى إدخال اسم المستخدم وكلمة المرور!";
                return;
            }

            loginBtn.innerText = "جاري الدخول...";
            loginBtn.disabled = true;

            try {
                // اسم المستخدم هو نفسه معرف المستند في Firestore
                const userDocRef = doc(db, "users", username);
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists()) {
                    errorMsg.innerText = "اسم المستخدم غير موجود.";
                    loginBtn.innerText = "دخول";
                    loginBtn.disabled = false;
                    return;
                }

                const userData = userSnap.data();

                if (userData.password !== password) {
                    errorMsg.innerText = "كلمة المرور غير صحيحة.";
                    loginBtn.innerText = "دخول";
                    loginBtn.disabled = false;
                    return;
                }

                // حفظ بيانات الدخول محلياً عشان تبقى متاحة داخل صفحة الهوم
                localStorage.setItem('userDocId', username);
                localStorage.setItem('currentUser', username);
                localStorage.setItem('username', username);
                localStorage.setItem('password', password);

                window.location.href = "home.html";

            } catch (error) {
                console.error(error);
                errorMsg.innerText = "حدث خطأ في الاتصال بقاعدة البيانات.";
                loginBtn.innerText = "دخول";
                loginBtn.disabled = false;
            }
        }
    </script>
</head>
<body>

    <div class="form-card">

        <div class="drag-handle">
            <span></span>
        </div>

        <div class="card-body">

            <div class="logo-container">
                <div class="church-logo">
                    <i class="fas fa-cross"></i>
                </div>
            </div>

            <h2>تسجيل الدخول</h2>
            <div class="subtitle">بوابة تسجيل دخول اللاعبين</div>

            <div id="error-msg"></div>

            <form onsubmit="handleLogin(event)">

                <div class="input-group">
                    <label>اسم المستخدم (Username)</label>
                    <div class="field-wrap">
                        <input type="text" id="username" required placeholder="اكتب اسم المستخدم هنا...">
                        <i class="fas fa-user field-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label>كلمة المرور (Password)</label>
                    <div class="field-wrap">
                        <input type="password" id="password" required placeholder="اكتب كلمة المرور هنا...">
                        <i class="fas fa-lock field-icon"></i>
                        <i class="fas fa-eye field-toggle" id="togglePasswordIcon" onclick="togglePassword()"></i>
                    </div>
                </div>

                <button type="submit" class="btn-action" id="loginBtn">دخول</button>

            </form>

            <div class="bottom-note">
                ليس لديك حساب؟ <a href="sign-cc.html">إنشاء حساب جديد</a>
            </div>

        </div>

    </div>

</body>
</html>
