<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب اللاعب</title>

    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #062348 0%,
                    #02162e 50%,
                    #000b18 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Amiri', serif;
        }

        /* =========================
           الكارت الأبيض
        ========================= */

        .form-card {
            width: 100%;
            max-width: 480px;

            background: #ffffff;

            padding: 35px 30px;

            border-radius: 28px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);

            position: relative;
        }

        /* =========================
           اللوجو / الصليب
        ========================= */

        .logo-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 15px;
        }

        .church-logo {
            width: 75px;
            height: 75px;

            border-radius: 50%;

            background: #7d1424;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #ffffff;

            font-size: 38px;

            box-shadow:
                0 8px 20px rgba(125, 20, 36, 0.25);
        }

        /* =========================
           العنوان
        ========================= */

        h2 {
            text-align: center;

            color: #1f1715;

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 8px;

            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;

            color: #8a817c;

            font-size: 14px;

            margin-bottom: 22px;
        }

        /* =========================
           رسالة الخطأ
        ========================= */

        #error-msg,
        #error-msg-2 {

            color: #9f1239;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 15px;

            min-height: 20px;
        }

        /* =========================
           الملاحظة
        ========================= */

        .notebook-note {

            background: #eef6fd;

            border: 1px solid #c9e1fa;

            color: #34495e;

            padding: 12px 15px;

            border-radius: 12px;

            margin-bottom: 22px;

            font-family: 'Amiri', serif;
        }

        .notebook-note h4 {

            color: #7d1424;

            font-size: 17px;

            margin-bottom: 3px;
        }

        .notebook-note p {

            color: #555;

            font-size: 14px;

            line-height: 1.7;

            font-weight: bold;
        }

        /* =========================
           مجموعات الإدخال
        ========================= */

        .input-group {

            margin-bottom: 16px;

            width: 100%;
        }

        label {

            display: block;

            color: #6b625c;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 6px;

            text-align: right;
        }

        /* =========================
           الحقول
        ========================= */

        input,
        select {

            width: 100%;

            padding: 13px 15px;

            background: #ffffff;

            border: 1.5px solid #e1d8d0;

            border-radius: 12px;

            color: #2a2320;

            font-size: 15px;

            font-family: 'Amiri', serif;

            outline: none;

            transition: all 0.25s ease;
        }

        input:focus,
        select:focus {

            border-color: #7d1424;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(125, 20, 36, 0.10);
        }

        /* =========================
           Select
        ========================= */

        select {

            cursor: pointer;

            appearance: auto;
        }

        select option {

            background: #ffffff;

            color: #2a2320;
        }

        /* =========================
           الأزرار
        ========================= */

        .btn-action {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #8b1728 0%,
                    #71111f 100%
                );

            color: #ffffff;

            font-family: 'Amiri', serif;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: all 0.25s ease;

            box-shadow:
                0 8px 20px rgba(125, 20, 36, 0.30);

            text-shadow:
                0 2px 3px rgba(0, 0, 0, 0.3);
        }

        .btn-action:hover {

            background:
                linear-gradient(
                    135deg,
                    #9b1c30 0%,
                    #7d1424 100%
                );

            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(125, 20, 36, 0.40);
        }

        .btn-action:active {

            transform: translateY(1px);

            box-shadow:
                0 5px 12px rgba(125, 20, 36, 0.25);
        }

        .btn-action:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================
           زر الرجوع
        ========================= */

        .btn-secondary {

            background:
                linear-gradient(
                    135deg,
                    #5d101c 0%,
                    #3e0912 100%
                );

            margin-top: 10px;

            box-shadow:
                0 7px 18px rgba(62, 9, 18, 0.25);
        }

        .btn-secondary:hover {

            background:
                linear-gradient(
                    135deg,
                    #721421 0%,
                    #4e0b16 100%
                );
        }

        /* =========================
           إخفاء الخطوات
        ========================= */

        .step-section {

            display: none;
        }

        .step-section.active {

            display: block;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .form-card {

                padding: 30px 20px;

                border-radius: 24px;
            }

            h2 {

                font-size: 25px;
            }

            .church-logo {

                width: 68px;
                height: 68px;

                font-size: 34px;
            }
        }

    </style>


    <!-- =========================
         Firebase
    ========================= -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            setDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",

            authDomain: "st-mina-c01ec.firebaseapp.com",

            projectId: "st-mina-c01ec",

            storageBucket: "st-mina-c01ec.firebasestorage.app",

            messagingSenderId: "792349150559",

            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };


        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        /* =========================
           تحديث الصفوف
        ========================= */

        window.updateGrades = function () {

            const stageSelect =
                document.getElementById('stage');

            const gradeSelect =
                document.getElementById('grade');

            const selectedStage =
                stageSelect.value;


            gradeSelect.innerHTML =
                '<option value="" disabled selected>اختر الصف الدراسي</option>';


            let gradesOptions = [];


            if (selectedStage === "ابتدائي") {

                gradesOptions = [

                    "الأول الابتدائي",

                    "الثاني الابتدائي",

                    "الثالث الابتدائي",

                    "الرابع الابتدائي",

                    "الخامس الابتدائي",

                    "السادس الابتدائي"
                ];
            }


            else if (selectedStage === "إعدادي") {

                gradesOptions = [

                    "الصف الأول الإعدادي",

                    "الصف الثاني الإعدادي",

                    "الصف الثالث الإعدادي"
                ];
            }


            else if (selectedStage === "ثانوي") {

                gradesOptions = [

                    "الصف الأول الثانوي",

                    "الصف الثاني الثانوي",

                    "الصف الثالث الثانوي"
                ];
            }


            gradesOptions.forEach(grade => {

                const opt =
                    document.createElement('option');

                opt.value = grade;

                opt.textContent = grade;

                gradeSelect.appendChild(opt);

            });

        };


        /* =========================
           الانتقال للخطوة الثانية
        ========================= */

        window.nextStep = async function () {

            const username =
                document
                    .getElementById('username')
                    .value
                    .trim();


            const password =
                document
                    .getElementById('password')
                    .value
                    .trim();


            const errorMsg =
                document.getElementById('error-msg');


            const btn1 =
                document.getElementById('btnNext');


            errorMsg.innerText = "";


            if (!username || !password) {

                errorMsg.innerText =
                    "يرجى إدخال اسم المستخدم وكلمة المرور أولاً!";

                return;
            }


            btn1.innerText =
                "جاري الفحص...";

            btn1.disabled = true;


            try {

                const usersRef =
                    collection(db, "users");


                const qUsername =
                    query(
                        usersRef,
                        where(
                            "username",
                            "==",
                            username
                        )
                    );


                const usernameSnapshot =
                    await getDocs(qUsername);


                if (!usernameSnapshot.empty) {

                    errorMsg.innerText =
                        "اسم المستخدم هذا مستخدم من قبل، اختر اسماً آخر.";

                    btn1.innerText =
                        "التالي ➔";

                    btn1.disabled = false;

                    return;
                }


                document
                    .getElementById('step-1')
                    .classList
                    .remove('active');


                document
                    .getElementById('step-2')
                    .classList
                    .add('active');


                btn1.innerText =
                    "التالي ➔";

                btn1.disabled = false;

            }

            catch (error) {

                console.error(error);

                errorMsg.innerText =
                    "حدث خطأ في الاتصال بقاعدة البيانات.";

                btn1.innerText =
                    "التالي ➔";

                btn1.disabled = false;
            }

        };


        /* =========================
           الرجوع للخطوة الأولى
        ========================= */

        window.prevStep = function () {

            document
                .getElementById('step-2')
                .classList
                .remove('active');


            document
                .getElementById('step-1')
                .classList
                .add('active');

        };


        /* =========================
           حفظ الحساب
        ========================= */

        window.handleRegister = async function (event) {

            event.preventDefault();


            const username =
                document
                    .getElementById('username')
                    .value
                    .trim();


            const password =
                document
                    .getElementById('password')
                    .value
                    .trim();


            const userId =
                document
                    .getElementById('userId')
                    .value
                    .trim();


            const birthdate =
                document
                    .getElementById('birthdate')
                    .value;


            const fatherPhone =
                document
                    .getElementById('fatherPhone')
                    .value
                    .trim();


            const motherPhone =
                document
                    .getElementById('motherPhone')
                    .value
                    .trim();


            const address =
                document
                    .getElementById('address')
                    .value
                    .trim();


            const stage =
                document
                    .getElementById('stage')
                    .value;


            const grade =
                document
                    .getElementById('grade')
                    .value;


            const errorMsg =
                document.getElementById('error-msg-2');


            const submitBtn =
                document.getElementById('submitBtn');


            errorMsg.innerText = "";


            if (!stage || !grade) {

                errorMsg.innerText =
                    "يرجى اختيار المرحلة والصف الدراسي!";

                return;
            }


            submitBtn.innerText =
                "جاري حفظ البيانات...";

            submitBtn.disabled = true;


            try {

                const userDocRef =
                    doc(
                        db,
                        "users",
                        username
                    );


                await setDoc(
                    userDocRef,
                    {

                        username: username,

                        password: password,

                        userId: userId,

                        birthdate: birthdate,

                        fatherPhone: fatherPhone,

                        motherPhone: motherPhone,

                        address: address,

                        stage: stage,

                        grade: grade,

                        points: 0,

                        createdAt:
                            new Date().toISOString()
                    }
                );


                localStorage.setItem(
                    'userDocId',
                    username
                );


                localStorage.setItem(
                    'currentUser',
                    username
                );


                localStorage.setItem(
                    'username',
                    username
                );


                window.location.href =
                    "home.html";

            }

            catch (error) {

                console.error(error);

                errorMsg.innerText =
                    "حدث خطأ أثناء الحفظ.";

                submitBtn.innerText =
                    "حفظ البيانات";

                submitBtn.disabled = false;
            }

        };

    </script>

</head>


<body>


    <div class="form-card">


        <!-- الصليب -->

        <div class="logo-container">

            <div class="church-logo">

                <i class="fas fa-cross"></i>

            </div>

        </div>


        <!-- العنوان -->

        <h2>
            إنشاء حساب اللاعب
        </h2>


        <div class="subtitle">
            بوابة تسجيل بيانات اللاعبين
        </div>


        <div id="error-msg"></div>


        <!-- =========================
             الخطوة الأولى
        ========================= -->

        <div
            id="step-1"
            class="step-section active">


            <div class="notebook-note">

                <h4>
                    ملاحظة هامة
                </h4>

                <p>
                    يرجى كتابة اسم المستخدم وكلمة المرور لتسجيل الدخول بالبرنامج لاحقاً
                </p>

            </div>


            <div class="input-group">

                <label>
                    اسم المستخدم (Username)
                </label>

                <input
                    type="text"
                    id="username"
                    required>

            </div>


            <div class="input-group">

                <label>
                    كلمة المرور (Password)
                </label>

                <input
                    type="password"
                    id="password"
                    required>

            </div>


            <button
                type="button"
                class="btn-action"
                id="btnNext"
                onclick="nextStep()">

                التالي ➔

            </button>


        </div>


        <!-- =========================
             الخطوة الثانية
        ========================= -->

        <div
            id="step-2"
            class="step-section">


            <div id="error-msg-2"></div>


            <form
                onsubmit="handleRegister(event)">


                <div class="input-group">

                    <label>
                        رقم المستخدم
                    </label>

                    <input
                        type="text"
                        id="userId"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        تاريخ الميلاد
                    </label>

                    <input
                        type="date"
                        id="birthdate"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        رقم الأب
                    </label>

                    <input
                        type="tel"
                        id="fatherPhone"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        رقم الأم
                    </label>

                    <input
                        type="tel"
                        id="motherPhone"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        العنوان
                    </label>

                    <input
                        type="text"
                        id="address"
                        required>

                </div>


                <!-- المرحلة -->

                <div class="input-group">

                    <label>
                        المرحلة الدراسية
                    </label>

                    <select
                        id="stage"
                        required
                        onchange="updateGrades()">

                        <option
                            value=""
                            disabled
                            selected>

                            اختر المرحلة الدراسية

                        </option>

                        <option value="ابتدائي">
                            ابتدائي
                        </option>

                        <option value="إعدادي">
                            إعدادي
                        </option>

                        <option value="ثانوي">
                            ثانوي
                        </option>

                    </select>

                </div>


                <!-- الصف -->

                <div class="input-group">

                    <label>
                        الصف الدراسي
                    </label>

                    <select
                        id="grade"
                        required>

                        <option
                            value=""
                            disabled
                            selected>

                            اختر المرحلة أولاً

                        </option>

                    </select>

                </div>


                <!-- حفظ -->

                <button
                    type="submit"
                    class="btn-action"
                    id="submitBtn">

                    حفظ البيانات

                </button>


                <!-- رجوع -->

                <button
                    type="button"
                    class="btn-action btn-secondary"
                    onclick="prevStep()">

                    ⬅ رجوع للخلف

                </button>


            </form>


        </div>


    </div>


</body>

</html>
