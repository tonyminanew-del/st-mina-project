    <style>

        /* =====================================================
           الألوان
        ====================================================== */

        :root {

            --wine-900: #4a0e16;
            --wine-800: #6b1420;
            --wine-700: #7c1b28;

            --gold: #c9a04d;
            --gold-light: #e6c878;

            --paper: #f6f1e9;

            --card: #ffffff;

            --ink: #2a2320;
            --ink-soft: #6b625c;

            --line: #e9dfd0;

            --green: #16a34a;
            --green-dark: #15803d;

            --red: #dc2626;

        }


        /* =====================================================
           Reset
        ====================================================== */

        * {

            box-sizing: border-box;

            margin: 0;
            padding: 0;

        }


        /* =====================================================
           Body
        ====================================================== */

        body {

            background: var(--paper);

            display: flex;

            flex-direction: column;

            min-height: 100vh;

            font-family: 'Cairo', sans-serif;

            color: var(--ink);

        }


        /* =====================================================
           Header
        ====================================================== */

        header.church-header {

            width: 100%;

            background:
                linear-gradient(
                    180deg,
                    var(--wine-800),
                    var(--wine-900)
                );

            padding: 18px 30px 22px;

            position: relative;

            box-shadow:
                0 8px 20px
                rgba(74, 14, 22, 0.25);

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        header.church-header::after {

            content: '';

            position: absolute;

            bottom: 0;

            right: 0;

            left: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    transparent
                );

        }


        header.church-header h2 {

            font-family: 'Amiri', serif;

            color: #fbeed4;

            font-size: 21px;

            font-weight: 700;

        }


        /* =====================================================
           Back Button
        ====================================================== */

        .back-btn {

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1.5px solid
                rgba(230, 200, 120, 0.4);

            color: var(--gold-light);

            padding: 9px 18px;

            border-radius: 20px;

            font-family: 'Cairo', sans-serif;

            font-weight: 600;

            font-size: 14px;

            cursor: pointer;

            display: flex;

            align-items: center;

            gap: 7px;

            text-decoration: none;

            transition: all 0.25s ease;

        }


        .back-btn:hover {

            background:
                rgba(230, 200, 120, 0.15);

            border-color: var(--gold);

            transform: translateY(-2px);

        }


        /* =====================================================
           Main
        ====================================================== */

        .main-content {

            flex: 1;

            padding: 30px 30px 55px;

            max-width: 1200px;

            width: 100%;

            margin: 0 auto;

        }


        /* =====================================================
           Loading
        ====================================================== */

        .loading {

            color: var(--wine-700);

            font-size: 20px;

            font-weight: 700;

            text-align: center;

            padding: 80px 20px;

        }


        /* =====================================================
           Widgets
        ====================================================== */

        .widget {

            background: var(--card);

            border-radius: 24px;

            border: 1px solid var(--line);

            box-shadow:
                0 14px 32px
                rgba(74, 14, 22, 0.10);

            margin-bottom: 24px;

            overflow: hidden;

            position: relative;

        }


        .widget::before {

            content: '';

            position: absolute;

            top: 0;

            right: 0;

            left: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--wine-700),
                    var(--gold),
                    var(--wine-700)
                );

            opacity: 0.95;

        }


        /* =====================================================
           Profile Widget
        ====================================================== */

        .profile-widget .widget-body {

            padding: 40px 30px 42px;

            text-align: center;

        }


        /* =====================================================
           Avatar
        ====================================================== */

        .avatar-container {

            position: relative;

            width: 145px;

            height: 145px;

            margin: 0 auto 20px;

        }


        .avatar-img {

            width: 100%;

            height: 100%;

            border-radius: 50%;

            object-fit: cover;

            border:
                4px solid
                var(--gold);

            box-shadow:
                0 12px 28px
                rgba(74, 14, 22, 0.23);

            background: var(--paper);

        }


        /* =====================================================
           Upload Button
        ====================================================== */

        .upload-btn-label {

            position: absolute;

            bottom: 3px;

            left: 3px;

            background: var(--wine-700);

            color: var(--gold-light);

            width: 43px;

            height: 43px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;

            border:

        /* =====================================================

        ====================================================== */

        .widget-head .icon-badge {

        .widget-head-title {

            font-family: 'Amiri', serif;

            font-size: 20px;

            color: var(--wine-800);

            font-weight: 700;

        }


        /* =====================================================
           Info Body
        ====================================================== */

        .info-widget .widget-body {

            padding: 10px 30px 18px;

        }


        /* =====================================================
           Information Grid
        ====================================================== */

        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            column-gap: 35px;

        }


        /* =====================================================
           Info Row
        ====================================================== */

        .info-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 18px 7px;

            border-bottom:
                1px solid

        .info-label {

        }


        .info-value {

            color: var(--ink);

            text-align: right;

        /* =====================================================

        ====================================================== */

        .info-value input,

            text-align: right;

            direction: rtl;

        .info-value select {

        }


        .info-value input:focus,
        .info-value select:focus {

            border-color: var(--wine-700);

        /* =====================================================
           Parents
        ====================================================== */

        .parents-title {

            padding:
                20px 30px 7px;

            font-weight: 700;

            font-size: 15px;

            color: var(--wine-800);

            border-top:
                1px solid
                var(--line);

        }


        .parents-body {

            padding:

        }


        .parents-grid {

            display: grid;

            grid-template-columns:

        }


        /* =====================================================
           Buttons
        ====================================================== */

        .btn {

            background:
                linear-gradient(
                    135deg,
                    var(--wine-700),
                    var(--wine-900)
                );

            color: #fbeed4;

            border: none;

            padding: 10px 23px;

            border-radius: 22px;

            font-family: 'Cairo', sans-serif;

            font-weight: 600;

            font-size: 14px;

            cursor: pointer;

            box-shadow:
                0 5px 14px
                rgba(74, 14, 22, 0.25);

            transition: 0.3s;

        }


        .btn:hover {

            background:
                linear-gradient(

                    var(--wine-900),
                    var(--wine-700)

        }


        .btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

        }


        /* =====================================================
           Save Button
        ====================================================== */

        .btn-save {

                );

            box-shadow:
                0 5px 14px

        }


        .btn-save:hover {

                linear-gradient(

                    var(--green-dark),

        /* =====================================================

            }

        /* =====================================================

        @media (max-width: 400px) {

    </style>


    <!-- =====================================================
         Firebase
    ====================================================== -->

    <script type="module">

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


        import {
            getFirestore,
            doc,
            getDoc,
            updateDoc
        }
        from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /* =====================================================
           Firebase Configuration
        ====================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",

            authDomain:
                "st-mina-c01ec.firebaseapp.com",

            projectId:
                "st-mina-c01ec",

            storageBucket:
                "st-mina-c01ec.firebasestorage.app",

            messagingSenderId:
                "792349150559",

            appId:
                "1:792349150559:web:8a86bbf57c2c7e351f3aea"

        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(app);


        /* =====================================================
           Variables
        ====================================================== */

        let isEditing = false;

        let currentUsernameUrl = "";

        let originalStage = "";

        let originalGrade = "";

        let originalUsername = "";

        let originalBirthdate = "";

        let originalAddress = "";

        let originalFather = "";

        let originalMother = "";


        /* =====================================================
           المراحل والصفوف
        ====================================================== */

        const stageGrades = {

            "ابتدائي": [

                "الأول الابتدائي",
                "الثاني الابتدائي",
                "الثالث الابتدائي",
                "الرابع الابتدائي",
                "الخامس الابتدائي",
                "السادس الابتدائي"

            ],

            "إعدادي": [

                "الأول الإعدادي",
                "الثاني الإعدادي",
                "الثالث الإعدادي"

            ],

            "ثانوي": [

                "الأول الثانوي",
                "الثاني الثانوي",
                "الثالث الثانوي"

            ]

        };


        /* =====================================================
           Normalize Text
        ====================================================== */

        function normalizeText(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(/\u200f/g, "")

                .replace(/\u200e/g, "")

                .replace(/\u00a0/g, " ")

                .trim();

        }


        /* =====================================================
           Normalize Stage
        ====================================================== */

        function normalizeStage(stage) {

            const value =
                normalizeText(stage);


            const found =
                Object.keys(stageGrades).find(

                    s =>
                        normalizeText(s) === value

                );


            return found || "";

        }


        /* =====================================================
           Normalize Grade
        ====================================================== */

        function normalizeGrade(
            stage,
            grade
        ) {

            const cleanStage =
                normalizeStage(stage);


            const cleanGrade =
                normalizeText(grade);


            const grades =
                stageGrades[cleanStage] || [];


            const found =
                grades.find(

                    g =>
                        normalizeText(g) === cleanGrade

                );


            return found || "";

        }


        /* =====================================================
           Stage Select
        ====================================================== */

        function buildStageSelect(
            currentStage
        ) {

            const cleanStage =
                normalizeStage(
                    currentStage
                );


            let html = `
                <select id="input-stage">
            `;


            Object.keys(
                stageGrades
            ).forEach(

                stage => {

                    html += `
                        <option
                            value="${stage}"
                            ${stage === cleanStage
                                ? "selected"
                                : ""}
                        >
                            ${stage}
                        </option>
                    `;

                }

            );


            html += `
                </select>
            `;


            return html;

        }


        /* =====================================================
           Grade Select
        ====================================================== */

        function buildGradeSelect(
            stage,
            currentGrade
        ) {

            const cleanStage =
                normalizeStage(stage);


            const cleanGrade =
                normalizeGrade(
                    cleanStage,
                    currentGrade
                );


            const grades =
                stageGrades[cleanStage] || [];


            let html = `
                <select id="input-grade">
            `;


            grades.forEach(

                grade => {

                    html += `
                        <option
                            value="${grade}"
                            ${grade === cleanGrade
                                ? "selected"
                                : ""}
                        >
                            ${grade}
                        </option>
                    `;

                }

            );


            html += `
                </select>
            `;


            return html;

        }


        /* =====================================================
           تغيير المرحلة
        ====================================================== */

        window.onStageChange =
            function () {

                const stageSelect =
                    document.getElementById(
                        "input-stage"
                    );


                if (!stageSelect) {

                    return;

                }


                const selectedStage =
                    normalizeStage(
                        stageSelect.value
                    );


                let targetGrade = "";


                if (
                    selectedStage ===
                    normalizeStage(
                        originalStage
                    )
                ) {

                    targetGrade =
                        normalizeGrade(
                            selectedStage,
                            originalGrade
                        );

                }


                if (!targetGrade) {

                    targetGrade =
                        stageGrades[
                            selectedStage
                        ]?.[0] || "";

                }


                const gradeContainer =
                    document.getElementById(
                        "val-grade"
                    );


                if (!gradeContainer) {

                    return;

                }


                gradeContainer.innerHTML =
                    buildGradeSelect(
                        selectedStage,
                        targetGrade
                    );


                const gradeSelect =
                    document.getElementById(
                        "input-grade"
                    );


                if (
                    gradeSelect &&
                    targetGrade
                ) {

                    gradeSelect.value =
                        targetGrade;

                }

            };


        /* =====================================================
           تحميل البروفايل
        ====================================================== */

        window.addEventListener(
            "DOMContentLoaded",
            async function () {

                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );


                const urlUser =
                    normalizeText(
                        urlParams.get("user")
                    );


                const savedUserId =
                    normalizeText(
                        localStorage.getItem(
                            "userDocId"
                        )
                    );


                currentUsernameUrl =
                    urlUser ||
                    savedUserId;


                const loadingText =
                    document.getElementById(
                        "loading-text"
                    );


                const profileContent =
                    document.getElementById(
                        "profile-content"
                    );


                if (!currentUsernameUrl) {

                    loadingText.innerText =
                        "يرجى تسجيل الدخول أولاً أو تحديد المستخدم!";

                    return;

                }


                console.log(
                    "================================"
                );

                console.log(
                    "PROFILE DEBUG"
                );

                console.log(
                    "Document ID المستخدم:",
                    currentUsernameUrl
                );

                console.log(
                    "URL user:",
                    urlUser
                );

                console.log(
                    "LocalStorage userDocId:",
                    savedUserId
                );

                console.log(
                    "================================"
                );


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            currentUsernameUrl
                        );


                    const docSnap =
                        await getDoc(
                            docRef
                        );


                    if (!docSnap.exists()) {

                        console.error(
                            "❌ Document غير موجود:",
                            currentUsernameUrl
                        );


                        loadingText.innerText =
                            "عذراً، لم يتم العثور على بيانات هذا المستخدم في Firebase.";

                        return;

                    }


                    currentUsernameUrl =
                        docSnap.id;


                    localStorage.setItem(
                        "userDocId",
                        docSnap.id
                    );


                    const userData =
                        docSnap.data();


                    console.log(
                        "================================"
                    );

                    console.log(
                        "✅ Firebase Document موجود"
                    );

                    console.log(
                        "Document ID:",
                        docSnap.id
                    );

                    console.log(
                        "Firebase Data:",
                        userData
                    );

                    console.log(
                        "username:",
                        userData.username
                    );

                    console.log(
                        "userId:",
                        userData.userId
                    );

                    console.log(
                        "stage:",
                        userData.stage
                    );

                    console.log(
                        "grade:",
                        userData.grade
                    );

                    console.log(
                        "================================"
                    );


                    /* =================================================
                       البيانات
                    ================================================== */

                    const username =
                        normalizeText(
                            userData.username
                        ) ||

                        normalizeText(
                            userData.fullName
                        ) ||

                        docSnap.id;


                    const rawStage =
                        normalizeText(
                            userData.stage
                        );


                    const rawGrade =
                        normalizeText(
                            userData.grade
                        );


                    const stage =
                        normalizeStage(
                            rawStage
                        );


                    const grade =
                        normalizeGrade(
                            stage,
                            rawGrade
                        );


                    originalUsername =
                        username;


                    originalBirthdate =
                        normalizeText(
                            userData.birthdate
                        );


                    originalAddress =
                        normalizeText(
                            userData.address
                        );


                    originalFather =
                        normalizeText(
                            userData.fatherPhone
                        );


                    originalMother =
                        normalizeText(
                            userData.motherPhone
                        );


                    originalStage =
                        stage ||
                        rawStage;


                    originalGrade =
                        grade ||
                        rawGrade;


                    /* =================================================
                       عرض البيانات
                    ================================================== */

                    document.getElementById(
                        "welcome-msg"
                    ).innerText =
                        `أهلاً بك يا ${username}`;


                    document.getElementById(
                        "val-username"
                    ).innerText =
                        username || "-";


                    document.getElementById(
                        "val-userid"
                    ).innerText =
                        userData.userId ||
                        docSnap.id ||
                        "-";


                    document.getElementById(
                        "val-birthdate"
                    ).innerText =
                        originalBirthdate ||
                        "-";


                    document.getElementById(
                        "val-stage"
                    ).innerText =
                        originalStage ||
                        "-";


                    document.getElementById(
                        "val-grade"
                    ).innerText =
                        originalGrade ||
                        "-";


                    document.getElementById(
                        "val-address"
                    ).innerText =
                        originalAddress ||
                        "-";


                    document.getElementById(
                        "val-father"
                    ).innerText =
                        originalFather ||
                        "-";


                    document.getElementById(
                        "val-mother"
                    ).innerText =
                        originalMother ||
                        "-";


                    /* =================================================
                       LocalStorage
                    ================================================== */

                    if (originalGrade) {

                        localStorage.setItem(
                            "userGrade",
                            originalGrade
                        );

                        localStorage.setItem(
                            "grade",
                            originalGrade
                        );

                        localStorage.setItem(
                            "servantGrade",
                            originalGrade
                        );

                    }


                    if (originalStage) {

                        localStorage.setItem(
                            "userStage",
                            originalStage
                        );

                        localStorage.setItem(
                            "stage",
                            originalStage
                        );

                        localStorage.setItem(
                            "servantStage",
                            originalStage
                        );

                    }


                    localStorage.setItem(
                        "userDocId",
                        docSnap.id
                    );


                    /* =================================================
                       الصورة
                    ================================================== */

                    if (
                        userData.avatarUrl
                    ) {

                        document.getElementById(
                            "profile-avatar"
                        ).src =
                            userData.avatarUrl;

                    } else {

                        document.getElementById(
                            "profile-avatar"
                        ).src =
                            `https://ui-avatars.com/api/?name=${encodeURIComponent(
                                username
                            )}&background=7c1b28&color=fbeed4&size=150`;

                    }


                    loadingText.style.display =
                        "none";


                    profileContent.style.display =
                        "block";


                } catch (error) {

                    console.error(
                        "❌ خطأ في جلب البيانات:",
                        error
                    );


                    loadingText.innerText =
                        "حدث خطأ أثناء الاتصال بقاعدة البيانات.";

                }

            }
        );


        /* =====================================================
           تعديل البيانات
        ====================================================== */

        window.toggleEditMode =
            async function () {

                const textFields = [

                    "username",
                    "birthdate",
                    "address",
                    "father",
                    "mother"

                ];


                const btn =
                    document.getElementById(
                        "edit-btn"
                    );


                /* =================================================
                   الدخول لوضع التعديل
                ================================================== */

                if (!isEditing) {

                    textFields.forEach(
                        field => {

                            const span =
                                document.getElementById(
                                    `val-${field}`
                                );


                            if (!span) {

                                return;

                            }


                            let value =
                                span.innerText;


                            if (
                                value === "-"
                            ) {

                                value = "";

                            }


                            span.innerHTML = `
                                <input
                                    type="text"
                                    id="input-${field}"
                                >
                            `;


                            document.getElementById(
                                `input-${field}`
                            ).value =
                                value;

                        }
                    );


                    /* =================================================
                       المرحلة
                    ================================================== */

                    const correctStage =
                        normalizeStage(
                            originalStage
                        );


                    const stageForEdit =
                        correctStage ||
                        "إعدادي";


                    const stageContainer =
                        document.getElementById(
                            "val-stage"
                        );


                    stageContainer.innerHTML =
                        buildStageSelect(
                            stageForEdit
                        );


                    const stageSelect =
                        document.getElementById(
                            "input-stage"
                        );


                    if (stageSelect) {

                        stageSelect.value =
                            stageForEdit;


                        stageSelect.onchange =
                            window.onStageChange;

                    }


                    /* =================================================
                       الصف
                    ================================================== */

                    const correctGrade =
                        normalizeGrade(
                            stageForEdit,
                            originalGrade
                        );


                    const gradeContainer =
                        document.getElementById(
                            "val-grade"
                        );


                    gradeContainer.innerHTML =
                        buildGradeSelect(
                            stageForEdit,
                            correctGrade
                        );


                    const gradeSelect =
                        document.getElementById(
                            "input-grade"
                        );


                    if (
                        gradeSelect &&
                        correctGrade
                    ) {

                        gradeSelect.value =
                            correctGrade;

                    }


                    /* =================================================
                       الزر
                    ================================================== */

                    btn.innerText =
                        "حفظ التغييرات";


                    btn.classList.add(
                        "btn-save"
                    );


                    isEditing = true;


                    return;

                }


                /* =================================================
                   الحفظ
                ================================================== */

                btn.innerText =
                    "جاري الحفظ...";


                btn.disabled = true;


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            currentUsernameUrl
                        );


                    const stageInput =
                        document.getElementById(
                            "input-stage"
                        );


                    const gradeInput =
                        document.getElementById(
                            "input-grade"
                        );


                    if (
                        !stageInput ||
                        !gradeInput
                    ) {

                        throw new Error(
                            "حقول المرحلة أو الصف غير موجودة."
                        );

                    }


                    const selectedStage =
                        normalizeStage(
                            stageInput.value
                        );


                    const selectedGrade =
                        normalizeGrade(
                            selectedStage,
                            gradeInput.value
                        );


                    if (!selectedStage) {

                        alert(
                            "من فضلك اختر المرحلة الدراسية."
                        );


                        btn.disabled = false;


                        btn.innerText =
                            "حفظ التغييرات";


                        return;

                    }


                    if (!selectedGrade) {

                        alert(
                            "من فضلك اختر الصف الدراسي."
                        );


                        btn.disabled = false;


                        btn.innerText =
                            "حفظ التغييرات";


                        return;

                    }


                    /* =================================================
                       البيانات الجديدة
                    ================================================== */

                    const updatedData = {

                        username:
                            document.getElementById(
                                "input-username"
                            ).value.trim(),


                        birthdate:
                            document.getElementById(
                                "input-birthdate"
                            ).value.trim(),


                        stage:
                            selectedStage,


                        grade:
                            selectedGrade,


                        address:
                            document.getElementById(
                                "input-address"
                            ).value.trim(),


                        fatherPhone:
                            document.getElementById(
                                "input-father"
                            ).value.trim(),


                        motherPhone:
                            document.getElementById(
                                "input-mother"
                            ).value.trim()

                    };


                    console.log(
                        "================================"
                    );

                    console.log(
                        "📤 سيتم الحفظ في Firebase"
                    );

                    console.log(
                        "Collection: users"
                    );

                    console.log(
                        "Document ID:",
                        currentUsernameUrl
                    );

                    console.log(
                        "Stage:",
                        updatedData.stage
                    );

                    console.log(
                        "Grade:",
                        updatedData.grade
                    );

                    console.log(
                        "================================"
                    );


                    /* =================================================
                       حفظ البيانات
                    ================================================== */

                    await updateDoc(
                        docRef,
                        updatedData
                    );


                    /* =================================================
                       إعادة القراءة للتأكد
                    ================================================== */

                    const checkSnap =
                        await getDoc(
                            docRef
                        );


                    if (!checkSnap.exists()) {

                        throw new Error(
                            "Document اختفى بعد الحفظ!"
                        );

                    }


                    const checkData =
                        checkSnap.data();


                    console.log(
                        "================================"
                    );

                    console.log(
                        "✅ تم الحفظ فعلياً في Firebase"
                    );

                    console.log(
                        "Document ID:",
                        checkSnap.id
                    );

                    console.log(
                        "Stage بعد الحفظ:",
                        checkData.stage
                    );

                    console.log(
                        "Grade بعد الحفظ:",
                        checkData.grade
                    );

                    console.log(
                        "================================"
                    );


                    /* =================================================
                       التأكد من المرحلة
                    ================================================== */

                    if (

                        normalizeText(
                            checkData.stage
                        ) !==

                        normalizeText(
                            updatedData.stage
                        )

                    ) {

                        throw new Error(
                            "المرحلة لم يتم حفظها بالقيمة الصحيحة."
                        );

                    }


                    /* =================================================
                       التأكد من الصف
                    ================================================== */

                    if (

                        normalizeText(
                            checkData.grade
                        ) !==

                        normalizeText(
                            updatedData.grade
                        )

                    ) {

                        throw new Error(
                            "الصف لم يتم حفظه بالقيمة الصحيحة."
                        );

                    }


                    /* =================================================
                       تحديث القيم الأصلية
                    ================================================== */

                    originalUsername =
                        updatedData.username;


                    originalBirthdate =
                        updatedData.birthdate;


                    originalStage =
                        updatedData.stage;


                    originalGrade =
                        updatedData.grade;


                    originalAddress =
                        updatedData.address;


                    originalFather =
                        updatedData.fatherPhone;


                    originalMother =
                        updatedData.motherPhone;


                    /* =================================================
                       LocalStorage
                    ================================================== */

                    localStorage.setItem(
                        "userDocId",
                        currentUsernameUrl
                    );


                    localStorage.setItem(
                        "userGrade",
                        updatedData.grade
                    );


                    localStorage.setItem(
                        "grade",
                        updatedData.grade
                    );


                    localStorage.setItem(
                        "servantGrade",
                        updatedData.grade
                    );


                    localStorage.setItem(
                        "userStage",
                        updatedData.stage
                    );


                    localStorage.setItem(
                        "stage",
                        updatedData.stage
                    );


                    localStorage.setItem(
                        "servantStage",
                        updatedData.stage
                    );


                    /* =================================================
                       عرض البيانات
                    ================================================== */

                    document.getElementById(
                        "val-username"
                    ).innerText =
                        updatedData.username ||
                        "-";


                    document.getElementById(
                        "val-birthdate"
                    ).innerText =
                        updatedData.birthdate ||
                        "-";


                    document.getElementById(
                        "val-stage"
                    ).innerText =
                        updatedData.stage;


                    document.getElementById(
                        "val-grade"
                    ).innerText =
                        updatedData.grade;


                    document.getElementById(
                        "val-address"
                    ).innerText =
                        updatedData.address ||
                        "-";


                    document.getElementById(
                        "val-father"
                    ).innerText =
                        updatedData.fatherPhone ||
                        "-";


                    document.getElementById(
                        "val-mother"
                    ).innerText =
                        updatedData.motherPhone ||
                        "-";


                    document.getElementById(
                        "welcome-msg"
                    ).innerText =
                        `أهلاً بك يا ${updatedData.username}`;


                    /* =================================================
                       إنهاء التعديل
                    ================================================== */

                    isEditing = false;


                    btn.disabled = false;


                    btn.innerText =
                        "تعديل البيانات";


                    btn.classList.remove(
                        "btn-save"
                    );


                    alert(
                        "تم حفظ التعديلات بنجاح في Firebase! ✅"
                    );


                } catch (error) {

                    console.error(
                        "❌ خطأ أثناء الحفظ:",
                        error
                    );


                    alert(
                        "حدث خطأ أثناء حفظ البيانات:\n\n" +
                        error.message
                    );


                    btn.disabled = false;


                    btn.innerText =
                        "حفظ التغييرات";

                }

            };


        /* =====================================================
           رفع صورة البروفايل
        ====================================================== */

        window.handleImageUpload =
            async function (event) {

                const file =
                    event.target.files[0];


                if (!file) {

                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    async function (e) {

                        const base64Image =
                            e.target.result;


                        document.getElementById(
                            "profile-avatar"
                        ).src =
                            base64Image;


                        try {

                            const docRef =
                                doc(
                                    db,
                                    "users",
                                    currentUsernameUrl
                                );


                            await updateDoc(
                                docRef,
                                {

                                    avatarUrl:
                                        base64Image

                                }
                            );


                            const checkSnap =
                                await getDoc(
                                    docRef
                                );


                            if (
                                !checkSnap.exists()
                            ) {

                                throw new Error(
                                    "Document غير موجود بعد حفظ الصورة."
                                );

                            }


                            if (
                                !checkSnap.data().avatarUrl
                            ) {

                                throw new Error(
                                    "الصورة لم يتم حفظها."
                                );

                            }


                            alert(
                                "تم تحديث وحفظ صورة البروفايل بنجاح! 🖼️"
                            );


                        } catch (error) {

                            console.error(
                                "❌ خطأ في حفظ الصورة:",
                                error
                            );


                            alert(
                                "حدث خطأ أثناء حفظ الصورة في قاعدة البيانات."
                            );

                        }

                    };


                reader.readAsDataURL(file);

            };

    </script>

</head>


<body>


    <!-- =====================================================
         Header
    ====================================================== -->

    <header class="church-header">

        <h2>
            الملف الشخصي
        </h2>


        <a
            href="home.html"
            class="back-btn"
        >

            <i class="fas fa-arrow-right"></i>

            <span>
                الرئيسية
            </span>

        </a>

    </header>



    <!-- =====================================================
         Main Content
    ====================================================== -->

    <div class="main-content">


        <!-- =================================================
             Loading
        ================================================== -->

        <div
            id="loading-text"
            class="loading"
        >

            جاري تحميل الملف الشخصي... ⏳

        </div>



        <!-- =================================================
             Profile Content
        ================================================== -->

        <div
            id="profile-content"
            style="display: none;"
        >


            <!-- =================================================
                 Profile Card
            ================================================== -->

            <div class="widget profile-widget">

                <div class="widget-body">


                    <div class="avatar-container">

                        <img
                            id="profile-avatar"
                            class="avatar-img"
                            alt="صورة البروفايل"
                        >


                        <label
                            for="avatar-input"
                            class="upload-btn-label"
                            title="تغيير الصورة"
                        >

                            <i class="fas fa-camera"></i>

                        </label>


                        <input
                            type="file"
                            id="avatar-input"
                            accept="image/*"
                            onchange="handleImageUpload(event)"
                        >

                    </div>


                    <h1 id="welcome-msg">

                        أهلاً بك

                    </h1>


                    <div class="profile-subtitle">

                        بياناتك الشخصية والدراسية

                    </div>

                </div>

            </div>



            <!-- =================================================
                 User Information
            ================================================== -->

            <div class="widget info-widget">


                <!-- Header -->

                <div class="widget-head">

                    <div class="title-row">

                        <div class="icon-badge">

                            <i class="fas fa-id-card"></i>

                        </div>


                        <div class="widget-head-title">

                            البيانات الشخصية

                        </div>

                    </div>


                    <button
                        id="edit-btn"
                        class="btn"
                        onclick="toggleEditMode()"
                    >

                        تعديل البيانات

                    </button>

                </div>



                <!-- =================================================
                     Information Grid
                ================================================== -->

                <div class="widget-body">

                    <div class="info-grid">


                        <!-- اسم المستخدم -->

                        <div class="info-row">

                            <span class="info-label">

                                اسم المستخدم:

                            </span>


                            <span
                                class="info-value"
                                id="val-username"
                            >

                                --

                            </span>

                        </div>



                        <!-- رقم المستخدم -->

                        <div class="info-row">

                            <span class="info-label">

                                رقم المستخدم:

                            </span>


                            <span
                                class="info-value"
                                id="val-userid"
                            >

                                --

                            </span>

                        </div>



                        <!-- تاريخ الميلاد -->

                        <div class="info-row">

                            <span class="info-label">

                                تاريخ الميلاد:

                            </span>


                            <span
                                class="info-value"
                                id="val-birthdate"
                            >

                                --

                            </span>

                        </div>



                        <!-- المرحلة -->

                        <div class="info-row">

                            <span class="info-label">

                                المرحلة الدراسية:

                            </span>


                            <span
                                class="info-value"
                                id="val-stage"
                            >

                                --

                            </span>

                        </div>



                        <!-- الصف -->

                        <div class="info-row">

                            <span class="info-label">

                                الصف الدراسي:

                            </span>


                            <span
                                class="info-value"
                                id="val-grade"
                            >

                                --

                            </span>

                        </div>



                        <!-- العنوان -->

                        <div class="info-row">

                            <span class="info-label">

                                العنوان:

                            </span>


                            <span
                                class="info-value"
                                id="val-address"
                            >

                                --

                            </span>

                        </div>

                    </div>

                </div>



                <!-- =================================================
                     Parents
                ================================================== -->

                <div class="parents-title">

                    أرقام أولياء الأمور

                </div>


                <div class="parents-body">

                    <div class="parents-grid">


                        <!-- الأب -->

                        <div class="info-row">

                            <span class="info-label">

                                رقم الأب:

                            </span>


                            <span
                                class="info-value"
                                id="val-father"
                            >

                                --

                            </span>

                        </div>



                        <!-- الأم -->

                        <div class="info-row">

                            <span class="info-label">

                                رقم الأم:

                            </span>


                            <span
                                class="info-value"
                                id="val-mother"
                            >

                                --

                            </span>

                        </div>

                    </div>

                </div>

            </div>


        </div>

    </div>


</body>

</html>
