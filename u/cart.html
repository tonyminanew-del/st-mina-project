<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة الطلبات - متجر الكنيسة</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
            measurementId: "G-XZGSBG05KR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async () => {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeBtn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const logoutBtn = document.getElementById('logoutBtn');

            function openSidebar() {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }
            function closeSidebar() {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }

            if (menuBtn) menuBtn.addEventListener('click', openSidebar);
            if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
            if (overlay) overlay.addEventListener('click', closeSidebar);

            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (confirm("هل تريد تسجيل الخروج حقاً؟")) {
                        localStorage.clear();
                        window.location.href = '../index.html';
                    }
                });
            }

            const loggedInUsername = localStorage.getItem('currentUser') || localStorage.getItem('username') || "Mina";
            const userOrdersContainer = document.getElementById('userOrdersContainer');

            /*
             * ترتيب فحص الحالة مهم هنا (نفس منطق صفحة الإشعارات):
             * 1) delivered -> تم القبول والتسليم (الحالة النهائية)
             * 2) accepted / approved -> تم القبول فقط (لسه في انتظار الاستلام)
             * 3) rejected -> مرفوض
             * 4) غير ذلك -> قيد المراجعة
             *
             * قبل التعديل كانت accepted و delivered بيتعاملوا كحالة واحدة،
             * فكان أي طلب "مقبول" بيظهر كـ "تم التسليم" فورًا وهو ده الخطأ.
             */
            function resolveOrderStatus(order) {
                if (order.status === "delivered" || order.isDelivered) {
                    return {
                        text: "تم القبول والتسليم ✅",
                        cls: "status-delivered",
                        icon: "fa-check-double"
                    };
                }

                if (order.status === "accepted" || order.status === "approved") {
                    return {
                        text: "تم القبول (في انتظار الاستلام) ⏳",
                        cls: "status-approved",
                        icon: "fa-check-circle"
                    };
                }

                if (order.status === "rejected" || order.isRejected) {
                    return {
                        text: "مرفوض (تم إرجاع النقاط) ❌",
                        cls: "status-rejected",
                        icon: "fa-times-circle"
                    };
                }

                return {
                    text: "قيد المراجعة 🕒",
                    cls: "status-pending",
                    icon: "fa-clock"
                };
            }

            async function fetchUserOrders() {
                userOrdersContainer.innerHTML = `<div class="no-orders"><i class="fas fa-spinner fa-spin"></i> جاري تحميل طلباتك السابقة...</div>`;
                try {
                    const q = query(collection(db, "notifications"), where("username", "==", loggedInUsername));
                    const querySnapshot = await getDocs(q);

                    userOrdersContainer.innerHTML = '';
                    let count = 0;

                    querySnapshot.forEach((docSnap) => {
                        const order = docSnap.data();
                        count++;

                        const { text: statusText, cls: statusClass, icon: statusIcon } = resolveOrderStatus(order);

                        let orderDate = "حديث";
                        if (order.timestamp && order.timestamp.toDate) {
                            orderDate = new Date(order.timestamp.toDate()).toLocaleString('ar-EG');
                        }

                        const card = document.createElement('div');
                        card.className = 'order-card';
                        card.innerHTML = `
                            <div class="order-header">
                                <span class="order-title"><i class="fas fa-gift" style="color: #f59e0b;"></i> ${order.giftName || order.title || 'طلب هدية'}</span>
                                <span class="order-status ${statusClass}"><i class="fas ${statusIcon}"></i> ${statusText}</span>
                            </div>
                            <div class="order-body">
                                <div><i class="fas fa-coins"></i> التكلفة: <strong>${order.pointsSpent || 1} نقطة</strong></div>
                                <div style="margin-top: 5px;"><i class="fas fa-calendar-alt"></i> التاريخ: <strong>${orderDate}</strong></div>
                            </div>
                        `;
                        userOrdersContainer.appendChild(card);
                    });

                    if (count === 0) {
                        userOrdersContainer.innerHTML = `<div class="no-orders">لا توجد طلبات سابقة حتى الآن. ابدأ باستبدال نقاطك بهدايا رائعة!</div>`;
                    }

                } catch (error) {
                    console.error("خطأ في جلب الطلبات:", error);
                    userOrdersContainer.innerHTML = `<div class="no-orders">حدث خطأ أثناء تحميل الطلبات. تأكد من اتصالك بالإنترنت.</div>`;
                }
            }

            await fetchUserOrders();
        });
    </script>

    <style>
        :root{
            --wine-900:#4a0e16;
            --wine-800:#6b1420;
            --wine-700:#7c1b28;
            --gold:#c9a04d;
            --gold-light:#e6c878;
            --paper:#f6f1e9;
            --card:#ffffff;
            --ink:#2a2320;
            --ink-soft:#6b625c;
            --line:#e9dfd0;
            --green:#16a34a;
            --red:#dc3545;
            --blue:#0d6efd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(160deg, #000000 0%, #001b3d 45%, #000000 100%);
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            background: linear-gradient(180deg, var(--wine-800), var(--wine-900));
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(74,14,22,0.25);
            position: relative;
        }

        .navbar::after{
            content:'';
            position:absolute;
            bottom:0; right:0; left:0;
            height:4px;
            background:linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .menu-btn {
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(230,200,120,0.4);
            color: var(--gold-light);
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.25s;
        }
        .menu-btn:hover { background: rgba(230,200,120,0.15); border-color: var(--gold); }

        .page-title {
            color: var(--gold-light);
            font-family: 'Amiri', serif;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: right;
            font-weight: 700;
        }

        .sidebar {
            position: fixed; top: 0; right: -300px;
            width: 290px; height: 100%;
            background: var(--wine-900);
            border-left: 1px solid rgba(230,200,120,0.2);
            transition: right 0.3s ease;
            z-index: 9999;
            padding: 22px;
            display: flex; flex-direction: column;
        }
        .sidebar.active { right: 0; }
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(230,200,120,0.2);
            padding-bottom: 14px; margin-bottom: 20px;
        }
        .sidebar-header h3 { color: #fbeed4; font-family:'Amiri', serif; font-size: 19px; }
        .close-btn { background: none; border: none; color: var(--gold-light); font-size: 22px; cursor: pointer; }
        .sidebar-links { list-style: none; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        .sidebar-links a {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(230,200,120,0.15);
            border-radius: 12px;
            color: #f3e9d8;
            text-decoration: none;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            transition: 0.25s;
            cursor: pointer;
        }
        .sidebar-links a:hover { background: var(--gold); color: var(--wine-900); border-color: var(--gold); }

        .logout-link {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 12px 15px;
            background: rgba(220, 53, 69, 0.15);
            border: 1.5px solid #dc3545;
            border-radius: 12px;
            color: #ff6b6b;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            margin-top: auto;
            cursor: pointer;
            transition: 0.25s;
            width: 100%;
        }
        .logout-link:hover { background: #dc3545; color: #ffffff; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,10,8,0.55); display: none; z-index: 998; }
        .overlay.active { display: block; }

        .main-content { max-width: 600px; width: 100%; padding: 26px 16px 50px; }

        .orders-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .order-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(74,14,22,0.06);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 10px;
        }

        .order-title {
            font-size: 16px;
            font-weight: 700;
            font-family: 'Amiri', serif;
            color: var(--wine-800);
        }

        .order-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-approved { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .status-delivered { background: #d1e7dd; color: #137333; border: 1px solid #b7eb8f; }
        .status-rejected { background: #f8d7da; color: #b3261e; border: 1px solid #f5c6cb; }

        .order-body {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            color: var(--ink-soft);
        }
        .order-body strong { color: var(--ink); }

        .no-orders {
            padding: 40px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            color: var(--ink-soft);
            text-align: center;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <button id="menuBtn" class="menu-btn"><i class="fas fa-bars"></i> القائمة</button>
        <div style="color: var(--gold-light); font-weight: 700; font-family: 'Amiri', serif; font-size: 18px;">سلة طلباتي</div>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>خيارات الحساب</h3>
            <button id="closeBtn" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-links">
            <li><a href="home.html"><i class="fas fa-home"></i>الرئيسية</a></li>
            <li><a href="profile.html"><i class="fas fa-user-circle"></i>البروفايل</a></li>
            <li><a href="gallery.html"><i class="fas fa-gift"></i>معرض الهدايا</a></li>
            <li><a href="cart.html"><i class="fas fa-shopping-cart"></i>السلة</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i>الإشعارات</a></li>
            <li><button id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i>تسجيل خروج</button></li>
        </ul>
    </div>

    <div id="overlay" class="overlay"></div>

    <div class="main-content">
        <h1 class="page-title">سجل المشتريات والطلبات السابقة</h1>
        <div id="userOrdersContainer" class="orders-grid"></div>
    </div>

</body>
</html>
