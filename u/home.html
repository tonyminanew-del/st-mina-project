<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة الرئيسية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --navy: #061d39;
      --navy-dark: #020c19;
      --maroon: #7d1424;
      --maroon-dark: #5d101c;
      --maroon-light: #a51f35;
      --gold: #c9a24b;
      --gold-light: #e6c878;
      --ink: #211918;
      --muted: #817773;
      --line: #eadfe0;
      --surface: #ffffff;
      --soft: #faf6f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "Tajawal", sans-serif;
      background: radial-gradient(circle at top, #0a2d57 0, var(--navy) 45%, var(--navy-dark) 100%);
      padding-bottom: 92px;
    }

    button, a { cursor: pointer; font: inherit; }

    /* ===== الشريط العلوي ===== */
    .topbar {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 18px 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #fff;
    }

    .topbar-title .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(145deg, var(--maroon-light), var(--maroon-dark));
      color: var(--gold-light);
      font-size: 16px;
      flex-shrink: 0;
    }

    .topbar-title span {
      font-weight: 800;
      font-size: 13px;
      line-height: 1.5;
    }

    .topbar-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      color: var(--maroon);
      background: #fff;
      box-shadow: 0 8px 20px rgb(0 0 0 / 22%);
      flex-shrink: 0;
      text-decoration: none;
      display: grid;
      place-items: center;
    }

    .topbar-btn:hover { transform: translateY(-2px); }

    /* ===== الصفحة ===== */
    .page {
      width: min(720px, 100%);
      margin: 16px auto 0;
      padding: 0 14px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background: var(--surface);
      box-shadow: 0 25px 65px rgb(0 0 0 / 30%);
      margin-bottom: 16px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 6px;
      background: linear-gradient(90deg, var(--navy), var(--maroon), var(--gold), var(--maroon), var(--navy));
    }

    /* بطاقة الترحيب */
    .hero-card {
      padding: 34px 26px 30px;
      text-align: center;
    }

    .hero-avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
    }

    .hero-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--gold);
      object-fit: cover;
      background: var(--soft);
      box-shadow: 0 14px 28px rgb(125 20 36 / 30%);
    }

    .hero-card h1 {
      font: 700 clamp(22px, 5vw, 28px) / 1.6 "Amiri", serif;
      color: var(--maroon);
    }

    .hero-card h1.error-msg { color: #b3261e; font-size: 18px; }

    .hero-card p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    /* بطاقة آية اليوم */
    .section-head {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 20px 22px 14px;
    }

    .section-head .icon-badge {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      background: linear-gradient(145deg, var(--maroon-light), var(--maroon-dark));
      flex-shrink: 0;
    }

    .section-head h2 {
      font: 700 20px "Amiri", serif;
      color: var(--maroon);
    }

    .section-head p {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .verse-body { padding: 4px 22px 26px; }

    .verse-text {
      position: relative;
      padding: 20px 20px 20px 18px;
      border-right: 4px solid var(--gold);
      border-radius: 14px;
      background: linear-gradient(135deg, var(--soft), #fff);
      font: italic 700 18px/1.95 "Amiri", serif;
      color: var(--ink);
    }

    .verse-ref {
      display: block;
      margin-top: 14px;
      text-align: left;
      color: var(--maroon);
      font-size: 13px;
      font-weight: 800;
    }

    /* روابط سريعة */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0 22px 24px;
    }

    .quick-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      color: var(--ink);
      transition: .2s ease;
      border: 0;
      width: 100%;
      text-align: right;
    }

    .quick-link {
      border: 1px solid var(--line);
    }

    .quick-link:hover {
      border-color: rgb(125 20 36 / 35%);
      box-shadow: 0 12px 25px rgb(31 23 21 / 10%);
      transform: translateY(-2px);
    }

    .quick-link .icon-badge {
      width: 36px;
      height: 36px;
      font-size: 14px;
      border-radius: 10px;
    }

    .quick-link span {
      font-weight: 700;
      font-size: 13px;
    }

    /* ===== شريط التنقل السفلي ===== */
    nav.bottom-nav {
      position: fixed;
      bottom: 0; right: 0; left: 0;
      background: var(--navy-dark);
      border-top: 1px solid rgb(230 200 120 / 25%);
      display: flex;
      justify-content: space-around;
      padding: 10px 4px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 20px rgb(0 0 0 / 25%);
      overflow-x: auto;
      z-index: 10;
    }

    nav.bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      flex-shrink: 0;
      border: 0;
      background: none;
      color: #c9b7a8;
      text-decoration: none;
      font-size: 10px;
      font-family: "Tajawal", sans-serif;
      transition: .25s ease;
    }

    nav.bottom-nav a i { font-size: 17px; }

    nav.bottom-nav a:hover,
    nav.bottom-nav a.active {
      color: var(--gold-light);
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .hero-card { padding: 28px 18px 24px; }
      .quick-grid { grid-template-columns: 1fr 1fr; padding-inline: 16px; }
      .section-head, .verse-body { padding-inline: 16px; }
    }
  </style>

  <!-- جلب اسم المستخدم والصورة من فايرستور اعتماداً على الـ LocalStorage -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
      authDomain: "st-mina-c01ec.firebaseapp.com",
      projectId: "st-mina-c01ec",
      storageBucket: "st-mina-c01ec.firebasestorage.app",
      messagingSenderId: "792349150559",
      appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.addEventListener("DOMContentLoaded", async () => {
      const welcomeElement = document.getElementById("welcomeName");
      const avatarElement = document.getElementById("homeAvatar");

      const userId = localStorage.getItem("userDocId");

      if (!userId) {
        welcomeElement.innerText = "خطأ: في تسجيل الدخول!";
        welcomeElement.classList.add("error-msg");
        return;
      }

      try {
        const docRef = doc(db, "users", userId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const userData = docSnap.data();
          welcomeElement.innerText = `أهلاً بك يا ${userData.username || userId}`;

          if (userData.avatarUrl) {
            avatarElement.src = userData.avatarUrl;
          } else {
            avatarElement.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.username || userId)}&background=7d1424&color=e6c878&size=150`;
          }
        } else {
          welcomeElement.innerText = "خطأ: لم يتم العثور على المستخدم في قاعدة البيانات!";
          welcomeElement.classList.add("error-msg");
        }
      } catch (error) {
        console.error("خطأ في جلب البيانات:", error);
        welcomeElement.innerText = "خطأ في الاتصال بقاعدة البيانات!";
        welcomeElement.classList.add("error-msg");
      }
    });
  </script>

  <script>
    function navigateTo(page) {
      const userId = localStorage.getItem("userDocId");
      if (page === "profile.html" && userId) {
        window.location.href = `profile.html?user=${userId}`;
      } else {
        window.location.href = page;
      }
    }
  </script>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">
      <div class="mark"><i class="fas fa-cross"></i></div>
      <span>كنيسه الشهيد العظيم<br>استيفانوس ومارمينا العجايبي</span>
    </div>
    <a class="topbar-btn" href="javascript:void(0)" title="الإشعارات" onclick="navigateTo('notifications.html')">
      <i class="fas fa-bell"></i>
    </a>
  </div>

  <div class="page">

    <!-- بطاقة الترحيب -->
    <section class="card hero-card">
      <div class="hero-avatar">
        <img id="homeAvatar" src="https://ui-avatars.com/api/?background=7d1424&color=e6c878&size=150" alt="صورة المستخدم">
      </div>
      <h1 id="welcomeName">جاري التحميل...</h1>
      <p>نتمنى لك يوماً مباركاً</p>
    </section>

    <!-- آية اليوم -->
    <section class="card">
      <div class="section-head">
        <div class="icon-badge"><i class="fas fa-book-bible"></i></div>
        <div>
          <h2>آية اليوم</h2>
          <p>كلمة نتأمل فيها معاً</p>
        </div>
      </div>
      <div class="verse-body">
        <p class="verse-text">"الرب نورى وخلاصى ممن أخاف؟ الرب حصن حياتى ممن أرتعب؟"</p>
        <span class="verse-ref">(مزمور 27 : 1)</span>
      </div>
    </section>

    <!-- روابط سريعة -->
    <section class="card">
      <div class="section-head">
        <div class="icon-badge"><i class="fas fa-grip"></i></div>
        <div>
          <h2>روابط سريعة</h2>
          <p>أهم الأقسام اللي محتاجها</p>
        </div>
      </div>
      <div class="quick-grid">
        <button class="quick-link" type="button" onclick="navigateTo('profile.html')">
          <div class="icon-badge"><i class="fas fa-user"></i></div>
          <span>البروفايل</span>
        </button>
        <button class="quick-link" type="button" onclick="navigateTo('gallery.html')">
          <div class="icon-badge"><i class="fas fa-images"></i></div>
          <span>المعرض</span>
        </button>
        <button class="quick-link" type="button" onclick="navigateTo('cart.html')">
          <div class="icon-badge"><i class="fas fa-heart"></i></div>
          <span>الطلبات</span>
        </button>
        <button class="quick-link" type="button" onclick="navigateTo('notifications.html')">
          <div class="icon-badge"><i class="fas fa-bell"></i></div>
          <span>الإشعارات</span>
        </button>
      </div>
    </section>

  </div>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <a onclick="navigateTo('profile.html')">
      <i class="fas fa-user"></i>
      <span>البروفايل</span>
    </a>
    <a onclick="navigateTo('gallery.html')">
      <i class="fas fa-images"></i>
      <span>المعرض</span>
    </a>
    <a class="active" onclick="navigateTo('home.html')">
      <i class="fas fa-house-chimney"></i>
      <span>الرئيسية</span>
    </a>
    <a onclick="navigateTo('cart.html')">
      <i class="fas fa-heart"></i>
      <span>الطلبات</span>
    </a>
    <a onclick="navigateTo('notifications.html')">
      <i class="fas fa-bell"></i>
      <span>الإشعارات</span>
    </a>
  </nav>

</body>
</html>
