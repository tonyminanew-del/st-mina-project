<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root{
            --wine-900:#4a0e16;
            --wine-800:#6b1420;
            --wine-700:#7c1b28;
            --gold:#c9a04d;
            --gold-light:#e6c878;
            --paper:#f6f1e9;
            --card:#ffffff;
            --ink:#2a2320;
            --ink-soft:#6b625c;
            --line:#e9dfd0;
        }

        * { box-sizing:border-box; margin:0; padding:0; }

        body{
            background:var(--paper);
            display:flex;
            flex-direction:column;
            min-height:100vh;
            font-family:'Cairo', sans-serif;
            color:var(--ink);
        }

        /* ===== الهيدر ===== */
        header.church-header{
            background:linear-gradient(180deg, var(--wine-800), var(--wine-900));
            padding:22px 20px 26px;
            text-align:center;
            position:relative;
            box-shadow:0 8px 20px rgba(74,14,22,0.25);
        }

        header.church-header::after{
            content:'';
            position:absolute;
            bottom:0; right:0; left:0;
            height:4px;
            background:linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .church-logo{
            width:52px;
            height:52px;
            border-radius:50%;
            background:var(--wine-700);
            border:2px solid var(--gold);
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 10px;
        }

        .church-logo i{
            color:var(--gold-light);
            font-size:24px;
        }

        header.church-header h2{
            font-family:'Amiri', serif;
            color:#fbeed4;
            font-size:19px;
            font-weight:700;
        }

        header.church-header p{
            color:var(--gold-light);
            font-size:12px;
            margin-top:4px;
            letter-spacing:.3px;
        }

        /* ===== المحتوى ===== */
        .main-content{
            flex:1;
            padding:18px 16px 100px;
            max-width:620px;
            width:100%;
            margin:0 auto;
        }

        /* ===== الويدجت الموحد ===== */
        .widget{
            background:var(--card);
            border-radius:22px;
            border:1px solid var(--line);
            box-shadow:0 12px 28px rgba(74,14,22,0.08);
            margin-bottom:18px;
            overflow:hidden;
            position:relative;
        }

        .widget::before{
            content:'';
            position:absolute;
            top:0; right:0; left:0;
            height:3px;
            background:linear-gradient(90deg, var(--wine-700), var(--gold), var(--wine-700));
            opacity:.9;
        }

        .widget-head{
            display:flex;
            align-items:center;
            gap:10px;
            padding:16px 18px 4px;
        }

        .widget-head .icon-badge{
            width:30px; height:30px;
            border-radius:10px;
            background:var(--wine-700);
            color:var(--gold-light);
            display:flex; align-items:center; justify-content:center;
            font-size:13px;
            flex-shrink:0;
        }

        .widget-head h3{
            font-size:14px;
            font-weight:700;
            color:var(--wine-800);
        }

        /* بطاقة الترحيب */
        .welcome-widget .widget-body{
            padding:14px 20px 22px;
            text-align:center;
        }

        .welcome-widget .avatar-wrap{
            width:76px;
            height:76px;
            margin:0 auto 10px;
            position:relative;
        }

        .welcome-widget .avatar-wrap img{
            width:100%;
            height:100%;
            border-radius:50%;
            object-fit:cover;
            border:3px solid var(--gold);
            box-shadow:0 6px 16px rgba(74,14,22,0.25);
            background:var(--paper);
        }

        .welcome-widget h1{
            font-family:'Amiri', serif;
            font-size:23px;
            color:var(--wine-800);
            margin-bottom:4px;
        }

        .welcome-widget .sub{
            color:var(--ink-soft);
            font-size:13px;
        }

        .error-msg{
            color:#b3261e !important;
            font-size:20px !important;
        }

        /* آية اليوم */
        .verse-widget .widget-body{
            padding:8px 18px 20px;
        }

        .verse-widget p{
            font-family:'Amiri', serif;
            font-style:italic;
            font-size:18px;
            line-height:1.9;
            color:var(--ink);
            background:var(--paper);
            border-right:4px solid var(--gold);
            padding:14px 16px;
            border-radius:12px;
        }

        .verse-widget span{
            display:block;
            text-align:left;
            font-size:13px;
            color:var(--wine-700);
            font-weight:700;
            margin-top:10px;
        }

        /* ===== شريط التنقل السفلي ===== */
        nav.gamer-nav{
            position:fixed;
            bottom:0; right:0; left:0;
            background:var(--wine-900);
            border-top:1px solid rgba(230,200,120,0.25);
            display:flex;
            justify-content:space-around;
            padding:10px 6px calc(10px + env(safe-area-inset-bottom));
            box-shadow:0 -8px 20px rgba(0,0,0,0.25);
            z-index:10;
        }

        nav.gamer-nav a{
            color:#c9b7a8;
            text-decoration:none;
            font-size:11px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:4px;
            transition:all .25s ease;
            cursor:pointer;
            padding:4px 6px;
        }

        nav.gamer-nav a i{ font-size:18px; }

        nav.gamer-nav a:hover,
        nav.gamer-nav a.active{
            color:var(--gold-light);
            transform:translateY(-2px);
        }
    </style>

    <!-- جلب اسم المستخدم من فايرستور اعتماداً على الـ LocalStorage -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', async () => {
            const welcomeElement = document.getElementById('welcomeName');
            const avatarElement = document.getElementById('homeAvatar');

            const userId = localStorage.getItem('userDocId');

            if (!userId) {
                welcomeElement.innerText = "خطأ: في تسجيل الدخول!";
                welcomeElement.classList.add('error-msg');
                return;
            }

            try {
                const docRef = doc(db, "users", userId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    welcomeElement.innerText = `أهلاً بك يا ${userData.username || userId}`;

                    if (userData.avatarUrl) {
                        avatarElement.src = userData.avatarUrl;
                    } else {
                        avatarElement.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.username || userId)}&background=7c1b28&color=fbeed4&size=150`;
                    }
                } else {
                    welcomeElement.innerText = "خطأ: لم يتم العثور على المستخدم في قاعدة البيانات!";
                    welcomeElement.classList.add('error-msg');
                }

            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                welcomeElement.innerText = "خطأ في الاتصال بقاعدة البيانات!";
                welcomeElement.classList.add('error-msg');
            }
        });
    </script>

    <script>
        function navigateTo(page) {
            const userId = localStorage.getItem('userDocId');
            if(page === 'profile.html' && userId) {
                window.location.href = `profile.html?user=${userId}`;
            } else {
                window.location.href = page;
            }
        }
    </script>
</head>
<body>

    <header class="church-header">
        <div class="church-logo"><i class="fas fa-cross"></i></div>
        <h2>كنيسه الشهيد العظيم استيفانوس ومارمينا العجايبي </h2>
    </header>

    <div class="main-content">

        <!-- بطاقة الترحيب -->
        <div class="widget welcome-widget">
            <div class="widget-body">
                <div class="avatar-wrap">
                    <img id="homeAvatar" src="https://ui-avatars.com/api/?background=7c1b28&color=fbeed4&size=150" alt="صورة المستخدم">
                </div>
                <h1 id="welcomeName">جاري التحميل...</h1>
            </div>
        </div>

        <!-- آية اليوم -->
        <div class="widget verse-widget">
            <div class="widget-head">
                <div class="icon-badge"><i class="fas fa-book-bible"></i></div>
              
            </div>
            <div class="widget-body">
                <p>"الرب نورى وخلاصى ممن أخاف؟ الرب حصن حياتى ممن أرتعب؟"</p>
                <span>(مزمور 27 : 1)</span>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="gamer-nav">
        <a onclick="navigateTo('profile.html')">
            <i class="fas fa-user"></i>
            <span>البروفايل</span>
        </a>
        <a onclick="navigateTo('gallery.html')">
            <i class="fas fa-images"></i>
            <span>المعرض</span>
        </a>
        <a class="active" onclick="navigateTo('home.html')">
            <i class="fas fa-house-chimney"></i>
            <span>الرئيسية</span>
        </a>
        <a onclick="navigateTo('cart.html')">
            <i class="fas fa-heart"></i>
            <span>الطلبات</span>
        </a>
        <a onclick="navigateTo('notifications.html')">
            <i class="fas fa-bell"></i>
            <span>الإشعارات</span>
        </a>
    </nav>

</body>
</html>
