<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البروفايل - لوحة الخادم</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root{
            --wine-900:#4a0e16;
            --wine-800:#6b1420;
            --wine-700:#7c1b28;
            --gold:#c9a04d;
            --gold-light:#e6c878;
            --paper:#f6f1e9;
            --card:#ffffff;
            --ink:#2a2320;
            --ink-soft:#6b625c;
            --line:#e9dfd0;
        }

        * { box-sizing:border-box; margin:0; padding:0; }

        body{
            background:var(--paper);
            display:flex;
            flex-direction:column;
            min-height:100vh;
            font-family:'Cairo', sans-serif;
            color:var(--ink);
        }

        /* ===== الهيدر ===== */
        header.church-header{
            background:linear-gradient(180deg, var(--wine-800), var(--wine-900));
            padding:22px 20px 26px;
            text-align:center;
            position:relative;
            box-shadow:0 8px 20px rgba(74,14,22,0.25);
        }

        header.church-header::after{
            content:'';
            position:absolute;
            bottom:0; right:0; left:0;
            height:4px;
            background:linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .church-logo{
            width:52px;
            height:52px;
            border-radius:50%;
            background:var(--wine-700);
            border:2px solid var(--gold);
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 10px;
        }

        .church-logo i{
            color:var(--gold-light);
            font-size:24px;
        }

        header.church-header h2{
            font-family:'Amiri', serif;
            color:#fbeed4;
            font-size:18px;
            font-weight:700;
        }

        /* ===== المحتوى ===== */
        .main-content{
            flex:1;
            padding:18px 16px 40px;
            max-width:620px;
            width:100%;
            margin:0 auto;
        }

        /* ===== الويدجت الموحد ===== */
        .widget{
            background:var(--card);
            border-radius:22px;
            border:1px solid var(--line);
            box-shadow:0 12px 28px rgba(74,14,22,0.08);
            margin-bottom:18px;
            overflow:hidden;
            position:relative;
        }

        .widget::before{
            content:'';
            position:absolute;
            top:0; right:0; left:0;
            height:3px;
            background:linear-gradient(90deg, var(--wine-700), var(--gold), var(--wine-700));
            opacity:.9;
        }

        .widget-head{
            display:flex;
            align-items:center;
            gap:10px;
            padding:16px 18px 4px;
        }

        .widget-head .icon-badge{
            width:30px; height:30px;
            border-radius:10px;
            background:var(--wine-700);
            color:var(--gold-light);
            display:flex; align-items:center; justify-content:center;
            font-size:13px;
            flex-shrink:0;
        }

        .widget-head h3{
            font-size:14px;
            font-weight:700;
            color:var(--wine-800);
        }

        /* بطاقة الصورة الشخصية */
        .avatar-widget .widget-body{
            padding:14px 20px 22px;
            text-align:center;
        }

        .avatar-widget h1{
            font-family:'Amiri', serif;
            font-size:21px;
            color:var(--wine-800);
            margin-bottom:16px;
        }

        .avatar-container{
            position:relative;
            width:120px;
            height:120px;
            margin:0 auto;
        }

        .avatar{
            width:100%;
            height:100%;
            border-radius:50%;
            border:3px solid var(--gold);
            object-fit:cover;
            background:var(--paper);
            box-shadow:0 6px 16px rgba(74,14,22,0.25);
        }

        .upload-label{
            position:absolute;
            bottom:0;
            left:0;
            background:linear-gradient(135deg, var(--gold-light), var(--gold));
            color:var(--wine-900);
            width:34px;
            height:34px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(74,14,22,0.35);
            transition:.3s;
            border:2px solid var(--card);
        }

        .upload-label:hover{
            transform:scale(1.08);
        }

        #avatar-input{ display:none; }

        /* بطاقة بيانات الخادم */
        .info-widget .widget-body{
            padding:8px 18px 20px;
        }

        .info-list{
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .info-item{
            background:var(--paper);
            border:1px solid var(--line);
            border-right:4px solid var(--gold);
            padding:12px 16px;
            border-radius:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
        }

        .info-label{
            color:var(--wine-700);
            font-weight:700;
            font-size:14px;
            display:flex;
            align-items:center;
            gap:8px;
        }

        .info-label i{ width:16px; text-align:center; }

        .info-value{
            color:var(--ink);
            font-size:14px;
            font-weight:600;
        }

        /* ===== زر الرجوع الأنيق ===== */
        .back-btn-container {
            margin-top: 25px;
            text-align: center;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--wine-800), var(--wine-900));
            color: #fbeed4;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            border: 2px solid var(--gold);
            box-shadow: 0 6px 18px rgba(74,14,22,0.25);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, var(--wine-700), var(--wine-800));
            color: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(74,14,22,0.35);
        }

        .back-btn i {
            font-size: 16px;
            color: var(--gold);
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // جلب وعرض البيانات من الـ LocalStorage
            const username = localStorage.getItem('username') || 'غير محدد';
            const fullName = localStorage.getItem('fullName') || 'خادم الرب';
            const servantTitle = localStorage.getItem('servantTitle') || '';
            const servantStage = localStorage.getItem('servantStage') || 'غير محددة';
            const servantNumber = localStorage.getItem('servantNumber') || 'غير متوفر';

            const usernameEl = document.getElementById('val-username');
            const fullnameEl = document.getElementById('val-fullname');
            const stageEl = document.getElementById('val-stage');
            const numberEl = document.getElementById('val-number');

            if (usernameEl) usernameEl.innerText = username;
            if (fullnameEl) fullnameEl.innerText = servantTitle ? `${servantTitle} ${fullName}` : fullName;
            if (stageEl) stageEl.innerText = servantStage;
            if (numberEl) numberEl.innerText = servantNumber;

            // معالجة رفع وعرض الصورة الشخصية وحفظها محلياً
            const avatarInput = document.getElementById('avatar-input');
            const profileImage = document.getElementById('profile-image');

            // تحميل الصورة المحفوظة مسبقاً إن وجدت
            const savedImage = localStorage.getItem('profileImage');
            if (savedImage && profileImage) {
                profileImage.src = savedImage;
            }

            if (avatarInput && profileImage) {
                avatarInput.addEventListener('change', function(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const base64Image = e.target.result;
                            profileImage.src = base64Image;
                            localStorage.setItem('profileImage', base64Image); // حفظ الصورة
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        });
    </script>
</head>
<body>

    <header class="church-header">
        <div class="church-logo"><i class="fas fa-cross"></i></div>
        <h2>كنيسه الشهيد العظيم استيفانوس ومارمينا العجايبي</h2>
    </header>

    <div class="main-content">

        <!-- بطاقة الصورة الشخصية -->
        <div class="widget avatar-widget">
            <div class="widget-body">
                <h1>الملف الشخصي للخادم</h1>
                <div class="avatar-container">
                    <img id="profile-image" class="avatar" src="https://via.placeholder.com/150/f6f1e9/7c1b28?text=صورة+الخادم" alt="صورة الخادم">
                    <label for="avatar-input" class="upload-label" title="تغيير الصورة">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="avatar-input" accept="image/*">
                </div>
            </div>
        </div>

        <!-- بطاقة بيانات الخادم -->
        <div class="widget info-widget">
            <div class="widget-head">
                <div class="icon-badge"><i class="fas fa-id-card"></i></div>
                <h3>بيانات الخادم</h3>
            </div>
            <div class="widget-body">
                <div class="info-list">
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-user"></i> اسم المستخدم:</span>
                        <span id="val-username" class="info-value">جاري التحميل...</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-id-badge"></i> الاسم الكامل:</span>
                        <span id="val-fullname" class="info-value">جاري التحميل...</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-graduation-cap"></i> المرحلة الخدمية:</span>
                        <span id="val-stage" class="info-value">جاري التحميل...</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-hashtag"></i> رقم الخادم:</span>
                        <span id="val-number" class="info-value">جاري التحميل...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- زر الرجوع الأنيق -->
        <div class="back-btn-container">
            <a href="home.html" class="back-btn">
                <i class="fas fa-arrow-right"></i>
                <span>العودة إلى الرئيسية</span>
            </a>
        </div>

    </div>

</body>
</html>
