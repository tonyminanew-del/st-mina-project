<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البروفايل - لوحة الخادم</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root{
            --wine-900:#4a0e16;
            --wine-800:#6b1420;
            --wine-700:#7c1b28;
            --gold:#c9a04d;
            --gold-light:#e6c878;
            --paper:#f6f1e9;
            --card:#ffffff;
            --ink:#2a2320;
            --ink-soft:#6b625c;
            --line:#e9dfd0;
        }

        * { box-sizing:border-box; margin:0; padding:0; }

        body{
            background:var(--paper);
            display:flex;
            flex-direction:column;
            min-height:100vh;
            font-family:'Cairo', sans-serif;
            color:var(--ink);
        }

        /* ===== الهيدر ===== */
        header.church-header{
            background:linear-gradient(180deg, var(--wine-800), var(--wine-900));
            padding:22px 20px 26px;
            text-align:center;
            position:relative;
            box-shadow:0 8px 20px rgba(74,14,22,0.25);
        }

        header.church-header::after{
            content:'';
            position:absolute;
            bottom:0; right:0; left:0;
            height:4px;
            background:linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .church-logo{
            width:52px;
            height:52px;
            border-radius:50%;
            background:var(--wine-700);
            border:2px solid var(--gold);
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 10px;
        }

        .church-logo i{
            color:var(--gold-light);
            font-size:24px;
        }

        header.church-header h2{
            font-family:'Amiri', serif;
            color:#fbeed4;
            font-size:18px;
            font-weight:700;
        }

        /* ===== المحتوى ===== */
        .main-content{
            flex:1;
            padding:18px 16px 100px; /* مسافة كافية لعدم تداخل المحتوى مع شريط التنقل السفلي */
            max-width:620px;
            width:100%;
            margin:0 auto;
        }

        /* ===== الويدجت الموحد ===== */
        .widget{
            background:var(--card);
            border-radius:22px;
            border:1px solid var(--line);
            box-shadow:0 12px 28px rgba(74,14,22,0.08);
            margin-bottom:18px;
            overflow:hidden;
            position:relative;
        }

        .widget::before{
            content:'';
            position:absolute;
            top:0; right:0; left:0;
            height:3px;
            background:linear-gradient(90deg, var(--wine-700), var(--gold), var(--wine-700));
            opacity:.9;
        }

        .widget-head{
            display:flex;
            align-items:center;
            gap:10px;
            padding:16px 18px 4px;
        }

        .widget-head .icon-badge{
            width:30px; height:30px;
            border-radius:10px;
            background:var(--wine-700);
            color:var(--gold-light);
            display:flex; align-items:center; justify-content:center;
            font-size:13px;
            flex-shrink:0;
        }

        .widget-head h3{
            font-size:14px;
            font-weight:700;
            color:var(--wine-800);
        }

        /* بطاقة الصورة الشخصية */
        .avatar-widget .widget-body{
            padding:14px 20px 22px;
            text-align:center;
        }

        .avatar-widget h1{
            font-family:'Amiri', serif;
            font-size:21px;
            color:var(--wine-800);
            margin-bottom:16px;
        }

        .avatar-container{
            position:relative;
            width:120px;
            height:120px;
            margin:0 auto;
        }

        .avatar{
            width:100%;
            height:100%;
            border-radius:50%;
            border:3px solid var(--gold);
            object-fit:cover;
            background:var(--paper);
            box-shadow:0 6px 16px rgba(74,14,22,0.25);
        }

        .upload-label{
            position:absolute;
            bottom:0;
            left:0;
            background:linear-gradient(135deg, var(--gold-light), var(--gold));
            color:var(--wine-900);
            width:34px;
            height:34px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(74,14,22,0.35);
            transition:.3s;
            border:2px solid var(--card);
        }

        .upload-label:hover{
            transform:scale(1.08);
        }

        #avatar-input{ display:none; }

        /* بطاقة بيانات الخادم */
        .info-widget .widget-body{
            padding:8px 18px 20px;
        }

        .info-list{
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .info-item{
            background:var(--paper);
            border:1px solid var(--line);
            border-right:4px solid var(--gold);
            padding:12px 16px;
            border-radius:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
        }

        .info-label{
            color:var(--wine-700);
            font-weight:700;
            font-size:14px;
            display:flex;
            align-items:center;
            gap:8px;
        }

        .info-label i{ width:16px; text-align:center; }

        .info-value{
            color:var(--ink);
            font-size:14px;
            font-weight:600;
        }

        /* ===== شريط التنقل السفلي ===== */
        nav.bottom-nav{
            position:fixed;
            bottom:0; right:0; left:0;
            background:var(--wine-900);
            border-top:1px solid rgba(230,200,120,0.25);
            display:flex;
            justify-content:space-around;
            padding:10px 4px calc(10px + env(safe-area-inset-bottom));
            box-shadow:0 -8px 20px rgba(0,0,0,0.25);
            overflow-x:auto;
            z-index:10;
        }

        nav.bottom-nav a, nav.bottom-nav button{
            background:none;
            border:none;
            color:#c9b7a8;
            text-decoration:none;
            font-size:10px;
            font-family:'Cairo', sans-serif;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:4px;
            transition:all .25s ease;
            cursor:pointer;
            padding:4px 6px;
            flex-shrink:0;
        }

        nav.bottom-nav a i, nav.bottom-nav button i{ font-size:17px; }

        nav.bottom-nav a:hover,
        nav.bottom-nav a.active{
            color:var(--gold-light);
            transform:translateY(-2px);
        }

        nav.bottom-nav .logout-link{
            color:#e88a84;
        }

        nav.bottom-nav .logout-link:hover{
            color:#ff6b6b;
            transform:translateY(-2px);
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // استخراج بيانات المستخدم من كائن currentUser أو adminData المخزن في LocalStorage (مع دعم المفاتيح المنفصلة كبديل)
            let userData = null;
            try {
                const storedUser = localStorage.getItem('currentUser') || localStorage.getItem('adminData');
                if (storedUser) {
                    userData = JSON.parse(storedUser);
                }
            } catch (e) {
                console.error("Error parsing user data:", e);
            }

            const username = (userData && (userData.username || userData.user)) || localStorage.getItem('username') || 'غير محدد';
            const fullName = (userData && (userData.fullName || userData.name)) || localStorage.getItem('fullName') || 'خادم الرب';
            const servantTitle = (userData && (userData.servantTitle || userData.title)) || localStorage.getItem('servantTitle') || '';
            const servantStage = (userData && (userData.servantStage || userData.stage)) || localStorage.getItem('servantStage') || 'غير محددة';
            const servantNumber = (userData && (userData.servantNumber || userData.number || userData.id)) || localStorage.getItem('servantNumber') || 'غير متوفر';

            const usernameEl = document.getElementById('val-username');
            const fullnameEl = document.getElementById('val-fullname');
            const stageEl = document.getElementById('val-stage');
            const numberEl = document.getElementById('val-number');

            if (usernameEl) usernameEl.innerText = username;
            if (fullnameEl) fullnameEl.innerText = servantTitle ? `${servantTitle} ${fullName}` : fullName;
            if (stageEl) stageEl.innerText = servantStage;
            if (numberEl) numberEl.innerText = servantNumber;

            // معالجة رفع وعرض الصورة الشخصية وحفظها محلياً
            const avatarInput = document.getElementById('avatar-input');
            const profileImage = document.getElementById('profile-image');

            // تحميل الصورة المحفوظة مسبقاً إن وجدت
            const savedImage = localStorage.getItem('profileImage');
            if (savedImage && profileImage) {
                profileImage.src = savedImage;
            }

            if (avatarInput && profileImage) {
                avatarInput.addEventListener('change', function(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const base64Image = e.target.result;
                            profileImage.src = base64Image;
                            localStorage.setItem('profileImage', base64Image); // حفظ الصورة
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            // زر تسجيل الخروج في الشريط السفلي
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (confirm("هل تريد تسجيل الخروج حقاً؟")) {
                        localStorage.clear();
                        window.location.href = 'index.html';
                    }
                });
            }
        });
    </script>
</head>
<body>

    <header class="church-header">
        <div class="church-logo"><i class="fas fa-cross"></i></div>
        <h2>كنيسه الشهيد العظيم استيفانوس ومارمينا العجايبي</h2>
    </header>

    <div class="main-content">

        <!-- بطاقة الصورة الشخصية -->
        <div class="widget avatar-widget">
            <div class="widget-body">
                <h1>الملف الشخصي للخادم</h1>
                <div class="avatar-container">
                    <img id="profile-image" class="avatar" src="https://via.placeholder.com/150/f6f1e9/7c1b28?text=صورة+الخادم" alt="صورة الخادم">
                    <label for="avatar-input" class="upload-label" title="تغيير الصورة">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="avatar-input" accept="image/*">
                </div>
            </div>
        </div>

        <!-- بطاقة بيانات الخادم -->
        <div class="widget info-widget">
            <div class="widget-head">
                <div class="icon-badge"><i class="fas fa-id-card"></i></div>
                <h3>بيانات الخادم</h3>
            </div>
            <div class="widget-body">
                <div class="info-list">
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-user"></i> اسم المستخدم:</span>
                        <span id="val-username" class="info-value">جاري التحميل...</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-id-badge"></i> الاسم الكامل:</span>
                        <span id="val-fullname" class="info-value">جاري التحميل...</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-graduation-cap"></i> المرحلة الخدمية:</span>
                        <span id="val-stage" class="info-value">جاري التحميل...</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-hashtag"></i> رقم الخادم:</span>
                        <span id="val-number" class="info-value">جاري التحميل...</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <a href="home.html">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </a>
        <a class="active" href="profile.html">
            <i class="fas fa-user-circle"></i>
            <span>البروفايل</span>
        </a>
        <a href="gifts.html">
            <i class="fas fa-gift"></i>
            <span>الهدايا</span>
        </a>
        <a href="control.html">
            <i class="fas fa-cogs"></i>
            <span>الإدارة</span>
        </a>
        <a href="cart.html">
            <i class="fas fa-shopping-cart"></i>
            <span>السلة</span>
        </a>
        <a href="../notifications/index.html">
            <i class="fas fa-bell"></i>
            <span>الإشعارات</span>
        </a>
        <button id="logoutBtn" class="logout-link">
            <i class="fas fa-sign-out-alt"></i>
            <span>خروج</span>
        </button>
    </nav>

</body>
</html>
