<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الهدايا المستلمة - متجر الكنيسة</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /* =========================
           FIREBASE
        ========================= */

        const firebaseConfig = {

            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",

            authDomain: "st-mina-c01ec.firebaseapp.com",

            databaseURL:
                "https://st-mina-c01ec-default-rtdb.firebaseio.com",

            projectId: "st-mina-c01ec",

            storageBucket:
                "st-mina-c01ec.firebasestorage.app",

            messagingSenderId: "792349150559",

            appId:
                "1:792349150559:web:8a86bbf57c2c7e351f3aea",

            measurementId: "G-XZGSBG05KR"
        };


        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        /* =========================
           VARIABLES
        ========================= */

        const myGrade =
            (localStorage.getItem("servantGrade") || "").trim();

        let allServants = [];

        let allNotifications = [];


        /* =========================
           START
        ========================= */

        document.addEventListener("DOMContentLoaded", async () => {

            setupMenu();

            setupGradeHeader();

            await loadData();

        });


        /* =========================
           HEADER
        ========================= */

        function setupGradeHeader() {

            const gradeNameEl =
                document.getElementById("myGradeName");

            const pageTitleEl =
                document.getElementById("pageTitle");

            const sectionTitleEl =
                document.getElementById("sectionTitle");


            if (myGrade) {

                gradeNameEl.textContent = myGrade;

                pageTitleEl.textContent =
                    `الهدايا المستلمة - ${myGrade}`;

                sectionTitleEl.textContent =
                    `مخدومين ${myGrade}`;

            } else {

                gradeNameEl.textContent = "غير محدد";

                pageTitleEl.textContent =
                    "الهدايا المستلمة";

                sectionTitleEl.textContent =
                    "مخدومين صفّي";
            }
        }


        /* =========================
           MENU
        ========================= */

        function setupMenu() {

            const logoutBtn =
                document.getElementById("logoutBtn");


            if (!logoutBtn) return;


            logoutBtn.addEventListener("click", () => {

                if (
                    confirm(
                        "هل تريد تسجيل الخروج حقاً؟"
                    )
                ) {

                    localStorage.clear();

                    window.location.href =
                        "../index.html";
                }

            });
        }


        /* =========================
           LOAD DATA
        ========================= */

        async function loadData() {

            showLoading();


            if (!myGrade) {

                showNoGrade();

                return;
            }


            try {

                /* USERS */

                const usersSnapshot =
                    await getDocs(
                        collection(db, "users")
                    );


                const all = [];


                usersSnapshot.forEach(docSnap => {

                    const data =
                        docSnap.data();


                    const username =
                        data.username ||
                        data.userName ||
                        data.name ||
                        data.fullName ||
                        data.displayName ||
                        docSnap.id;


                    const stage =
                        data.stage ||
                        data.stageName ||
                        "عام";


                    const grade =
                        data.grade ||
                        data.className ||
                        "";


                    all.push({

                        id: docSnap.id,

                        username:
                            String(username).trim(),

                        fullName:
                            data.fullName ||
                            data.name ||
                            data.userName ||
                            username,

                        stage:
                            String(stage).trim(),

                        grade:
                            String(grade).trim(),

                        image:
                            data.image ||
                            data.photoBase64 ||
                            data.photo ||
                            ""

                    });

                });


                /* SAME GRADE ONLY */

                allServants =
                    all.filter(
                        user =>
                            user.grade === myGrade
                    );


                /* NOTIFICATIONS */

                const notificationsSnapshot =
                    await getDocs(
                        collection(
                            db,
                            "notifications"
                        )
                    );


                allNotifications = [];


                notificationsSnapshot.forEach(
                    docSnap => {

                        const data =
                            docSnap.data();


                        if (
                            data.type &&
                            data.type !== "gift_order"
                        ) return;


                        allNotifications.push({

                            id: docSnap.id,

                            username:
                                String(
                                    data.username || ""
                                ).trim(),

                            message:
                                String(
                                    data.message || ""
                                ).trim(),

                            giftName:
                                data.giftName ||
                                data.title ||
                                "هدية",

                            giftImage:
                                data.giftImage ||
                                data.image ||
                                data.photo ||
                                "",

                            pointsSpent:
                                Number(
                                    data.pointsSpent || 0
                                ),

                            timestamp:
                                data.timestamp || null,

                            deliveredAt:
                                data.deliveredAt ||
                                data.updatedAt ||
                                null
                        });

                    }
                );


                showServants();

                setupSearch();


            } catch (error) {

                console.error(
                    "Firebase Error:",
                    error
                );


                showError(
                    "حدث خطأ أثناء تحميل البيانات. تأكد من اتصالك بالإنترنت وصلاحيات Firestore."
                );

            }

        }


        /* =========================
           SHOW SERVANTS
        ========================= */

        function showServants(searchText = "") {

            const container =
                document.getElementById(
                    "servantsContainer"
                );


            container.innerHTML = "";


            let servants =
                [...allServants];


            if (searchText.trim()) {

                const search =
                    searchText
                        .trim()
                        .toLowerCase();


                servants =
                    servants.filter(user =>
                        String(user.fullName)
                            .toLowerCase()
                            .includes(search)
                    );

            }


            servants.sort(
                (a, b) =>
                    a.fullName.localeCompare(
                        b.fullName,
                        "ar"
                    )
            );


            document.getElementById(
                "servantsCount"
            ).textContent =
                servants.length;


            if (servants.length === 0) {

                container.innerHTML = `

                    <div class="empty-box">

                        <div class="empty-icon">

                            <i class="fas fa-user-slash"></i>

                        </div>

                        <h3>
                            لا يوجد مخدومون
                        </h3>

                        <p>
                            لا يوجد مخدومون مسجلون في صفّك حالياً.
                        </p>

                    </div>

                `;

                return;
            }


            servants.forEach(user => {

                const card =
                    document.createElement("div");


                card.className =
                    "servant-card";


                const gifts =
                    getServantGifts(
                        user.fullName,
                        user.username
                    );


                const giftCount =
                    gifts.length;


                let avatarHTML =
                    user.image

                        ?

                    `
                    <img
                        src="${user.image}"
                        alt="${escapeHTML(user.fullName)}"
                        class="servant-avatar"
                    >
                    `

                        :

                    `
                    <div class="servant-avatar default-avatar">

                        <i class="fas fa-user"></i>

                    </div>
                    `;


                let displaySubText =
                    user.grade

                        ?

                    `${user.stage} - ${user.grade}`

                        :

                    (
                        user.stage ||
                        "مخدوم"
                    );


                card.innerHTML = `

                    <div class="servant-right">

                        ${avatarHTML}

                        <div class="servant-info">

                            <div class="servant-name">

                                ${escapeHTML(
                                    user.fullName
                                )}

                            </div>


                            <div class="servant-grade">

                                <i class="fas fa-layer-group"></i>

                                ${escapeHTML(
                                    displaySubText
                                )}

                            </div>

                        </div>

                    </div>


                    <div class="servant-left">

                        <div class="gift-count">

                            <i class="fas fa-gift"></i>

                            <span>
                                ${giftCount}
                            </span>

                        </div>


                        <div class="arrow-box">

                            <i class="fas fa-chevron-left arrow"></i>

                        </div>

                    </div>

                `;


                card.addEventListener(
                    "click",
                    () =>
                        openServant(
                            user,
                            displaySubText
                        )
                );


                container.appendChild(card);

            });

        }


        /* =========================
           GET SERVANT GIFTS
        ========================= */

        function getServantGifts(
            fullName,
            username
        ) {

            return allNotifications.filter(
                notification => {

                    const notificationUser =
                        String(
                            notification.username || ""
                        )
                            .trim()
                            .toLowerCase();


                    const notificationMessage =
                        String(
                            notification.message || ""
                        )
                            .trim()
                            .toLowerCase();


                    const userName =
                        String(
                            username || ""
                        )
                            .trim()
                            .toLowerCase();


                    const full =
                        String(
                            fullName || ""
                        )
                            .trim()
                            .toLowerCase();


                    return (

                        (
                            userName &&
                            notificationUser === userName
                        )

                        ||

                        (
                            full &&
                            notificationUser === full
                        )

                        ||

                        (
                            notificationUser &&
                            full.includes(
                                notificationUser
                            )
                        )

                        ||

                        (
                            notificationUser &&
                            notificationUser.includes(full)
                        )

                        ||

                        notificationMessage.includes(full)

                    );

                }
            );

        }


        /* =========================
           OPEN SERVANT
        ========================= */

        function openServant(
            user,
            subText
        ) {

            const gifts =
                getServantGifts(
                    user.fullName,
                    user.username
                );


            document.getElementById(
                "servantsSection"
            ).style.display = "none";


            document.getElementById(
                "detailsSection"
            ).style.display = "block";


            document.getElementById(
                "selectedName"
            ).textContent =
                user.fullName;


            document.getElementById(
                "selectedGrade"
            ).textContent =
                subText;


            document.getElementById(
                "selectedGiftCount"
            ).textContent =
                gifts.length;


            const container =
                document.getElementById(
                    "giftsContainer"
                );


            container.innerHTML = "";


            if (gifts.length === 0) {

                container.innerHTML = `

                    <div class="empty-box">

                        <div class="empty-icon">

                            <i class="fas fa-gift"></i>

                        </div>

                        <h3>
                            لا توجد هدايا مستلمة
                        </h3>

                        <p>
                            هذا المخدوم لم يستلم أي هدايا مسجلة حتى الآن.
                        </p>

                    </div>

                `;

                return;
            }


            gifts.sort(
                (a, b) =>
                    getDateValue(
                        b.deliveredAt ||
                        b.timestamp
                    )
                    -
                    getDateValue(
                        a.deliveredAt ||
                        a.timestamp
                    )
            );


            gifts.forEach(
                (gift, index) => {

                    const card =
                        document.createElement("div");


                    card.className =
                        "gift-card";


                    const date =
                        formatDate(
                            gift.deliveredAt ||
                            gift.timestamp
                        );


                    let giftImageHTML =
                        gift.giftImage

                            ?

                        `
                        <img
                            src="${gift.giftImage}"
                            alt="${escapeHTML(gift.giftName)}"
                            class="gift-img"
                            loading="lazy"
                        >
                        `

                            :

                        `
                        <div class="gift-icon">

                            <i class="fas fa-gift"></i>

                        </div>
                        `;


                    card.innerHTML = `

                        <div class="gift-number">

                            ${index + 1}

                        </div>


                        ${giftImageHTML}


                        <div class="gift-details">

                            <div class="gift-name">

                                ${escapeHTML(
                                    gift.giftName
                                )}

                            </div>


                            <div class="gift-date">

                                <i class="fas fa-calendar-alt"></i>

                                ${date}

                            </div>


                            ${
                                gift.message

                                    ?

                                `
                                <div class="gift-msg">

                                    <i class="fas fa-info-circle"></i>

                                    ${escapeHTML(
                                        gift.message
                                    )}

                                </div>
                                `

                                    :

                                ""
                            }

                        </div>


                        <div class="gift-points">

                            <i class="fas fa-star"></i>

                            <span>
                                ${gift.pointsSpent}
                            </span>

                            <small>
                                نقطة
                            </small>

                        </div>

                    `;


                    container.appendChild(card);

                }
            );

        }


        /* =========================
           BACK
        ========================= */

        function backToServants() {

            document.getElementById(
                "detailsSection"
            ).style.display = "none";


            document.getElementById(
                "servantsSection"
            ).style.display = "block";

        }


        /* =========================
           SEARCH
        ========================= */

        function setupSearch() {

            const search =
                document.getElementById(
                    "searchInput"
                );


            if (!search) return;


            search.addEventListener(
                "input",
                () => {

                    showServants(
                        search.value
                    );

                }
            );

        }


        /* =========================
           DATE
        ========================= */

        function getDateValue(value) {

            if (!value) return 0;


            if (
                typeof value.toDate ===
                "function"
            ) {

                return value
                    .toDate()
                    .getTime();

            }


            if (
                value instanceof Date
            ) {

                return value.getTime();

            }


            const date =
                new Date(value);


            return isNaN(
                date.getTime()
            )

                ?

            0

                :

            date.getTime();

        }


        function formatDate(value) {

            if (!value)
                return "تاريخ غير محدد";


            let date =
                typeof value.toDate ===
                "function"

                    ?

                value.toDate()

                    :

                new Date(value);


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return "تاريخ غير محدد";

            }


            return date.toLocaleString(
                "ar-EG",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        /* =========================
           SECURITY
        ========================= */

        function escapeHTML(value) {

            return String(
                value || ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           LOADING
        ========================= */

        function showLoading() {

            document.getElementById(
                "servantsContainer"
            ).innerHTML = `

                <div class="loading-box">

                    <div class="loading-icon">

                        <i class="fas fa-spinner fa-spin"></i>

                    </div>

                    <p>
                        جاري تحميل مخدومي صفّك...
                    </p>

                </div>

            `;

        }


        /* =========================
           NO GRADE
        ========================= */

        function showNoGrade() {

            document.getElementById(
                "servantsContainer"
            ).innerHTML = `

                <div class="empty-box">

                    <div class="empty-icon">

                        <i class="fas fa-triangle-exclamation"></i>

                    </div>

                    <h3>
                        لم يتم تحديد صفّك
                    </h3>

                    <p>
                        يرجى إكمال بيانات ملفك الشخصي لتحديد الصف الذي تخدمه.
                    </p>

                </div>

            `;


            document.getElementById(
                "servantsCount"
            ).textContent = "0";

        }


        /* =========================
           ERROR
        ========================= */

        function showError(message) {

            document.getElementById(
                "servantsContainer"
            ).innerHTML = `

                <div class="error-box">

                    <div class="error-icon">

                        <i class="fas fa-exclamation-triangle"></i>

                    </div>

                    <h3>
                        حدث خطأ
                    </h3>

                    <p>
                        ${escapeHTML(message)}
                    </p>

                    <button
                        class="retry-btn"
                        onclick="location.reload()"
                    >

                        <i class="fas fa-redo"></i>

                        إعادة المحاولة

                    </button>

                </div>

            `;

        }


        window.backToServants =
            backToServants;

    </script>

                );

        }


        /* =====================================
           GRADE CARD
        ===================================== */

        .my-grade-card {

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #fff8f8
                );

            border: 1px solid var(--line);

            border-radius: 19px;

            padding: 15px 17px;

            margin-bottom: 19px;

            display: flex;

            align-items: center;

            gap: 13px;

            position: relative;

            overflow: hidden;

                0 8px 25px
                rgba(42, 20, 24, .07);

        }


        .my-grade-card::before {

            content: "";

            position: absolute;

            top: 0;

            right: 0;

            width: 4px;

            height: 100%;

            background:
                linear-gradient(
                    180deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

        }


        .my-grade-icon {

            width: 44px;

            height: 44px;

            flex-shrink: 0;

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: #ffffff;

            font-size: 17px;

            box-shadow:
                0 7px 15px
                rgba(125, 20, 36, .18);

        }


        .my-grade-info .label {

            color: var(--muted);

            font-size: 11px;

            font-weight: 600;

        }


        .my-grade-info .value {

            color: var(--maroon-dark);

            font-family: "Amiri", serif;

            font-size: 20px;

            font-weight: 700;

        }


        /* =====================================
           SEARCH
        ===================================== */

        .search-box {

            position: relative;

            margin-bottom: 20px;

        }


        .search-box input {

            width: 100%;

            height: 50px;

            padding:
                10px 46px
                10px 16px;

            border-radius: 15px;

            border: 1px solid #e4dadd;

            background: #faf9f9;

            color: var(--ink);

            font-family: "Cairo", sans-serif;

            font-size: 13px;

            outline: none;

            transition: .22s;

        }


        .search-box input::placeholder {

            color: #aaa19e;

        }


        .search-box input:focus {

            background: #ffffff;

            border-color: var(--maroon-light);

            box-shadow:
                0 0 0 4px
                rgba(155, 28, 48, .08);

        }


        .search-box i {

            position: absolute;

            right: 17px;

            top: 50%;

            transform:
                translateY(-50%);

            color: var(--maroon);

            font-size: 15px;

        }


        /* =====================================
           SECTION HEADER
        ===================================== */

        .section-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin: 8px 2px 13px;

        }


        .section-header h2 {

            color: var(--ink);

            font-family: "Amiri", serif;

            font-size: 21px;

            font-weight: 700;

        }


        .servants-count-badge {

            min-width: 35px;

            height: 31px;

            padding: 3px 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            background: var(--soft-maroon);

            color: var(--maroon-dark);

            border: 1px solid #e7cdd1;

            font-size: 12px;

            font-weight: 800;

        }


        /* =====================================
           SERVANTS LIST
        ===================================== */

        .servants-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        .servant-card {

            background: #ffffff;

            border: 1px solid var(--line);

            border-radius: 17px;

            padding: 12px 14px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 6px 18px
                rgba(40, 20, 25, .06);

            transition:
                transform .22s ease,
                border-color .22s ease,
                box-shadow .22s ease;

            animation:
                fadeUp .35s ease both;

        }


        .servant-card::before {

            content: "";

            position: absolute;

            top: 0;

            right: 0;

            width: 3px;

            height: 100%;

            background:
                var(--maroon);

            opacity: 0;

            transition: .22s;

        }


        .servant-card:hover {

            transform:
                translateY(-2px);

            border-color:
                #dcbec3;

            box-shadow:
                0 12px 28px
                rgba(80, 20, 30, .11);

        }


        .servant-card:hover::before {

            opacity: 1;

        }


        .servant-right {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .servant-avatar {

            width: 50px;

            height: 50px;

            flex-shrink: 0;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #d9b0b7;

            padding: 2px;

            background: #ffffff;

        }


        .default-avatar {

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: #ffffff;

            padding: 0;

            border: none;

            font-size: 17px;

        }


        .servant-info {

            min-width: 0;

        }


        .servant-name {

            color: var(--ink);

            font-family: "Amiri", serif;

            font-size: 18px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .servant-grade {

            margin-top: 2px;

            color: var(--muted);

            font-size: 11px;

            display: flex;

            align-items: center;

            gap: 5px;

        }


        .servant-grade i {

            color: var(--maroon);

            font-size: 10px;

        }


        .servant-left {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-shrink: 0;

        }


        .gift-count {

            display: flex;

            align-items: center;

            gap: 5px;

            padding: 6px 10px;

            border-radius: 12px;

            background: #fff8ed;

            border: 1px solid #ead9bd;

            color: #74520e;

            font-size: 12px;

            font-weight: 800;

        }


        .gift-count i {

            color: var(--gold);

        }


        .arrow-box {

            width: 31px;

            height: 31px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #faf5f6;

            color: var(--maroon);

            transition: .22s;

        }


        .servant-card:hover .arrow-box {

            background: var(--maroon);

            color: #ffffff;

            transform:
                translateX(-2px);

        }


        /* =====================================
           DETAILS
        ===================================== */

        .details-section {

            display: none;

        }


        .back-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: #ffffff;

            padding: 10px 16px;

            border-radius: 14px;

            font-family: "Cairo", sans-serif;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 16px;

            box-shadow:
                0 8px 18px
                rgba(125, 20, 36, .20);

            transition: .22s;

        }


        .back-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 24px
                rgba(125, 20, 36, .27);

        }


        .stage-card {

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #fff8f8
                );

            border: 1px solid var(--line);

            border-radius: 20px;

            padding: 19px 20px;

            margin-bottom: 18px;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 9px 25px
                rgba(42, 20, 24, .07);

        }


        .stage-card::before {

            content: "";

            position: absolute;

            top: 0;

            right: 0;

            left: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--maroon-dark),
                    var(--maroon-light),
                    var(--maroon-dark)
                );

        }


        .stage-info {

            display: flex;

            flex-direction: column;

            gap: 2px;

        }


        .stage-label {

            color: var(--muted);

            font-size: 12px;

        }


        .stage-name {

            color: var(--maroon-dark);

            font-family: "Amiri", serif;

            font-size: 23px;

            font-weight: 700;

        }


        /* =====================================
           GIFTS
        ===================================== */

        .gifts-list {

            display: flex;

            flex-direction: column;

            gap: 11px;

        }


        .gift-card {

            background: #ffffff;

            border: 1px solid var(--line);

            border-radius: 17px;

            padding: 13px;

            display: flex;

            align-items: center;

            gap: 12px;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 6px 18px
                rgba(40, 20, 25, .06);

            animation:
                fadeUp .35s ease both;

        }


        .gift-card::before {

            content: "";

            position: absolute;

            right: 0;

            top: 0;

            bottom: 0;

            width: 3px;

            background:
                var(--maroon);

        }


        .gift-number {

            width: 29px;

            height: 29px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                var(--soft-maroon);

            color: var(--maroon-dark);

            border: 1px solid #e7cdd1;

            font-size: 11px;

            font-weight: 800;

        }


        .gift-img,
        .gift-icon {

            width: 62px;

            height: 62px;

            flex-shrink: 0;

            border-radius: 14px;

            object-fit: cover;

            border: 1px solid #e4d0d3;

            background: #fffafa;

        }


        .gift-icon {

            display: flex;

            align-items: center;

            justify-content: center;

            color: var(--maroon);

            font-size: 21px;

            background:
                linear-gradient(
                    145deg,
                    #fff5f6,
                    #fffafa
                );

        }


        .gift-details {

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 3px;

        }


        .gift-name {

            color: var(--ink);

            font-family: "Amiri", serif;

            font-size: 18px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .gift-date,
        .gift-msg {

            color: var(--muted);

            font-size: 10px;

            display: flex;

            align-items: center;

            gap: 5px;

        }


        .gift-date i {

            color: var(--maroon);

        }


        .gift-msg {

            color: var(--maroon);

            font-weight: 600;

        }


        .gift-msg i {

            font-size: 9px;

        }


        .gift-points {

            min-width: 54px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 7px 8px;

            border-radius: 12px;

            background: #fff8ed;

            border: 1px solid #ead9bd;

            color: #74520e;

            flex-shrink: 0;

        }


        .gift-points i {

            color: var(--gold);

            font-size: 12px;

            margin-bottom: 1px;

        }


        .gift-points span {

            font-size: 14px;

            font-weight: 800;

        }


        .gift-points small {

            color: var(--muted);

            font-size: 9px;

        }


        /* =====================================
           EMPTY / LOADING / ERROR
        ===================================== */

        .empty-box,
        .loading-box,
        .error-box {

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #fffafa
                );

            border: 1px solid var(--line);

            border-radius: 20px;

            padding: 38px 20px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(40, 20, 25, .07);

            margin-top: 12px;

        }


        .empty-icon,
        .error-icon {

            width: 58px;

            height: 58px;

            margin: 0 auto 12px;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: var(--soft-maroon);

            color: var(--maroon);

            border: 1px solid #ead2d6;

            font-size: 23px;

        }


        .loading-icon {

            width: 58px;

            height: 58px;

            margin: 0 auto 12px;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #fff8ed;

            color: var(--gold);

            font-size: 24px;

        }


        .empty-box h3,
        .error-box h3 {

            color: var(--maroon-dark);

            font-family: "Amiri", serif;

            font-size: 20px;

            margin-bottom: 5px;

        }


        .empty-box p,
        .loading-box p,
        .error-box p {

            color: var(--muted);

            font-size: 12px;

            line-height: 1.8;

        }


        .retry-btn {

            margin-top: 15px;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: #ffffff;

            padding: 9px 17px;

            border-radius: 12px;

            font-family: "Cairo", sans-serif;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 16px
                rgba(125, 20, 36, .18);

            transition: .22s;

        }


        .retry-btn:hover {

            transform:
                translateY(-2px);

        }


        /* =====================================
           ANIMATION
        ===================================== */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            body {

                padding:
                    10px
                    9px
                    30px;

            }


            .navbar {

                border-radius: 20px;

                padding:
                    12px;

                gap: 10px;

            }


            .navbar-title {

                font-size: 18px;

                gap: 7px;

            }


            .navbar-title::before {

                width: 34px;

                height: 34px;

                font-size: 18px;

            }


            .navbar-actions {

                gap: 6px;

            }


            .nav-home-btn,
            .logout-btn-nav {

                min-height: 38px;

                padding:
                    8px 10px;

                border-radius: 12px;

                font-size: 11px;

            }


            .main-content {

                margin-top: 12px;

                border-radius: 23px;

                padding:
                    24px 15px
                    28px;

            }


            .page-title {

                font-size: 26px;

            }


            .my-grade-card {

                padding: 13px;

            }


            .servant-card {

                padding: 11px;

            }


            .servant-right {

                gap: 9px;

            }


            .servant-avatar {

                width: 45px;

                height: 45px;

            }


            .servant-name {

                font-size: 16px;

            }


            .gift-count {

                padding:
                    5px 8px;

            }


            .arrow-box {

                width: 29px;

                height: 29px;

            }


            .gift-card {

                gap: 8px;

                padding: 10px;

            }


            .gift-number {

                display: none;

            }


            .gift-img,
            .gift-icon {

                width: 54px;

                height: 54px;

            }


            .gift-name {

                font-size: 16px;

            }


            .gift-points {

                min-width: 48px;

                padding:
                    6px;

            }

        }


        @media (max-width: 420px) {

            .navbar-title {

                font-size: 16px;

            }


            .navbar-title::before {

                width: 31px;

                height: 31px;

                font-size: 16px;

            }


            .nav-home-btn,
            .logout-btn-nav {

                padding:
                    7px 8px;

            }


            .nav-home-btn i,
            .logout-btn-nav i {

                margin: 0;

            }


            .servant-left {

                gap: 4px;

            }


            .gift-count span {

                font-size: 11px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="navbar-title">
            متجر الكنيسة
        </div>


        <div class="navbar-actions">

            <a
                href="home.html"
                class="nav-home-btn"
            >

                <i class="fas fa-home"></i>

                الرئيسية

            </a>


            <button
                class="logout-btn-nav"
                id="logoutBtn"
            >

                <i class="fas fa-sign-out-alt"></i>

                خروج

            </button>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main-content">


        <!-- =====================
             SERVANTS
        ====================== -->

        <div id="servantsSection">


            <h1
                class="page-title"
                id="pageTitle"
            >
                الهدايا المستلمة
            </h1>


            <!-- GRADE -->

            <div class="my-grade-card">

                <div class="my-grade-icon">

                    <i class="fas fa-book-open"></i>

                </div>


                <div class="my-grade-info">

                    <div class="label">
                        صفّك الدراسي
                    </div>


                    <div
                        class="value"
                        id="myGradeName"
                    >
                        جاري التحميل...
                    </div>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="ابحث باسم المخدوم في صفّك..."
                >

                <i class="fas fa-search"></i>

            </div>


            <!-- SECTION HEADER -->

            <div class="section-header">

                <h2 id="sectionTitle">
                    مخدومين صفّي
                </h2>


                <span
                    class="servants-count-badge"
                    id="servantsCount"
                >
                    0
                </span>

            </div>


            <!-- SERVANTS -->

            <div
                class="servants-list"
                id="servantsContainer"
            ></div>


        </div>


        <!-- =====================
             DETAILS
        ====================== -->

        <div
            id="detailsSection"
            class="details-section"
        >


            <!-- BACK -->

            <button
                class="back-btn"
                onclick="backToServants()"
            >

                <i class="fas fa-arrow-right"></i>

                العودة للقائمة

            </button>


            <!-- SELECTED SERVANT -->

            <div class="stage-card">

                <div class="stage-info">

                    <div class="stage-label">
                        سجل هدايا المخدوم
                    </div>


                    <div
                        class="stage-name"
                        id="selectedName"
                    >
                        ...
                    </div>


                    <div
                        class="stage-label"
                        id="selectedGrade"
                        style="margin-top: 4px;"
                    >
                        ...
                    </div>

                </div>

            </div>


            <!-- GIFTS HEADER -->

            <div class="section-header">

                <h2>
                    الهدايا المستلمة وتفاصيلها
                </h2>


                <span
                    class="servants-count-badge"
                    id="selectedGiftCount"
                >
                    0
                </span>

            </div>


            <!-- GIFTS -->

            <div
                class="gifts-list"
                id="giftsContainer"
            ></div>


        </div>


    </main>


</body>

</html>
