<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة هدايا المخدومين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --navy: #061d39;
      --navy-dark: #020c19;
      --maroon: #7d1424;
      --maroon-dark: #5d101c;
      --maroon-light: #a51f35;
      --gold: #c9a24b;
      --ink: #211918;
      --muted: #817773;
      --line: #eadfe0;
      --soft: #fff7f8;
      --green: #137333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100dvh;
      padding: 15px 12px 30px;
      color: var(--ink);
      font-family: "Tajawal", sans-serif;
      background: radial-gradient(circle at top, #0a2d57 0, var(--navy) 48%, var(--navy-dark) 100%);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar, .page {
      width: min(900px, 100%);
      margin-inline: auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      color: #fff;
      font-weight: 800;
    }
    .topbar-title { display: flex; align-items: center; gap: 9px; }
    .topbar-title i { color: var(--gold); }
    .topbar-actions { display: flex; gap: 7px; }
    .topbar-actions button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      color: var(--maroon);
      background: #fff;
      box-shadow: 0 7px 18px rgb(0 0 0 / 22%);
    }

    .page {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border-radius: 27px;
      background: #fff;
      box-shadow: 0 30px 70px rgb(0 0 0 / 35%);
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--navy), var(--maroon), var(--gold), var(--maroon), var(--navy));
    }
    .page-head { margin-bottom: 20px; text-align: center; }
    .page-icon {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 50%;
      color: #fff;
      font-size: 27px;
      background: linear-gradient(145deg, var(--maroon-light), var(--maroon-dark));
    }
    h1 { color: var(--ink); font: 700 clamp(27px, 5vw, 37px) "Amiri", serif; }
    h1 span { color: var(--maroon); }
    .page-head p { margin-top: 4px; color: var(--muted); font-size: 14px; }

    .grade-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      padding: 14px 16px;
      border: 1px solid #eadbdd;
      border-radius: 16px;
      background: linear-gradient(135deg, #f8f0f1, #fff);
    }
    .grade-card i {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: var(--maroon);
    }
    .grade-card small { display: block; color: var(--muted); font-size: 11px; }
    .grade-card strong { color: var(--maroon-dark); font: 700 21px "Amiri", serif; }

    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-wrap i {
      position: absolute;
      top: 50%;
      right: 16px;
      color: var(--maroon);
      transform: translateY(-50%);
    }
    .search-wrap input {
      width: 100%;
      height: 49px;
      padding: 9px 44px 9px 14px;
      outline: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fafafa;
    }
    .search-wrap input:focus {
      border-color: var(--maroon);
      box-shadow: 0 0 0 4px rgb(125 20 36 / 8%);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 2px 12px;
    }
    .section-head h2 { font: 700 23px "Amiri", serif; }
    .count {
      min-width: 34px;
      padding: 6px 10px;
      border: 1px solid #e7cdd1;
      border-radius: 20px;
      color: var(--maroon-dark);
      text-align: center;
      font-weight: 800;
      background: var(--soft);
    }

    .servants-list { display: grid; gap: 10px; }
    .servant-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 18px rgb(40 20 25 / 6%);
      transition: .2s ease;
    }
    .servant-card:hover {
      border-color: #dcbec3;
      box-shadow: 0 12px 28px rgb(80 20 30 / 11%);
      transform: translateY(-2px);
    }
    .servant-info { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(145deg, var(--maroon-light), var(--maroon-dark));
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .servant-text { min-width: 0; }
    .servant-text h3 {
      overflow: hidden;
      font: 700 20px "Amiri", serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .servant-text p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .gift-count {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid #ead9bd;
      border-radius: 11px;
      color: #74520e;
      font-size: 12px;
      font-weight: 800;
      background: #fff8ed;
    }

    .details { display: none; }
    .back-btn, .refresh-btn {
      min-height: 43px;
      padding: 0 14px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      font-weight: 800;
      background: var(--maroon);
    }
    .back-btn:hover, .refresh-btn:hover { background: var(--maroon-dark); }
    .details-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 15px 0;
      padding: 15px;
      border: 1px solid #eadbdd;
      border-radius: 16px;
      background: linear-gradient(135deg, #f8f0f1, #fff);
    }
    .details-head h2 { font: 700 24px "Amiri", serif; }
    .details-head p { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .subsection { margin-top: 17px; }
    .subsection h3 {
      margin-bottom: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--line);
      color: var(--maroon-dark);
      font: 700 21px "Amiri", serif;
    }
    .gift-list { display: grid; gap: 10px; }
    .gift-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 5px 16px rgb(40 20 25 / 5%);
    }
    .gift-image, .gift-icon {
      width: 62px;
      height: 62px;
      min-width: 62px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #e4d0d3;
      border-radius: 13px;
      color: var(--maroon);
      font-size: 22px;
      background: #fff7f8;
    }
    .gift-image { object-fit: cover; }
    .gift-content { flex: 1; min-width: 0; }
    .gift-content h4 {
      overflow: hidden;
      font: 700 19px "Amiri", serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gift-content p { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .gift-points {
      min-width: 52px;
      padding: 7px 6px;
      border: 1px solid #ead9bd;
      border-radius: 10px;
      color: #74520e;
      text-align: center;
      font-weight: 800;
      background: #fff8ed;
    }
    .gift-points small { display: block; color: var(--muted); font-size: 9px; }
    .empty, .loading, .error {
      padding: 32px 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
      background: #fffafa;
    }
    .empty i, .loading i, .error i { display: block; margin-bottom: 9px; font-size: 28px; color: var(--maroon); }
    .error { color: #8b2630; border-color: #efc2c5; }
    .error i { color: #b42318; }

    @media (max-width: 540px) {
      body { padding: 9px 8px 22px; }
      .page { padding: 23px 14px; border-radius: 22px; }
      .details-head { align-items: stretch; flex-direction: column; }
      .details-head button { width: 100%; }
      .servant-text h3 { font-size: 18px; }
      .gift-content h4 { font-size: 17px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-title">
      <i class="fas fa-gift"></i>
       <span>إدارة هدايا المخدومين</span>
    </div>
    <div class="topbar-actions">
      <button id="homeBtn" type="button" title="الرئيسية"><i class="fas fa-house"></i></button>
      <button id="reloadBtn" type="button" title="تحديث"><i class="fas fa-rotate"></i></button>
    </div>
  </header>

  <main class="page">
    <header class="page-head">
      <div class="page-icon"><i class="fas fa-gifts"></i></div>
      <h1>إدارة هدايا <span>المخدومين</span></h1>
      <p>اختر مخدومًا من صفك لعرض الهدايا التي استلمها هو فقط</p>
    </header>

    <section id="listView">
      <div class="grade-card">
        <i class="fas fa-book-open"></i>
        <div>
          <small>صف المشرف</small>
          <strong id="gradeName">جاري التحميل...</strong>
        </div>
      </div>

      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input id="searchInput" type="search" placeholder="ابحث عن مخدوم في صفك..." autocomplete="off">
      </div>

      <div class="section-head">
        <h2>مخدومو صفّي</h2>
        <span id="servantCount" class="count">0</span>
      </div>
      <div id="servantsList" class="servants-list">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i>جاري تحميل مخدومي صفك...</div>
      </div>
    </section>

    <section id="detailsView" class="details">
      <button id="backBtn" class="back-btn" type="button">
        <i class="fas fa-arrow-right"></i> العودة إلى المخدومين
      </button>

      <div class="details-head">
        <div>
          <h2 id="selectedName">—</h2>
          <p id="selectedClass">—</p>
        </div>
        <button id="refreshDetailsBtn" class="refresh-btn" type="button">
          <i class="fas fa-rotate"></i> تحديث الهدايا
        </button>
      </div>

      <div class="subsection">
        <h3><i class="fas fa-gift"></i> الهدايا التي استلمها هذا المخدوم</h3>
        <div id="receivedGifts" class="gift-list"></div>
      </div>

    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQPZ5p8VHykUWE",
      authDomain: "st-mina-c01ec.firebaseapp.com",
      databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
      projectId: "st-mina-c01ec",
      storageBucket: "st-mina-c01ec.firebasestorage.app",
      messagingSenderId: "792349150559",
      appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
      measurementId: "G-XZGSBG05KR"
    };

    const db = getFirestore(initializeApp(firebaseConfig));
    const $ = (selector) => document.querySelector(selector);

    let myGrade = "";
    let allServants = [];
    let allNotifications = [];
    let allGifts = [];
    let selectedServant = null;

    function normalize(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/ـ/g, "")
        .replace(/[\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF]/g, " ")
        .trim()
        .replace(/\s+/g, " ")
        .toLocaleLowerCase("ar-EG");
    }

    function clean(value) {
      return String(value ?? "").trim().replace(/\s+/g, " ");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function firstValue(data, fields, fallback = "") {
      for (const field of fields) {
        if (clean(data?.[field])) return clean(data[field]);
      }
      return fallback;
    }

    function servantName(servant) {
      return firstValue(servant, ["fullName", "name", "username", "userName"], servant.id);
    }

    function servantUsername(servant) {
      return firstValue(servant, ["username", "userName", "usernameLower"], "");
    }

    function servantGrade(servant) {
      return firstValue(servant, ["grade", "className", "servantGrade", "class"], "");
    }

    function servantStage(servant) {
      return firstValue(servant, ["stage", "stageName", "servantStage"], "");
    }

    function dateValue(value) {
      if (!value) return 0;
      if (typeof value?.toDate === "function") return value.toDate().getTime();
      if (typeof value === "object" && value.seconds !== undefined) {
        return Number(value.seconds) * 1000;
      }
      const result = new Date(value).getTime();
      return Number.isNaN(result) ? 0 : result;
    }

    function formatDate(value) {
      const timestamp = dateValue(value);
      return timestamp
        ? new Date(timestamp).toLocaleString("ar-EG", {
            year: "numeric", month: "long", day: "numeric",
            hour: "2-digit", minute: "2-digit"
          })
        : "تاريخ غير محدد";
    }

    function showBox(container, type, message) {
      const icon = type === "error" ? "fa-triangle-exclamation" : "fa-gift";
      container.innerHTML = `
        <div class="${type}">
          <i class="fas ${icon}"></i>
          ${escapeHtml(message)}
        </div>
      `;
    }

    function getLoginIdentifiers() {
      const params = new URLSearchParams(location.search);
      const values = [
        params.get("user"),
        params.get("admin"),
        localStorage.getItem("userDocId"),
        localStorage.getItem("currentUsername"),
        localStorage.getItem("username"),
        localStorage.getItem("adminUsername"),
        localStorage.getItem("adminDocId")
      ];

      const currentUser = localStorage.getItem("currentUser");
      if (currentUser) {
        try {
          const parsed = JSON.parse(currentUser);
          values.push(
            parsed?.id, parsed?.docId, parsed?.userId, parsed?.username,
            parsed?.userName, parsed?.email, parsed?.phone
          );
        } catch {
          values.push(currentUser);
        }
      }

      return [...new Set(values.map(normalize).filter(Boolean))];
    }

    async function getMyGrade() {
      const savedGrade = clean(localStorage.getItem("servantGrade"));
      if (savedGrade) return savedGrade;

      const identifiers = getLoginIdentifiers();
      if (!identifiers.length) return "";

      const snapshot = await getDocs(collection(db, "admin"));
      let admin = null;
      snapshot.forEach((item) => {
        if (admin) return;
        const data = item.data();
        const values = [
          item.id, data.username, data.usernameLower, data.fullName,
          data.name, data.servantNumber, data.adminId
        ].map(normalize).filter(Boolean);
        if (identifiers.some((identifier) => values.includes(identifier))) {
          admin = data;
        }
      });

      return firstValue(admin, ["servantGrade", "grade", "class"], "");
    }

    async function loadData() {
      showBox($("#servantsList"), "loading", "جاري تحميل مخدومي صفك...");

      try {
        myGrade = await getMyGrade();
        $("#gradeName").textContent = myGrade || "غير محدد";

        if (!myGrade) {
          showBox($("#servantsList"), "error", "لم يتم تحديد صف المشرف.");
          return;
        }

        const [usersSnapshot, notificationsSnapshot, giftsSnapshot] = await Promise.all([
          getDocs(collection(db, "users")),
          getDocs(collection(db, "notifications")),
          getDocs(collection(db, "gifts"))
        ]);

        allServants = usersSnapshot.docs
          .map((item) => ({ id: item.id, ...item.data() }))
          .filter((user) => normalize(servantGrade(user)) === normalize(myGrade));

        allNotifications = notificationsSnapshot.docs.map((item) => ({
          id: item.id,
          ...item.data()
        }));

        allGifts = giftsSnapshot.docs.map((item) => ({
          id: item.id,
          ...item.data()
        }));

        renderServants();
      } catch (error) {
        console.error("Firebase error:", error);
        showBox($("#servantsList"), "error", error?.code === "permission-denied"
          ? "ليس لديك صلاحية قراءة users أو notifications أو gifts."
          : "حدث خطأ أثناء تحميل البيانات.");
      }
    }

    function receivedFor(servant) {
      const ids = [
        servant.id,
        servant.userId,
        servant.username,
        servantUsername(servant),
        servant.fullName,
        servant.name
      ].map(normalize).filter(Boolean);

      return allNotifications.filter((notification) => {
        /*
         * هذه الصفحة تعرض الهدايا المستلمة فقط.
         * الطلب المرفوض أو غير المسلّم لا يظهر هنا.
         * إذا كان المستند القديم لا يحتوي isDelivered نسمح به
         * حتى لا تختفي البيانات القديمة.
         */
        if (notification.isRejected === true) return false;
        if (
          Object.prototype.hasOwnProperty.call(notification, "isDelivered")
          && notification.isDelivered !== true
        ) {
          return false;
        }

        const notificationIds = [
          notification.userId,
          notification.userDocId,
          notification.uid,
          notification.username,
          notification.userName,
          notification.fullName,
          notification.name
        ].map(normalize).filter(Boolean);

        /* المطابقة الأفضل: المعرّف أو اسم المستخدم أو الاسم الكامل */
        if (ids.some((id) => notificationIds.includes(id))) return true;

        /*
         * احتياط للبيانات القديمة التي حفظت الاسم داخل message فقط.
         * لا نستخدم includes عندما يكون الاسم فارغًا حتى لا تظهر
         * هدايا كل المستخدمين عند اختيار شخص واحد.
         */
        const message = normalize(notification.message);
        const names = [servantName(servant), servantUsername(servant)]
          .map(normalize)
          .filter((name) => name.length >= 2);
        return names.some((name) => message.includes(name));
      });
    }

    function getCatalogGift(notification) {
      const giftId = normalize(notification.giftId);
      const giftName = normalize(notification.giftName);

      return allGifts.find((gift) => {
        const sameId =
          giftId
          && [gift.id, gift.giftId].map(normalize).includes(giftId);

        const sameName =
          giftName
          && normalize(firstValue(gift, ["name", "giftName", "title"], "")) === giftName;

        return sameId || sameName;
      }) || null;
    }

    function renderServants() {
      const term = normalize($("#searchInput").value);
      const visible = allServants
        .filter((servant) => {
          const searchable = [
            servantName(servant), servantUsername(servant),
            servantGrade(servant), servantStage(servant)
          ].map(normalize).join(" ");
          return !term || searchable.includes(term);
        })
        .sort((a, b) => servantName(a).localeCompare(servantName(b), "ar"));

      $("#servantCount").textContent = visible.length;

      if (!visible.length) {
        showBox($("#servantsList"), "empty", "لا يوجد مخدومون في صفك.");
        return;
      }

      $("#servantsList").innerHTML = "";
      visible.forEach((servant) => {
        const received = receivedFor(servant);
        const card = document.createElement("button");
        card.type = "button";
        card.className = "servant-card";
        const image = firstValue(servant, ["image", "photo", "photoBase64"], "");
        card.innerHTML = `
          <div class="servant-info">
            <div class="avatar">
              ${image
                ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(servantName(servant))}">`
                : `<i class="fas fa-user"></i>`}
            </div>
            <div class="servant-text">
              <h3>${escapeHtml(servantName(servant))}</h3>
              <p>${escapeHtml(servantStage(servant) || "مرحلة غير محددة")} • ${escapeHtml(servantGrade(servant))}</p>
            </div>
          </div>
          <span class="gift-count"><i class="fas fa-gift"></i> ${received.length}</span>
        `;
        card.addEventListener("click", () => openServant(servant));
        $("#servantsList").appendChild(card);
      });
    }

    function renderReceived(servant) {
      const container = $("#receivedGifts");
      const gifts = receivedFor(servant).sort((a, b) =>
        dateValue(b.deliveredAt || b.timestamp || b.createdAt)
        - dateValue(a.deliveredAt || a.timestamp || a.createdAt)
      );

      if (!gifts.length) {
        showBox(container, "empty", "لا توجد هدايا مستلمة مسجلة لهذا المخدوم.");
        return;
      }

      container.innerHTML = "";
      gifts.forEach((gift) => {
        const card = document.createElement("article");
        card.className = "gift-card";
        const catalogGift = getCatalogGift(gift);
        const image = firstValue(
          gift,
          ["giftImage", "image", "photo"],
          firstValue(catalogGift, ["image", "giftImage", "photo"], "")
        );
        const name = firstValue(
          gift,
          ["giftName", "title", "name"],
          firstValue(catalogGift, ["name", "giftName", "title"], "هدية")
        );
        const points = Number(
          gift.pointsSpent ?? gift.points ?? catalogGift?.points ?? 0
        ) || 0;
        card.innerHTML = `
          ${image
            ? `<img class="gift-image" src="${escapeHtml(image)}" alt="${escapeHtml(name)}">`
            : `<div class="gift-icon"><i class="fas fa-gift"></i></div>`}
          <div class="gift-content">
            <h4>${escapeHtml(name)}</h4>
            <p><i class="fas fa-calendar"></i> ${escapeHtml(formatDate(gift.deliveredAt || gift.timestamp || gift.createdAt))}</p>
            ${gift.message ? `<p>${escapeHtml(gift.message)}</p>` : ""}
          </div>
          <div class="gift-points"><i class="fas fa-star"></i><br>${points}<small>نقطة</small></div>
        `;
        container.appendChild(card);
      });
    }

    function openServant(servant) {
      selectedServant = servant;
      $("#listView").style.display = "none";
      $("#detailsView").style.display = "block";
      $("#selectedName").textContent = servantName(servant);
      $("#selectedClass").textContent =
        `${servantStage(servant) || "مرحلة غير محددة"} • ${servantGrade(servant) || "صف غير محدد"}`;
      renderReceived(servant);
    }

    function backToList() {
      selectedServant = null;
      $("#detailsView").style.display = "none";
      $("#listView").style.display = "block";
    }

    $("#searchInput").addEventListener("input", renderServants);
    $("#backBtn").addEventListener("click", backToList);
    $("#refreshDetailsBtn").addEventListener("click", () => {
      if (selectedServant) {
        renderReceived(selectedServant);
      }
    });
    $("#reloadBtn").addEventListener("click", loadData);
    $("#homeBtn").addEventListener("click", () => { location.href = "home.html"; });

    loadData();
  </script>
</body>
</html>
