<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول لوحة تحكم الأدمن</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --navy-deep: #041a36;
            --navy-mid: #062348;
            --navy-edge: #000b18;

            --maroon-dark: #5d101c;
            --maroon: #7d1424;
            --maroon-light: #9b1c30;

            --ink: #1f1715;
            --muted: #8a817c;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    var(--navy-mid) 0%,
                    var(--navy-deep) 45%,
                    var(--navy-edge) 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Tajawal', sans-serif;
        }

        /* =========================
           الكارت
        ========================= */

        .form-card {
            width: 100%;
            max-width: 400px;

            background: #ffffff;

            border-radius: 30px;

            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);

            position: relative;

            overflow: hidden;
        }

        .drag-handle {
            width: 100%;

            display: flex;
            justify-content: center;

            padding-top: 12px;
            padding-bottom: 4px;

            background: linear-gradient(180deg, #fbeef0 0%, #ffffff 60%);
        }

        .drag-handle span {
            width: 44px;
            height: 4px;
            border-radius: 4px;
            background: #e3c9cd;
        }

        .card-body {
            padding: 10px 32px 34px;

            text-align: center;
        }

        /* =========================
           اللوجو / الصليب
        ========================= */

        .logo-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-top: 10px;
            margin-bottom: 16px;
        }

        .church-logo {
            width: 74px;
            height: 74px;

            border-radius: 50%;

            background: linear-gradient(150deg, var(--maroon-light) 0%, var(--maroon-dark) 100%);

            display: flex;
            justify-content: center;
            align-items: center;

            color: #ffffff;

            font-size: 34px;

            box-shadow: 0 10px 22px rgba(125, 20, 36, 0.35);
        }

        /* =========================
           العنوان
        ========================= */

        h2 {
            color: var(--ink);

            font-family: 'Amiri', serif;

            font-size: 25px;

            font-weight: 700;

            margin-bottom: 6px;

            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 28px;
        }

        /* =========================
           زر جوجل
        ========================= */

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            width: 100%;

            padding: 14px;

            border-radius: 14px;

            background: #ffffff;

            border: 1.5px solid #e1d8d0;

            color: var(--ink);

            font-family: 'Tajawal', sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);

            transition: all 0.25s ease;

            margin-bottom: 16px;
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .btn-google:hover {
            border-color: var(--maroon);
            box-shadow: 0 8px 18px rgba(125, 20, 36, 0.12);
        }

        .btn-google:active {
            transform: translateY(1px);
        }

        /* =========================
           فاصل "أو"
        ========================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 18px 0;

            color: var(--muted);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee1dd;
        }

        /* =========================
           زر لدي حساب
        ========================= */

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(135deg, var(--maroon-light) 0%, var(--maroon-dark) 100%);

            color: #ffffff;

            font-family: 'Tajawal', sans-serif;

            font-size: 16px;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition: all 0.25s ease;

            box-shadow: 0 10px 22px rgba(125, 20, 36, 0.35);
        }

        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(125, 20, 36, 0.45);
        }

        .btn-action:active {
            transform: translateY(1px);
            box-shadow: 0 5px 12px rgba(125, 20, 36, 0.25);
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 500px) {

            .card-body {
                padding: 8px 22px 28px;
            }

            h2 {
                font-size: 23px;
            }

            .church-logo {
                width: 66px;
                height: 66px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="form-card">

        <div class="drag-handle">
            <span></span>
        </div>

        <div class="card-body">

            <div class="logo-container">
                <div class="church-logo">
                    <i class="fas fa-user-shield"></i>
                </div>
            </div>

            <div class="subtitle">تسجيل الدخول الخاص بالمسؤولين</div>

            <!-- زر جوجل -->
            <button type="button" class="btn-google" id="googleLoginBtn" title="تسجيل بجوجل">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                <span>الدخول باستخدام جوجل</span>
            </button>

            <div class="divider">أو</div>

            <!-- زر لدي حساب في الأسفل -->
            <a href="sign_c.html" class="btn-action">
                <span>لدي حساب بالفعل</span>
            </a>

        </div>

    </div>

    <!-- سكربت Firebase وتسجيل الدخول بجوجل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
            measurementId: "G-XZGSBG05KR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                // فتح نافذة اختيار الحسابات من جوجل
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // حفظ الحساب المختار في Realtime Database تحت كولكشن google_accounts
                await push(ref(db, 'google_accounts'), {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName,
                    loginTime: new Date().toISOString()
                });

                console.log('Google account saved successfully:', user.email);

                // الانتقال الفوري لصفحة sign-cc.html
                window.location.href = 'sign-cc.html';

            } catch (error) {
                console.error('Login Error:', error.message);
                alert('حدث خطأ أثناء تسجيل الدخول: ' + error.message);
            }
        });
    </script>

</body>
</html>
