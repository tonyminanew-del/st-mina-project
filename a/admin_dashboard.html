```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حساب الأدمن</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --navy-deep: #041a36;
            --navy-mid: #062348;
            --navy-edge: #000b18;

            --maroon-dark: #5d101c;
            --maroon: #7d1424;
            --maroon-light: #9b1c30;

            --ink: #1f1715;
            --muted: #8a817c;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    var(--navy-mid) 0%,
                    var(--navy-deep) 45%,
                    var(--navy-edge) 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Tajawal', sans-serif;
        }

        /* الكارت */

        .form-card {
            width: 100%;
            max-width: 400px;

            background: #ffffff;

            border-radius: 30px;

            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);

            overflow: hidden;
        }

        .drag-handle {
            width: 100%;

            display: flex;
            justify-content: center;

            padding-top: 12px;
            padding-bottom: 4px;

            background:
                linear-gradient(
                    180deg,
                    #fbeef0 0%,
                    #ffffff 60%
                );
        }

        .drag-handle span {
            width: 44px;
            height: 4px;

            border-radius: 4px;

            background: #e3c9cd;
        }

        .card-body {
            padding: 10px 32px 34px;

            text-align: center;
        }

        /* اللوجو */

        .logo-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-top: 10px;
            margin-bottom: 16px;
        }

        .church-logo {
            width: 74px;
            height: 74px;

            border-radius: 50%;

            background:
                linear-gradient(
                    150deg,
                    var(--maroon-light) 0%,
                    var(--maroon-dark) 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            color: #ffffff;

            font-size: 34px;

            box-shadow:
                0 10px 22px rgba(125, 20, 36, 0.35);
        }

        /* العنوان */

        h2 {
            color: var(--ink);

            font-family: 'Amiri', serif;

            font-size: 25px;

            font-weight: 700;

            margin-bottom: 6px;

            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 28px;
        }

        /* الأزرار */

        .buttons {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        .btn-action {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            width: 100%;

            padding: 15px;

            border-radius: 14px;

            font-family: 'Tajawal', sans-serif;

            font-size: 16px;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        /* إنشاء حساب */

        .btn-create {
            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light) 0%,
                    var(--maroon-dark) 100%
                );

            color: #ffffff;

            box-shadow:
                0 10px 22px rgba(125, 20, 36, 0.35);
        }

        .btn-create:hover {
            transform: translateY(-1px);

            box-shadow:
                0 12px 26px rgba(125, 20, 36, 0.45);
        }

        /* لدي حساب */

        .btn-login {
            background: #ffffff;

            color: var(--maroon);

            border: 1.5px solid #e1d8d0;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.06);
        }

        .btn-login:hover {
            border-color: var(--maroon);

            background: #fff8f9;

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(125, 20, 36, 0.12);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        /* Responsive */

        @media (max-width: 500px) {

            .card-body {
                padding: 8px 22px 28px;
            }

            h2 {
                font-size: 23px;
            }

            .church-logo {
                width: 66px;
                height: 66px;

                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">

        <div class="drag-handle">
            <span></span>
        </div>

        <div class="card-body">

            <!-- اللوجو -->
            <div class="logo-container">

                <div class="church-logo">

                    <i class="fas fa-user-shield"></i>

                </div>

            </div>


            <h2>حساب الأدمن</h2>

            <div class="subtitle">
                اختر الطريقة المناسبة للمتابعة
            </div>


            <!-- الأزرار -->

            <div class="buttons">

                <!-- إنشاء حساب -->
                <a href="sign_c.html"
                    class="btn-action btn-create">

                    <i class="fas fa-user-plus"></i>

                    <span>
                        إنشاء حساب
                    </span>

                </a>


                <!-- لدي حساب بالفعل -->
                <a href="sign_c.html"
                    class="btn-action btn-login">

                    <i class="fas fa-right-to-bracket"></i>

                    <span>
                        لدي حساب بالفعل
                    </span>

                </a>

            </div>

        </div>

    </div>

</body>

</html>
```
