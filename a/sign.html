<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول لوحة تحكم الأدمن</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --navy-deep: #041a36;
            --navy-mid: #062348;
            --navy-edge: #000b18;

            --maroon-dark: #5d101c;
            --maroon: #7d1424;
            --maroon-light: #9b1c30;

            --ink: #1f1715;
            --muted: #8a817c;
            --field-border: #e1d8d0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    var(--navy-mid) 0%,
                    var(--navy-deep) 45%,
                    var(--navy-edge) 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Tajawal', sans-serif;
        }

        /* =========================
           الكارت
        ========================= */

        .form-card {
            width: 100%;
            max-width: 400px;

            background: #ffffff;

            border-radius: 30px;

            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);

            position: relative;

            overflow: hidden;
        }

        .drag-handle {
            width: 100%;

            display: flex;
            justify-content: center;

            padding-top: 12px;
            padding-bottom: 4px;

            background: linear-gradient(180deg, #fbeef0 0%, #ffffff 60%);
        }

        .drag-handle span {
            width: 44px;
            height: 4px;
            border-radius: 4px;
            background: #e3c9cd;
        }

        .card-body {
            padding: 10px 32px 34px;

            text-align: center;
        }

        /* =========================
           اللوجو
        ========================= */

        .logo-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-top: 10px;
            margin-bottom: 16px;
        }

        .church-logo {
            width: 74px;
            height: 74px;

            border-radius: 50%;

            background: linear-gradient(150deg, var(--maroon-light) 0%, var(--maroon-dark) 100%);

            display: flex;
            justify-content: center;
            align-items: center;

            color: #ffffff;

            font-size: 34px;

            box-shadow: 0 10px 22px rgba(125, 20, 36, 0.35);
        }

        /* =========================
           العنوان
        ========================= */

        h2 {
            color: var(--ink);

            font-family: 'Amiri', serif;

            font-size: 25px;

            font-weight: 700;

            margin-bottom: 6px;

            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 26px;
        }

        /* =========================
           مجموعة الإدخال
        ========================= */

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        label {
            display: block;

            color: #6b625c;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 6px;
        }

        .field-wrap {
            position: relative;
        }

        .field-wrap i.field-icon {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);

            color: #b9afa8;
            font-size: 15px;

            pointer-events: none;
        }

        .field-wrap i.field-toggle {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);

            color: #b9afa8;
            font-size: 15px;

            cursor: pointer;
        }

        .input-field {
            width: 100%;

            padding: 13px 42px 13px 42px;

            background: #faf8f7;

            border: 1.5px solid var(--field-border);

            border-radius: 13px;

            color: var(--ink);

            font-size: 15px;

            font-family: 'Tajawal', sans-serif;

            direction: ltr;
            text-align: left;

            outline: none;

            transition: all 0.25s ease;
        }

        .input-field::placeholder {
            color: #b9afa8;
        }

        .input-field:focus {
            border-color: var(--maroon);

            background: #ffffff;

            box-shadow: 0 0 0 3px rgba(125, 20, 36, 0.10);
        }

        .input-field.error {
            border-color: #e11d48;
        }

        /* =========================
           زر الدخول
        ========================= */

        .btn-login {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;

            padding: 15px;

            margin-top: 6px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(135deg, var(--maroon-light) 0%, var(--maroon-dark) 100%);

            color: #ffffff;

            font-family: 'Tajawal', sans-serif;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.25s ease;

            box-shadow: 0 10px 22px rgba(125, 20, 36, 0.35);
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(125, 20, 36, 0.45);
        }

        .btn-login:active {
            transform: translateY(1px);
            box-shadow: 0 5px 12px rgba(125, 20, 36, 0.25);
        }

        /* =========================
           رسالة الخطأ
        ========================= */

        .error-msg {
            color: #9f1239;
            font-size: 13px;
            font-weight: 700;
            margin-top: 14px;
            display: none;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 500px) {

            .card-body {
                padding: 8px 22px 28px;
            }

            h2 {
                font-size: 23px;
            }

            .church-logo {
                width: 66px;
                height: 66px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="form-card">

        <div class="drag-handle">
            <span></span>
        </div>

        <div class="card-body">

            <div class="logo-container">
                <div class="church-logo">
                    <i class="fas fa-user-shield"></i>
                </div>
            </div>

            <h2>لوحة تحكم الأدمن</h2>
            <div class="subtitle">تسجيل الدخول الخاص بالمسؤولين</div>

            <div class="input-group">
                <label for="adminPassword">أدخل كلمة مرور الآدمن (بالإنجليزية)</label>

                <div class="field-wrap">
                    <input type="password" id="adminPassword" class="input-field" placeholder="Enter Password" autocomplete="off">
                    <i class="fas fa-lock field-icon"></i>
                    <i class="fas fa-eye field-toggle" id="toggleAdminPasswordIcon" onclick="toggleAdminPassword()"></i>
                </div>
            </div>

            <button type="button" class="btn-login" id="adminLoginBtn">
                <span>دخول لوحة التحكم</span>
            </button>

            <p id="errorText" class="error-msg">كلمة المرور غير صحيحة، حاول مرة أخرى!</p>

        </div>

    </div>

    <script>
        const adminPasswordInput = document.getElementById('adminPassword');
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const errorText = document.getElementById('errorText');
        const toggleAdminPasswordIcon = document.getElementById('toggleAdminPasswordIcon');

        function toggleAdminPassword() {
            if (adminPasswordInput.type === 'password') {
                adminPasswordInput.type = 'text';
                toggleAdminPasswordIcon.classList.remove('fa-eye');
                toggleAdminPasswordIcon.classList.add('fa-eye-slash');
            } else {
                adminPasswordInput.type = 'password';
                toggleAdminPasswordIcon.classList.remove('fa-eye-slash');
                toggleAdminPasswordIcon.classList.add('fa-eye');
            }
        }

        adminLoginBtn.addEventListener('click', () => {
            const enteredPassword = adminPasswordInput.value.trim();

            if (enteredPassword === "stmina") {
                errorText.style.display = "none";
                adminPasswordInput.classList.remove('error');
                alert("تم تسجيل الدخول بنجاح يا آدمن! 🔓");
                // الانتقال لصفحة الآدمن الخاصة بك (يمكنك تغيير اسم الصفحة حسب رغبتك)
                window.location.href = 'admin_dashboard.html';
            } else {
                errorText.style.display = "block";
                adminPasswordInput.classList.add('error');
            }
        });

        // السماح بالدخول عبر الضغط على زر Enter من لوحة المفاتيح
        adminPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                adminLoginBtn.click();
            }
        });
    </script>

</body>
</html>
