<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - متجر الكنيسة</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Cairo:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
            measurementId: "G-XZGSBG05KR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", () => {
            const loginForm = document.getElementById("loginForm");
            const togglePassword = document.getElementById("togglePassword");
            const passwordInput = document.getElementById("password");

            // إظهار/إخفاء كلمة المرور
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener("click", () => {
                    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                    passwordInput.setAttribute("type", type);
                    togglePassword.classList.toggle("fa-eye");
                    togglePassword.classList.toggle("fa-eye-slash");
                });
            }

            // عملية تسجيل الدخول وتخزين البيانات للـ LocalStorage
            if (loginForm) {
                loginForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    
                    const usernameInput = document.getElementById("username").value.trim();
                    const passwordVal = passwordInput.value.trim();
                    const errorMsg = document.getElementById("errorMsg");

                    if (!usernameInput || !passwordVal) {
                        showError("يرجى إدخال اسم المستخدم وكلمة المرور");
                        return;
                    }

                    showLoading(true);
                    errorMsg.style.display = "none";

                    try {
                        const adminRef = collection(db, "admin");
                        const querySnapshot = await getDocs(adminRef);
                        let foundUser = null;

                        querySnapshot.forEach(docSnap => {
                            const data = docSnap.data();
                            const uName = String(data.username || "").trim();
                            const pass = String(data.password || "").trim();

                            if ((uName === usernameInput || docSnap.id === usernameInput) && pass === passwordVal) {
                                foundUser = { id: docSnap.id, ...data };
                            }
                        });

                        if (foundUser) {
                            // حفظ بيانات المستخدم في LocalStorage لكي تستخدمها صفحة home.html
                            localStorage.setItem("currentUser", JSON.stringify(foundUser));
                            localStorage.setItem("adminData", JSON.stringify(foundUser));
                            localStorage.setItem("isLoggedIn", "true");

                            // الانتقال لصفحة الرئيسية
                            window.location.href = "home.html";
                        } else {
                            showError("اسم المستخدم أو كلمة المرور غير صحيحة.");
                            showLoading(false);
                        }

                    } catch (error) {
                        console.error("Login Error:", error);
                        showError("حدث خطأ في الاتصال بقاعدة البيانات. حاول مرة أخرى.");
                        showLoading(false);
                    }
                });
            }
        });

        function showError(msg) {
            const errorDiv = document.getElementById("errorMsg");
            errorDiv.textContent = msg;
            errorDiv.style.display = "block";
        }

        function showLoading(isLoading) {
            const btnText = document.getElementById("btnText");
            const btnLoader = document.getElementById("btnLoader");
            const submitBtn = document.getElementById("submitBtn");

            if (isLoading) {
                btnText.style.display = "none";
                btnLoader.style.display = "inline-block";
                submitBtn.disabled = true;
            } else {
                btnText.style.display = "inline-block";
                btnLoader.style.display = "none";
                submitBtn.disabled = false;
            }
        }
    </script>

    <style>
        :root {
            --wine-900: #4a0e16;
            --wine-800: #6b1420;
            --wine-700: #7c1b28;
            --gold: #c9a04d;
            --gold-light: #e6c878;
            --card: #ffffff;
            --ink: #2a2320;
            --ink-soft: #6b625c;
            --line: #e9dfd0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #000000 0%, #001b3d 45%, #000000 100%);
            font-family: "Cairo", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 28px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .logo-container {
            width: 75px;
            height: 75px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-title {
            color: var(--ink);
            font-family: "Amiri", serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }

        .login-subtitle {
            color: var(--ink-soft);
            font-size: 13px;
            margin-bottom: 22px;
            text-align: center;
        }

        .alert-box {
            background: #eef6fd;
            border: 1px solid #cce3fd;
            color: #0c5460;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 22px;
        }

        .alert-box i {
            color: #17a2b8;
            font-size: 16px;
            flex-shrink: 0;
        }

        .form-group {
            width: 100%;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            color: var(--ink-soft);
            font-size: 13px;
            font-weight: 600;
            text-align: right;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .form-control {
            width: 100%;
            padding: 13px 16px;
            background: #fdfdfd;
            border: 1.5px solid #e2d8cd;
            border-radius: 12px;
            font-family: "Cairo", sans-serif;
            font-size: 14px;
            color: var(--ink);
            outline: none;
            transition: 0.25s;
            text-align: right;
        }

        .form-control:focus {
            border-color: var(--wine-800);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(107, 20, 32, 0.1);
        }

        .password-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #b5aca6;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .password-toggle:hover {
            color: var(--wine-800);
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            width: 100%;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            background: var(--wine-800);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-family: "Cairo", sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(107, 20, 32, 0.3);
        }

        .submit-btn:hover {
            background: var(--wine-900);
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-container">
            <svg viewBox="0 0 100 100" width="75" height="75">
                <circle cx="50" cy="50" r="48" fill="#6b1420"/>
                <path d="M50 20 L50 80 M30 45 L70 45" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
            </svg>
        </div>

        <h1 class="login-title">تسجيل الدخول</h1>
        <p class="login-subtitle">بوابة خادم مدارس الأحد</p>

        <div class="alert-box">
            <i class="fas fa-info-circle"></i>
            <span>هذه البوابة مخصصة لخدام مدارس الأحد فقط</span>
        </div>

        <div id="errorMsg" class="error-message"></div>

        <form id="loginForm" style="width: 100%;">
            <div class="form-group">
                <label class="form-label">اسم المستخدم (User Name)</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-control" placeholder="ادخل اسم المستخدم  " required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="ادخل كلمة المرور" required autocomplete="current-password">
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">تسجيل الدخول</span>
                <span id="btnLoader" style="display: none;"><i class="fas fa-spinner fa-spin"></i> جاري الدخول...</span>
            </button>
        </form>
    </div>

</body>

</html>
