<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الهدايا - لوحة الخادم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ربط مكتبات فايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
            measurementId: "G-XZGSBG05KR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async () => {
            const currentServantGradeBadge = document.getElementById('currentServantGradeBadge');
            const giftGradeSelect = document.getElementById('giftGradeSelect');
            const filterGrade = document.getElementById('filterGrade');
            const giftsContainer = document.getElementById('giftsContainer');
            const giftForm = document.getElementById('giftForm');
            const giftImageInput = document.getElementById('giftImageInput');
            const fileLabelText = document.getElementById('fileLabelText');

            let base64Image = '';

            // جلب اسم المستخدم الحالي
            const loggedInUser = localStorage.getItem('currentUser') || localStorage.getItem('username');

            // جلب المرحلة من الـ LocalStorage (مع دعم عدة مسميات محتملة)
            let rawStage = localStorage.getItem('servantStage') || localStorage.getItem('stage') || localStorage.getItem('servantGrade') || 'ابتدائي';
            let servantStageValue = rawStage.trim();

            // دالة ذكية لتنسيق اسم المرحلة بشكل جميل
            function formatStageName(stage) {
                if (stage.includes("ابتدائي") || stage.includes("ابتدايي")) return "المرحلة الابتدائية";
                if (stage.includes("إعدادي") || stage.includes("اعدادي")) return "المرحلة الإعدادية";
                if (stage.includes("ثانوي")) return "المرحلة الثانوية";
                return stage;
            }

            const formattedStage = formatStageName(servantStageValue);

            // دالة لتحديد الصفوف المتاحة بناءً على المرحلة
            function getGradesForStage(stage) {
                const cleanStage = stage.toLowerCase();
                
                if (cleanStage.includes("ابتدائي") || cleanStage.includes("ابتدايي")) {
                    return [
                        "الصف الأول الابتدائي", "الصف الثاني الابتدائي", "الصف الثالث الابتدائي",
                        "الصف الرابع الابتدائي", "الصف الخامس الابتدائي", "الصف السادس الابتدائي"
                    ];
                } else if (cleanStage.includes("إعدادي") || cleanStage.includes("اعدادي")) {
                    return [
                        "الصف الأول الإعدادي", "الصف الثاني الإعدادي", "الصف الثالث الإعدادي"
                    ];
                } else if (cleanStage.includes("ثانوي")) {
                    return [
                        "الصف الأول الثانوي", "الصف الثاني الثانوي", "الصف الثالث الثانوي"
                    ];
                } else {
                    return [
                        "الصف الأول الابتدائي", "الصف الثاني الابتدائي", "الصف الثالث الابتدائي",
                        "الصف الرابع الابتدائي", "الصف الخامس الابتدائي", "الصف السادس الابتدائي",
                        "الصف الأول الإعدادي", "الصف الثاني الإعدادي", "الصف الثالث الإعدادي",
                        "الصف الأول الثانوي", "الصف الثاني الثانوي", "الصف الثالث الثانوي"
                    ];
                }
            }

            // عرض المرحلة المنسقة في الـ Badge
            currentServantGradeBadge.innerText = formattedStage;
            
            const allowedGrades = getGradesForStage(servantStageValue);
            
            // تحديث قائمة الفلتر في الأعلى
            filterGrade.innerHTML = `<option value="all">🌐 جميع صفوف مرحلتي (${formattedStage})</option>`;
            allowedGrades.forEach(grade => {
                filterGrade.innerHTML += `<option value="${grade}">${grade}</option>`;
            });

            // تحديث قائمة اختيار الصف عند إضافة هدية جديدة
            giftGradeSelect.innerHTML = `<option value="" disabled selected>اختر الصف المستهدف</option>`;
            allowedGrades.forEach(grade => {
                giftGradeSelect.innerHTML += `<option value="${grade}">${grade}</option>`;
            });

            // اختيار صورة الهدية وتحويلها لـ Base64
            giftImageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    fileLabelText.innerText = file.name;
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        base64Image = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // جلب وعرض الهدايا حسب الفلتر والمرحلة (مع استبعاد الكميات التي تساوي صفر أو أقل)
            async function renderGifts(selectedFilter = "all") {
                giftsContainer.innerHTML = `<div class="no-gifts">جاري تحميل الهدايا...</div>`;
                try {
                    const giftsRef = collection(db, "gifts");
                    const querySnapshot = await getDocs(giftsRef);

                    giftsContainer.innerHTML = '';
                    let itemsCount = 0;

                    querySnapshot.forEach((docSnap) => {
                        const gift = docSnap.data();

                        // التحقق من أن الكمية أكبر من الصفر أولاً
                        const qty = Number(gift.quantity) || 0;
                        if (qty <= 0) return; // تخطي الهدية تماماً إذا كانت كميتها 0 أو أقل

                        const isMyStage = allowedGrades.includes(gift.grade);
                        const matchesFilter = (selectedFilter === "all" && isMyStage) || (gift.grade === selectedFilter);

                        if (matchesFilter) {
                            itemsCount++;
                            const card = document.createElement('div');
                            card.className = 'gift-card';
                            card.innerHTML = `
                                <img src="${gift.image || 'https://via.placeholder.com/250x180/f6f1e9/7c1b28?text=هدية'}" alt="${gift.name}" class="gift-img">
                                <div class="gift-details">
                                    <div class="gift-title">${gift.name}</div>
                                    <div class="gift-info" style="color: var(--gold); font-size: 13px; font-weight: bold;">
                                        <span>الصف: <span>${gift.grade || 'غير محدد'}</span></span>
                                    </div>
                                    <div class="gift-info">
                                        <span>الكمية: <span>${qty}</span></span>
                                    </div>
                                    <div class="gift-info">
                                        <span>النقاط: <span>${gift.points} نقطة</span></span>
                                    </div>
                                </div>
                            `;
                            giftsContainer.appendChild(card);
                        }
                    });

                    if (itemsCount === 0) {
                        giftsContainer.innerHTML = `<div class="no-gifts">لا توجد هدايا مضافة لهذه الصفوف حالياً أو نفدت الكميات.</div>`;
                    }
                } catch (error) {
                    console.error("خطأ في جلب الهدايا: ", error);
                    giftsContainer.innerHTML = `<div class="no-gifts">حدث خطأ أثناء تحميل الهدايا. تأكد من اتصال الإنترنت.</div>`;
                }
            }

            filterGrade.addEventListener('change', (e) => {
                renderGifts(e.target.value);
            });

            // إضافة هدية جديدة للصف المختار
            giftForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const name = document.getElementById('giftName').value.trim();
                const quantity = Number(document.getElementById('giftQuantity').value.trim());
                const points = Number(document.getElementById('giftPoints').value.trim());
                const selectedGrade = giftGradeSelect.value;

                if (!name || isNaN(quantity) || isNaN(points) || !selectedGrade) {
                    alert("يرجى ملء جميع الحقول واختيار الصف بدقة!");
                    return;
                }

                if (quantity <= 0) {
                    alert("لا يمكن إضافة هدية بكمية صفر أو أقل!");
                    return;
                }

                const submitBtn = giftForm.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...`;

                try {
                    await addDoc(collection(db, "gifts"), {
                        name: name,
                        quantity: quantity,
                        points: points,
                        grade: selectedGrade,
                        stage: formattedStage,
                        addedBy: loggedInUser || 'خادم',
                        image: base64Image || 'https://via.placeholder.com/250x180/f6f1e9/7c1b28?text=هدية',
                        createdAt: serverTimestamp()
                    });

                    alert(`تمت إضافة الهدية بنجاح إلى (${selectedGrade})!`);
                    giftForm.reset();
                    fileLabelText.innerText = "اختر صورة الهدية من الجاليري";
                    base64Image = '';
                    renderGifts(filterGrade.value);
                } catch (error) {
                    console.error("خطأ في الإضافة: ", error);
                    alert("حدث خطأ أثناء حفظ الهدية.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fas fa-plus"></i> إضافة الهدية للصف المختار`;
                }
            });

            renderGifts("all");
        });
    </script>

    <style>
        :root{
            --wine-900:#4a0e16;
            --wine-800:#6b1420;
            --wine-700:#7c1b28;
            --gold:#c9a04d;
            --gold-light:#e6c878;
            --paper:#f6f1e9;
            --card:#ffffff;
            --ink:#2a2320;
            --ink-soft:#6b625c;
            --line:#e9dfd0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--paper);
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
        }

        /* ===== الهيدر ===== */
        header.church-header{
            background:linear-gradient(180deg, var(--wine-800), var(--wine-900));
            padding:22px 20px 26px;
            text-align:center;
            position:relative;
            box-shadow:0 8px 20px rgba(74,14,22,0.25);
        }

        header.church-header::after{
            content:'';
            position:absolute;
            bottom:0; right:0; left:0;
            height:4px;
            background:linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .church-logo{
            width:52px;
            height:52px;
            border-radius:50%;
            background:var(--wine-700);
            border:2px solid var(--gold);
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 10px;
        }

        .church-logo i{
            color:var(--gold-light);
            font-size:24px;
        }

        header.church-header h2{
            font-family:'Amiri', serif;
            color:#fbeed4;
            font-size:18px;
            font-weight:700;
        }

        .servant-badge {
            background: var(--card);
            border: 1px solid var(--line);
            border-right: 4px solid var(--gold);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--wine-800);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(74,14,22,0.06);
            margin-bottom: 20px;
        }

        .servant-badge i {
            color: var(--gold);
        }

        .main-content { 
            flex: 1;
            text-align: center; 
            padding: 24px 16px 40px; 
            max-width: 680px; 
            width: 100%; 
            margin: 0 auto; 
        }

        h1 { 
            font-family: 'Amiri', serif;
            color: var(--wine-800); 
            font-size: 24px; 
            margin-bottom: 15px; 
        }

        .filter-bar { 
            background: var(--card); 
            border: 1px solid var(--line); 
            padding: 15px 18px; 
            border-radius: 18px; 
            margin-bottom: 22px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 12px; 
            text-align: right; 
            box-shadow: 0 8px 20px rgba(74,14,22,0.05);
        }

        .filter-bar label { 
            color: var(--wine-700); 
            font-size: 14px; 
            font-weight: 700; 
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-select { 
            background: var(--paper); 
            border: 1px solid var(--line); 
            color: var(--ink); 
            padding: 10px 14px; 
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: 600;
            min-width: 210px; 
            cursor: pointer; 
            font-family: 'Cairo', sans-serif; 
        }
        .filter-select:focus { outline: none; border-color: var(--gold); }

        .add-gift-box { 
            background: var(--card); 
            border: 1px solid var(--line); 
            border-top: 3px solid var(--gold);
            padding: 22px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            text-align: right; 
            box-shadow: 0 10px 25px rgba(74,14,22,0.06); 
        }

        .add-gift-box h3 { 
            color: var(--wine-800); 
            margin-bottom: 15px; 
            font-size: 16px; 
            font-weight: 700;
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 12px; 
            margin-bottom: 12px; 
        }

        .form-control { 
            background: var(--paper); 
            border: 1px solid var(--line); 
            color: var(--ink); 
            padding: 11px 14px; 
            border-radius: 10px; 
            font-family: 'Cairo', sans-serif; 
            font-size: 13px; 
            font-weight: 600;
            width: 100%; 
        }
        .form-control::placeholder { color: var(--ink-soft); }
        .form-control:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 8px rgba(201,160,77,0.25); }

        .file-upload-wrapper { 
            background: var(--paper); 
            border: 1px dashed var(--gold); 
            padding: 12px 15px; 
            border-radius: 10px; 
            color: var(--wine-700); 
            font-size: 13px; 
            font-weight: 600;
            text-align: center; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 15px; 
            transition: 0.3s; 
        }
        .file-upload-wrapper:hover { background: rgba(201,160,77,0.08); }
        .file-upload-wrapper input { display: none; }

        .btn-gold { 
            background: linear-gradient(135deg, var(--wine-800), var(--wine-900)); 
            color: #fbeed4; 
            border: 2px solid var(--gold); 
            padding: 12px 25px; 
            border-radius: 50px; 
            font-weight: 700; 
            font-size: 14px; 
            cursor: pointer; 
            width: 100%; 
            font-family: 'Cairo', sans-serif; 
            transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(74,14,22,0.2);
        }
        .btn-gold:hover { 
            background: linear-gradient(135deg, var(--wine-700), var(--wine-800)); 
            color: var(--gold-light);
            transform: translateY(-2px); 
            box-shadow: 0 6px 18px rgba(74,14,22,0.3);
        }

        .gifts-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 16px; 
            text-align: right;
        }

        .gift-card { 
            background: var(--card); 
            border: 1px solid var(--line); 
            border-radius: 18px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            transition: 0.3s; 
            box-shadow: 0 8px 20px rgba(74,14,22,0.06);
        }
        .gift-card:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 12px 25px rgba(74,14,22,0.1); }
        
        .gift-img { 
            width: 100%; 
            height: 160px; 
            object-fit: cover; 
            background: var(--paper); 
            border-bottom: 1px solid var(--line); 
        }

        .gift-details { 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            flex-grow: 1; 
        }

        .gift-title { 
            color: var(--wine-800); 
            font-size: 16px; 
            font-weight: 700; 
            font-family: 'Amiri', serif;
        }

        .gift-info { 
            display: flex; 
            justify-content: space-between; 
            font-size: 13px; 
            color: var(--ink-soft); 
        }
        .gift-info span span { color: var(--wine-700); font-weight: 700; }

        .no-gifts { 
            grid-column: 1 / -1; 
            padding: 30px; 
            background: var(--card); 
            border: 1px dashed var(--line); 
            border-radius: 15px; 
            color: var(--ink-soft); 
            font-size: 14px; 
            font-weight: 600;
        }

        /* ===== زر الرجوع الأنيق ===== */
        .back-btn-container {
            margin-top: 30px;
            text-align: center;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--wine-800), var(--wine-900));
            color: #fbeed4;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid var(--gold);
            box-shadow: 0 6px 18px rgba(74,14,22,0.25);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, var(--wine-700), var(--wine-800));
            color: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(74,14,22,0.35);
        }

        .back-btn i {
            font-size: 15px;
            color: var(--gold);
        }
    </style>
</head>
<body>

    <header class="church-header">
        <div class="church-logo"><i class="fas fa-cross"></i></div>
        <h2>كنيسه الشهيد العظيم استيفانوس ومارمينا العجايبي</h2>
    </header>

    <div class="main-content">
        <h1>معرض هدايا الخدام</h1>

        <div>
            <div class="servant-badge"><i class="fas fa-user-shield"></i> مرحلتك: <span id="currentServantGradeBadge">جاري التحميل...</span></div>
        </div>

        <div class="filter-bar">
            <label for="filterGrade"><i class="fas fa-filter"></i> عرض هدايا الصف:</label>
            <select id="filterGrade" class="filter-select">
                <option value="all">جاري التحميل...</option>
            </select>
        </div>

        <div class="add-gift-box">
            <h3>إضافة هدية جديدة <span style="font-size: 11px; color: var(--gold); font-weight: normal;">(متاحة لصفوف مرحلتك فقط)</span></h3>
            <form id="giftForm">
                <div class="form-grid">
                    <input type="text" id="giftName" class="form-control" placeholder="اسم الهدية" required>
                    <input type="number" id="giftQuantity" class="form-control" placeholder="الكمية المتاحة" min="1" required>
                    <input type="number" id="giftPoints" class="form-control" placeholder="النقاط المطلوبة" min="1" required>
                    
                    <select id="giftGradeSelect" class="form-control" required style="cursor: pointer;">
                        <option value="" disabled selected>اختر الصف المستهدف</option>
                    </select>
                </div>
                
                <label class="file-upload-wrapper">
                    <i class="fas fa-image"></i>
                    <span id="fileLabelText">اختر صورة الهدية من الجاليري</span>
                    <input type="file" id="giftImageInput" accept="image/*">
                </label>

                <button type="submit" class="btn-gold"><i class="fas fa-plus"></i> إضافة الهدية للصف المختار</button>
            </form>
        </div>

        <div id="giftsContainer" class="gifts-grid"></div>

        <!-- زر الرجوع الأنيق -->
        <div class="back-btn-container">
            <a href="home.html" class="back-btn">
                <i class="fas fa-arrow-right"></i>
                <span>العودة إلى الرئيسية</span>
            </a>
        </div>
    </div>

</body>
</html>
