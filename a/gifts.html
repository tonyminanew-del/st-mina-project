<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الهدايا - لوحة الخادم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ربط مكتبات فايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
            measurementId: "G-XZGSBG05KR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async () => {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeBtn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const logoutBtn = document.getElementById('logoutBtn');

            function openSidebar() {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }

            function closeSidebar() {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }

            if (menuBtn) menuBtn.addEventListener('click', openSidebar);
            if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
            if (overlay) overlay.addEventListener('click', closeSidebar);

            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (confirm("هل تريد تسجيل الخروج حقاً؟")) {
                        localStorage.clear();
                        window.location.href = 'index.html';
                    }
                });
            }

            const currentServantGradeBadge = document.getElementById('currentServantGradeBadge');
            const giftGradeSelect = document.getElementById('giftGradeSelect');
            const filterGrade = document.getElementById('filterGrade');
            const giftsContainer = document.getElementById('giftsContainer');
            const giftForm = document.getElementById('giftForm');
            const giftImageInput = document.getElementById('giftImageInput');
            const fileLabelText = document.getElementById('fileLabelText');

            let base64Image = '';

            // جلب اسم المستخدم الحالي
            const loggedInUser = localStorage.getItem('currentUser') || localStorage.getItem('username');

            // جلب المرحلة من الـ LocalStorage (مع دعم عدة مسميات محتملة)
            let rawStage = localStorage.getItem('servantStage') || localStorage.getItem('stage') || localStorage.getItem('servantGrade') || 'ابتدائي';
            let servantStageValue = rawStage.trim();

            // دالة ذكية لتنسيق اسم المرحلة بشكل جميل
            function formatStageName(stage) {
                if (stage.includes("ابتدائي") || stage.includes("ابتدايي")) return "المرحلة الابتدائية";
                if (stage.includes("إعدادي") || stage.includes("اعدادي")) return "المرحلة الإعدادية";
                if (stage.includes("ثانوي")) return "المرحلة الثانوية";
                return stage;
            }

            const formattedStage = formatStageName(servantStageValue);

            // دالة لتحديد الصفوف المتاحة بناءً على المرحلة
            function getGradesForStage(stage) {
                const cleanStage = stage.toLowerCase();
                
                if (cleanStage.includes("ابتدائي") || cleanStage.includes("ابتدايي")) {
                    return [
                        "الصف الأول الابتدائي", "الصف الثاني الابتدائي", "الصف الثالث الابتدائي",
                        "الصف الرابع الابتدائي", "الصف الخامس الابتدائي", "الصف السادس الابتدائي"
                    ];
                } else if (cleanStage.includes("إعدادي") || cleanStage.includes("اعدادي")) {
                    return [
                        "الصف الأول الإعدادي", "الصف الثاني الإعدادي", "الصف الثالث الإعدادي"
                    ];
                } else if (cleanStage.includes("ثانوي")) {
                    return [
                        "الصف الأول الثانوي", "الصف الثاني الثانوي", "الصف الثالث الثانوي"
                    ];
                } else {
                    // افتراضي يعرض الكل لو لم يتم التعرف عليها
                    return [
                        "الصف الأول الابتدائي", "الصف الثاني الابتدائي", "الصف الثالث الابتدائي",
                        "الصف الرابع الابتدائي", "الصف الخامس الابتدائي", "الصف السادس الابتدائي",
                        "الصف الأول الإعدادي", "الصف الثاني الإعدادي", "الصف الثالث الإعدادي",
                        "الصف الأول الثانوي", "الصف الثاني الثانوي", "الصف الثالث الثانوي"
                    ];
                }
            }

            // عرض المرحلة المنسقة في الـ Badge
            currentServantGradeBadge.innerText = formattedStage;
            
            const allowedGrades = getGradesForStage(servantStageValue);
            
            // تحديث قائمة الفلتر في الأعلى
            filterGrade.innerHTML = `<option value="all">🌐 جميع صفوف مرحلتي (${formattedStage})</option>`;
            allowedGrades.forEach(grade => {
                filterGrade.innerHTML += `<option value="${grade}">${grade}</option>`;
            });

            // تحديث قائمة اختيار الصف عند إضافة هدية جديدة
            giftGradeSelect.innerHTML = `<option value="" disabled selected>اختر الصف المستهدف</option>`;
            allowedGrades.forEach(grade => {
                giftGradeSelect.innerHTML += `<option value="${grade}">${grade}</option>`;
            });

            // اختيار صورة الهدية وتحويلها لـ Base64
            giftImageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    fileLabelText.innerText = file.name;
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        base64Image = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // جلب وعرض الهدايا حسب الفلتر والمرحلة
            async function renderGifts(selectedFilter = "all") {
                giftsContainer.innerHTML = `<div class="no-gifts">جاري تحميل الهدايا...</div>`;
                try {
                    const giftsRef = collection(db, "gifts");
                    const querySnapshot = await getDocs(giftsRef);

                    giftsContainer.innerHTML = '';
                    let itemsCount = 0;

                    querySnapshot.forEach((docSnap) => {
                        const gift = docSnap.data();

                        const isMyStage = allowedGrades.includes(gift.grade);
                        const matchesFilter = (selectedFilter === "all" && isMyStage) || (gift.grade === selectedFilter);

                        if (matchesFilter) {
                            itemsCount++;
                            const card = document.createElement('div');
                            card.className = 'gift-card';
                            card.innerHTML = `
                                <img src="${gift.image || 'https://via.placeholder.com/250x180/111/d4af37?text=هدية'}" alt="${gift.name}" class="gift-img">
                                <div class="gift-details">
                                    <div class="gift-title">${gift.name}</div>
                                    <div class="gift-info" style="color: #d4af37; font-size: 14px; font-weight: bold;">
                                        <span>الصف: <span>${gift.grade || 'غير محدد'}</span></span>
                                    </div>
                                    <div class="gift-info">
                                        <span>الكمية: <span>${gift.quantity}</span></span>
                                    </div>
                                    <div class="gift-info">
                                        <span>النقاط: <span>${gift.points} نقطة</span></span>
                                    </div>
                                </div>
                            `;
                            giftsContainer.appendChild(card);
                        }
                    });

                    if (itemsCount === 0) {
                        giftsContainer.innerHTML = `<div class="no-gifts">لا توجد هدايا مضافة لهذه الصفوف حالياً.</div>`;
                    }
                } catch (error) {
                    console.error("خطأ في جلب الهدايا: ", error);
                    giftsContainer.innerHTML = `<div class="no-gifts">حدث خطأ أثناء تحميل الهدايا. تأكد من اتصال الإنترنت.</div>`;
                }
            }

            filterGrade.addEventListener('change', (e) => {
                renderGifts(e.target.value);
            });

            // إضافة هدية جديدة للصف المختار
            giftForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const name = document.getElementById('giftName').value.trim();
                const quantity = Number(document.getElementById('giftQuantity').value.trim());
                const points = Number(document.getElementById('giftPoints').value.trim());
                const selectedGrade = giftGradeSelect.value;

                if (!name || isNaN(quantity) || isNaN(points) || !selectedGrade) {
                    alert("يرجى ملء جميع الحقول واختيار الصف بدقة!");
                    return;
                }

                const submitBtn = giftForm.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...`;

                try {
                    await addDoc(collection(db, "gifts"), {
                        name: name,
                        quantity: quantity,
                        points: points,
                        grade: selectedGrade,
                        stage: formattedStage,
                        addedBy: loggedInUser || 'خادم',
                        image: base64Image || 'https://via.placeholder.com/250x180/111/d4af37?text=هدية',
                        createdAt: serverTimestamp()
                    });

                    alert(`تمت إضافة الهدية بنجاح إلى (${selectedGrade})!`);
                    giftForm.reset();
                    fileLabelText.innerText = "اختر صورة الهدية من الجاليري";
                    base64Image = '';
                    renderGifts(filterGrade.value);
                } catch (error) {
                    console.error("خطأ في الإضافة: ", error);
                    alert("حدث خطأ أثناء حفظ الهدية.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fas fa-plus"></i> إضافة الهدية للصف المختار`;
                }
            });

            renderGifts("all");
        });
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #111111 0%, #000000 100%);
            min-height: 100vh;
            font-family: 'Reem Kufi', 'Cairo', sans-serif;
            color: #f3e5ab;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .navbar { width: 100%; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .menu-btn { background: rgba(18, 18, 18, 0.9); border: 2px solid #d4af37; color: #d4af37; font-size: 24px; padding: 10px 14px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .menu-btn:hover { background: #d4af37; color: #000; }
        .servant-badge { background: rgba(18, 18, 18, 0.9); border: 1px solid #d4af37; padding: 8px 15px; border-radius: 10px; font-size: 16px; color: #d4af37; }
        
        .sidebar { position: fixed; top: 0; right: -320px; width: 320px; height: 100%; background: rgba(12, 12, 12, 0.99); border-left: 2px solid #d4af37; transition: right 0.35s ease; z-index: 9999; padding: 30px 20px; display: flex; flex-direction: column; }
        .sidebar.active { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(212, 175, 55, 0.3); padding-bottom: 15px; margin-bottom: 25px; }
        .sidebar-header h3 { color: #d4af37; }
        .close-btn { background: none; border: none; color: #ff6b6b; font-size: 24px; cursor: pointer; }
        .sidebar-links { list-style: none; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }
        .sidebar-links a, .logout-link { display: flex; align-items: center; gap: 15px; padding: 14px 18px; background: rgba(22, 22, 22, 0.85); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 14px; color: #f3e5ab; text-decoration: none; font-size: 18px; transition: 0.3s; cursor: pointer; }
        .sidebar-links a:hover { background: #d4af37; color: #000; transform: translateX(-5px); }
        .logout-link { border-color: rgba(255, 107, 107, 0.4); color: #ff8b8b; margin-top: auto; }
        .logout-link:hover { background: #ff6b6b; color: #fff; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: none; z-index: 998; }
        .overlay.active { display: block; }

        .main-content { text-align: center; margin-top: 10px; padding: 20px; max-width: 1000px; width: 100%; }
        h1 { color: #d4af37; font-size: 32px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }

        .filter-bar { background: rgba(18, 18, 18, 0.95); border: 1px solid rgba(212, 175, 55, 0.4); padding: 15px 20px; border-radius: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; text-align: right; }
        .filter-bar label { color: #d4af37; font-size: 18px; font-weight: bold; }
        .filter-select { background: #0a0a0a; border: 1px solid #d4af37; color: #f3e5ab; padding: 10px 15px; border-radius: 10px; font-size: 16px; min-width: 240px; cursor: pointer; font-family: 'Reem Kufi', 'Cairo', sans-serif; }

        .add-gift-box { background: rgba(18, 18, 18, 0.95); border: 2px solid #d4af37; padding: 25px; border-radius: 20px; margin-bottom: 30px; text-align: right; box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); }
        .add-gift-box h3 { color: #d4af37; margin-bottom: 15px; font-size: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-control { background: #0a0a0a; border: 1px solid rgba(212, 175, 55, 0.4); color: #f3e5ab; padding: 12px 15px; border-radius: 10px; font-family: 'Reem Kufi', 'Cairo', sans-serif; font-size: 16px; width: 100%; }
        .form-control:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }

        .file-upload-wrapper { background: #0a0a0a; border: 1px dashed rgba(212, 175, 55, 0.5); padding: 12px 15px; border-radius: 10px; color: #c5b358; font-size: 16px; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; transition: 0.3s; }
        .file-upload-wrapper:hover { border-color: #d4af37; background: rgba(212, 175, 55, 0.05); }
        .file-upload-wrapper input { display: none; }

        .btn-gold { background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%); color: #000; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; font-size: 17px; cursor: pointer; width: 100%; font-family: 'Reem Kufi', 'Cairo', sans-serif; transition: 0.3s; }
        .btn-gold:hover { background: #f3e5ab; transform: translateY(-2px); }

        .gifts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .gift-card { background: rgba(18, 18, 18, 0.95); border: 2px solid rgba(212, 175, 55, 0.4); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
        .gift-card:hover { border-color: #d4af37; transform: translateY(-5px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2); }
        .gift-img { width: 100%; height: 180px; object-fit: cover; background: #000; border-bottom: 1px solid rgba(212, 175, 55, 0.3); }
        .gift-details { padding: 15px; text-align: right; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .gift-title { color: #d4af37; font-size: 20px; font-weight: bold; }
        .gift-info { `display: flex; justify-content: space-between; font-size: 16px; color: #f3e5ab; }
        .gift-info span span { color: #c5b358; font-weight: bold; }
        .no-gifts { grid-column: 1 / -1; padding: 30px; background: rgba(18, 18, 18, 0.8); border: 1px dashed rgba(212, 175, 55, 0.4); border-radius: 15px; color: #c5b358; font-size: 18px; }
    </style>
</head>
<body>

    <div class="navbar">
        <button id="menuBtn" class="menu-btn"><i class="fas fa-bars"></i></button>
        <div class="servant-badge"><i class="fas fa-user-shield"></i> مرحلتك: <span id="currentServantGradeBadge">جاري التحميل...</span></div>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>قائمة الخادم</h3>
            <button id="closeBtn" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-links">
            <li><a href="home.html"><i class="fas fa-home"></i>الرئيسية</a></li>
            <li><a href="profile.html"><i class="fas fa-user-circle"></i>البروفايل</a></li>
            <li><a href="gifts.html"><i class="fas fa-gift"></i>معرض الهدايا</a></li>
            <li><a href="admin_dashboard.html"><i class="fas fa-cogs"></i>الإدارة</a></li>
            <li><a href="cart.html"><i class="fas fa-shopping-cart"></i>السلة</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i>الإشعارات</a></li>
            <li><button id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i>تسجيل خروج</button></li>
        </ul>
    </div>

    <div id="overlay" class="overlay"></div>

    <div class="main-content">
        <h1>معرض هدايا الخدام</h1>

        <div class="filter-bar">
            <label for="filterGrade"><i class="fas fa-filter"></i> عرض هدايا الصف:</label>
            <select id="filterGrade" class="filter-select">
                <option value="all">جاري التحميل...</option>
            </select>
        </div>

        <div class="add-gift-box">
            <h3>إضافة هدية جديدة <span style="font-size: 13px; color: #c5b358;">(متاحة لصفوف مرحلتك فقط)</span></h3>
            <form id="giftForm">
                <div class="form-grid">
                    <input type="text" id="giftName" class="form-control" placeholder="اسم الهدية" required>
                    <input type="number" id="giftQuantity" class="form-control" placeholder="الكمية المتاحة" required>
                    <input type="number" id="giftPoints" class="form-control" placeholder="النقاط المطلوبة" required>
                    
                    <select id="giftGradeSelect" class="form-control" required style="background: #0a0a0a; color: #f3e5ab; cursor: pointer;">
                        <option value="" disabled selected>اختر الصف المستهدف</option>
                    </select>
                </div>
                
                <label class="file-upload-wrapper">
                    <i class="fas fa-image"></i>
                    <span id="fileLabelText">اختر صورة الهدية من الجاليري</span>
                    <input type="file" id="giftImageInput" accept="image/*">
                </label>

                <button type="submit" class="btn-gold"><i class="fas fa-plus"></i> إضافة الهدية للصف المختار</button>
            </form>
        </div>

        <div id="giftsContainer" class="gifts-grid"></div>
    </div>

</body>
</html>
