<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب مشرف جديد - كنيسة الشهيد استفانوس ومارمينا</title>
    
    <!-- خط عربي فخم (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #791319 0%, #4a0a0f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
            color: #333;
            position: relative;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 
                        0 5px 15px rgba(121, 19, 25, 0.2);
            position: relative;
            text-align: center;
        }

        .app-logo-container {
            margin-bottom: 25px;
        }

        .cross-icon-box {
            width: 75px;
            height: 75px;
            background: #791319;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            font-size: 34px;
            box-shadow: 0 8px 20px rgba(121, 19, 25, 0.3);
        }

        h2 {
            color: #791319;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .church-title {
            color: #555;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .form-section {
            display: none;
            text-align: right;
        }

        .form-section.active {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #444;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            color: #333;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            background: #fff;
            border-color: #791319;
            box-shadow: 0 0 0 3px rgba(121, 19, 25, 0.1);
        }

        select option {
            background: #fff;
            color: #333;
        }

        .btn {
            width: 100%;
            background: #791319;
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(121, 19, 25, 0.25);
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5e0e13;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(121, 19, 25, 0.35);
        }

        .error-msg {
            color: #d9534f;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            text-align: center;
            background: #fdf2f2;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #791319;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            z-index: 10;
            display: none;
        }

        .loading-overlay i {
            font-size: 50px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        .loading-overlay p {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .dots-loader {
            display: flex;
            gap: 8px;
        }

        .dots-loader span {
            width: 10px;
            height: 100%;
            min-height: 10px;
            background: #ffffff;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.4;
            animation: bounce 1.2s infinite ease-in-out both;
        }

        .dots-loader span:nth-child(1) { animation-delay: -0.32s; }
        .dots-loader span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); opacity: 1; }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const stageGrades = {
            'ابتدائي': ['الأول الابتدائي', 'الثاني الابتدائي', 'الثالث الابتدائي', 'الرابع الابتدائي', 'الخامس الابتدائي', 'السادس الابتدائي'],
            'إعدادي': ['الأول الإعدادي', 'الثاني الإعدادي', 'الثالث الإعدادي'],
            'ثانوي': ['الأول الثانوي', 'الثاني الثانوي', 'الثالث الثانوي']
        };

        function fillGradeOptions(stage) {
            const gradeSelect = document.getElementById('servant-grade');
            const grades = stageGrades[stage] || [];
            gradeSelect.innerHTML = grades.map(g => `<option value="${g}">${g}</option>`).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const step1Btn = document.getElementById('step1-btn');
            const step2Btn = document.getElementById('step2-btn');
            const errorMsg = document.getElementById('error-msg');
            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            const stageSelect = document.getElementById('servant-stage');

            fillGradeOptions(stageSelect.value);

            stageSelect.addEventListener('change', () => {
                fillGradeOptions(stageSelect.value);
            });

            step1Btn.addEventListener('click', async () => {
                const username = document.getElementById('admin-username').value.trim();
                const password = document.getElementById('admin-password').value.trim();

                if (!username || !password) {
                    errorMsg.innerText = "يرجى إدخال اسم المستخدم وكلمة المرور!";
                    errorMsg.style.display = "block";
                    return;
                }

                errorMsg.style.display = "none";
                loadingText.innerText = "جاري التحقق من التوفر...";
                loadingOverlay.style.display = "flex";
                step1Btn.disabled = true;

                try {
                    const adminRef = collection(db, "admin");
                    const q = query(adminRef, where("username", "==", username));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        errorMsg.innerText = "اسم المستخدم هذا موجود مسبقاً، يرجى اختيار اسم آخر!";
                        errorMsg.style.display = "block";
                        loadingOverlay.style.display = "none";
                        step1Btn.disabled = false;
                        return;
                    }

                    loadingOverlay.style.display = "none";
                    step1Btn.disabled = false;

                    document.getElementById('section-1').classList.remove('active');
                    document.getElementById('section-2').classList.add('active');

                } catch (error) {
                    console.error("خطأ في التحقق:", error);
                    errorMsg.innerText = "حدث خطأ في الاتصال بقاعدة البيانات!";
                    errorMsg.style.display = "block";
                    loadingOverlay.style.display = "none";
                    step1Btn.disabled = false;
                }
            });

            step2Btn.addEventListener('click', async () => {
                const username = document.getElementById('admin-username').value.trim();
                const password = document.getElementById('admin-password').value.trim();
                const fullName = document.getElementById('servant-name').value.trim();
                const servantNum = document.getElementById('servant-number').value.trim();
                const servantTitle = document.getElementById('servant-title').value; 
                const servantStage = document.getElementById('servant-stage').value; 
                const servantGrade = document.getElementById('servant-grade').value;

                if (!fullName || !servantNum) {
                    alert("يرجى ملء جميع الحقول المطلوبة!");
                    return;
                }

                loadingText.innerText = "جاري إنشاء الحساب وحفظ البيانات...";
                loadingOverlay.style.display = "flex";
                step2Btn.disabled = true;

                try {
                    await setDoc(doc(db, "admin", username), {
                        username: username,
                        password: password,
                        fullName: fullName,
                        servantNumber: servantNum,
                        servantTitle: servantTitle,
                        servantStage: servantStage,
                        servantGrade: servantGrade,
                        createdAt: new Date().toISOString()
                    });

                    localStorage.setItem('username', username);
                    localStorage.setItem('fullName', fullName);
                    localStorage.setItem('servantTitle', servantTitle);
                    localStorage.setItem('servantStage', servantStage);
                    localStorage.setItem('servantGrade', servantGrade);
                    localStorage.setItem('servantNumber', servantNum);

                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1000);

                } catch (error) {
                    console.error("خطأ أثناء الحفظ:", error);
                    alert("حدث خطأ أثناء حفظ البيانات!");
                    loadingOverlay.style.display = "none";
                    step2Btn.disabled = false;
                }
            });
        });
    </script>
</head>
<body>

    <div class="card">
        <div id="loading-overlay" class="loading-overlay">
            <i class="fas fa-cross"></i>
            <p id="loading-text">جاري التحميل...</p>
            <div class="dots-loader">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="app-logo-container">
            <div class="cross-icon-box">
                <i class="fas fa-cross"></i>
            </div>
            <h2>تسجيل مشرف جديد</h2>
            <div class="church-title">كنيسة الشهيد العظيم استفانوس ومارمينا العجايبي</div>
        </div>

        <div id="section-1" class="form-section active">
            <div class="input-group">
                <label for="admin-username">اسم المستخدم (Username):</label>
                <input type="text" id="admin-username" placeholder="" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="admin-password">كلمة المرور (Password):</label>
                <input type="password" id="admin-password" placeholder="أدخل كلمة المرور">
            </div>

            <div id="error-msg" class="error-msg"></div>
            
            <button type="button" id="step1-btn" class="btn">التالي</button>
        </div>

        <div id="section-2" class="form-section">
            <div class="input-group">
                <label for="servant-name">اسم الخادم:</label>
                <input type="text" id="servant-name" placeholder="أدخل اسمك الكامل">
            </div>

            <div class="input-group">
                <label for="servant-number">رقم الخادم:</label>
                <input type="text" id="servant-number" placeholder="أدخل رقمك التعريفي">
            </div>

            <div class="input-group">
                <label for="servant-title">لقب الخادم:</label>
                <select id="servant-title">
                    <option value="أبونا">أبونا</option>
                    <option value="تاسوني">تاسوني</option>
                    <option value="أخ">أخ</option>
                </select>
            </div>

            <div class="input-group">
                <label for="servant-stage">المرحلة:</label>
                <select id="servant-stage">
                    <option value="ابتدائي">ابتدائي</option>
                    <option value="إعدادي">إعدادي</option>
                    <option value="ثانوي">ثانوي</option>
                </select>
            </div>

            <div class="input-group">
                <label for="servant-grade">الصف الدراسي الذي يخدمه:</label>
                <select id="servant-grade">
                </select>
            </div>

            <button type="button" id="step2-btn" class="btn">حفظ وإنشاء الحساب</button>
        </div>
    </div>

</body>
</html>
