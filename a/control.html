<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخدومين - لوحة الخادم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ربط مكتبات فايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
            measurementId: "G-XZGSBG05KR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async () => {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeBtn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const logoutBtn = document.getElementById('logoutBtn');
            const servantModal = document.getElementById('servantModal');
            const closeModalBtn = document.getElementById('closeModalBtn');

            function openSidebar() {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }

            function closeSidebar() {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }

            if (menuBtn) menuBtn.addEventListener('click', openSidebar);
            if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
            if (overlay) overlay.addEventListener('click', () => { closeSidebar(); closeServantModal(); });
            if (closeModalBtn) closeModalBtn.addEventListener('click', closeServantModal);

            function closeServantModal() {
                servantModal.classList.remove('active');
                overlay.classList.remove('active');
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (confirm("هل تريد تسجيل الخروج حقاً؟")) {
                        localStorage.clear();
                        window.location.href = '../index.html';
                    }
                });
            }

            // جلب وتنسيق المرحلة
            let rawStage = localStorage.getItem('servantStage') || localStorage.getItem('stage') || localStorage.getItem('servantGrade') || localStorage.getItem('userStage') || 'إعدادي';
            
            function formatStageName(stage) {
                if (stage.includes("ابتدائي") || stage.includes("ابتدايي")) return "المرحلة الابتدائية";
                if (stage.includes("إعدادي") || stage.includes("اعدادي")) return "المرحلة الإعدادية";
                if (stage.includes("ثانوي")) return "المرحلة الثانوية";
                return stage;
            }

            const formattedStage = formatStageName(rawStage.trim());
            document.getElementById('currentServantGradeBadge').innerText = formattedStage;

            const servantsListContainer = document.getElementById('servantsListContainer');
            const searchInput = document.getElementById('searchInput');

            let allServants = [];

            async function fetchServants() {
                servantsListContainer.innerHTML = `<div class="loading-box"><i class="fas fa-spinner fa-spin"></i> جاري تحميل قائمة المخدومين...</div>`;
                try {
                    const querySnapshot = await getDocs(collection(db, "users"));
                    allServants = [];

                    querySnapshot.forEach((docSnap) => {
                        allServants.push({
                            id: docSnap.id,
                            ...docSnap.data()
                        });
                    });

                    renderNamesList(allServants);
                } catch (error) {
                    console.error("خطأ في جلب البيانات:", error);
                    servantsListContainer.innerHTML = `<div class="loading-box" style="color: #ff4757;">تعذر تحميل البيانات، تأكد من الاتصال.</div>`;
                }
            }

            // عرض قائمة الأسماء فقط
            function renderNamesList(dataList) {
                servantsListContainer.innerHTML = '';
                if (dataList.length === 0) {
                    servantsListContainer.innerHTML = `<div class="loading-box">لا يوجد مخدومين مسجلين حالياً.</div>`;
                    return;
                }

                dataList.forEach((person) => {
                    const name = person.name || person.fullName || person.username || 'بدون اسم';
                    const grade = person.grade || person.stage || 'غير محدد';
                    const points = person.points || 0;
                    const isBanned = person.banned || false;

                    const card = document.createElement('div');
                    card.className = `servant-name-card ${isBanned ? 'banned-card' : ''}`;
                    card.innerHTML = `
                        <div class="card-info">
                            <i class="fas fa-user-circle"></i>
                            <div>
                                <h3>${name}</h3>
                                <span>${grade} | ${points} نقطة ${isBanned ? ' | (محظور)' : ''}</span>
                            </div>
                        </div>
                        <button class="btn-open-control">إدارة وتحكم <i class="fas fa-arrow-left"></i></button>
                    `;

                    // عند النقر على كارت المخدوم، تفتح نافذة التحكم والبيانات الخاصة به
                    card.addEventListener('click', () => {
                        openServantDetails(person);
                    });

                    servantsListContainer.appendChild(card);
                });
            }

            // فتح نافذة الجدول والبيانات للمخدوم المحدد
            function openServantDetails(person) {
                const modalContent = document.getElementById('modalServantContent');
                const name = person.name || person.fullName || person.username || 'بدون اسم';
                const grade = person.grade || person.stage || 'غير محدد';
                const points = person.points || 0;
                const isBanned = person.banned || false;

                modalContent.innerHTML = `
                    <div class="servant-profile-header">
                        <h2><i class="fas fa-user-shield"></i> ${name}</h2>
                        <span class="grade-pill">${grade}</span>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                               <tr>
                                    <th>النقاط الحالية</th>
                                    <th>تعديل النقاط</th>
                                    <th>حالة الحظر</th>
                               </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><span id="points-${person.id}" class="points-badge">${points} نقطة</span></td>
                                    <td>
                                        <div class="points-controls">
                                            <button class="btn-action minus" onclick="updatePoints('${person.id}', -5)">-5</button>
                                            <button class="btn-action minus" onclick="updatePoints('${person.id}', -1)">-1</button>
                                            <input type="number" id="custom-points-${person.id}" class="custom-input" placeholder="رقم">
                                            <button class="btn-action plus" onclick="updatePoints('${person.id}', 1)">+1</button>
                                            <button class="btn-action plus" onclick="updatePoints('${person.id}', 5)">+5</button>
                                            <button class="btn-action save" onclick="saveCustomPoints('${person.id}')"><i class="fas fa-check"></i></button>
                                        </div>
                                    </td>
                                    <td>
                                        <button class="btn-ban ${isBanned ? 'unban' : 'ban'}" onclick="toggleBan('${person.id}', ${isBanned})">
                                            ${isBanned ? '<i class="fas fa-unlock"></i> إلغاء الحظر' : '<i class="fas fa-lock"></i> حظر'}
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="personal-details-box">
                        <h3><i class="fas fa-id-card"></i> البيانات الشخصية الكاملة</h3>
                        <div class="details-grid">
                            <div class="detail-item"><strong>رقم الهاتف:</strong> <span>${person.userId || person.phone || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>هاتف الأب:</strong> <span>${person.fatherPhone || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>هاتف الأم:</strong> <span>${person.motherPhone || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>العنوان:</strong> <span>${person.address || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>تاريخ الميلاد:</strong> <span>${person.birthdate || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>تاريخ التسجيل:</strong> <span>${person.createdAt || 'غير متوفر'}</span></div>
                        </div>
                    </div>
                `;

                servantModal.classList.add('active');
                overlay.classList.add('active');
            }

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allServants.filter(p => {
                    const name = (p.name || p.fullName || p.username || '').toLowerCase();
                    return name.includes(term);
                });
                renderNamesList(filtered);
            });

            window.updatePoints = async function(docId, amount) {
                const person = allServants.find(p => p.id === docId);
                if (!person) return;

                let currentPoints = Number(person.points || 0);
                let newPoints = currentPoints + amount;
                if (newPoints < 0) newPoints = 0;

                try {
                    const docRef = doc(db, "users", docId);
                    await updateDoc(docRef, { points: newPoints });

                    person.points = newPoints;
                    const badge = document.getElementById(`points-${docId}`);
                    if(badge) badge.innerText = `${newPoints} نقطة`;
                } catch (error) {
                    console.error("خطأ في تحديث النقاط:", error);
                    alert("تعذر تحديث النقاط.");
                }
            };

            window.saveCustomPoints = async function(docId) {
                const inputEl = document.getElementById(`custom-points-${docId}`);
                const val = parseInt(inputEl.value);

                if (isNaN(val)) {
                    alert("يرجى كتابة رقم صحيح!");
                    return;
                }

                const person = allServants.find(p => p.id === docId);
                if (!person) return;

                try {
                    const docRef = doc(db, "users", docId);
                    await updateDoc(docRef, { points: val });

                    person.points = val;
                    const badge = document.getElementById(`points-${docId}`);
                    if(badge) badge.innerText = `${val} نقطة`;
                    inputEl.value = '';
                    alert("تم حفظ النقاط بنجاح!");
                } catch (error) {
                    console.error("خطأ في حفظ النقاط:", error);
                    alert("تعذر الحفظ.");
                }
            };

            window.toggleBan = async function(docId, currentBanStatus) {
                const newStatus = !currentBanStatus;
                const actionText = newStatus ? "حظر" : "فك حظر";

                if (!confirm(`هل أنت متأكد من رغبتك في ${actionText} هذا المخدوم؟`)) return;

                const person = allServants.find(p => p.id === docId);
                if (!person) return;

                try {
                    const docRef = doc(db, "users", docId);
                    await updateDoc(docRef, { banned: newStatus });

                    person.banned = newStatus;
                    openServantDetails(person); // تحديث النافذة المفتوحة
                    renderNamesList(allServants); // تحديث القائمة الخلفية
                } catch (error) {
                    console.error("خطأ في الحظر:", error);
                    alert("حدث خطأ أثناء التنفيذ.");
                }
            };

            fetchServants();
        });
    </script>

    <style>

        .main-content { text-align: center; margin-top: 10px; padding: 20px; max-width: 900px; width: 100%; }

        .search-box { margin-bottom: 25px; text-align: center; }

        .search-input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

        /* قائمة أسماء المخدومين */
        .servants-list { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .servant-name-card { background: rgba(10, 15, 30, 0.9); border: 2px solid rgba(212, 175, 55, 0.4); border-radius: 16px; padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .servant-name-card:hover { border-color: #00d2ff; transform: translateY(-3px); box-shadow: 0 0 20px rgba(0, 210, 255, 0.25); background: rgba(15, 23, 42, 0.95); }

        .card-info span { color: #8a99ad; font-size: 14px; }
        
        .btn-open-control { background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff; color: #00d2ff; padding: 8px 16px; border-radius: 10px; font-family: 'Reem Kufi', sans-serif; font-weight: bold; font-size: 14px; transition: 0.2s; pointer-events: none; }
        .servant-name-card:hover .btn-open-control { background: #00d2ff; color: #000; box-shadow: 0 0 10px #00d2ff; }

        .loading-box { text-align: center; color: #00d2ff; padding: 40px; font-size: 18px; }

        /* نافذة إدارة المخدوم المنبثقة (Modal) */

        .modal-header-custom { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(212, 175, 55, 0.3); padding-bottom: 15px; margin-bottom: 20px; }

</head>
<body>

    <div class="navbar">
        <button id="menuBtn" class="menu-btn"><i class="fas fa-bars"></i></button>
        <div class="servant-badge"><i class="fas fa-user-shield"></i> مرحلتك: <span id="currentServantGradeBadge">جاري التحميل...</span></div>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>قائمة الخادم</h3>
            <button id="closeBtn" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-links">
            <li><a href="home.html"><i class="fas fa-home"></i>الرئيسية</a></li>
            <li><a href="profile.html"><i class="fas fa-user-circle"></i>البروفايل</a></li>
            <li><a href="gifts.html"><i class="fas fa-gift"></i>معرض الهدايا</a></li>
            <li><a href="control.html"><i class="fas fa-cogs"></i>الإدارة</a></li>
            <li><a href="cart.html"><i class="fas fa-shopping-cart"></i>السلة</a></li>
            <li><a href="notifications/notifications.html"><i class="fas fa-bell"></i>الإشعارات</a></li>
            <li><button id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i>تسجيل خروج</button></li>
        </ul>
    </div>

    <div id="overlay" class="overlay"></div>

    <!-- نافذة إدارة المخدوم والجدول الخاص به -->
    <div id="servantModal" class="servant-modal">
        <div class="modal-header-custom">
            <h2><i class="fas fa-sliders-h"></i> لوحة تحكم المخدوم</h2>
            <button id="closeModalBtn" class="modal-close"><i class="fas fa-times"></i></button>
        </div>
        <div id="modalServantContent">
            <!-- سيتم حقن جدول التحكم والبيانات هنا عند النقر -->
        </div>
    </div>

    <div class="main-content">
        <h1>إدارة المخدومين</h1>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن مخدوم بالاسم...">
        </div>

        <div id="servantsListContainer" class="servants-list">
