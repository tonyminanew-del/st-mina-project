<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>مخدومين صفّي - لوحة الخادم</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --navy-deep: #041a36;
            --navy-mid: #062348;
            --navy-edge: #000b18;

            --maroon-dark: #5d101c;
            --maroon: #7d1424;
            --maroon-light: #9b1c30;

            --ink: #1f1715;
            --muted: #8a817c;

            --white: #ffffff;
            --soft-white: #fafafa;

            --border: #eadfe0;
            --gold: #c9a24b;

            --green: #137333;
            --red: #b42318;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: 'Tajawal', sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    var(--navy-mid) 0%,
                    var(--navy-deep) 48%,
                    var(--navy-edge) 100%
                );

            color: var(--ink);
            min-height: 100dvh;

            padding:
                max(14px, env(safe-area-inset-top))
                15px
                max(25px, env(safe-area-inset-bottom));

            overflow-x: hidden;
        }

        .topbar {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .menu-btn {
            width: 48px;
            height: 48px;

            border: none;
            border-radius: 14px;

            background: #ffffff;
            color: var(--maroon);

            font-size: 20px;
            cursor: pointer;

            box-shadow: 0 8px 22px rgba(0, 0, .25);
            transition: .25s;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            background: #fff7f8;
        }

        .class-badge {
            background: #ffffff;
            border-radius: 15px;
            padding: 10px 17px;

            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 14px;
            font-weight: 700;

            color: var(--navy-deep);

            box-shadow: 0 8px 22px rgba(0, 0, 0, .25);
        }

        .class-badge i {
            color: var(--maroon);
        }

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 11, 24, .72);
            backdrop-filter: blur(5px);

            opacity: 0;
            visibility: hidden;

            transition: .3s;
            z-index: 5000;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;

            top: 0;
            right: -350px;

            width: min(330px, 88vw);
            height: 100dvh;

            background: #ffffff;
            border-left: 5px solid var(--maroon);

            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(20px, env(safe-area-inset-bottom));

            box-shadow: -20px 0 60px rgba(0, 0, .3);

            z-index: 6000;

            transition: right .35s ease;

            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);

            margin-bottom: 18px;
        }

        .sidebar-header h3 {
            font-family: 'Amiri', serif;
            color: var(--maroon);
            font-size: 24px;
        }

        .close-btn {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 12px;

            background: #fff2f3;
            color: var(--maroon);

            font-size: 19px;
            cursor: pointer;
        }

        .sidebar-links {
            list-style: none;

            display: flex;
            flex-direction: column;

            gap: 9px;
            overflow-y: auto;
        }

        .sidebar-links a,
        .logout-link {
            width: 100%;
            min-height: 48px;

            display: flex;
            align-items: center;

            gap: 13px;
            padding: 11px 15px;

            border-radius: 13px;

            background: #faf7f7;
            border: 1px solid #eee3e4;

            color: var(--ink);

            text-decoration: none;

            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
            transition: .22s;
        }

        .sidebar-links a i,
        .logout-link i {
            width: 22px;
            text-align: center;
            color: var(--maroon);
        }

        .sidebar-links a:hover {
            transform: translateX(-4px);

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: white;
            border-color: transparent;

            box-shadow: 0 8px 20px rgba(125, 20, 36, .22);
        }

        .sidebar-links a:hover i {
            color: white;
        }

        .logout-link {
            margin-top: auto;

            background: #fff5f5;
            color: #9f1239;
            border-color: #f2cccc;
        }

        .logout-link:hover {
            background: #9f1239;
            color: white;
        }

        .logout-link:hover i {
            color: white;
        }

        .main-content {
            width: 100%;
            max-width: 1050px;

            margin: 0 auto;

            background: #ffffff;
            border-radius: 30px;

            padding: 32px;

            box-shadow: 0 30px 75px rgba(0, 0, 0, .35);

            position: relative;
            overflow: hidden;
        }

        .main-content::before {
            content: "";

            position: absolute;

            top: 0;
            right: 0;
            left: 0;

            height: 7px;

            background:
                linear-gradient(
                    90deg,
                    var(--navy-deep),
                    var(--maroon),
                    var(--maroon-light),
                    var(--navy-deep)
                );
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-icon {
            width: 70px;
            height: 70px;

            margin: 4px auto 15px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: white;
            font-size: 30px;

            box-shadow: 0 12px 25px rgba(125, 20, 36, .28);
        }

        .page-header h1 {
            font-family: 'Amiri', serif;

            color: var(--ink);

            font-size: clamp(28px, 6vw, 38px);

            line-height: 1.5;
            margin-bottom: 5px;
        }

        .page-header h1 span {
            color: var(--maroon);
        }

        .page-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .class-info {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;

            padding: 17px 20px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #f8f1f2,
                    #fff
                );

            border: 1px solid #eadbdd;
            margin-bottom: 18px;
        }

        .class-title {
            display: flex;
            align-items: center;
            gap: 11px;

            color: var(--navy-deep);

            font-weight: 700;
            font-size: 15px;
        }

        .class-title i {
            color: var(--maroon);
            font-size: 21px;
        }

        .count-pill {
            background: white;

            border: 1px solid #dfc7ca;

            color: var(--maroon);

            border-radius: 12px;

            padding: 7px 13px;

            font-size: 13px;
            font-weight: 800;

            white-space: nowrap;

            box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
        }

        .search-box {
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            min-height: 52px;

            padding: 12px 48px 12px 16px;

            border: 1px solid #e3d8d9;
            border-radius: 15px;

            background: #fafafa;
            color: var(--ink);

            font-family: 'Tajawal', sans-serif;
            font-size: 15px;

            outline: none;
            transition: .25s;
        }

        .search-input:focus {
            background: white;

            border-color: var(--maroon);

            box-shadow:
                0 0 0 4px rgba(125, 20, 36, .08);
        }

        .search-box::before {
            content: "\f002";

            font-family: "Font Awesome 6 Free";
            font-weight: 900;

            position: absolute;

            right: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--maroon);

            z-index: 2;
        }

        .search-input::placeholder {
            color: #aaa2a0;
        }

        .servants-list {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 13px;
        }

        .servant-name-card {
            background: #ffffff;

            border: 1px solid #eadfe0;
            border-radius: 18px;

            padding: 17px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            cursor: pointer;
            transition: .25s;

            box-shadow:
                0 6px 18px rgba(31, 23, 21, .055);
        }

        .servant-name-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(125, 20, 36, .35);

            box-shadow:
                0 14px 30px rgba(31, 23, 21, .11);
        }

        .servant-name-card.banned-card {
            border-color: #e7a9ad;

            background:
                linear-gradient(
                    135deg,
                    #fff,
                    #fff5f5
                );
        }

        .card-info {
            display: flex;
            align-items: center;

            gap: 12px;
            min-width: 0;
        }

        .avatar {
            width: 49px;
            height: 49px;

            min-width: 49px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: white;
            font-size: 20px;

            box-shadow:
                0 7px 15px rgba(125, 20, 36, .18);
        }

        .card-text {
            min-width: 0;
        }

        .card-info h3 {
            font-family: 'Amiri', serif;

            font-size: 21px;
            color: var(--ink);

            margin-bottom: 1px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-info span {
            display: block;

            color: var(--muted);

            font-size: 12px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-open-control {
            border: none;

            background: #f9f0f1;
            color: var(--maroon);

            padding: 9px 12px;

            border-radius: 11px;

            font-family: 'Tajawal', sans-serif;
            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;
            cursor: pointer;

            pointer-events: none;
            transition: .2s;
        }

        .servant-name-card:hover .btn-open-control {
            background: var(--maroon);
            color: white;
        }

        .loading-box {
            grid-column: 1 / -1;

            padding: 55px 20px;

            text-align: center;

            color: var(--maroon);
            font-size: 16px;
        }

        .loading-box i {
            display: block;

            font-size: 30px;
            margin-bottom: 12px;
        }

        .error-box {
            grid-column: 1 / -1;

            padding: 28px;

            text-align: center;

            background: #fff7f7;

            border: 1px solid #efc2c5;
            border-radius: 18px;

            color: #8b2630;
        }

        .error-box i {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .error-box p {
            word-break: break-word;
        }

        .retry-btn {
            margin-top: 17px;

            padding: 10px 18px;

            border: none;
            border-radius: 11px;

            background: var(--maroon);
            color: white;

            font-family: 'Tajawal', sans-serif;
            font-weight: 700;

            cursor: pointer;
        }

        .servant-modal {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -47%)
                scale(.96);

            width: min(900px, 94vw);

            max-height: 90dvh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 27px;

            padding: 27px;

            z-index: 7000;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition: .28s ease;

            box-shadow:
                0 35px 90px rgba(0, 0, .42);
        }

        .servant-modal.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        .servant-modal::-webkit-scrollbar {
            width: 7px;
        }

        .servant-modal::-webkit-scrollbar-thumb {
            background: #d8c4c7;
            border-radius: 10px;
        }

        .modal-header-custom {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding-bottom: 15px;

            border-bottom: 1px solid #eee2e3;
            margin-bottom: 20px;
        }

        .modal-header-custom h2 {
            font-family: 'Amiri', serif;

            color: var(--maroon);
            font-size: 24px;
        }

        .modal-close {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: #fff2f3;
            color: var(--maroon);

            font-size: 18px;
            cursor: pointer;

            transition: .2s;
        }

        .modal-close:hover {
            background: var(--maroon);
            color: white;
        }

        .servant-profile-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
            padding: 17px;

            background:
                linear-gradient(
                    135deg,
                    #f8f0f1,
                    #fff
                );

            border-radius: 17px;
            border: 1px solid #eadbdd;
        }

        .profile-name {
            display: flex;
            align-items: center;

            gap: 12px;
            min-width: 0;
        }

        .profile-name-icon {
            width: 51px;
            height: 51px;

            min-width: 51px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            font-size: 21px;
        }

        .servant-profile-header h2 {
            font-family: 'Amiri', serif;

            color: var(--ink);
            font-size: 26px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .grade-pill {
            background: white;

            border: 1px solid #dcc4c7;

            color: var(--maroon);

            padding: 7px 13px;

            border-radius: 11px;

            font-size: 13px;
            font-weight: 800;

            white-space: nowrap;
        }

        .control-section {
            border: 1px solid #eadfe0;
            border-radius: 18px;

            overflow: hidden;
            margin-bottom: 18px;
        }

        .section-title {
            padding: 13px 17px;

            background:
                linear-gradient(
                    135deg,
                    #f8f0f1,
                    #fff
                );

            color: var(--maroon);

            font-family: 'Amiri', serif;

            font-size: 20px;

            border-bottom: 1px solid #eadfe0;
        }

        .control-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 0;
        }

        .control-item {
            padding: 18px;

            min-width: 0;

            border-left: 1px solid #eee5e5;
        }

        .control-item:last-child {
            border-left: none;
        }

        .control-label {
            color: var(--muted);

            font-size: 12px;

            margin-bottom: 9px;

            display: block;
        }

        .points-row {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 6px;
        }

        .points-badge {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 95px;

            padding: 8px 12px;

            border-radius: 11px;

            background: #fff9eb;

            border: 1px solid #ead49e;

            color: #8a6518;

            font-weight: 800;
            font-size: 13px;
        }

        .btn-action {
            min-width: 38px;
            height: 36px;

            padding: 0 9px;

            border-radius: 9px;

            background: white;

            border: 1px solid #dfd2d3;

            color: var(--ink);

            font-family: 'Tajawal', sans-serif;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;
        }

        .btn-action.plus:hover {
            background: #137333;
            color: white;
            border-color: #137333;
        }

        .btn-action.minus:hover {
            background: #b42318;
            color: white;
            border-color: #b42318;
        }

        .btn-action.save {
            background: var(--maroon);
            border-color: var(--maroon);
            color: white;
        }

        .btn-action.save:hover {
            background: var(--maroon-dark);
        }

        .custom-input {
            width: 65px;
            height: 36px;

            border: 1px solid #dfd2d3;
            border-radius: 9px;

            text-align: center;

            outline: none;

            font-family: 'Tajawal', sans-serif;

            font-weight: 700;

            color: var(--ink);
        }

        .custom-input:focus {
            border-color: var(--maroon);

            box-shadow:
                0 0 0 3px rgba(125, 20, 36, .08);
        }

        .btn-ban {
            width: 100%;
            min-height: 43px;

            border-radius: 11px;

            cursor: pointer;

            font-family: 'Tajawal', sans-serif;
            font-weight: 800;

            transition: .2s;
        }

        .btn-ban.ban {
            background: #fff5f5;

            color: #b42318;

            border: 1px solid #efc4c6;
        }

        .btn-ban.ban:hover {
            background: #b42318;
            color: white;
        }

        .btn-ban.unban {
            background: #f0faf3;

            color: #137333;

            border: 1px solid #b9ddc2;
        }

        .btn-ban.unban:hover {
            background: #137333;
            color: white;
        }

        .personal-details-box {
            border: 1px solid #eadfe0;
            border-radius: 18px;
            overflow: hidden;
        }

        .personal-details-box h3 {
            padding: 13px 17px;
            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #f8f0f1,
                    #fff
                );

            color: var(--maroon);

            font-family: 'Amiri', serif;

            font-size: 20px;

            border-bottom: 1px solid #eadfe0;
        }

        .details-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            padding: 15px;
        }

        .detail-item {
            background: #fafafa;

            border: 1px solid #eee5e5;

            border-radius: 12px;

            padding: 12px 14px;

            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            gap: 10px;

            font-size: 13px;
        }

        .detail-item strong {
            color: var(--maroon);
            white-space: nowrap;
        }

        .detail-item span {
            color: var(--ink);

            text-align: left;

            word-break: break-word;
        }

        @media (max-width: 760px) {

            .main-content {
                padding: 24px 18px 25px;
                border-radius: 25px;
            }

            .servants-list {
                grid-template-columns: 1fr;
            }

            .control-grid {
                grid-template-columns: 1fr;
            }

            .control-item {
                border-left: none;

                border-bottom: 1px solid #eee5e5;
            }

            .control-item:last-child {
                border-bottom: none;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {

            body {
                padding-left: 10px;
                padding-right: 10px;
            }

            .topbar {
                margin-bottom: 10px;
            }

            .class-badge {
                font-size: 12px;
                padding: 9px 12px;
            }

            .main-content {
                padding: 22px 14px;
                border-radius: 22px;
            }

            .header-icon {
                width: 62px;
                height: 62px;
                font-size: 26px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .class-info {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .class-title {
                justify-content: center;
            }

            .count-pill {
                text-align: center;
            }

            .servant-name-card {
                padding: 13px;
            }

            .card-info h3 {
                font-size: 19px;
            }

            .btn-open-control {
                padding: 8px;
                font-size: 10px;
            }

            .servant-modal {
                width: 96vw;
                max-height: 94dvh;

                padding: 18px;
                border-radius: 21px;
            }

            .servant-profile-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .servant-profile-header h2 {
                font-size: 23px;
                max-width: 100%;
            }

            .grade-pill {
                align-self: flex-start;
            }

            .points-row {
                gap: 5px;
            }

            .points-badge {
                width: 100%;
            }

            .custom-input {
                flex: 1;
            }

            .details-grid {
                padding: 10px;
            }

            .detail-item {
                flex-direction: column;
                gap: 5px;
            }

            .detail-item span {
                text-align: right;
            }
        }
    </style>
</head>

<body>

    <div id="overlay" class="overlay"></div>

    <aside id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <h3>
                قائمة الخادم
            </h3>

            <button id="closeBtn" class="close-btn" type="button">
                <i class="fas fa-times"></i>
            </button>

        </div>

        <ul class="sidebar-links">

            <li>
                <a href="home.html">
                    <i class="fas fa-home"></i>

        /* =====================================================
           NORMALIZE TEXT
        ===================================================== */

        function normalizeText(value) {

            return String(value ?? "")
                .trim()
                .replace(/\s+/g, " ");
        }


        function normalizeKey(value) {

            return normalizeText(value)
                .toLowerCase();
        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           SAFE JS VALUE
        ===================================================== */

        function safeJs(value) {

            return String(value ?? "")
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\n/g, "\\n")
                .replace(/\r/g, "\\r");
        }


        /* =====================================================
           LOGIN IDENTIFIER
        ===================================================== */

        function getLoginIdentifier() {

            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            const urlUser =
                normalizeKey(
                    urlParams.get("user")
                );


            const userDocId =
                normalizeKey(
                    localStorage.getItem(
                        "userDocId"
                    )
                );


            const currentUsername =
                normalizeKey(
                    localStorage.getItem(
                        "currentUsername"
                    )
                );


            const username =
                normalizeKey(
                    localStorage.getItem(
                        "username"
                    )
                );


            const identifier =
                urlUser ||
                userDocId ||
                currentUsername ||
                username ||
                "";


            console.log(
                "👤 Login Identifier:",
                identifier
            );


            console.log(
                "🗂 userDocId:",
                localStorage.getItem(
                    "userDocId"
                )
            );


            console.log(
                "👤 currentUsername:",
                localStorage.getItem(
                    "currentUsername"
                )
            );


            console.log(
                "👤 username:",
                localStorage.getItem(
                    "username"
                )
            );


            return identifier;
        }


        /* =====================================================
           FIND CURRENT USER
           
           IMPORTANT:
           هنا لا نعتمد على Document ID فقط.
           نقرأ users مرة واحدة ونبحث في:
           
           1 - Document ID
           2 - usernameLower
           3 - username
           4 - userId
        ===================================================== */

        async function findCurrentUser() {

            const identifier =
                getLoginIdentifier();


            if (!identifier) {

                throw new Error(
                    "لم يتم العثور على بيانات تسجيل الدخول في localStorage."
                );
            }


            const normalizedIdentifier =
                normalizeKey(identifier);


            console.log(
                "🔎 البحث عن الحساب:",
                normalizedIdentifier
            );


            const usersRef =
                collection(
                    db,
                    "users"
                );


            const snapshot =
                await getDocs(
                    usersRef
                );


            console.log(
                "👥 عدد مستندات users:",
                snapshot.size
            );


            if (snapshot.empty) {

                throw new Error(
                    "مجموعة users فارغة في Firestore."
                );
            }


            let foundUser = null;


            snapshot.forEach(
                (docSnap) => {

                    if (foundUser) {
                        return;
                    }


                    const data =
                        docSnap.data();


                    const docId =
                        normalizeKey(
                            docSnap.id
                        );


                    const usernameLower =
                        normalizeKey(
                            data.usernameLower
                        );


                    const username =
                        normalizeKey(
                            data.username
                        );


                    const userName =
                        normalizeKey(
                            data.userName
                        );


                    const userId =
                        normalizeKey(
                            data.userId
                        );


                    const email =
                        normalizeKey(
                            data.email
                        );


                    const fullName =
                        normalizeKey(
                            data.fullName
                        );


                    console.log(
                        "🔍 فحص:",
                        {
                            docId,
                            usernameLower,
                            username,
                            userId
                        }
                    );


                    if (

                        docId ===
                        normalizedIdentifier

                        ||

                        usernameLower ===
                        normalizedIdentifier

                        ||

                        username ===
                        normalizedIdentifier

                        ||

                        userName ===
                        normalizedIdentifier

                        ||

                        userId ===
                        normalizedIdentifier

                        ||

                        email ===
                        normalizedIdentifier

                        ||

                        fullName ===
                        normalizedIdentifier

                    ) {

                        foundUser = {

                            id:
                                docSnap.id,

                            data:
                                data

                        };
                    }
                }
            );


            if (!foundUser) {

                console.error(
                    "❌ لم يتم العثور على الحساب:",
                    identifier
                );


                throw new Error(
                    `لم يتم العثور على حساب المستخدم: ${identifier}`
                );
            }


            currentUserDocId =
                foundUser.id;


            currentUserData =
                foundUser.data;

            localStorage.setItem(
                "userDocId",
                currentUserDocId
            );

            const canonicalUsername =
                currentUserData.username ||
                currentUserData.userName ||
                currentUserData.usernameLower ||
                "";

            if (canonicalUsername) {
                localStorage.setItem(
                    "username",
                    canonicalUsername
                );
                localStorage.setItem(
                    "currentUsername",
                    canonicalUsername
                );
            }


            console.log(
                "✅ تم العثور على الحساب بنجاح!"
            );


            console.log(
                "🆔 Document ID:",
                currentUserDocId
            );


            console.log(
                "👤 بيانات الحساب:",
                currentUserData
            );


            return foundUser;
        }


        /* =====================================================
           FETCH MY GRADE
        ===================================================== */

        async function fetchMyGrade() {

            const user =
                await findCurrentUser();


            const userData =
                user.data;


            /*
             * الأولوية:
             *
             * grade
             * servantGrade
             * class
             * ثم localStorage
             */

            myGrade =
                normalizeText(
                    userData.grade
                );


            if (!myGrade) {

                myGrade =
                    normalizeText(
                        userData.servantGrade
                    );
            }


            if (!myGrade) {

                myGrade =
                    normalizeText(
                        userData.class
                    );
            }


            if (!myGrade) {

                myGrade =
                    normalizeText(
                        localStorage.getItem(
                            "servantGrade"
                        )
                    );
            }


            if (!myGrade) {

                myGrade =
                    normalizeText(
                        localStorage.getItem(
                            "grade"
                        )
                    );
            }


            if (!myGrade) {

                throw new Error(
                    "تم العثور على حسابك، لكن الصف الدراسي غير محفوظ في Firebase."
                );
            }


            localStorage.setItem(
                "servantGrade",
                myGrade
            );


            localStorage.setItem(
                "grade",
                myGrade
            );


            gradeBadge.innerText =
                myGrade;


            rosterTitle.innerHTML =
                `إدارة مخدومي <span>${escapeHtml(myGrade)}</span>`;


            console.log(
                "🎓 صف الخادم:",
                myGrade
            );


            console.log(
                "🆔 Document ID:",
                currentUserDocId
            );
        }


        /* =====================================================
           FETCH ALL USERS
        ===================================================== */

        async function fetchAllUsers() {

            console.log(
                "📥 جاري تحميل users..."
            );


            const usersSnapshot =
                await getDocs(
                    collection(
                        db,
                        "users"
                    )
                );


            allUsers = [];


            usersSnapshot.forEach(
                (docSnap) => {

                    allUsers.push({

                        id:
                            docSnap.id,

                        ...docSnap.data()

                    });
                }
            );


            console.log(
                "👥 إجمالي المستخدمين:",
                allUsers.length
            );


            return allUsers;
        }


        /* =====================================================
           FETCH SERVANTS
        ===================================================== */

        async function fetchServants() {

            servantsListContainer.innerHTML = `

                <div class="loading-box">

                    <i class="fas fa-spinner fa-spin"></i>

                    جاري تحميل مخدومي صفك...

                </div>

            `;


            try {

                /*
                 * أولاً:
                 * نحدد الخادم الحالي وصفه
                 */

                await fetchMyGrade();


                /*
                 * ثانياً:
                 * نجيب users
                 */

                await fetchAllUsers();


                /*
                 * ثالثاً:
                 * فلترة نفس الصف
                 */

                myServants =
                    allUsers.filter(
                        (person) => {

                            const personGrade =
                                normalizeText(
                                    person.grade ||
                                    person.servantGrade ||
                                    person.class ||
                                    ""
                                );


                            return (
                                normalizeKey(
                                    personGrade
                                ) ===
                                normalizeKey(
                                    myGrade
                                )
                            );
                        }
                    );


                /*
                 * لو مش عايز الخادم نفسه يظهر
                 * في قائمة مخدوميه، نستبعده
                 */

                myServants =
                    myServants.filter(
                        (person) =>
                            person.id !==
                            currentUserDocId
                    );


                console.log(
                    "🎓 الصف المطلوب:",
                    myGrade
                );


                console.log(
                    "👥 مخدومو الصف:",
                    myServants
                );


                renderNamesList(
                    myServants
                );


            } catch (error) {

                console.error(
                    "🔥 FIREBASE ERROR:",
                    error
                );


                let message =
                    error.message ||
                    "حدث خطأ غير معروف.";


                if (
                    error.code ===
                    "permission-denied"
                ) {

                    message =
                        "ليس لديك صلاحية قراءة بيانات users من Firebase.";
                }


                if (
                    error.code ===
                    "failed-precondition"
                ) {

                    message =
                        "يوجد شرط أو إعداد في Firestore يحتاج إلى مراجعة.";
                }


                servantsListContainer.innerHTML = `

                    <div class="error-box">

                        <i class="fas fa-triangle-exclamation"></i>

                        <h3>
                            تعذر تحميل البيانات
                        </h3>

                        <p style="margin-top:10px;">
                            ${escapeHtml(message)}
                        </p>

                        <p style="
                            margin-top:8px;
                            direction:ltr;
                            color:#b42318;
                        ">
                            ${escapeHtml(
                                error.code ||
                                "unknown-error"
                            )}
                        </p>

                        <button
                            class="retry-btn"
                            onclick="location.reload()">

                            <i class="fas fa-rotate-right"></i>

                            إعادة المحاولة

                        </button>

                    </div>

                `;


                countPill.innerText =
                    "0";
            }
        }

        /* =====================================================
           FORMAT DATE
        ===================================================== */

        function formatDate(value) {

            if (!value) {

                return "غير متوفر";
            }


            try {

                /*
                 * Firebase Timestamp
                 */

                if (
                    typeof value === "object" &&
                    typeof value.toDate === "function"
                ) {

                    return value
                        .toDate()
                        .toLocaleDateString(
                            "ar-EG"
                        );
                }


                /*
                 * Firestore Timestamp-like
                 */

                if (
                    typeof value === "object" &&
                    value.seconds !== undefined
                ) {

                    return new Date(
                        Number(value.seconds) * 1000
                    ).toLocaleDateString(
                        "ar-EG"
                    );
                }


                const date =
                    new Date(value);


                if (
                    !isNaN(
                        date.getTime()
                    )
                ) {

                    return date.toLocaleDateString(
                        "ar-EG"
                    );
                }

            } catch (error) {

                console.warn(
                    "⚠️ تعذر تنسيق التاريخ:",
                    error
                );
            }


            return String(value);
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        searchInput.addEventListener(
            "input",
            (e) => {

                const term =
                    normalizeKey(
                        e.target.value
                    );


                const filtered =
                    myServants.filter(
                        (person) => {

                            const name =
                                normalizeKey(
                                    person.fullName ||
                                    person.name ||
                                    person.username ||
                                    ""
                                );


                            return name.includes(
                                term
                            );
                        }
                    );


                renderNamesList(
                    filtered
                );
            }
        );


        /* =====================================================
           UPDATE POINTS
        ===================================================== */

        window.updatePoints =
            async function (
                docId,
                amount
            ) {

                const person =
                    myServants.find(
                        p =>
                            p.id ===
                            docId
                    );


                if (!person) {

                    alert(
                        "لم يتم العثور على المخدوم."
                    );

                    return;
                }


                const currentPoints =
                    Number(
                        person.points ?? 0
                    );


                let newPoints =
                    currentPoints +
                    Number(amount);


                if (newPoints < 0) {

                    newPoints = 0;
                }


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            docId
                        );


                    await updateDoc(
                        docRef,
                        {
                            points:
                                newPoints
                        }
                    );


                    person.points =
                        newPoints;


                    /*
                     * تحديث القائمة
                     */

                    renderNamesList(
                        getCurrentDisplayedList()
                    );


                    /*
                     * تحديث المودال
                     */

                    openServantDetails(
                        person
                    );


                    console.log(
                        "✅ تم تحديث النقاط:",
                        newPoints
                    );


                } catch (error) {

                    console.error(
                        "❌ خطأ في تحديث النقاط:",
                        error
                    );


                    alert(
                        "تعذر تحديث النقاط.\n\n" +
                        (
                            error.code ||
                            error.message ||
                            ""
                        )
                    );
                }
            };

                const val =

                    return;

                const person =

        /* =====================================================
           BAN / UNBAN
        ===================================================== */

        window.toggleBan =
            async function (
                docId,
                currentBanStatus
            ) {

                const newStatus =
                    !currentBanStatus;


                const actionText =
                    newStatus
                        ? "حظر"
                        : "فك الحظر";


                if (
                    !confirm(
                        `هل أنت متأكد من رغبتك في ${actionText} هذا المخدوم؟`
                    )
                ) {

                    return;
                }


                const person =
                    myServants.find(
                        p =>
                            p.id ===
                            docId
                    );


                if (!person) {

                    alert(
                        "لم يتم العثور على المخدوم."
                    );

                    return;
                }


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            docId
                        );


                    /*
                     * نحفظ الاثنين حتى تكون
                     * الصفحات القديمة والجديدة متوافقة
                     */

                    await updateDoc(
                        docRef,
                        {
                            banned:
                                newStatus,

                            isBanned:
                                newStatus
                        }
                    );


                    person.banned =
                        newStatus;


                    person.isBanned =
                        newStatus;


                    renderNamesList(
                        getCurrentDisplayedList()
                    );


                    openServantDetails(
                        person
                    );


                    console.log(
                        newStatus
                            ? "🔒 تم حظر المستخدم"
                            : "🔓 تم فك الحظر"
                    );


                } catch (error) {

                    console.error(

                        error

                    alert(

                        (

                            error.message ||
                            ""

                }
            };


        /* =====================================================
           CURRENT DISPLAYED LIST
        ===================================================== */

        function getCurrentDisplayedList() {

            const term =
                normalizeKey(
                    searchInput.value
                );


            if (!term) {

                return myServants;
            }


            return myServants.filter(
                (person) => {

                    const name =
                        normalizeKey(
                            person.fullName ||
                            person.name ||
                            person.username ||
                            ""
                        );


                    return name.includes(
                        term
                    );
                }
            );
        }
