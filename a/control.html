<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>مخدومين صفّي - لوحة الخادم</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --navy-deep: #041a36;
            --navy-mid: #062348;
            --navy-edge: #000b18;

            --maroon-dark: #5d101c;
            --maroon: #7d1424;
            --maroon-light: #9b1c30;

            --ink: #1f1715;
            --muted: #8a817c;

            --white: #ffffff;
            --soft-white: #fafafa;

            --border: #eadfe0;
            --gold: #c9a24b;

            --green: #137333;
            --red: #b42318;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: 'Tajawal', sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    var(--navy-mid) 0%,
                    var(--navy-deep) 48%,
                    var(--navy-edge) 100%
                );

            color: var(--ink);
            min-height: 100dvh;

            padding:
                max(14px, env(safe-area-inset-top))
                15px
                max(25px, env(safe-area-inset-bottom));

            overflow-x: hidden;
        }

        .topbar {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .menu-btn {
            width: 48px;
            height: 48px;

            border: none;
            border-radius: 14px;

            background: #ffffff;
            color: var(--maroon);

            font-size: 20px;
            cursor: pointer;

            box-shadow: 0 8px 22px rgba(0, 0, .25);
            transition: .25s;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            background: #fff7f8;
        }

        .class-badge {
            background: #ffffff;
            border-radius: 15px;
            padding: 10px 17px;

            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 14px;
            font-weight: 700;

            color: var(--navy-deep);

            box-shadow: 0 8px 22px rgba(0, 0, 0, .25);
        }

        .class-badge i {
            color: var(--maroon);
        }

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 11, 24, .72);
            backdrop-filter: blur(5px);

            opacity: 0;
            visibility: hidden;

            transition: .3s;
            z-index: 5000;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;

            top: 0;
            right: -350px;

            width: min(330px, 88vw);
            height: 100dvh;

            background: #ffffff;
            border-left: 5px solid var(--maroon);

            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(20px, env(safe-area-inset-bottom));

            box-shadow: -20px 0 60px rgba(0, 0, .3);

            z-index: 6000;

            transition: right .35s ease;

            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);

            margin-bottom: 18px;
        }

        .sidebar-header h3 {
            font-family: 'Amiri', serif;
            color: var(--maroon);
            font-size: 24px;
        }

        .close-btn {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 12px;

            background: #fff2f3;
            color: var(--maroon);

            font-size: 19px;
            cursor: pointer;
        }

        .sidebar-links {
            list-style: none;

            display: flex;
            flex-direction: column;

            gap: 9px;
            overflow-y: auto;
        }

        .sidebar-links a,
        .logout-link {
            width: 100%;
            min-height: 48px;

            display: flex;
            align-items: center;

            gap: 13px;
            padding: 11px 15px;

            border-radius: 13px;

            background: #faf7f7;
            border: 1px solid #eee3e4;

            color: var(--ink);

            text-decoration: none;

            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
            transition: .22s;
        }

        .sidebar-links a i,
        .logout-link i {
            width: 22px;
            text-align: center;
            color: var(--maroon);
        }

        .sidebar-links a:hover {
            transform: translateX(-4px);

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: white;
            border-color: transparent;

            box-shadow: 0 8px 20px rgba(125, 20, 36, .22);
        }

        .sidebar-links a:hover i {
            color: white;
        }

        .logout-link {
            margin-top: auto;

            background: #fff5f5;
            color: #9f1239;
            border-color: #f2cccc;
        }

        .logout-link:hover {
            background: #9f1239;
            color: white;
        }

        .logout-link:hover i {
            color: white;
        }

        .main-content {
            width: 100%;
            max-width: 1050px;

            margin: 0 auto;

            background: #ffffff;
            border-radius: 30px;

            padding: 32px;

            box-shadow: 0 30px 75px rgba(0, 0, 0, .35);

            position: relative;
            overflow: hidden;
        }

        .main-content::before {
            content: "";

            position: absolute;

            top: 0;
            right: 0;
            left: 0;

            height: 7px;

            background:
                linear-gradient(
                    90deg,
                    var(--navy-deep),
                    var(--maroon),
                    var(--maroon-light),
                    var(--navy-deep)
                );
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-icon {
            width: 70px;
            height: 70px;

            margin: 4px auto 15px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: white;
            font-size: 30px;

            box-shadow: 0 12px 25px rgba(125, 20, 36, .28);
        }

        .page-header h1 {
            font-family: 'Amiri', serif;

            color: var(--ink);

            font-size: clamp(28px, 6vw, 38px);

            line-height: 1.5;
            margin-bottom: 5px;
        }

        .page-header h1 span {
            color: var(--maroon);
        }

        .page-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .class-info {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;

            padding: 17px 20px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #f8f1f2,
                    #fff
                );

            border: 1px solid #eadbdd;
            margin-bottom: 18px;
        }

        .class-title {
            display: flex;
            align-items: center;
            gap: 11px;

            color: var(--navy-deep);

            font-weight: 700;
            font-size: 15px;
        }

        .class-title i {
            color: var(--maroon);
            font-size: 21px;
        }

        .count-pill {
            background: white;

            border: 1px solid #dfc7ca;

            color: var(--maroon);

            border-radius: 12px;

            padding: 7px 13px;

            font-size: 13px;
            font-weight: 800;

            white-space: nowrap;

            box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
        }

        .search-box {
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            min-height: 52px;

            padding: 12px 48px 12px 16px;

            border: 1px solid #e3d8d9;
            border-radius: 15px;

            background: #fafafa;
            color: var(--ink);

            font-family: 'Tajawal', sans-serif;
            font-size: 15px;

            outline: none;
            transition: .25s;
        }

        .search-input:focus {
            background: white;

            border-color: var(--maroon);

            box-shadow:
                0 0 0 4px rgba(125, 20, 36, .08);
        }

        .search-box::before {
            content: "\f002";

            font-family: "Font Awesome 6 Free";
            font-weight: 900;

            position: absolute;

            right: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--maroon);

            z-index: 2;
        }

        .search-input::placeholder {
            color: #aaa2a0;
        }

        .servants-list {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 13px;
        }

        .servant-name-card {
            background: #ffffff;

            border: 1px solid #eadfe0;
            border-radius: 18px;

            padding: 17px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            cursor: pointer;
            transition: .25s;

            box-shadow:
                0 6px 18px rgba(31, 23, 21, .055);
        }

        .servant-name-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(125, 20, 36, .35);

            box-shadow:
                0 14px 30px rgba(31, 23, 21, .11);
        }

        .servant-name-card.banned-card {
            border-color: #e7a9ad;

            background:
                linear-gradient(
                    135deg,
                    #fff,
                    #fff5f5
                );
        }

        .card-info {
            display: flex;
            align-items: center;

            gap: 12px;
            min-width: 0;
        }

        .avatar {
            width: 49px;
            height: 49px;

            min-width: 49px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            color: white;
            font-size: 20px;

            box-shadow:
                0 7px 15px rgba(125, 20, 36, .18);
        }

        .card-text {
            min-width: 0;
        }

        .card-info h3 {
            font-family: 'Amiri', serif;

            font-size: 21px;
            color: var(--ink);

            margin-bottom: 1px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-info span {
            display: block;

            color: var(--muted);

            font-size: 12px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-open-control {
            border: none;

            background: #f9f0f1;
            color: var(--maroon);

            padding: 9px 12px;

            border-radius: 11px;

            font-family: 'Tajawal', sans-serif;
            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;
            cursor: pointer;

            pointer-events: none;
            transition: .2s;
        }

        .servant-name-card:hover .btn-open-control {
            background: var(--maroon);
            color: white;
        }

        .loading-box {
            grid-column: 1 / -1;

            padding: 55px 20px;

            text-align: center;

            color: var(--maroon);
            font-size: 16px;
        }

        .loading-box i {
            display: block;

            font-size: 30px;
            margin-bottom: 12px;
        }

        .error-box {
            grid-column: 1 / -1;

            padding: 28px;

            text-align: center;

            background: #fff7f7;

            border: 1px solid #efc2c5;
            border-radius: 18px;

            color: #8b2630;
        }

        .error-box i {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .error-box p {
            word-break: break-word;
        }

        .retry-btn {
            margin-top: 17px;

            padding: 10px 18px;

            border: none;
            border-radius: 11px;

            background: var(--maroon);
            color: white;

            font-family: 'Tajawal', sans-serif;
            font-weight: 700;

            cursor: pointer;
        }

        .servant-modal {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -47%)
                scale(.96);

            width: min(900px, 94vw);

            max-height: 90dvh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 27px;

            padding: 27px;

            z-index: 7000;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition: .28s ease;

            box-shadow:
                0 35px 90px rgba(0, 0, .42);
        }

        .servant-modal.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        .servant-modal::-webkit-scrollbar {
            width: 7px;
        }

        .servant-modal::-webkit-scrollbar-thumb {
            background: #d8c4c7;
            border-radius: 10px;
        }

        .modal-header-custom {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding-bottom: 15px;

            border-bottom: 1px solid #eee2e3;
            margin-bottom: 20px;
        }

        .modal-header-custom h2 {
            font-family: 'Amiri', serif;

            color: var(--maroon);
            font-size: 24px;
        }

        .modal-close {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: #fff2f3;
            color: var(--maroon);

            font-size: 18px;
            cursor: pointer;

            transition: .2s;
        }

        .modal-close:hover {
            background: var(--maroon);
            color: white;
        }

        .servant-profile-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
            padding: 17px;

            background:
                linear-gradient(
                    135deg,
                    #f8f0f1,
                    #fff
                );

            border-radius: 17px;
            border: 1px solid #eadbdd;
        }

        .profile-name {
            display: flex;
            align-items: center;

            gap: 12px;
            min-width: 0;
        }

        .profile-name-icon {
            width: 51px;
            height: 51px;

            min-width: 51px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    var(--maroon-light),
                    var(--maroon-dark)
                );

            font-size: 21px;
        }

        .servant-profile-header h2 {
            font-family: 'Amiri', serif;

            color: var(--ink);
            font-size: 26px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .grade-pill {
            background: white;

            border: 1px solid #dcc4c7;

            color: var(--maroon);

            padding: 7px 13px;

            border-radius: 11px;

            font-size: 13px;
            font-weight: 800;

            white-space: nowrap;
        }

        .control-section {
            border: 1px solid #eadfe0;
            border-radius: 18px;

            overflow: hidden;
            margin-bottom: 18px;
        }

        .section-title {
            padding: 13px 17px;

            background:
                linear-gradient(
                    135deg,
                    #f8f0f1,
                    #fff
                );

            color: var(--maroon);

            font-family: 'Amiri', serif;

            font-size: 20px;

            border-bottom: 1px solid #eadfe0;
        }

        .control-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 0;
        }

        .control-item {
            padding: 18px;

            min-width: 0;

            border-left: 1px solid #eee5e5;
        }

        .control-item:last-child {
            border-left: none;
        }

        .control-label {
            color: var(--muted);

            font-size: 12px;

            margin-bottom: 9px;

            display: block;
        }

        .points-row {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 6px;
        }

        .points-badge {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 95px;

            padding: 8px 12px;

            border-radius: 11px;

            background: #fff9eb;

            border: 1px solid #ead49e;

            color: #8a6518;

            font-weight: 800;
            font-size: 13px;
        }

        .btn-action {
            min-width: 38px;
            height: 36px;

            padding: 0 9px;

            border-radius: 9px;

            background: white;

            border: 1px solid #dfd2d3;

            color: var(--ink);

            font-family: 'Tajawal', sans-serif;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;
        }

        .btn-action.plus:hover {
            background: #137333;
            color: white;
            border-color: #137333;
        }

        .btn-action.minus:hover {
            background: #b42318;
            color: white;
            border-color: #b42318;
        }

        .btn-action.save {
            background: var(--maroon);
            border-color: var(--maroon);
            color: white;
        }

        .btn-action.save:hover {
            background: var(--maroon-dark);
        }

        .custom-input {
            width: 65px;
            height: 36px;

            border: 1px solid #dfd2d3;
            border-radius: 9px;

            text-align: center;

            outline: none;

            font-family: 'Tajawal', sans-serif;

            font-weight: 700;

            color: var(--ink);
        }

        .custom-input:focus {
            border-color: var(--maroon);

            box-shadow:
                0 0 0 3px rgba(125, 20, 36, .08);
        }

        .btn-ban {
            width: 100%;
            min-height: 43px;

            border-radius: 11px;

            cursor: pointer;

            font-family: 'Tajawal', sans-serif;
            font-weight: 800;

            transition: .2s;
        }

        .btn-ban.ban {
            background: #fff5f5;

            color: #b42318;

            border: 1px solid #efc4c6;
        }

        .btn-ban.ban:hover {
            background: #b42318;
            color: white;
        }

        .btn-ban.unban {
            background: #f0faf3;

            color: #137333;

            border: 1px solid #b9ddc2;
        }

        .btn-ban.unban:hover {
            background: #137333;
            color: white;
        }

        .personal-details-box {
            border: 1px solid #eadfe0;
            border-radius: 18px;
            overflow: hidden;
        }

        .personal-details-box h3 {
            padding: 13px 17px;
            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #f8f0f1,
                    #fff
                );

            color: var(--maroon);

            font-family: 'Amiri', serif;

            font-size: 20px;

            border-bottom: 1px solid #eadfe0;
        }

        .details-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            padding: 15px;
        }

        .detail-item {
            background: #fafafa;

            border: 1px solid #eee5e5;

            border-radius: 12px;

            padding: 12px 14px;

            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            gap: 10px;

            font-size: 13px;
        }

        .detail-item strong {
            color: var(--maroon);
            white-space: nowrap;
        }

        .detail-item span {
            color: var(--ink);

            text-align: left;

            word-break: break-word;
        }

        @media (max-width: 760px) {

            .main-content {
                padding: 24px 18px 25px;
                border-radius: 25px;
            }

            .servants-list {
                grid-template-columns: 1fr;
            }

            .control-grid {
                grid-template-columns: 1fr;
            }

            .control-item {
                border-left: none;

                border-bottom: 1px solid #eee5e5;
            }

            .control-item:last-child {
                border-bottom: none;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {

            body {
                padding-left: 10px;
                padding-right: 10px;
            }

            .topbar {
                margin-bottom: 10px;
            }

            .class-badge {
                font-size: 12px;
                padding: 9px 12px;
            }

            .main-content {
                padding: 22px 14px;
                border-radius: 22px;
            }

            .header-icon {
                width: 62px;
                height: 62px;
                font-size: 26px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .class-info {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .class-title {
                justify-content: center;
            }

            .count-pill {
                text-align: center;
            }

            .servant-name-card {
                padding: 13px;
            }

            .card-info h3 {
                font-size: 19px;
            }

            .btn-open-control {
                padding: 8px;
                font-size: 10px;
            }

            .servant-modal {
                width: 96vw;
                max-height: 94dvh;

                padding: 18px;
                border-radius: 21px;
            }

            .servant-profile-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .servant-profile-header h2 {
                font-size: 23px;
                max-width: 100%;
            }

            .grade-pill {
                align-self: flex-start;
            }

            .points-row {
                gap: 5px;
            }

            .points-badge {
                width: 100%;
            }

            .custom-input {
                flex: 1;
            }

            .details-grid {
                padding: 10px;
            }

            .detail-item {
                flex-direction: column;
                gap: 5px;
            }

            .detail-item span {
                text-align: right;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <button id="menuBtn" class="menu-btn">
            <i class="fas fa-bars"></i>
        </button>

        <div class="servant-badge">

            <i class="fas fa-user-shield"></i>

            صفّك:

            <span id="currentServantGradeBadge">
                جاري التحميل...
            </span>

        </div>

    </div>


    <!-- SIDEBAR -->

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">

    <!-- FIREBASE -->

    <script type="module">

        import {

        import {

            collection,

        /* =========================
           FIREBASE CONFIG
        ========================== */

        const firebaseConfig = {

            apiKey: "AIzaSyBcUuUmMe8Ok8Ap7IspdQP5Zp8VHykUWE",

            authDomain:
                "st-mina-c01ec.firebaseapp.com",

            databaseURL:
                "https://st-mina-c01ec-default-rtdb.firebaseio.com",

            projectId:
                "st-mina-c01ec",

            storageBucket:
                "st-mina-c01ec.firebasestorage.app",

            messagingSenderId:
                "792349150559",

            appId:
                "1:792349150559:web:8a86bbf57c2c7e351f3aea",

            measurementId:
                "G-XZGSBG05KR"

        };


        const app =
            initializeApp(firebaseConfig);

        const db =

        /* =========================

        const menuBtn =

            document.getElementById("closeBtn");

        /* =========================
           SIDEBAR
        ========================== */

        function openSidebar() {

            sidebar.classList.add(
                "active"
            );

            overlay.classList.add(
                "active"
            );

        }


        function closeSidebar() {

            sidebar.classList.remove(
                "active"
            );

            if (
                !servantModal.classList.contains(
                    "active"
                )
            ) {

                overlay.classList.remove(
                    "active"
                );

            }

        }


        function closeServantModal() {

            servantModal.classList.remove(
                "active"
            );

            overlay.classList.remove(
                "active"
            );

        }


        menuBtn.addEventListener(
            "click",
            openSidebar

        closeBtn.addEventListener(
            "click",
            closeSidebar

        closeModalBtn.addEventListener(
            "click",

        overlay.addEventListener(
            "click",
            () => {

                closeSidebar();

                closeServantModal();

            }
        );


        /* =========================
           LOGOUT
        ========================== */

        logoutBtn.addEventListener(
            "click",
            () => {

                if (
                    confirm(
                        "هل تريد تسجيل الخروج حقاً؟"
                    )
                ) {

                    localStorage.clear();

                    window.location.href =
                        "../index.html";

                }

            }
        );


        /* =========================
           تنظيف النص
        ========================== */

        function normalizeText(value) {

            return String(
                value || ""
            )
                .trim()
                .replace(/\s+/g, " ");

        }


        /* =========================
           الحصول على ID المستخدم
        ========================== */

        function getCurrentUserId() {

            const urlParams =
                new URLSearchParams(
                    window.location.search
                );

            const urlUser =
                normalizeText(
                    urlParams.get("user")
                );

            const storedId =
                normalizeText(
                    localStorage.getItem(
                        "userDocId"
                    )
                );

            /*
               الأولوية للـ URL
               ثم userDocId
            */

            return (
                urlUser ||
                storedId ||
                ""
            );

        }


        /* =========================
           ID المستخدم الحالي
        ========================== */

        const currentUserId =
            getCurrentUserId();


        console.log(
            "👤 Current User ID:",
            currentUserId
        );


        /* =========================
           البيانات
        ========================== */

        let myGrade = "";

        let myServants = [];


        /* =========================
           جلب صف المستخدم من Firebase
        ========================== */

        async function fetchMyGrade() {

            if (!currentUserId) {

                throw new Error(
                    "لم يتم العثور على معرف المستخدم."
                );

            }


            const userRef =
                doc(
                    db,
                    "users",
                    currentUserId
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (!userSnap.exists()) {

                throw new Error(
                    "مستند المستخدم غير موجود في users."
                );

            }


            const userData =
                userSnap.data();


            console.log(
                "🔥 بيانات المستخدم الحالية من Firebase:",
                userData
            );


            /*
               نأخذ grade فقط.
               لا نستخدم localStorage هنا.
            */

            myGrade =
                normalizeText(
                    userData.grade
                );


            if (!myGrade) {

                /*
                   لو grade غير موجود
                   نحاول stage كحل احتياطي فقط
                */

                myGrade =
                    normalizeText(
                        userData.stage
                    );

            }


            if (!myGrade) {

                throw new Error(
                    "الصف الدراسي غير محفوظ في Firebase."
                );

            }


            /* تحديث localStorage بالقيمة الجديدة */

            localStorage.setItem(
                "servantGrade",
                myGrade
            );

            localStorage.setItem(
                "grade",
                myGrade
            );


            gradeBadge.innerText =
                myGrade;


            rosterTitle.innerText =
                `إدارة مخدومي ${myGrade}`;


            console.log(
                "🎓 الصف المستخدم:",
                myGrade
            );

        }


        /* =========================
           تحميل المخدومين
        ========================== */

        async function fetchServants() {

            servantsListContainer.innerHTML = `

                <div class="loading-box">

                    <i class="fas fa-spinner fa-spin"></i>

                    جاري تحميل مخدومي صفك...

                </div>

            `;


            try {

                /*
                   أولاً:
                   نجيب الصف الحقيقي من Firebase
                */

                await fetchMyGrade();


                /*
                   ثانياً:
                   نجيب كل المستخدمين
                */

                const querySnapshot =
                    await getDocs(
                        collection(
                            db,
                            "users"
                        )
                    );


                const allServants = [];


                querySnapshot.forEach(
                    (docSnap) => {

                        allServants.push({

                            id:
                                docSnap.id,

                            ...docSnap.data()

                        });

                    }
                );


                console.log(
                    "👥 جميع المستخدمين:",
                    allServants
                );


                /*
                   ثالثاً:
                   فلترة حسب grade الحقيقي
                */

                myServants =
                    allServants.filter(
                        (person) => {

                            const personGrade =
                                normalizeText(
                                    person.grade
                                );


                            return (
                                personGrade ===
                                myGrade
                            );

                        }
                    );


                console.log(
                    "✅ مخدومو الصف:",
                    myServants
                );


                renderNamesList(
                    myServants
                );


            } catch (error) {

                console.error(
                    "🔥 FIREBASE ERROR:",
                    error
                );


                servantsListContainer.innerHTML = `

                    <div class="error-box">

                        <i class="fas fa-triangle-exclamation"></i>

                        <h3>
                            تعذر تحميل البيانات
                        </h3>

                        <p style="margin-top:10px;">
                            ${escapeHtml(
                                error.message ||
                                "حدث خطأ غير معروف."
                            )}
                        </p>

                        <p style="
                            margin-top:10px;
                            direction:ltr;
                            word-break:break-word;
                            color:#ffb3b8;
                        ">
                            ${escapeHtml(
                                error.code ||
                                "unknown-error"
                            )}
                        </p>

                        <button
                            class="retry-btn"
                            onclick="location.reload()"
                        >
                            🔄 إعادة المحاولة
                        </button>

                    </div>

                `;

                countPill.innerText = "0";

            }

        }


        /* =========================
           عرض القائمة
        ========================== */

        function renderNamesList(
            dataList
        ) {

            servantsListContainer.innerHTML =
                "";

            countPill.innerText =
                dataList.length;


            if (
                dataList.length === 0
            ) {

                servantsListContainer.innerHTML = `

                    <div class="loading-box">

                        <i class="fas fa-users-slash"></i>

                        لا يوجد مخدومون في صفك حالياً.

                    </div>

                `;

                return;

            }


            dataList.forEach(
                (person) => {

                    const name =
                        person.name ||
                        person.fullName ||
                        person.username ||
                        "بدون اسم";


                    const grade =
                        person.grade ||
                        person.stage ||
                        "غير محدد";


                    const points =
                        Number(
                            person.points || 0
                        );


                    const isBanned =
                        person.banned === true;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        `servant-name-card ${
                            isBanned
                                ? "banned-card"
                                : ""
                        }`;


                    card.innerHTML = `

                        <div class="card-info">

                            <i class="fas fa-user-circle"></i>

                            <div>

                                <h3>
                                    ${escapeHtml(
                                        name
                                    )}
                                </h3>

                                <span>

                                    ${escapeHtml(
                                        grade
                                    )}

                                    |

                                    ${points}

                                    نقطة

                                    ${
                                        isBanned
                                            ? " | (محظور)"
                                            : ""
                                    }

                                </span>

                            </div>

                        </div>

                        <button
                            class="btn-open-control"
                        >

                            إدارة وتحكم

                            <i class="fas fa-arrow-left"></i>

                        </button>

                    `;


                    card.addEventListener(
                        "click",
                        () => {

                            openServantDetails(
                                person
                            );

                        }
                    );


                    servantsListContainer.appendChild(
                        card
                    );

                }
            );

        }


        /* =========================
           حماية النصوص
        ========================== */

        function escapeHtml(
            value
        ) {

            return String(
                value
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           فتح بيانات المخدوم
        ========================== */

        function openServantDetails(
            person
        ) {

            const modalContent =
                document.getElementById(
                    "modalServantContent"
                );


            const name =
                person.name ||
                person.fullName ||
                person.username ||
                "بدون اسم";


            const grade =
                person.grade ||
                person.stage ||
                "غير محدد";


            const points =
                Number(
                    person.points || 0
                );


            const isBanned =
                person.banned === true;


            modalContent.innerHTML = `

                <div class="servant-profile-header">

                    <h2>

                        <i class="fas fa-user-shield"></i>

                        ${escapeHtml(
                            name
                        )}

                    </h2>

                    <span class="grade-pill">

                        ${escapeHtml(
                            grade
                        )}

                    </span>

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    النقاط الحالية
                                </th>

                                <th>
                                    تعديل النقاط
                                </th>

                                <th>
                                    حالة الحظر
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            <tr>

                                <td>

                                    <span
                                        id="points-${person.id}"
                                        class="points-badge"
                                    >

                                        ${points}
                                        نقطة

                                    </span>

                                </td>


                                <td>

                                    <div class="points-controls">

                                        <button
                                            class="btn-action minus"
                                            onclick="updatePoints('${person.id}', -5)"
                                        >
                                            -5
                                        </button>

                                        <button
                                            class="btn-action minus"
                                            onclick="updatePoints('${person.id}', -1)"
                                        >
                                            -1
                                        </button>

                                        <input
                                            type="number"
                                            id="custom-points-${person.id}"
                                            class="custom-input"
                                            placeholder="رقم"
                                        >

                                        <button
                                            class="btn-action plus"
                                            onclick="updatePoints('${person.id}', 1)"
                                        >
                                            +1
                                        </button>

                                        <button
                                            class="btn-action plus"
                                            onclick="updatePoints('${person.id}', 5)"
                                        >
                                            +5
                                        </button>

                                        <button
                                            class="btn-action save"
                                            onclick="saveCustomPoints('${person.id}')"
                                        >

                                            <i class="fas fa-check"></i>

                                        </button>

                                    </div>

                                </td>


                                <td>

                                    <button
                                        class="btn-ban ${
                                            isBanned
                                                ? "unban"
                                                : "ban"
                                        }"
                                        onclick="toggleBan('${person.id}', ${isBanned})"
                                    >

                                        ${
                                            isBanned

                                                ? `
                                                    <i class="fas fa-unlock"></i>
                                                    إلغاء الحظر
                                                `

                                                : `
                                                    <i class="fas fa-lock"></i>
                                                    حظر
                                                `
                                        }

                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>


                <div class="personal-details-box">

                    <h3>

                        <i class="fas fa-id-card"></i>

                        البيانات الشخصية الكاملة

                    </h3>


                    <div class="details-grid">

                        <div class="detail-item">

                            <strong>
                                رقم الهاتف:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.userId ||
                                    person.phone ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                هاتف الأب:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.fatherPhone ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                هاتف الأم:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.motherPhone ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                العنوان:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.address ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                تاريخ الميلاد:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.birthdate ||
                                    person.birthDate ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                تاريخ التسجيل:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.createdAt ||
                                    "غير متوفر"
                                )}

                    </div>

                </div>

            `;


            servantModal.classList.add(
                "active"
            );

            overlay.classList.add(
                "active"
            );

        }


        /* =========================
           SEARCH
        ========================== */

        searchInput.addEventListener(
            "input",
            (e) => {

                const term =
                    e.target.value
                    .trim()
                    .toLowerCase();


                const filtered =
                    myServants.filter(
                        (person) => {

                            const name =
                                (
                                    person.name ||
                                    person.fullName ||
                                    person.username ||
                                    ""
                                )
                                    .toString()
                                    .toLowerCase();


                            return name.includes(
                                term
                            );

                        }
                    );


                renderNamesList(
                    filtered
                );

            }
        );


        /* =========================
           UPDATE POINTS
        ========================== */

        window.updatePoints =
            async function (
                docId,
                amount
            ) {

                const person =
                    myServants.find(
                        p =>
                            p.id ===
                            docId
                    );


                if (!person) return;


                const currentPoints =
                    Number(
                        person.points || 0
                    );


                let newPoints =
                    currentPoints +
                    amount;


                if (
                    newPoints < 0
                ) {

                    newPoints = 0;

                }


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            docId
                        );


                    await updateDoc(
                        docRef,
                        {
                            points:
                                newPoints
                        }
                    );


                    person.points =
                        newPoints;


                    const badge =
                        document.getElementById(
                            `points-${docId}`
                        );


                    if (badge) {

                        badge.innerText =
                            `${newPoints} نقطة`;

                    }


                    renderNamesList(
                        myServants
                    );


                } catch (error) {

                    console.error(
                        "خطأ في تحديث النقاط:",
                        error
                    );


                    alert(
                        "تعذر تحديث النقاط.\n\n" +
                        (
                            error.code ||
                            ""
                        )
                    );

                }

            };


        /* =========================
           CUSTOM POINTS
        ========================== */

        window.saveCustomPoints =
            async function (
                docId
            ) {

                const inputEl =
                    document.getElementById(
                        `custom-points-${docId}`
                    );


                if (!inputEl) return;


                const val =
                    parseInt(
                        inputEl.value,
                        10
                    );


                if (
                    isNaN(val) ||
                    val < 0
                ) {

                    alert(
                        "يرجى كتابة رقم صحيح أكبر من أو يساوي صفر."
                    );

                    return;

                }


                const person =
                    myServants.find(
                        p =>
                            p.id ===
                            docId
                    );


                if (!person) return;


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            docId
                        );


                    await updateDoc(
                        docRef,
                        {
                            points: val
                        }
                    );


                    person.points =
                        val;


                    const badge =
                        document.getElementById(
                            `points-${docId}`
                        );


                    if (badge) {

                        badge.innerText =
                            `${val} نقطة`;

                    }


                    inputEl.value =
                        "";


                    renderNamesList(
                        myServants
                    );


                    alert(
                        "تم حفظ النقاط بنجاح ✅"
                    );


                } catch (error) {

                    console.error(
                        "خطأ في حفظ النقاط:",
                        error
                    );


                    alert(
                        "تعذر حفظ النقاط.\n\n" +
                        (
                            error.code ||
                            ""
                        )
                    );

                }

            };


        /* =========================
           BAN / UNBAN
        ========================== */

        window.toggleBan =
            async function (
                docId,
                currentBanStatus
            ) {

                const newStatus =
                    !currentBanStatus;


                const actionText =
                    newStatus
                        ? "حظر"
                        : "فك حظر";


                if (
                    !confirm(
                        `هل أنت متأكد من رغبتك في ${actionText} هذا المخدوم؟`
                    )
                ) {

                    return;

                }


                const person =
                    myServants.find(
                        p =>
                            p.id ===
                            docId
                    );


                if (!person) return;


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            docId
                        );


                    await updateDoc(
                        docRef,
                        {
                            banned:
                                newStatus
                        }
                    );


                    person.banned =
                        newStatus;


                    openServantDetails(
                        person
                    );


                    renderNamesList(
                        myServants
                    );


                } catch (error) {

                    console.error(
