<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المستخدمين</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --navy: #061d39;
      --navy-dark: #020c19;
      --maroon: #7d1424;
      --maroon-dark: #5d101c;
      --maroon-light: #a51f35;
      --gold: #c9a24b;
      --ink: #211918;
      --muted: #817773;
      --line: #eadfe0;
      --surface: #ffffff;
      --soft: #faf6f6;
      --green: #137333;
      --red: #b42318;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      min-height: 100dvh;
      padding: 18px 14px 30px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Tajawal", sans-serif;
      background: radial-gradient(circle at top, #0a2d57 0, var(--navy) 45%, var(--navy-dark) 100%);
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      width: min(1100px, 100%);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #fff;
      font-weight: 800;
    }

    .topbar-title i { color: var(--gold); font-size: 22px; }

    .topbar-actions { display: flex; gap: 8px; }

    .topbar-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      color: var(--maroon);
      background: #fff;
      box-shadow: 0 8px 20px rgb(0 0 0 / 22%);
    }

    .topbar-btn:hover { transform: translateY(-2px); }

    .page {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 30px;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 30px 75px rgb(0 0 0 / 35%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--navy), var(--maroon), var(--gold), var(--maroon), var(--navy));
    }

    .page-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-size: 28px;
      background: linear-gradient(145deg, var(--maroon-light), var(--maroon-dark));
      box-shadow: 0 12px 25px rgb(125 20 36 / 28%);
    }

    h1 {
      color: var(--ink);
      font: 700 clamp(27px, 5vw, 38px) / 1.5 "Amiri", serif;
    }

    h1 span { color: var(--maroon); }

    .page-header p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 190px auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    .field {
      min-height: 48px;
      width: 100%;
      padding: 10px 14px;
      outline: none;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: #fff;
    }

    .field:focus {
      border-color: var(--maroon);
      box-shadow: 0 0 0 4px rgb(125 20 36 / 9%);
    }

    .search-wrap { position: relative; }
    .search-wrap i {
      position: absolute;
      top: 50%;
      right: 16px;
      color: var(--maroon);
      transform: translateY(-50%);
    }
    .search-wrap input { padding-right: 45px; }

    .primary-btn {
      min-height: 48px;
      padding: 0 17px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      font-weight: 800;
      background: var(--maroon);
    }

    .primary-btn:hover { background: var(--maroon-dark); }
    .primary-btn:disabled { cursor: wait; opacity: .65; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 14px 16px;
      border: 1px solid #eadbdd;
      border-radius: 15px;
      background: linear-gradient(135deg, #f8f1f2, #fff);
    }

    .status-row strong { color: var(--maroon); }
    .status-row small { color: var(--muted); }

    .users-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 6px 18px rgb(31 23 21 / 5%);
      transition: .2s ease;
    }

    .user-card:hover {
      border-color: rgb(125 20 36 / 35%);
      box-shadow: 0 14px 30px rgb(31 23 21 / 11%);
      transform: translateY(-2px);
    }

    .user-card.banned {
      border-color: #e7a9ad;
      background: linear-gradient(135deg, #fff, #fff5f5);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      font-size: 19px;
      background: linear-gradient(145deg, var(--maroon-light), var(--maroon-dark));
    }

    .user-text { min-width: 0; }
    .user-text h2 {
      overflow: hidden;
      color: var(--ink);
      font: 700 20px / 1.3 "Amiri", serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .user-text p {
      overflow: hidden;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .manage-btn {
      flex: 0 0 auto;
      padding: 9px 11px;
      border: 0;
      border-radius: 10px;
      color: var(--maroon);
      font-size: 12px;
      font-weight: 800;
      background: #f9f0f1;
    }
    .manage-btn:hover { color: #fff; background: var(--maroon); }

    .message {
      grid-column: 1 / -1;
      padding: 35px 18px;
      color: var(--maroon);
      text-align: center;
    }
    .message i { display: block; margin-bottom: 10px; font-size: 29px; }
    .message.error {
      color: #8b2630;
      border: 1px solid #efc2c5;
      border-radius: 17px;
      background: #fff7f7;
    }

    .overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 15px;
      background: rgb(0 11 24 / 72%);
      backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: .2s ease;
    }
    .overlay.active { opacity: 1; visibility: visible; }

    .modal {
      width: min(720px, 100%);
      max-height: 92dvh;
      overflow-y: auto;
      padding: 23px;
      border-radius: 23px;
      background: #fff;
      box-shadow: 0 35px 90px rgb(0 0 0 / 42%);
      transform: translateY(10px) scale(.98);
      transition: .2s ease;
    }
    .overlay.active .modal { transform: translateY(0) scale(1); }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { color: var(--maroon); font: 700 25px "Amiri", serif; }
    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 11px;
      color: var(--maroon);
      background: #fff2f3;
    }
    .icon-btn:hover { color: #fff; background: var(--maroon); }

    .modal-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 15px;
      border: 1px solid #eadbdd;
      border-radius: 16px;
      background: linear-gradient(135deg, #f8f0f1, #fff);
    }
    .modal-profile .avatar { width: 52px; height: 52px; }
    .modal-profile h3 { font: 700 24px "Amiri", serif; }
    .modal-profile p { margin-top: 2px; color: var(--muted); font-size: 13px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .form-group { display: grid; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { color: var(--muted); font-size: 13px; font-weight: 700; }

    .points-box {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .points-box .field { width: 90px; text-align: center; }
    .small-btn {
      min-height: 43px;
      padding: 0 11px;
      border: 1px solid #dfd2d3;
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      font-weight: 800;
    }
    .small-btn:hover { color: #fff; background: var(--maroon); border-color: var(--maroon); }
    .small-btn.plus:hover { background: var(--green); border-color: var(--green); }
    .small-btn.minus:hover { background: var(--red); border-color: var(--red); }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .danger-btn, .success-btn {
      min-height: 45px;
      padding: 0 15px;
      border-radius: 11px;
      font-weight: 800;
    }
    .danger-btn { border: 1px solid #efc4c6; color: var(--red); background: #fff5f5; }
    .danger-btn:hover { color: #fff; background: var(--red); }
    .danger-btn.unban { color: var(--green); border-color: #b9ddc2; background: #f0faf3; }
    .danger-btn.unban:hover { color: #fff; background: var(--green); }
    .success-btn { border: 0; color: #fff; background: var(--maroon); }
    .success-btn:hover { background: var(--maroon-dark); }

    .toast {
      position: fixed;
      z-index: 50;
      right: 18px;
      bottom: 18px;
      max-width: min(420px, calc(100vw - 36px));
      padding: 13px 16px;
      border-radius: 12px;
      color: #fff;
      background: var(--navy);
      box-shadow: 0 12px 30px rgb(0 0 0 / 25%);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: .2s ease;
    }
    .toast.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .toast.error { background: var(--red); }

    @media (max-width: 700px) {
      .page { padding: 25px 16px; border-radius: 23px; }
      .toolbar { grid-template-columns: 1fr; }
      .users-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      body { padding: 10px 8px 20px; }
      .topbar-title { font-size: 14px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: auto; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
      .user-card { padding: 12px; }
      .user-text h2 { font-size: 18px; }
      .manage-btn { padding: 8px; font-size: 11px; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-title">
      <i class="fas fa-shield-halved"></i>
      <span>لوحة التحكم</span>
    </div>
    <div class="topbar-actions">
      <button id="homeBtn" class="topbar-btn" type="button" title="الرئيسية">
        <i class="fas fa-house"></i>
      </button>
      <button id="refreshBtn" class="topbar-btn" type="button" title="تحديث">
        <i class="fas fa-rotate"></i>
      </button>
    </div>
  </div>

  <main class="page">
    <header class="page-header">
      <div class="header-icon"><i class="fas fa-users-gear"></i></div>
      <h1>إدارة <span>مخدومي صفّي</span></h1>
      <p>تعديل بيانات ونقاط مخدومي الصف الذي تخدمه فقط</p>
    </header>

    <section class="toolbar" aria-label="أدوات البحث">
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input id="searchInput" class="field" type="search"
               placeholder="ابحث في مخدومي صفك بالاسم أو الهاتف..." autocomplete="off">
      </div>

      <select id="scopeSelect" class="field" aria-label="نطاق المستخدمين">
        <option value="grade">مستخدمو صفي فقط</option>
      </select>

      <button id="loadBtn" class="primary-btn" type="button">
        <i class="fas fa-cloud-arrow-down"></i>
        تحميل المستخدمين
      </button>
    </section>

    <div class="status-row">
      <div>
        <strong id="countLabel">0 مستخدم</strong>
        <small id="currentUserLabel">جاري التحقق من الحساب...</small>
      </div>
      <small id="gradeLabel">الصف: —</small>
    </div>

    <section id="usersGrid" class="users-grid">
      <div class="message">
        <i class="fas fa-spinner fa-spin"></i>
        جاري تحميل المستخدمين...
      </div>
    </section>
  </main>

  <div id="overlay" class="overlay" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"><i class="fas fa-user-pen"></i> إدارة المستخدم</h2>
        <button id="closeModalBtn" class="icon-btn" type="button" aria-label="إغلاق">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div id="modalBody"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      runTransaction,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    /*
     * نفس إعدادات مشروع Firebase الموجود في الكود المرسل.
     * لا تضع Service Account أو أي مفتاح سري داخل HTML.
     */
    const firebaseConfig = {
      apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
      authDomain: "st-mina-c01ec.firebaseapp.com",
      databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
      projectId: "st-mina-c01ec",
      storageBucket: "st-mina-c01ec.firebasestorage.app",
      messagingSenderId: "792349150559",
      appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
      measurementId: "G-XZGSBG05KR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = (selector) => document.querySelector(selector);
    const usersGrid = $("#usersGrid");
    const searchInput = $("#searchInput");
    const scopeSelect = $("#scopeSelect");
    const countLabel = $("#countLabel");
    const currentUserLabel = $("#currentUserLabel");
    const gradeLabel = $("#gradeLabel");
    const overlay = $("#overlay");
    const modalBody = $("#modalBody");
    const toast = $("#toast");

    let allUsers = [];
    let currentUser = null;
    let selectedUser = null;
    let toastTimer = null;

    function text(value) {
      return String(value ?? "")
        .replace(/[\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF\u202A-\u202E]/g, " ")
        .trim()
        .replace(/\s+/g, " ");
    }

    function key(value) {
      return text(value).toLocaleLowerCase("ar-EG");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function userName(user) {
      return text(user.fullName || user.name || user.username || user.userName || "بدون اسم");
    }

    function userGrade(user) {
      return text(user.grade || user.servantGrade || user.class || user.stage || "غير محدد");
    }

    function userPoints(user) {
      const value = Number(user.points ?? 0);
      return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function isBanned(user) {
      return user.banned === true || user.isBanned === true;
    }

    function showToast(message, isError = false) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast show${isError ? " error" : ""}`;
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
    }

    function getSessionIdentifiers() {
      const params = new URLSearchParams(location.search);
      const adminParam = params.get("admin");
      const adminIdentifier = adminParam
        && !["1", "true", "yes", "on"].includes(key(adminParam))
        ? adminParam
        : null;

      const values = [
        params.get("user"),
        adminIdentifier,
        params.get("adminId"),
        localStorage.getItem("userDocId"),
        localStorage.getItem("adminDocId"),
        localStorage.getItem("adminId"),
        localStorage.getItem("currentAdminId"),
        localStorage.getItem("adminUsername"),
        localStorage.getItem("servantNumber"),
        localStorage.getItem("currentAdmin"),
        localStorage.getItem("currentUsername"),
        localStorage.getItem("username"),
        localStorage.getItem("currentUserId"),
        localStorage.getItem("userId"),
        localStorage.getItem("phone"),
        localStorage.getItem("mobile")
      ];

      const stored = localStorage.getItem("currentUser");
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (parsed && typeof parsed === "object") {
            values.push(
              parsed.id, parsed.docId, parsed.userId, parsed.username,
              parsed.userName, parsed.email, parsed.phone, parsed.mobile,
              parsed.servantNumber
            );
          } else {
            values.push(parsed);
          }
        } catch {
          values.push(stored);
        }
      }

      return [...new Set(values.map(key).filter(Boolean))];
    }

    function isAdminMode() {
      const params = new URLSearchParams(location.search);
      const adminValue = params.get("admin");
      return adminValue !== null && adminValue !== "" && adminValue !== "false";
    }

    async function findCurrentUser() {
      const identifiers = getSessionIdentifiers();
      if (!identifiers.length) {
        throw new Error("لا توجد جلسة دخول. افتح الصفحة بعد تسجيل الدخول.");
      }

      const snapshot = await getDocs(collection(db, "users"));
      let found = null;

      snapshot.forEach((item) => {
        if (found) return;
        const data = item.data();
        const possibleValues = [
          item.id, data.usernameLower, data.username, data.userName,
          data.userId, data.email, data.fullName, data.name,
          data.phone, data.mobile
        ].map(key).filter(Boolean);

        if (identifiers.some((identifier) => possibleValues.includes(identifier))) {
          found = { id: item.id, ...data };
        }
      });

      if (!found) {
        throw new Error("لم يتم العثور على حساب المستخدم الحالي في مجموعة users.");
      }

      return found;
    }

    async function findCurrentAdmin() {
      const identifiers = getSessionIdentifiers();
      if (!identifiers.length) {
        throw new Error("لا توجد بيانات تعريف للمشرف.");
      }

      /*
       * اسم المجموعة في Firebase عندك هو admin بالمفرد.
       * لا تغيّره إلى admins إلا إذا أنشأت مجموعة جديدة بهذا الاسم.
       */
      const snapshot = await getDocs(collection(db, "admin"));
      let found = null;

      snapshot.forEach((item) => {
        if (found) return;

        const data = item.data();
        const possibleValues = [
          item.id,
          data.uid,
          data.id,
          data.docId,
          data.adminId,
          data.adminUsername,
          data.usernameLower,
          data.username,
          data.userName,
          data.email,
          data.fullName,
          data.name,
          data.servantNumber,
          data.phone,
          data.mobile
        ].map(key).filter(Boolean);

        if (identifiers.some((identifier) => possibleValues.includes(identifier))) {
          found = { id: item.id, ...data, isAdmin: true };
        }
      });

      if (!found) {
        throw new Error("لم يتم العثور على حساب المشرف داخل مجموعة admin.");
      }

      return found;
    }

    function formatDate(value) {
      if (!value) return "غير متوفر";
      try {
        if (typeof value?.toDate === "function") {
          return value.toDate().toLocaleDateString("ar-EG");
        }
        if (typeof value === "object" && value.seconds !== undefined) {
          return new Date(Number(value.seconds) * 1000).toLocaleDateString("ar-EG");
        }
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? text(value) : date.toLocaleDateString("ar-EG");
      } catch {
        return text(value) || "غير متوفر";
      }
    }

    function renderMessage(message, error = false) {
      usersGrid.innerHTML = `
        <div class="message${error ? " error" : ""}">
          <i class="fas ${error ? "fa-triangle-exclamation" : "fa-users-slash"}"></i>
          <p>${escapeHtml(message)}</p>
          ${error ? '<button id="retryBtn" class="primary-btn" style="margin-top:14px">إعادة المحاولة</button>' : ""}
        </div>
      `;
      $("#retryBtn")?.addEventListener("click", loadPage);
    }

    function getVisibleUsers() {
      const term = key(searchInput.value);
      return allUsers.filter((user) => {
        /*
         * نفس فكرة صفحة الهدايا:
         * نعرض المستخدمين الذين يساوي grade الخاص بهم
         * servantGrade الخاص بالمشرف الحالي فقط.
         */
        const myGrade = userGrade(currentUser);
        const sameGrade = myGrade !== "غير محدد"
          && key(userGrade(user)) === key(myGrade);
        const searchable = [
          userName(user), user.username, user.userName, user.phone,
          user.mobile, user.email, userGrade(user)
        ].map(key).join(" ");
        return sameGrade && (!term || searchable.includes(term));
      });
    }

    function renderUsers() {
      const visibleUsers = getVisibleUsers();
      countLabel.textContent = `${visibleUsers.length} مستخدم`;

      if (!visibleUsers.length) {
        renderMessage("لا يوجد مستخدمون مطابقون للبحث أو للنطاق المحدد.");
        return;
      }

      usersGrid.innerHTML = "";
      visibleUsers.forEach((user) => {
        const card = document.createElement("article");
        card.className = `user-card${isBanned(user) ? " banned" : ""}`;
        card.innerHTML = `
          <div class="user-info">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <div class="user-text">
              <h2>${escapeHtml(userName(user))}</h2>
              <p>${escapeHtml(userGrade(user))} • ${userPoints(user)} نقطة${isBanned(user) ? " • محظور" : ""}</p>
            </div>
          </div>
          <button class="manage-btn" type="button" data-user-id="${escapeHtml(user.id)}">
            إدارة <i class="fas fa-arrow-left"></i>
          </button>
        `;
        card.querySelector(".manage-btn").addEventListener("click", () => openModal(user.id));
        usersGrid.appendChild(card);
      });
    }

    async function loadPage() {
      usersGrid.innerHTML = `
        <div class="message">
          <i class="fas fa-spinner fa-spin"></i>
          جاري تحميل المستخدمين...
        </div>
      `;

      try {
        /*
         * هذه الصفحة صفحة إدارة، لذلك لا نبحث عن الحساب الحالي
         * داخل users نهائياً.
         *
         * الحساب الحالي يجب أن يكون داخل مجموعة admin،
         * وبعد نجاح التحقق فقط نقرأ قائمة الأشخاص من users.
         *
         * يعمل هذا سواء فتحت:
         * control.html
         * أو control.html?admin=Tonmi
         */
        currentUser = await findCurrentAdmin();
        currentUserLabel.textContent = `المشرف الحالي: ${userName(currentUser)}`;
        gradeLabel.textContent = `صف المشرف: ${userGrade(currentUser)} • المصدر: admin`;

        const snapshot = await getDocs(collection(db, "users"));
        allUsers = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
        renderUsers();
      } catch (error) {
        console.error("Firebase error:", error);
        currentUserLabel.textContent = "تعذر التحقق من الحساب";
        gradeLabel.textContent = "الصف: —";
        const message = error?.code === "permission-denied"
          ? "ليس لديك صلاحية قراءة مجموعة users من Firestore."
          : (error?.message || "حدث خطأ أثناء تحميل المستخدمين.");
        renderMessage(message, true);
      }
    }

    function openModal(userId) {
      selectedUser = allUsers.find((user) => user.id === userId);
      if (!selectedUser) return;

      const banned = isBanned(selectedUser);
      modalBody.innerHTML = `
        <div class="modal-profile">
          <div class="avatar"><i class="fas fa-user"></i></div>
          <div>
            <h3>${escapeHtml(userName(selectedUser))}</h3>
            <p>معرّف المستند: ${escapeHtml(selectedUser.id)}</p>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="editName">الاسم الكامل</label>
            <input id="editName" class="field" value="${escapeHtml(userName(selectedUser))}">
          </div>
          <div class="form-group">
            <label for="editGrade">الصف / الفصل</label>
            <input id="editGrade" class="field" value="${escapeHtml(userGrade(selectedUser))}">
          </div>
          <div class="form-group full">
            <label>النقاط</label>
            <div class="points-box">
              <button class="small-btn minus" type="button" data-points="-5">−5</button>
              <button class="small-btn minus" type="button" data-points="-1">−1</button>
              <input id="editPoints" class="field" type="number" min="0" step="1" value="${userPoints(selectedUser)}">
              <button class="small-btn plus" type="button" data-points="1">+1</button>
              <button class="small-btn plus" type="button" data-points="5">+5</button>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="toggleBanBtn" class="danger-btn${banned ? " unban" : ""}" type="button">
            <i class="fas ${banned ? "fa-unlock" : "fa-lock"}"></i>
            ${banned ? "إلغاء الحظر" : "حظر المستخدم"}
          </button>
          <button id="saveUserBtn" class="success-btn" type="button">
            <i class="fas fa-floppy-disk"></i>
            حفظ التعديلات
          </button>
        </div>
      `;

      $("#saveUserBtn").addEventListener("click", saveUser);
      $("#toggleBanBtn").addEventListener("click", toggleBan);
      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");
      selectedUser = null;
    }

    async function saveUser() {
      if (!selectedUser) return;
      const name = text($("#editName").value);
      const grade = text($("#editGrade").value);
      const points = Number($("#editPoints").value);

      if (!name) return showToast("اكتب اسم المستخدم أولاً.", true);
      if (!grade) return showToast("اكتب الصف أولاً.", true);
      if (!Number.isInteger(points) || points < 0) {
        return showToast("النقاط يجب أن تكون رقماً صحيحاً أكبر من أو يساوي صفر.", true);
      }

      const saveButton = $("#saveUserBtn");
      saveButton.disabled = true;
      try {
        await updateDoc(doc(db, "users", selectedUser.id), {
          fullName: name,
          name,
          grade,
          servantGrade: grade,
          points
        });

        Object.assign(selectedUser, { fullName: name, name, grade, servantGrade: grade, points });
        allUsers = allUsers.map((user) => user.id === selectedUser.id ? selectedUser : user);
        closeModal();
        renderUsers();
        showToast("تم حفظ تعديلات المستخدم بنجاح.");
      } catch (error) {
        console.error("Save user error:", error);
        showToast(error?.code === "permission-denied"
          ? "تم رفض التعديل. راجع صلاحيات Firestore."
          : "تعذر حفظ التعديلات.", true);
      } finally {
        saveButton.disabled = false;
      }
    }

    async function changePoints(amount) {
      if (!selectedUser) return;
      try {
        const updated = await runTransaction(db, async (transaction) => {
          const reference = doc(db, "users", selectedUser.id);
          const snapshot = await transaction.get(reference);
          if (!snapshot.exists()) throw new Error("المستخدم غير موجود.");
          const nextPoints = Math.max(0, userPoints(snapshot.data()) + amount);
          transaction.update(reference, { points: nextPoints });
          return nextPoints;
        });

        selectedUser.points = updated;
        allUsers = allUsers.map((user) => user.id === selectedUser.id ? selectedUser : user);
        openModal(selectedUser.id);
        renderUsers();
        showToast("تم تحديث النقاط.");
      } catch (error) {
        console.error("Points error:", error);
        showToast(error?.code === "permission-denied"
          ? "تم رفض تحديث النقاط. راجع صلاحيات Firestore."
          : "تعذر تحديث النقاط.", true);
      }
    }

    async function toggleBan() {
      if (!selectedUser) return;
      const nextStatus = !isBanned(selectedUser);
      const action = nextStatus ? "حظر" : "إلغاء الحظر";
      if (!confirm(`هل أنت متأكد من ${action} هذا المستخدم؟`)) return;

      try {
        await updateDoc(doc(db, "users", selectedUser.id), {
          banned: nextStatus,
          isBanned: nextStatus
        });
        selectedUser.banned = nextStatus;
        selectedUser.isBanned = nextStatus;
        allUsers = allUsers.map((user) => user.id === selectedUser.id ? selectedUser : user);
        closeModal();
        renderUsers();
        showToast(nextStatus ? "تم حظر المستخدم." : "تم إلغاء حظر المستخدم.");
      } catch (error) {
        console.error("Ban error:", error);
        showToast(error?.code === "permission-denied"
          ? "تم رفض تغيير حالة الحساب. راجع صلاحيات Firestore."
          : "تعذر تغيير حالة الحساب.", true);
      }
    }

    searchInput.addEventListener("input", renderUsers);
    scopeSelect.addEventListener("change", renderUsers);
    $("#loadBtn").addEventListener("click", loadPage);
    $("#refreshBtn").addEventListener("click", loadPage);
    $("#homeBtn").addEventListener("click", () => { location.href = "home.html"; });
    $("#closeModalBtn").addEventListener("click", closeModal);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });

    /*َ
     * أزرار تعديل النقاط تعمل من داخل المودال بعد إنشائه.
     * نستخدم event delegation لأن الأزرار لا تكون موجودة عند بداية الصفحة.
     */
    modalBody.addEventListener("click", (event) => {
      const button = event.target.closest("[data-points]");
      if (button) changePoints(Number(button.dataset.points));
    });

    loadPage();
  </script>
</body>
</html>
