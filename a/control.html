<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخدومين صفّي - لوحة الخادم</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ربط مكتبات فايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            databaseURL: "https://st-mina-c01ec-default-rtdb.firebaseio.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea",
            measurementId: "G-XZGSBG05KR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async () => {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeBtn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const logoutBtn = document.getElementById('logoutBtn');
            const servantModal = document.getElementById('servantModal');
            const closeModalBtn = document.getElementById('closeModalBtn');

            function openSidebar() {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }
            function closeSidebar() {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }
            function closeServantModal() {
                servantModal.classList.remove('active');
                overlay.classList.remove('active');
            }

            if (menuBtn) menuBtn.addEventListener('click', openSidebar);
            if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
            if (overlay) overlay.addEventListener('click', () => { closeSidebar(); closeServantModal(); });
            if (closeModalBtn) closeModalBtn.addEventListener('click', closeServantModal);

            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (confirm("هل تريد تسجيل الخروج حقاً؟")) {
                        localStorage.clear();
                        window.location.href = '../index.html';
                    }
                });
            }

            // صف الخادم نفسه (نفس المفتاح المحفوظ وقت التسجيل)
            const myGrade = (localStorage.getItem('servantGrade') || '').trim();
            const gradeBadge = document.getElementById('currentServantGradeBadge');
            const rosterTitle = document.getElementById('rosterTitle');

            if (myGrade) {
                gradeBadge.innerText = myGrade;
                rosterTitle.innerText = `مخدومين ${myGrade}`;
            } else {
                gradeBadge.innerText = 'غير محدد';
                rosterTitle.innerText = 'مخدومين صفّي';
            }

            const servantsListContainer = document.getElementById('servantsListContainer');
            const searchInput = document.getElementById('searchInput');
            const countPill = document.getElementById('countPill');

            let myServants = [];

            async function fetchServants() {
                servantsListContainer.innerHTML = `<div class="state-box"><i class="fas fa-spinner fa-spin"></i><p>جاري تحميل قائمة المخدومين...</p></div>`;

                if (!myGrade) {
                    servantsListContainer.innerHTML = `<div class="state-box"><i class="fas fa-triangle-exclamation"></i><p>لم يتم تحديد صفّك بعد. يرجى إكمال بيانات ملفك الشخصي.</p></div>`;
                    countPill.innerText = '0';
                    return;
                }

                try {
                    const querySnapshot = await getDocs(collection(db, "users"));
                    const all = [];
                    querySnapshot.forEach((docSnap) => {
                        all.push({ id: docSnap.id, ...docSnap.data() });
                    });

                    // نعرض فقط مخدومي نفس الصف الخاص بالخادم
                    myServants = all.filter((person) => {
                        const grade = (person.grade || person.stage || '').trim();
                        return grade === myGrade;
                    });

                    renderRoster(myServants);
                } catch (error) {
                    console.error("خطأ في جلب البيانات:", error);
                    servantsListContainer.innerHTML = `<div class="state-box"><i class="fas fa-plug-circle-xmark"></i><p>تعذر تحميل البيانات، تأكد من الاتصال.</p></div>`;
                }
            }

            function initials(name) {
                const parts = name.trim().split(/\s+/).filter(Boolean);
                if (parts.length === 0) return '؟';
                return parts[0].charAt(0);
            }

            function renderRoster(dataList) {
                servantsListContainer.innerHTML = '';
                countPill.innerText = dataList.length;

                if (dataList.length === 0) {
                    servantsListContainer.innerHTML = `<div class="state-box"><i class="fas fa-users-slash"></i><p>لا يوجد مخدومون مسجلون في صفّك حالياً.</p></div>`;
                    return;
                }

                dataList.forEach((person, index) => {
                    const name = person.name || person.fullName || person.username || 'بدون اسم';
                    const points = person.points || 0;
                    const isBanned = person.banned || false;

                    const row = document.createElement('div');
                    row.className = `roster-row ${isBanned ? 'is-banned' : ''}`;
                    row.innerHTML = `
                        <span class="roll-no">${index + 1}</span>
                        <span class="roster-avatar">${initials(name)}</span>
                        <div class="roster-main">
                            <h3>${name}</h3>
                            <div class="roster-meta">
                                <span class="meta-points"><i class="fas fa-star"></i> ${points} نقطة</span>
                                ${isBanned ? '<span class="meta-banned"><i class="fas fa-ban"></i> محظور</span>' : ''}
                            </div>
                        </div>
                        <i class="fas fa-chevron-left roster-arrow"></i>
                    `;
                    row.addEventListener('click', () => openServantDetails(person));
                    servantsListContainer.appendChild(row);
                });
            }

            function openServantDetails(person) {
                const modalContent = document.getElementById('modalServantContent');
                const name = person.name || person.fullName || person.username || 'بدون اسم';
                const grade = person.grade || person.stage || 'غير محدد';
                const points = person.points || 0;
                const isBanned = person.banned || false;

                modalContent.innerHTML = `
                    <div class="servant-profile-header">
                        <div>
                            <h2>${name}</h2>
                            <span class="grade-pill">${grade}</span>
                        </div>
                    </div>

                    <div class="points-panel">
                        <div class="points-current">
                            <span class="label">النقاط الحالية</span>
                            <span id="points-${person.id}" class="points-value">${points}</span>
                        </div>
                        <div class="points-controls">
                            <button class="btn-action minus" onclick="updatePoints('${person.id}', -5)">-5</button>
                            <button class="btn-action minus" onclick="updatePoints('${person.id}', -1)">-1</button>
                            <input type="number" id="custom-points-${person.id}" class="custom-input" placeholder="رقم">
                            <button class="btn-action save" onclick="saveCustomPoints('${person.id}')"><i class="fas fa-check"></i></button>
                            <button class="btn-action plus" onclick="updatePoints('${person.id}', 1)">+1</button>
                            <button class="btn-action plus" onclick="updatePoints('${person.id}', 5)">+5</button>
                        </div>
                    </div>

                    <button class="btn-ban ${isBanned ? 'unban' : 'ban'}" onclick="toggleBan('${person.id}', ${isBanned})">
                        ${isBanned ? '<i class="fas fa-unlock"></i> إلغاء الحظر' : '<i class="fas fa-lock"></i> حظر المخدوم'}
                    </button>

                    <div class="personal-details-box">
                        <h3><i class="fas fa-id-card"></i> البيانات الشخصية</h3>
                        <div class="details-grid">
                            <div class="detail-item"><strong>رقم الهاتف</strong><span>${person.userId || person.phone || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>هاتف الأب</strong><span>${person.fatherPhone || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>هاتف الأم</strong><span>${person.motherPhone || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>العنوان</strong><span>${person.address || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>تاريخ الميلاد</strong><span>${person.birthdate || 'غير متوفر'}</span></div>
                            <div class="detail-item"><strong>تاريخ التسجيل</strong><span>${person.createdAt || 'غير متوفر'}</span></div>
                        </div>
                    </div>
                `;

                servantModal.classList.add('active');
                overlay.classList.add('active');
            }

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = myServants.filter(p => {
                    const name = (p.name || p.fullName || p.username || '').toLowerCase();
                    return name.includes(term);
                });
                renderRoster(filtered);
            });

            window.updatePoints = async function(docId, amount) {
                const person = myServants.find(p => p.id === docId);
                if (!person) return;

                let currentPoints = Number(person.points || 0);
                let newPoints = currentPoints + amount;
                if (newPoints < 0) newPoints = 0;

                try {
                    const docRef = doc(db, "users", docId);
                    await updateDoc(docRef, { points: newPoints });
                    person.points = newPoints;
                    const badge = document.getElementById(`points-${docId}`);
                    if (badge) badge.innerText = newPoints;
                } catch (error) {
                    console.error("خطأ في تحديث النقاط:", error);
                    alert("تعذر تحديث النقاط.");
                }
            };

            window.saveCustomPoints = async function(docId) {
                const inputEl = document.getElementById(`custom-points-${docId}`);
                const val = parseInt(inputEl.value);

                if (isNaN(val)) {
                    alert("يرجى كتابة رقم صحيح!");
                    return;
                }

                const person = myServants.find(p => p.id === docId);
                if (!person) return;

                try {
                    const docRef = doc(db, "users", docId);
                    await updateDoc(docRef, { points: val });
                    person.points = val;
                    const badge = document.getElementById(`points-${docId}`);
                    if (badge) badge.innerText = val;
                    inputEl.value = '';
                } catch (error) {
                    console.error("خطأ في حفظ النقاط:", error);
                    alert("تعذر الحفظ.");
                }
            };

            window.toggleBan = async function(docId, currentBanStatus) {
                const newStatus = !currentBanStatus;
                const actionText = newStatus ? "حظر" : "فك حظر";

                if (!confirm(`هل أنت متأكد من رغبتك في ${actionText} هذا المخدوم؟`)) return;

                const person = myServants.find(p => p.id === docId);
                if (!person) return;

                try {
                    const docRef = doc(db, "users", docId);
                    await updateDoc(docRef, { banned: newStatus });
                    person.banned = newStatus;
                    openServantDetails(person);
                    renderRoster(myServants);
                } catch (error) {
                    console.error("خطأ في الحظر:", error);
                    alert("حدث خطأ أثناء التنفيذ.");
                }
            };

            fetchServants();
        });
    </script>

    <style>
        :root{
            --wine-900:#4a0e16;
            --wine-800:#6b1420;
            --wine-700:#7c1b28;
            --gold:#c9a04d;
            --gold-light:#e6c878;
            --paper:#f6f1e9;
            --card:#ffffff;
            --ink:#2a2320;
            --ink-soft:#6b625c;
            --line:#e9dfd0;
            --green:#2f8f52;
            --green-dark:#1f6b3c;
            --red:#b3392f;
        }

        * { box-sizing:border-box; margin:0; padding:0; }

        body{
            background:var(--paper);
            min-height:100vh;
            font-family:'Cairo', sans-serif;
            color:var(--ink);
            display:flex;
            flex-direction:column;
        }

        /* ===== الهيدر ===== */
        header.church-header{
            background:linear-gradient(180deg, var(--wine-800), var(--wine-900));
            padding:18px 20px 34px;
            position:relative;
            box-shadow:0 8px 20px rgba(74,14,22,0.25);
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        header.church-header::after{
            content:'';
            position:absolute;
            bottom:0; right:0; left:0;
            height:4px;
            background:linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .menu-btn{
            background:rgba(255,255,255,0.08);
            border:1.5px solid rgba(230,200,120,0.4);
            color:var(--gold-light);
            width:42px; height:42px;
            border-radius:14px;
            font-size:17px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:.25s;
        }
        .menu-btn:hover{
            background:rgba(230,200,120,0.15);
            border-color:var(--gold);
        }

        header.church-header h2{
            font-family:'Amiri', serif;
            color:#fbeed4;
            font-size:16px;
            font-weight:700;
        }

        /* بطاقة الصف تحت الهيدر مباشرة */
        .grade-strip{
            margin:-20px 16px 0;
            background:var(--card);
            border-radius:20px;
            box-shadow:0 12px 28px rgba(74,14,22,0.14);
            border:1px solid var(--line);
            padding:16px 20px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
            position:relative;
            max-width:588px;
            width:calc(100% - 32px);
            margin-left:auto;
            margin-right:auto;
        }

        .grade-strip .grade-info{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .grade-icon{
            width:44px; height:44px;
            border-radius:14px;
            background:var(--wine-700);
            color:var(--gold-light);
            display:flex; align-items:center; justify-content:center;
            font-size:18px;
            flex-shrink:0;
        }

        .grade-info .grade-label{
            font-size:12px;
            color:var(--ink-soft);
            font-weight:600;
        }

        .grade-info .grade-name{
            font-family:'Amiri', serif;
            font-size:19px;
            color:var(--wine-800);
            font-weight:700;
        }

        .count-pill{
            background:var(--paper);
            border:1px solid var(--line);
            color:var(--wine-700);
            padding:7px 14px;
            border-radius:14px;
            font-size:13px;
            font-weight:700;
            white-space:nowrap;
        }

        /* ===== المحتوى ===== */
        .main-content{
            flex:1;
            padding:22px 16px 40px;
            max-width:620px;
            width:100%;
            margin:0 auto;
        }

        .main-content h1{
            font-family:'Amiri', serif;
            font-size:22px;
            color:var(--wine-800);
            margin-bottom:16px;
        }

        .search-box{ margin-bottom:18px; }
        .search-input{
            width:100%;
            background:var(--card);
            border:1px solid var(--line);
            color:var(--ink);
            padding:13px 18px;
            border-radius:14px;
            font-size:15px;
            font-family:'Cairo', sans-serif;
            box-shadow:0 6px 16px rgba(74,14,22,0.06);
            transition:.25s;
        }
        .search-input:focus{
            outline:none;
            border-color:var(--gold);
            box-shadow:0 0 0 3px rgba(201,160,77,0.15);
        }

        /* ===== قائمة المخدومين (سجل صف) ===== */
        .servants-list{ display:flex; flex-direction:column; gap:10px; }

        .roster-row{
            background:var(--card);
            border:1px solid var(--line);
            border-radius:16px;
            padding:12px 16px;
            display:flex;
            align-items:center;
            gap:14px;
            cursor:pointer;
            transition:.2s;
        }
        .roster-row:hover{
            border-color:var(--gold);
            transform:translateY(-2px);
            box-shadow:0 8px 18px rgba(74,14,22,0.1);
        }
        .roster-row.is-banned{ border-color:rgba(179,57,47,0.4); background:#fdf5f4; }

        .roll-no{
            font-family:'Amiri', serif;
            font-size:14px;
            color:var(--ink-soft);
            width:20px;
            text-align:center;
            flex-shrink:0;
        }

        .roster-avatar{
            width:42px; height:42px;
            border-radius:50%;
            background:linear-gradient(135deg, var(--gold-light), var(--gold));
            color:var(--wine-900);
            font-family:'Amiri', serif;
            font-weight:700;
            font-size:17px;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
        }

        .roster-main{ flex:1; min-width:0; text-align:right; }
        .roster-main h3{
            font-size:15px;
            font-weight:700;
            color:var(--ink);
            margin-bottom:3px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }
        .roster-meta{ display:flex; gap:10px; font-size:12px; color:var(--ink-soft); }
        .roster-meta i{ margin-left:3px; }
        .meta-points i{ color:var(--gold); }
        .meta-banned{ color:var(--red); font-weight:700; }
        .meta-banned i{ color:var(--red); }

        .roster-arrow{ color:var(--line); font-size:13px; flex-shrink:0; }
        .roster-row:hover .roster-arrow{ color:var(--gold); }

        .state-box{
            text-align:center;
            color:var(--ink-soft);
            padding:50px 20px;
            font-size:14px;
        }
        .state-box i{
            font-size:26px;
            color:var(--gold);
            margin-bottom:12px;
            display:block;
        }

        /* ===== القائمة الجانبية ===== */
        .sidebar{
            position:fixed; top:0; right:-300px; width:290px; height:100%;
            background:linear-gradient(180deg, var(--wine-800), var(--wine-900));
            transition:right .35s ease;
            z-index:9999;
            padding:26px 20px;
            display:flex;
            flex-direction:column;
            box-shadow:-10px 0 30px rgba(0,0,0,0.3);
        }
        .sidebar.active{ right:0; }
        .sidebar-header{
            display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid rgba(230,200,120,0.25);
            padding-bottom:16px; margin-bottom:20px;
        }
        .sidebar-header h3{ font-family:'Amiri', serif; color:#fbeed4; font-size:18px; }
        .close-btn{ background:none; border:none; color:var(--gold-light); font-size:20px; cursor:pointer; }
        .sidebar-links{ list-style:none; display:flex; flex-direction:column; gap:8px; flex-grow:1; }
        .sidebar-links a, .logout-link{
            display:flex; align-items:center; gap:12px;
            padding:12px 14px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(230,200,120,0.15);
            border-radius:12px;
            color:#f3e5d3;
            text-decoration:none;
            font-size:14px;
            font-weight:600;
            transition:.2s;
            cursor:pointer;
            width:100%;
        }
        .sidebar-links a:hover{
            background:var(--gold);
            color:var(--wine-900);
            border-color:var(--gold);
        }
        .logout-link{ border-color:rgba(179,57,47,0.4); color:#f0aca6; margin-top:auto; }
        .logout-link:hover{ background:var(--red); color:#fff; }

        .overlay{
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(20,8,10,0.6);
            display:none; z-index:998;
            backdrop-filter:blur(3px);
        }
        .overlay.active{ display:block; }

        /* ===== نافذة إدارة المخدوم ===== */
        .servant-modal{
            position:fixed; top:50%; left:50%;
            transform:translate(-50%, -50%) scale(0.95);
            width:92%; max-width:520px; max-height:88vh; overflow-y:auto;
            background:var(--card);
            border-radius:24px;
            padding:0;
            z-index:10000;
            opacity:0; pointer-events:none;
            transition:.25s ease;
            box-shadow:0 30px 60px rgba(0,0,0,0.35);
        }
        .servant-modal.active{ opacity:1; pointer-events:auto; transform:translate(-50%, -50%) scale(1); }

        .modal-header-custom{
            display:flex; justify-content:space-between; align-items:center;
            background:linear-gradient(180deg, var(--wine-800), var(--wine-900));
            padding:18px 22px;
            position:sticky; top:0;
        }
        .modal-header-custom h2{ font-family:'Amiri', serif; color:#fbeed4; font-size:17px; }
        .modal-close{ background:none; border:none; color:var(--gold-light); font-size:20px; cursor:pointer; }

        #modalServantContent{ padding:22px; }

        .servant-profile-header{ margin-bottom:18px; }
        .servant-profile-header h2{
            font-family:'Amiri', serif;
            color:var(--wine-800);
            font-size:21px;
            margin-bottom:6px;
        }
        .grade-pill{
            display:inline-block;
            background:var(--paper);
            border:1px solid var(--line);
            color:var(--wine-700);
            padding:5px 14px;
            border-radius:14px;
            font-size:12px;
            font-weight:700;
        }

        .points-panel{
            background:var(--paper);
            border:1px solid var(--line);
            border-radius:16px;
            padding:16px;
            margin-bottom:14px;
        }
        .points-current{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:14px;
        }
        .points-current .label{ font-size:13px; color:var(--ink-soft); font-weight:600; }
        .points-current .points-value{
            font-family:'Amiri', serif;
            font-size:26px;
            color:var(--wine-800);
            font-weight:700;
        }
        .points-controls{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

        .btn-action{
            background:#fff;
            border:1px solid var(--line);
            color:var(--wine-700);
            padding:8px 12px;
            border-radius:10px;
            cursor:pointer;
            font-weight:700;
            font-size:13px;
            font-family:'Cairo', sans-serif;
            transition:.2s;
        }
        .btn-action.plus:hover{ background:var(--green); color:#fff; border-color:var(--green); }
        .btn-action.minus:hover{ background:var(--red); color:#fff; border-color:var(--red); }
        .btn-action.save{ background:var(--gold); color:var(--wine-900); border-color:var(--gold); }
        .btn-action.save:hover{ background:var(--gold-light); }

        .custom-input{
            background:#fff;
            border:1px solid var(--line);
