<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة الخدام</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Tajawal", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(143, 18, 45, .20), transparent 35%),
                linear-gradient(135deg, #00111f, #001a2d 50%, #000b16);
            color: #111;
        }

        .page {
            width: min(1050px, calc(100% - 30px));
            margin: auto;
            padding: 18px 0 60px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .grade-badge {
            background: #fff;
            color: #172b42;
            border-radius: 16px;
            padding: 11px 18px;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.18);
        }

        .grade-badge i {
            color: #8e102b;
            margin-left: 5px;
        }

        .menu-btn {
            border: 0;
            width: 48px;
            height: 48px;
            border-radius: 15px;
            background: #fff;
            color: #94122f;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,.18);
        }

        .main-card {
            background: #fff;
            border-radius: 28px 28px 0 0;
            padding: 35px 32px 45px;
            min-height: 650px;
            box-shadow: 0 15px 50px rgba(0,0,0,.20);
            border-top: 7px solid #8c1730;
        }

        .hero {
            text-align: center;
        }

        .hero-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #8e102b;
            color: white;
            font-size: 34px;
            box-shadow: 0 10px 25px rgba(142,16,43,.28);
        }

        .hero h1 {
            margin: 0;
            font-family: "Amiri", serif;
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.2;
            color: #111;
        }

        .hero h1 span {
            color: #97132e;
        }

        .hero p {
            color: #999;
            margin: 8px 0 25px;
            font-size: 14px;
        }

        .section-head {
            border: 1px solid #ead7da;
            border-radius: 18px;
            min-height: 70px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: linear-gradient(90deg, #fff, #fffafa);
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .section-title i {
            color: #8e102b;
            font-size: 23px;
        }

        .count {
            background: white;
            border: 1px solid #e8c7cd;
            color: #8e102b;
            border-radius: 12px;
            padding: 8px 13px;
            font-size: 13px;
            font-weight: 800;
        }

        .search-box {
            height: 54px;
            border: 1px solid #e5d8da;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            margin-bottom: 20px;
            background: #fff;
        }

        .search-box i {
            color: #8e102b;
            font-size: 20px;
        }

        .search-box input {
            border: 0;
            outline: none;
            width: 100%;
            height: 100%;
            padding: 0 12px;
            font-family: inherit;
            font-size: 14px;
            text-align: right;
        }

        .servants-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .servant-card {
            min-height: 92px;
            border: 1px solid #eadfe1;
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: white;
            box-shadow: 0 5px 16px rgba(0,0,0,.05);
            transition: .2s;
        }

        .servant-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 24px rgba(0,0,0,.09);
        }

        .person-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .avatar {
            width: 50px;
            height: 50px;
            min-width: 50px;
            border-radius: 15px;
            background: #8e102b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .person-text {
            min-width: 0;
        }

        .person-name {
            font-family: "Amiri", serif;
            font-size: 19px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .person-meta {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }

        .manage-btn {
            border: 0;
            background: #fff1f3;
            color: #8e102b;
            padding: 9px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            white-space: nowrap;
        }

        .manage-btn:hover {
            background: #8e102b;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px 10px;
            color: #999;
        }

        .loading i {
            color: #8e102b;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 15px;
            color: #999;
        }

        .empty i {
            display: block;
            font-size: 45px;
            color: #ddd;
            margin-bottom: 15px;
        }

        /* Modal */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(520px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 25px;
            padding: 25px;
            position: relative;
            box-shadow: 0 25px 80px rgba(0,0,0,.3);
        }

        .modal-close {
            position: absolute;
            left: 16px;
            top: 16px;
            border: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff0f2;
            color: #8e102b;
            cursor: pointer;
            font-size: 18px;
        }

        .modal-header {
            text-align: center;
            padding-top: 10px;
            margin-bottom: 20px;
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 22px;
            overflow: hidden;
            background: #8e102b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-name {
            font-family: "Amiri", serif;
            font-size: 27px;
            font-weight: bold;
            margin-top: 10px;
        }

        .detail {
            border: 1px solid #eee1e3;
            border-radius: 14px;
            padding: 13px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .detail-label {
            color: #999;
            font-size: 13px;
        }

        .detail-value {
            font-weight: 700;
            text-align: left;
        }

        .error-box {
            background: #fff1f1;
            color: #a00000;
            border: 1px solid #efcccc;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        @media (max-width: 700px) {
            .page {
                width: calc(100% - 14px);
                padding-top: 10px;
            }

            .main-card {
                padding: 25px 15px 35px;
                border-radius: 22px 22px 0 0;
            }

            .servants-grid {
                grid-template-columns: 1fr;
            }

            .section-head {
                padding: 10px 13px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .grade-badge {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="topbar">

        <!-- سيتم تغيير النص تلقائياً إلى المرحلة + الصف -->
        <div class="grade-badge" id="myGradeBadge">
            <i class="fa-solid fa-graduation-cap"></i>
            جاري التحميل...
        </div>

        <button class="menu-btn" onclick="history.back()">
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>

    <main class="main-card">

        <div class="hero">

            <div class="hero-icon">
                <i class="fa-solid fa-users"></i>
            </div>

            <h1>
                إدارة خدام
                <span id="myGradeTitle">...</span>
            </h1>

            <p>
                متابعة وإدارة خدام صفك بسهولة
            </p>

        </div>

        <div class="section-head">

            <div class="section-title">
                <i class="fa-solid fa-school"></i>
                <span id="servantsTitle">
                    المخدومون الموجودون في صفك فقط
                </span>
            </div>

            <div class="count" id="servantsCount">
                0 خدام
            </div>

        </div>

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="إبحث عن مخدوم بالاسم..."
                autocomplete="off"
            >

        </div>

        <div id="errorBox" class="error-box"></div>

        <div id="servantsContainer" class="servants-grid">

            <div class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <div>جاري تحميل الخدام...</div>
            </div>

        </div>

    </main>

</div>


<!-- Modal -->

<div class="modal-overlay" id="modalOverlay">

    <div class="modal">

        <button class="modal-close" onclick="closeModal()">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="modal-header">

            <div class="modal-avatar" id="modalAvatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="modal-name" id="modalName">
                -
            </div>

        </div>

        <div class="detail">
            <span class="detail-label">المرحلة</span>
            <span class="detail-value" id="modalStage">-</span>
        </div>

        <div class="detail">
            <span class="detail-label">الصف الدراسي</span>
            <span class="detail-value" id="modalGrade">-</span>
        </div>

        <div class="detail">
            <span class="detail-label">الاسم الكامل</span>
            <span class="detail-value" id="modalFullName">-</span>
        </div>

        <div class="detail">
            <span class="detail-label">البريد الإلكتروني</span>
            <span class="detail-value" id="modalEmail">-</span>
        </div>

        <div class="detail">
            <span class="detail-label">رقم الهاتف</span>
            <span class="detail-value" id="modalPhone">-</span>
        </div>

    </div>

</div>


<!-- Firebase -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


    /* =========================================================
       FIREBASE
    ========================================================= */

    const firebaseConfig = {

        /*
         * ضع هنا نفس firebaseConfig الموجود في home.html
         *
         * لا تغيّر بيانات Firebase.
         */

        apiKey: "ضع_apiKey_من_home.html",
        authDomain: "st-mina-c01ec.firebaseapp.com",
        projectId: "st-mina-c01ec",
        storageBucket: "st-mina-c01ec.firebasestorage.app",
        messagingSenderId: "ضع_messagingSenderId",
        appId: "ضع_appId"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* =========================================================
       VARIABLES
    ========================================================= */

    let myStage = "";

    let myGrade = "";

    let myServants = [];

    let allUsers = [];

    let currentUserDocId = "";

    let currentUserData = null;


    /* =========================================================
       NORMALIZE
    ========================================================= */

    function normalizeText(value) {

        return String(value ?? "")
            .trim()
            .replace(/\s+/g, " ");

    }


    function normalizeKey(value) {

        return normalizeText(value)
            .toLowerCase()
            .replace(/[أإآ]/g, "ا")
            .replace(/ة/g, "ه")
            .replace(/ى/g, "ي")
            .replace(/ؤ/g, "و")
            .replace(/ئ/g, "ي");

    }


    /* =========================================================
       LOCAL STORAGE
       نفس البيانات التي يستخدمها home.html
    ========================================================= */

    function getHomeData() {

        const stage =
            localStorage.getItem("servantStage") || "";

        const grade =
            localStorage.getItem("servantGrade") || "";

        const title =
            localStorage.getItem("servantTitle") || "";

        const fullName =
            localStorage.getItem("fullName") || "";

        return {

            stage: normalizeText(stage),

            grade: normalizeText(grade),

            title: normalizeText(title),

            fullName: normalizeText(fullName)

        };

    }


    /* =========================================================
       GET CURRENT USER DATA
    ========================================================= */

    async function fetchMyData(user) {

        /*
         * أولاً:
         * نأخذ المرحلة والصف من نفس localStorage
         * الذي يستخدمه home.html.
         */

        const homeData = getHomeData();

        myStage = homeData.stage;

        myGrade = homeData.grade;


        /*
         * لو localStorage ناقص، نحاول نجيب البيانات
         * من Firestore كـ fallback.
         */

        if (!myStage || !myGrade) {

            try {

                const usersRef =
                    collection(db, "users");

                const snapshot =
                    await getDocs(usersRef);


                let foundDoc = null;


                snapshot.forEach((item) => {

                    const data = item.data();

                    const itemUid =
                        normalizeText(data.uid);

                    const itemEmail =
                        normalizeText(data.email);


                    if (
                        itemUid === normalizeText(user.uid) ||
                        itemEmail === normalizeText(user.email)
                    ) {

                        foundDoc = item;

                    }

                });


                if (foundDoc) {

                    currentUserDocId =
                        foundDoc.id;

                    currentUserData =
                        foundDoc.data();


                    if (!myStage) {

                        myStage = normalizeText(
                            currentUserData.stage ||
                            currentUserData.servantStage ||
                            ""
                        );

                    }


                    if (!myGrade) {

                        myGrade = normalizeText(
                            currentUserData.grade ||
                            currentUserData.servantGrade ||
                            currentUserData.class ||
                            ""
                        );

                    }

                }

            } catch (error) {

                console.error(
                    "Error loading current user:",
                    error
                );

            }

        }


        /*
         * نخزنهم بنفس أسماء home.html
         */

        if (myStage) {

            localStorage.setItem(
                "servantStage",
                myStage
            );

        }


        if (myGrade) {

            localStorage.setItem(
                "servantGrade",
                myGrade
            );

        }


        updateMyInfo();

    }


    /* =========================================================
       UPDATE UI
    ========================================================= */

    function updateMyInfo() {

        const stage =
            myStage || "غير محدد";

        const grade =
            myGrade || "غير محدد";


        const badge =
            document.getElementById(
                "myGradeBadge"
            );


        const title =
            document.getElementById(
                "myGradeTitle"
            );


        if (badge) {

            badge.innerHTML = `
                <i class="fa-solid fa-graduation-cap"></i>
                ${escapeHtml(stage)} -
                ${escapeHtml(grade)}
            `;

        }


        if (title) {

            title.textContent =
                grade;

        }

    }


    /* =========================================================
       FETCH SERVANTS
    ========================================================= */

    async function fetchServants() {

        const container =
            document.getElementById(
                "servantsContainer"
            );


        try {

            showLoading();


            const currentUser =
                auth.currentUser;


            if (!currentUser) {

                throw new Error(
                    "لم يتم تسجيل الدخول"
                );

            }


            await fetchMyData(
                currentUser
            );


            const usersRef =
                collection(db, "users");


            const snapshot =
                await getDocs(usersRef);


            allUsers = [];


            snapshot.forEach((item) => {

                const data = item.data();


                allUsers.push({

                    id: item.id,

                    ...data

                });

            });


            /*
             * ==================================================
             * أهم جزء:
             *
             * لازم المرحلة + الصف يكونوا متساويين.
             *
             * يعني:
             *
             * المرحلة نفسها
             * +
             * الصف نفسه
             *
             * ==================================================
             */

            myServants =
                allUsers.filter((person) => {


                    /*
                     * المرحلة الخاصة بالخادم
                     */

                    const personStage =
                        normalizeText(
                            person.stage ||
                            person.servantStage ||
                            ""
                        );


                    /*
                     * الصف الخاص بالخادم
                     */

                    const personGrade =
                        normalizeText(
                            person.grade ||
                            person.servantGrade ||
                            person.class ||
                            ""
                        );


                    /*
                     * لا يظهر الشخص إلا لو:
                     *
                     * المرحلة = مرحلتي
                     * والصف = صفي
                     */

                    return (

                        normalizeKey(
                            personStage
                        ) ===
                        normalizeKey(
                            myStage
                        )

                        &&

                        normalizeKey(
                            personGrade
                        ) ===
                        normalizeKey(
                            myGrade
                        )

                    );

                });


            /*
             * لا نريد ظهور المستخدم نفسه
             * داخل قائمة الخدام.
             */

            myServants =
                myServants.filter(
                    person => {

                        const personUid =
                            normalizeText(
                                person.uid
                            );

                        return (
                            personUid !==
                            normalizeText(
                                currentUser.uid
                            )
                        );

                    }
                );


            updateCount();

            renderServants(
                myServants
            );


        } catch (error) {

            console.error(error);

            showError(
                "حدث خطأ أثناء تحميل الخدام: " +
                error.message
            );

        }

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function renderServants(servants) {

        const container =
            document.getElementById(
                "servantsContainer"
            );


        if (!servants.length) {

            container.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-users-slash"></i>

                    <div>
                        لا يوجد خدام في
                        ${escapeHtml(myStage || "هذه المرحلة")}
                        -
                        ${escapeHtml(myGrade || "هذا الصف")}
                    </div>

                </div>

            `;

            return;

        }


        container.innerHTML =
            servants.map(
                person => {

                    const name =
                        normalizeText(
                            person.name ||
                            person.fullName ||
                            person.displayName ||
                            "بدون اسم"
                        );


                    const stage =
                        normalizeText(
                            person.stage ||
                            person.servantStage ||
                            myStage ||
                            "غير محدد"
                        );


                    const grade =
                        normalizeText(
                            person.grade ||
                            person.servantGrade ||
                            person.class ||
                            myGrade ||
                            "غير محدد"
                        );


                    const photo =
                        person.profilePhotoUrl ||
                        person.photoUrl ||
                        person.googlePhotoUrl ||
                        "";


                    return `

                        <div
                            class="servant-card"
                            data-name="${escapeAttr(name)}"
                        >

                            <div class="person-info">

                                <div class="avatar">

                                    ${
                                        photo
                                        ?

                                        `<img
                                            src="${escapeAttr(photo)}"
                                            alt=""
                                            onerror="this.style.display='none'"
                                        >`

                                        :

                                        `<i class="fa-solid fa-user"></i>`
                                    }

                                </div>


                                <div class="person-text">

                                    <div class="person-name">
                                        ${escapeHtml(name)}
                                    </div>

                                    <div class="person-meta">
                                        ${escapeHtml(stage)}
                                        -
                                        ${escapeHtml(grade)}
                                        -
                                        ${getPoints(person)} نقطة
                                    </div>

                                </div>

                            </div>


                            <button
                                class="manage-btn"
                                onclick="openModal('${escapeAttr(person.id)}')"
                            >
                                إدارة
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>

                        </div>

                    `;

                }
            ).join("");

    }


    /* =========================================================
       POINTS
    ========================================================= */

    function getPoints(person) {

        const points =
            person.points ??
            person.totalPoints ??
            0;

        return Number(points) || 0;

    }


    /* =========================================================
       SEARCH
    ========================================================= */

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            function () {

                const search =
                    normalizeKey(
                        this.value
                    );


                if (!search) {

                    renderServants(
                        myServants
                    );

                    return;

                }


                const filtered =
                    myServants.filter(
                        person => {

                            const name =
                                normalizeKey(
                                    person.name ||
                                    person.fullName ||
                                    person.displayName ||
                                    ""
                                );


                            return name.includes(
                                search
                            );

                        }
                    );


                renderServants(
                    filtered
                );

            }
        );


    /* =========================================================
       COUNT
    ========================================================= */

    function updateCount() {

        const count =
            document.getElementById(
                "servantsCount"
            );


        if (count) {

            count.textContent =
                `${myServants.length} خدام`;

        }

    }


    /* =========================================================
       MODAL
    ========================================================= */

    window.openModal = function(id) {

        const person =
            myServants.find(
                item => item.id === id
            );


        if (!person) return;


        const name =
            normalizeText(
                person.name ||
                person.fullName ||
                person.displayName ||
                "بدون اسم"
            );


        const stage =
            normalizeText(
                person.stage ||
                person.servantStage ||
                myStage ||
                "غير محدد"
            );


        const grade =
            normalizeText(
                person.grade ||
                person.servantGrade ||
                person.class ||
                myGrade ||
                "غير محدد"
            );


        const email =
            normalizeText(
                person.email ||
                "غير متوفر"
            );


        const phone =
            normalizeText(
                person.phone ||
                person.phoneNumber ||
                "غير متوفر"
            );


        document.getElementById(
            "modalName"
        ).textContent = name;


        document.getElementById(
            "modalStage"
        ).textContent = stage;


        document.getElementById(
            "modalGrade"
        ).textContent = grade;


        document.getElementById(
            "modalFullName"
        ).textContent =
            normalizeText(
                person.fullName ||
                name
            );


        document.getElementById(
            "modalEmail"
        ).textContent = email;


        document.getElementById(
            "modalPhone"
        ).textContent = phone;


        const avatar =
            document.getElementById(
                "modalAvatar"
            );


        const photo =
            person.profilePhotoUrl ||
            person.photoUrl ||
            person.googlePhotoUrl ||
            "";


        if (photo) {

            avatar.innerHTML = `

                <img
                    src="${escapeAttr(photo)}"
                    alt=""
                    onerror="
                        this.parentElement.innerHTML =
                        '<i class=\'fa-solid fa-user\'></i>'
                    "
                >

            `;

        } else {

            avatar.innerHTML =
                `<i class="fa-solid fa-user"></i>`;

        }


        document
            .getElementById(
                "modalOverlay"
            )
            .classList.add("show");

    };


    window.closeModal = function() {

        document
            .getElementById(
                "modalOverlay"
            )
            .classList.remove("show");

    };


    document
        .getElementById(
            "modalOverlay"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    closeModal();

                }

            }
        );


    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeModal();

            }

        }
    );


    /* =========================================================
       LOADING
    ========================================================= */

    function showLoading() {

        document
            .getElementById(
                "servantsContainer"
            )
            .innerHTML = `

                <div class="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    <div>
                        جاري تحميل الخدام...
                    </div>

                </div>

            `;

    }


    /* =========================================================
       ERROR
    ========================================================= */

    function showError(message) {

        const box =
            document.getElementById(
                "errorBox"
            );


        box.textContent =
            message;


        box.style.display =
            "block";


        document
            .getElementById(
                "servantsContainer"
            )
            .innerHTML = "";

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function escapeAttr(value) {

        return escapeHtml(value);

    }


    /* =========================================================
       AUTH
    ========================================================= */

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                showError(
                    "يجب تسجيل الدخول أولاً."
                );

                return;

            }


            await fetchServants();

        }
    );

</script>

</body>
</html>
