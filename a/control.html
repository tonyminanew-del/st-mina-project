<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مخدومين صفّي - لوحة الخادم</title>

    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Cairo:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #050811 0%, #000000 100%);
            min-height: 100vh;
            font-family: 'Reem Kufi', 'Cairo', sans-serif;
            color: #f3e5ab;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            background: rgba(10, 15, 30, 0.9);
            border: 2px solid #d4af37;
            color: #d4af37;
            font-size: 24px;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .menu-btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 15px #d4af37;
        }

        .servant-badge {
            background: rgba(10, 15, 30, 0.9);
            border: 1px solid #00d2ff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 16px;
            color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: rgba(7, 11, 20, 0.98);
            border-left: 2px solid #d4af37;
            transition: right 0.35s ease;
            z-index: 9999;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .sidebar-header h3 {
            color: #d4af37;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 24px;
            cursor: pointer;
        }

        .sidebar-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .sidebar-links a,
        .logout-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 14px;
            color: #f3e5ab;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }

        .sidebar-links a:hover {
            background: #00d2ff;
            color: #000;
            border-color: #00d2ff;
            transform: translateX(-5px);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .logout-link {
            border-color: rgba(255, 107, 107, 0.4);
            color: #ff8b8b;
            margin-top: auto;
        }

        .logout-link:hover {
            background: #ff6b6b;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.4);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 998;
            backdrop-filter: blur(5px);
        }

        .overlay.active {
            display: block;
        }

        .main-content {
            text-align: center;
            margin-top: 10px;
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: #d4af37;
            font-size: 34px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .search-box {
            margin-bottom: 25px;
            text-align: center;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            background: rgba(10, 15, 30, 0.9);
            border: 2px solid #00d2ff;
            color: #fff;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-family: 'Reem Kufi', 'Cairo', sans-serif;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
            transition: 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .search-input::placeholder {
            color: #718096;
        }

        .class-info {
            margin: 0 auto 25px;
            width: 100%;
            max-width: 700px;
            background: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.08);
        }

        .class-title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #00d2ff;
            font-size: 17px;
        }

        .class-title i {
            font-size: 23px;
        }

        .count-pill {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 7px 14px;
            border-radius: 10px;
            white-space: nowrap;
            font-size: 14px;
        }

        .servants-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .servant-name-card {
            background: rgba(10, 15, 30, 0.9);
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            gap: 15px;
        }

        .servant-name-card:hover {
            border-color: #00d2ff;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
            background: rgba(15, 23, 42, 0.95);
        }

        .servant-name-card.banned-card {
            border-color: #ff4757;
            opacity: 0.85;
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 18px;
            text-align: right;
            min-width: 0;
        }

        .card-info i {
            font-size: 32px;
            color: #00d2ff;
            flex-shrink: 0;
        }

        .card-info h3 {
            color: #f3e5ab;
            font-size: 20px;
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-info span {
            color: #8a99ad;
            font-size: 14px;
        }

        .btn-open-control {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 8px 16px;
            border-radius: 10px;
            font-family: 'Reem Kufi', sans-serif;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }

        .servant-name-card:hover .btn-open-control {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 10px #00d2ff;
        }

        .loading-box {
            text-align: center;
            color: #00d2ff;
            padding: 50px 20px;
            font-size: 18px;
        }

        .loading-box i {
            font-size: 30px;
            margin-bottom: 15px;
            display: block;
        }

        .error-box {
            background: rgba(255, 71, 87, 0.08);
            border: 1px solid #ff4757;
            color: #ff7b86;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        .error-box i {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .retry-btn {
            margin-top: 18px;
            background: #d4af37;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .servant-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 92%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(7, 11, 20, 0.99);
            border: 2px solid #d4af37;
            border-radius: 22px;
            padding: 30px;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.25);
        }

        .servant-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header-custom h2 {
            color: #d4af37;
            font-size: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 24px;
            cursor: pointer;
        }

        .servant-profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .servant-profile-header h2 {
            color: #00d2ff;
            font-size: 26px;
        }

        .grade-pill {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 6px 15px;
            border-radius: 10px;
            font-size: 16px;
            white-space: nowrap;
        }

        .table-container {
            background: rgba(10, 15, 30, 0.95);
            border: 2px solid #d4af37;
            border-radius: 16px;
            overflow-x: auto;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        th,
        td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        th {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            font-size: 16px;
        }

        td {
            color: #f3e5ab;
            font-size: 15px;
        }

        .points-badge {
            background: #020617;
            border: 1px solid #d4af37;
            padding: 6px 14px;
            border-radius: 10px;
            color: #d4af37;
            font-weight: bold;
        }

        .points-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action {
            background: #020617;
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn-action.plus:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 10px #00d2ff;
        }

        .btn-action.minus:hover {
            background: #ff4757;
            color: #fff;
            border-color: #ff4757;
            box-shadow: 0 0 10px #ff4757;
        }

        .btn-action.save {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
        }

        .btn-action.save:hover {
            background: #fff;
        }

        .custom-input {
            background: #020617;
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #f3e5ab;
            padding: 6px;
            border-radius: 8px;
            width: 60px;
            text-align: center;
            font-family: 'Reem Kufi', sans-serif;
        }

        .custom-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .btn-ban {
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            font-family: 'Reem Kufi', sans-serif;
            transition: 0.2s;
        }

        .btn-ban.ban {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid #ff4757;
        }

        .btn-ban.ban:hover {
            background: #ff4757;
            color: #fff;
            box-shadow: 0 0 12px #ff4757;
        }

        .btn-ban.unban {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .btn-ban.unban:hover {
            background: #2ecc71;
            color: #fff;
            box-shadow: 0 0 12px #2ecc71;
        }

        .personal-details-box {
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
        }

        .personal-details-box h3 {
            color: #00d2ff;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            padding-bottom: 8px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .detail-item {
            background: rgba(2, 6, 23, 0.8);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .detail-item strong {
            color: #d4af37;
        }

        .detail-item span {
            color: #fff;
            text-align: left;
            word-break: break-word;
        }

        @media (max-width: 650px) {

            .navbar {
                padding: 15px;
            }

            .servant-badge {
                font-size: 13px;
                padding: 9px 12px;
            }

            .main-content {
                padding: 15px;
            }

            h1 {
                font-size: 26px;
            }

            .class-info {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .class-title {
                justify-content: center;
            }

            .count-pill {
                text-align: center;
            }

            .servant-name-card {
                padding: 14px;
            }

            .card-info {
                gap: 10px;
            }

            .card-info i {
                font-size: 27px;
            }

            .card-info h3 {
                font-size: 16px;
            }

            .btn-open-control {
                font-size: 11px;
                padding: 7px 9px;
            }

            .servant-modal {
                padding: 18px;
                width: 96%;
            }

            .servant-profile-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .servant-profile-header h2 {
                font-size: 21px;
            }

            .points-controls {
                flex-wrap: wrap;
            }

            .sidebar {
                width: 290px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <button id="menuBtn" class="menu-btn">
            <i class="fas fa-bars"></i>
        </button>

        <div class="servant-badge">

            <i class="fas fa-user-shield"></i>

            صفّك:

            <span id="currentServantGradeBadge">
                جاري التحميل...
            </span>

        </div>

    </div>


    <!-- SIDEBAR -->

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <h3>قائمة الخادم</h3>

            <button id="closeBtn" class="close-btn">
                <i class="fas fa-times"></i>
            </button>

        </div>

        <ul class="sidebar-links">

            <li>
                <a href="home.html">
                    <i class="fas fa-home"></i>

                </a>
            </li>

            <li>
                <a href="profile.html">

                </a>
            </li>

            <li>
                <a href="gifts.html">
                    <i class="fas fa-gift"></i>

                </a>
            </li>

            <li>
                <a href="admin_dashboard.html">
                    <i class="fas fa-cogs"></i>
                    الإدارة
                </a>
            </li>

            <li>
                <a href="cart.html">
                    <i class="fas fa-shopping-cart"></i>

                </a>
            </li>

            <li>
                <a href="notifications.html">
                    <i class="fas fa-bell"></i>
                    الإشعارات
                </a>
            </li>

            <li>

                <button id="logoutBtn" class="logout-link">

                    <i class="fas fa-sign-out-alt"></i>

                    تسجيل خروج

                </button>

            </li>

        </ul>

    </div>


    <!-- OVERLAY -->

    <div id="overlay" class="overlay"></div>


    <!-- MODAL -->

    <div id="servantModal" class="servant-modal">

        <div class="modal-header-custom">

            <h2>

                <i class="fas fa-sliders-h"></i>

                لوحة تحكم المخدوم

            </h2>

            <button id="closeModalBtn" class="modal-close">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div id="modalServantContent"></div>

    </div>


    <!-- MAIN -->

    <div class="main-content">

        <h1 id="rosterTitle">
            إدارة مخدومي صفّي
        </h1>

        <div class="class-info">

            <div class="class-title">

                <i class="fas fa-graduation-cap"></i>

                <span>
                    المخدومون الموجودون في صفك فقط
                </span>

            </div>

            <div class="count-pill">

                <span id="countPill">0</span>

                مخدوم

            </div>

        </div>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="🔍 ابحث عن مخدوم بالاسم..."
            >

        </div>

        <div id="servantsListContainer" class="servants-list">

            <div class="loading-box">

                <i class="fas fa-spinner fa-spin"></i>

                جاري تحميل قائمة المخدومين...

            </div>

        </div>

    </div>


    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /* =========================
           FIREBASE CONFIG
        ========================== */

        const firebaseConfig = {

            apiKey: "AIzaSyBcUuUmMe8Ok8Ap7IspdQP5Zp8VHykUWE",

            authDomain:
                "st-mina-c01ec.firebaseapp.com",

            databaseURL:
                "https://st-mina-c01ec-default-rtdb.firebaseio.com",

            projectId:
                "st-mina-c01ec",

            storageBucket:
                "st-mina-c01ec.firebasestorage.app",

            messagingSenderId:
                "792349150559",

            appId:
                "1:792349150559:web:8a86bbf57c2c7e351f3aea",

            measurementId:
                "G-XZGSBG05KR"

        };


        const app =
            initializeApp(firebaseConfig);

        const db =
            getFirestore(app);


        /* =========================
           DOM
        ========================== */

        const menuBtn =
            document.getElementById("menuBtn");

        const closeBtn =
            document.getElementById("closeBtn");

        const sidebar =
            document.getElementById("sidebar");

        const overlay =
            document.getElementById("overlay");

        const logoutBtn =
            document.getElementById("logoutBtn");

        const servantModal =
            document.getElementById("servantModal");

        const closeModalBtn =
            document.getElementById("closeModalBtn");

        const servantsListContainer =
            document.getElementById(
                "servantsListContainer"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const countPill =
            document.getElementById(
                "countPill"
            );

        const gradeBadge =
            document.getElementById(
                "currentServantGradeBadge"
            );

        const rosterTitle =
            document.getElementById(
                "rosterTitle"
            );


        /* =========================
           SIDEBAR
        ========================== */

        function openSidebar() {

            sidebar.classList.add(
                "active"
            );

            overlay.classList.add(
                "active"
            );

        }


        function closeSidebar() {

            sidebar.classList.remove(
                "active"
            );

            if (
                !servantModal.classList.contains(
                    "active"
                )
            ) {

                overlay.classList.remove(
                    "active"
                );

            }

        }


        function closeServantModal() {

            servantModal.classList.remove(
                "active"
            );

            overlay.classList.remove(
                "active"
            );

        }


        menuBtn.addEventListener(
            "click",
            openSidebar
        );


        closeBtn.addEventListener(
            "click",
            closeSidebar
        );


        closeModalBtn.addEventListener(
            "click",
            closeServantModal
        );


        overlay.addEventListener(
            "click",
            () => {

                closeSidebar();

                closeServantModal();

            }
        );


        /* =========================
           LOGOUT
        ========================== */

        logoutBtn.addEventListener(
            "click",
            () => {

                if (
                    confirm(
                        "هل تريد تسجيل الخروج حقاً؟"
                    )
                ) {

                    localStorage.clear();

                    window.location.href =
                        "../index.html";

                }

            }
        );


        /* =========================
           تنظيف النص
        ========================== */

        function normalizeText(value) {

            return String(
                value || ""
            )
                .trim()
                .replace(/\s+/g, " ");

        }


        /* =========================
           الحصول على ID المستخدم
        ========================== */

        function getCurrentUserId() {

            const urlParams =
                new URLSearchParams(
                    window.location.search
                );

            const urlUser =
                normalizeText(
                    urlParams.get("user")
                );

            const storedId =
                normalizeText(
                    localStorage.getItem(
                        "userDocId"
                    )
                );

            /*
               الأولوية للـ URL
               ثم userDocId
            */

            return (
                urlUser ||
                storedId ||
                ""
            );

        }


        /* =========================
           ID المستخدم الحالي
        ========================== */

        const currentUserId =
            getCurrentUserId();


        console.log(
            "👤 Current User ID:",
            currentUserId
        );


        /* =========================
           البيانات
        ========================== */

        let myGrade = "";

        let myServants = [];


        /* =========================
           جلب صف المستخدم من Firebase
        ========================== */

        async function fetchMyGrade() {

            if (!currentUserId) {

                throw new Error(
                    "لم يتم العثور على معرف المستخدم."
                );

            }


            const userRef =
                doc(
                    db,
                    "users",
                    currentUserId
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (!userSnap.exists()) {

                throw new Error(
                    "مستند المستخدم غير موجود في users."
                );

            }


            const userData =
                userSnap.data();


            console.log(
                "🔥 بيانات المستخدم الحالية من Firebase:",
                userData
            );


            /*
               نأخذ grade فقط.
               لا نستخدم localStorage هنا.
            */

            myGrade =
                normalizeText(
                    userData.grade
                );


            if (!myGrade) {

                /*
                   لو grade غير موجود
                   نحاول stage كحل احتياطي فقط
                */

                myGrade =
                    normalizeText(
                        userData.stage
                    );

            }


            if (!myGrade) {

                throw new Error(
                    "الصف الدراسي غير محفوظ في Firebase."
                );

            }


            /* تحديث localStorage بالقيمة الجديدة */

            localStorage.setItem(
                "servantGrade",
                myGrade
            );

            localStorage.setItem(
                "grade",
                myGrade
            );


            gradeBadge.innerText =
                myGrade;


            rosterTitle.innerText =
                `إدارة مخدومي ${myGrade}`;


            console.log(
                "🎓 الصف المستخدم:",
                myGrade
            );

        }


        /* =========================
           تحميل المخدومين
        ========================== */

        async function fetchServants() {

            servantsListContainer.innerHTML = `

                <div class="loading-box">

                    <i class="fas fa-spinner fa-spin"></i>

                    جاري تحميل مخدومي صفك...

                </div>

            `;


            try {

                /*
                   أولاً:
                   نجيب الصف الحقيقي من Firebase
                */

                await fetchMyGrade();


                /*
                   ثانياً:
                   نجيب كل المستخدمين
                */

                const querySnapshot =
                    await getDocs(
                        collection(
                            db,
                            "users"
                        )
                    );


                const allServants = [];


                querySnapshot.forEach(
                    (docSnap) => {

                        allServants.push({

                            id:
                                docSnap.id,

                            ...docSnap.data()

                        });

                    }
                );


                console.log(
                    "👥 جميع المستخدمين:",
                    allServants
                );


                /*
                   ثالثاً:
                   فلترة حسب grade الحقيقي
                */

                myServants =
                    allServants.filter(
                        (person) => {

                            const personGrade =
                                normalizeText(
                                    person.grade
                                );


                            return (
                                personGrade ===
                                myGrade
                            );

                        }
                    );


                console.log(
                    "✅ مخدومو الصف:",
                    myServants
                );


                renderNamesList(
                    myServants
                );


            } catch (error) {

                console.error(
                    "🔥 FIREBASE ERROR:",
                    error
                );


                servantsListContainer.innerHTML = `

                    <div class="error-box">

                        <i class="fas fa-triangle-exclamation"></i>

                        <h3>
                            تعذر تحميل البيانات
                        </h3>

                        <p style="margin-top:10px;">
                            ${escapeHtml(
                                error.message ||
                                "حدث خطأ غير معروف."
                            )}
                        </p>

                        <p style="
                            margin-top:10px;
                            direction:ltr;
                            word-break:break-word;
                            color:#ffb3b8;
                        ">
                            ${escapeHtml(
                                error.code ||
                                "unknown-error"
                            )}
                        </p>

                        <button
                            class="retry-btn"
                            onclick="location.reload()"
                        >
                            🔄 إعادة المحاولة
                        </button>

                    </div>

                `;

                countPill.innerText = "0";

            }

        }


        /* =========================
           عرض القائمة
        ========================== */

        function renderNamesList(
            dataList
        ) {

            servantsListContainer.innerHTML =
                "";

            countPill.innerText =
                dataList.length;


            if (
                dataList.length === 0
            ) {

                servantsListContainer.innerHTML = `

                    <div class="loading-box">

                        <i class="fas fa-users-slash"></i>

                        لا يوجد مخدومون في صفك حالياً.

                    </div>

                `;

                return;

            }


            dataList.forEach(
                (person) => {

                    const name =
                        person.name ||
                        person.fullName ||
                        person.username ||
                        "بدون اسم";


                    const grade =
                        person.grade ||
                        person.stage ||
                        "غير محدد";


                    const points =
                        Number(
                            person.points || 0
                        );


                    const isBanned =
                        person.banned === true;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        `servant-name-card ${
                            isBanned
                                ? "banned-card"
                                : ""
                        }`;


                    card.innerHTML = `

                        <div class="card-info">

                            <i class="fas fa-user-circle"></i>

                            <div>

                                <h3>
                                    ${escapeHtml(
                                        name
                                    )}
                                </h3>

                                <span>

                                    ${escapeHtml(
                                        grade
                                    )}

                                    |

                                    ${points}

                                    نقطة

                                    ${
                                        isBanned
                                            ? " | (محظور)"
                                            : ""
                                    }

                                </span>

                            </div>

                        </div>

                        <button
                            class="btn-open-control"
                        >

                            إدارة وتحكم

                            <i class="fas fa-arrow-left"></i>

                        </button>

                    `;


                    card.addEventListener(
                        "click",
                        () => {

                            openServantDetails(
                                person
                            );

                        }
                    );


                    servantsListContainer.appendChild(
                        card
                    );

                }
            );

        }


        /* =========================
           حماية النصوص
        ========================== */

        function escapeHtml(
            value
        ) {

            return String(
                value
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           فتح بيانات المخدوم
        ========================== */

        function openServantDetails(
            person
        ) {

            const modalContent =
                document.getElementById(
                    "modalServantContent"
                );


            const name =
                person.name ||
                person.fullName ||
                person.username ||
                "بدون اسم";


            const grade =
                person.grade ||
                person.stage ||
                "غير محدد";


            const points =
                Number(
                    person.points || 0
                );


            const isBanned =
                person.banned === true;


            modalContent.innerHTML = `

                <div class="servant-profile-header">

                    <h2>

                        <i class="fas fa-user-shield"></i>

                        ${escapeHtml(
                            name
                        )}

                    </h2>

                    <span class="grade-pill">

                        ${escapeHtml(
                            grade
                        )}

                    </span>

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    النقاط الحالية
                                </th>

                                <th>
                                    تعديل النقاط
                                </th>

                                <th>
                                    حالة الحظر
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            <tr>

                                <td>

                                    <span
                                        id="points-${person.id}"
                                        class="points-badge"
                                    >

                                        ${points}
                                        نقطة

                                    </span>

                                </td>


                                <td>

                                    <div class="points-controls">

                                        <button
                                            class="btn-action minus"
                                            onclick="updatePoints('${person.id}', -5)"
                                        >
                                            -5
                                        </button>

                                        <button
                                            class="btn-action minus"
                                            onclick="updatePoints('${person.id}', -1)"
                                        >
                                            -1
                                        </button>

                                        <input
                                            type="number"
                                            id="custom-points-${person.id}"
                                            class="custom-input"
                                            placeholder="رقم"
                                        >

                                        <button
                                            class="btn-action plus"
                                            onclick="updatePoints('${person.id}', 1)"
                                        >
                                            +1
                                        </button>

                                        <button
                                            class="btn-action plus"
                                            onclick="updatePoints('${person.id}', 5)"
                                        >
                                            +5
                                        </button>

                                        <button
                                            class="btn-action save"
                                            onclick="saveCustomPoints('${person.id}')"
                                        >

                                            <i class="fas fa-check"></i>

                                        </button>

                                    </div>

                                </td>


                                <td>

                                    <button
                                        class="btn-ban ${
                                            isBanned
                                                ? "unban"
                                                : "ban"
                                        }"
                                        onclick="toggleBan('${person.id}', ${isBanned})"
                                    >

                                        ${
                                            isBanned

                                                ? `
                                                    <i class="fas fa-unlock"></i>
                                                    إلغاء الحظر
                                                `

                                                : `
                                                    <i class="fas fa-lock"></i>
                                                    حظر
                                                `
                                        }

                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>


                <div class="personal-details-box">

                    <h3>

                        <i class="fas fa-id-card"></i>

                        البيانات الشخصية الكاملة

                    </h3>


                    <div class="details-grid">

                        <div class="detail-item">

                            <strong>
                                رقم الهاتف:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.userId ||
                                    person.phone ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                هاتف الأب:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.fatherPhone ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                هاتف الأم:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.motherPhone ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                العنوان:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.address ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                تاريخ الميلاد:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.birthdate ||
                                    person.birthDate ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>


                        <div class="detail-item">

                            <strong>
                                تاريخ التسجيل:
                            </strong>

                            <span>
                                ${escapeHtml(
                                    person.createdAt ||
                                    "غير متوفر"
                                )}
                            </span>

                        </div>

                    </div>

                </div>

            `;


            servantModal.classList.add(
                "active"
            );

            overlay.classList.add(
                "active"
            );

        }


        /* =========================
           SEARCH
        ========================== */

        searchInput.addEventListener(
            "input",
            (e) => {

                const term =
                    e.target.value
                    .trim()
                    .toLowerCase();


                const filtered =
                    myServants.filter(
                        (person) => {

                            const name =
                                (
                                    person.name ||
                                    person.fullName ||
                                    person.username ||
                                    ""
                                )
                                    .toString()
                                    .toLowerCase();


                            return name.includes(
                                term
                            );

                        }
                    );


                renderNamesList(
                    filtered
                );

            }
        );


        /* =========================
           UPDATE POINTS
        ========================== */

        window.updatePoints =
            async function (
                docId,
                amount
            ) {

                const person =
                    myServants.find(
                        p =>
                            p.id ===
                            docId
                    );


                if (!person) return;


                const currentPoints =
                    Number(
                        person.points || 0
                    );


                let newPoints =
                    currentPoints +
                    amount;


                if (
                    newPoints < 0
                ) {

                    newPoints = 0;

                }


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            docId
                        );


                    await updateDoc(
                        docRef,
                        {
                            points:
                                newPoints
                        }
                    );


                    person.points =
                        newPoints;


                    const badge =
                        document.getElementById(
                            `points-${docId}`
                        );


                    if (badge) {

                        badge.innerText =
                            `${newPoints} نقطة`;

                    }


                    renderNamesList(
                        myServants
                    );


                } catch (error) {

                    console.error(
                        "خطأ في تحديث النقاط:",
                        error
                    );


                    alert(
                        "تعذر تحديث النقاط.\n\n" +
                        (
                            error.code ||
                            ""
                        )
                    );

                }

            };


        /* =========================
           CUSTOM POINTS
        ========================== */

        window.saveCustomPoints =
            async function (
                docId
            ) {

                const inputEl =
                    document.getElementById(
                        `custom-points-${docId}`
                    );


                if (!inputEl) return;


                const val =
                    parseInt(
                        inputEl.value,
                        10
                    );


                if (
                    isNaN(val) ||
                    val < 0
                ) {

                    alert(
                        "يرجى كتابة رقم صحيح أكبر من أو يساوي صفر."
                    );

                    return;

                }


                const person =
                    myServants.find(
                        p =>
                            p.id ===
                            docId
                    );


                if (!person) return;


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            docId
                        );


                    await updateDoc(
                        docRef,
                        {
                            points: val
                        }
                    );


                    person.points =
                        val;


                    const badge =
                        document.getElementById(
                            `points-${docId}`
                        );


                    if (badge) {

                        badge.innerText =
                            `${val} نقطة`;

                    }


                    inputEl.value =
                        "";


                    renderNamesList(
                        myServants
                    );


                    alert(
                        "تم حفظ النقاط بنجاح ✅"
                    );


                } catch (error) {

                    console.error(
                        "خطأ في حفظ النقاط:",
                        error
                    );


                    alert(
                        "تعذر حفظ النقاط.\n\n" +
                        (
                            error.code ||
                            ""
                        )
                    );

                }

            };


        /* =========================
           BAN / UNBAN
        ========================== */

        window.toggleBan =
            async function (
                docId,
                currentBanStatus
            ) {

                const newStatus =
                    !currentBanStatus;


                const actionText =
                    newStatus
                        ? "حظر"
                        : "فك حظر";


                if (
                    !confirm(
                        `هل أنت متأكد من رغبتك في ${actionText} هذا المخدوم؟`
                    )
                ) {

                    return;

                }


                const person =
                    myServants.find(
                        p =>
                            p.id ===
                            docId
                    );


                if (!person) return;


                try {

                    const docRef =
                        doc(
                            db,
                            "users",
                            docId
                        );


                    await updateDoc(
                        docRef,
                        {
                            banned:
                                newStatus
                        }
                    );


                    person.banned =
                        newStatus;


                    openServantDetails(
                        person
                    );


                    renderNamesList(
                        myServants
                    );


                } catch (error) {

                    console.error(
                        "خطأ في الحظر:",
                        error
                    );


                    alert(
                        "حدث خطأ أثناء التنفيذ.\n\n" +
                        (
                            error.code ||
                            ""
                        )
                    );

                }

            };


        /* =========================
           START
        ========================== */

        fetchServants();

    </script>

</body>

</html>
